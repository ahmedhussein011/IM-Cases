ailure.\n-   PTH related: hypoparathyroidism (autoimmune, surgical) and pseudohypoparathyroidism.\n-   Renal tubular acidosis (Type 1 RTA). Investigations: in addition to serum calcium, phosphorous & alkaline phosphatase:\n-   Serum 25(OH) vitamin D: decreased in nutritional vit D deficiency, decreased sun exposure, hepatic disease and malabsorption.\n-   Serum magnesium to determine its potential contribution fo hypocalcemia.\n-   Serum PTH level.\n-   Arterial PH, urinary PH (RTA), anti-endomysial antibody (Celiac)\n- Vit D deficiency (] Calcium, |Phosphorous, 1PTH).\n- Hypopararathyroidism (|Calcium, 1Phosphorous,|PTH, normal renal     functions).   Pseudohypoparathroidism       (] Calcium, 1Phosphorous, 1PTH).\n- Renal osteodystrophy: |Calcium, tPhosphorous, {PTH and impaired renal functions. Type 1 RTA (metabolic acidosis urine PH > 5.3, low serum potassium and HCO3, high urinary calcium and potassium). In vitamin D deficiency, calcium preparations (1-2 g per day elemental calcium) and calcitriol. RTA: potassium citrate and sodium bicarbonate corrects metabolic acidosis and bone disease. In Celiac disease, gluten diet is restricted."}, {"num": 183, "chapter": "Endocrine", "front": "A 37-year-old woman presented with symptoms of fatigue and weakness in all extremities. Clinical evaluation revealed brisk deep tendon reflexes and positive Chvostek's and Trousseau's signs. The serum calcium level was 6.7 mg/dL (8.0 to 10.6 mg/dL) and the phosphorus level was 6.2 mg/dL (2.3 to 5.0 mg/dL), creatinine 1 mg/dl. Computed tomography of the head showed extensive bilateral symmetrical calcification of basal ganglia and dentate nucleus in the cerebellum and centrum semiovale.\n\nWhat is the cause of hypocalcemia in this case? Mention other clinical pictures of hypocalcemia?\n\nWhat other investigation needed in this case? O ol\n\nWhat is the treatment?", "back": "1. The diagnosis is hypoparathyroidism (low serum calcium and high phosphorus level with normal renal function). Chronic hypocalcemia is associated with basal ganglia calcification. Clinical picture of hypocalcemia: Muscular and neurological: paresthesias, tetany, seizures (focal, petit mal, grand mal), fatigue, muscle cramps. Extrapyramidal signs due to calcification of basal ganglia. Insidious hypocalcemia may cause mild, diffuse encephalopathy and should be suspected in unexplained dementia, depression or psychosis. Smooth muscle contraction causes biliary colic, intestinal colic, and dysphagia. In chronic hypocalcemia: dry skin, psoriasis exfoliative dermatitis brittle nails and coarse hair. Cataracts occasionally occur with long standing hypocalcemia. - Cardiac: prolonged Q.T interval in ECG, cardiomyopathy. The investigations are serum magnesium, serum PTH (in this case is low or undetectable). The treatment: is calcium and calcitriol (active vitamin D), with follow up serum calcium, Target calcium is the lowest level at which the patient is asymptomatic (low-normal 7.5-8.5 mg/dl). Higher values are avoided to prevent renal stones due to concomitant hypercalciuria."}, {"num": 184, "chapter": "Endocrine", "front": "A 17-year-old male is investigated for short stature. He has a previous diagnosis of slipped femoral epiphysis diagnosed at the age of 11, He presented with this disorder at this age with pain in the hip. This was treated by the orthopaedic surgeons with nonsurgical containment of the femoral head in the acetabulum using casts. However, his younger brother has also recently been diagnosed with bilateral slipped femoral capital epiphysis and is being treated by the orthopaedic surgeons at the age of 12. There is nothing else of note in family history and his progress at school and development are otherwise fine. On examination he is on the 12 per centile for height, a BMI of 30 and has normal pubertal development. His blood pressure is 110/70 mmHg and he has pulse 90 beat min. No abnormalities are noted on examination of the chest, heart and abdomen.\n\nInvestigations reveal: CBC, serum sodium, serum potassium, creatinine are normal. Serum Calcium 8 mg/dl ((8.6-10.2 mg/dl), serum phosphate 5.6 mg/dl (3-4.5 mg/dl), PTH 16 pmol/L (0.9-5.4pmol/L).\n\n1. What is the most likely explanation of this boy's presentation?\n\n2. What are the diagnostic tests?", "back": "1. This young boy has short stature and previous history of slipped femoral epiphysis. The investigations reveal a hypocalcaemia and a hyperphosphataemia suggesting a hypo-parathyroidism (both calcium and phosphate would be expected to be low in vitamin D deficiency and hypophosphataemia in vitamin D resistant rickets) yet the raised parathyroid hormone (PTH) concentration is elevated indicating pseudohypoparathyroidism. This is a group of disorders characterized by insensitivity to PTH. It is an autosomal dominant condition and is due to defects in the gene (GNAST) encoding the alpha subunit of the stimulatory G protein (Gsa) contributing to at least three different forms of the disease: the severity of the condition may vary with generations. The constellation of findings includes: short stature, stocky habitus, obesity, developmental delay, round face, dental hypoplasia, short 4% and 5% metacarpals bones, soft tissue calcification/ossification and slipped femoral epiphysis. The diagnosis is confirmed with genetic analysis and with a failure of cyclic adenosine monophosphate (cCAMP) rise following PTH."}, {"num": 185, "chapter": "Endocrine", "front": "A 26-year-old female presents with a three month history of weight loss and general lethargy. She has a five year history of Type 1 diabetes for which she has been treated with basal bolus insulin consisting of short acting insulin thrice daily and long acting insulin in the evenings. Commensurate with her weight loss of 5 kg over the last three months she has noticed that she has recently encountered more hypoglycemic events and has reduced her insulin requirements from 60 units per day to 38 units daily. She takes no medication other than the oral contraceptive pill. She is a non-smoker. On examination she has a BMI of 21.2 kg/m? and appears comfortable. Her pulse is 68 beats per minute regular and her blood pressure is 110/70 mmHg. There are no specific abnormalities of the chest, heart or abdomen but she has a slight purplish-yellow, 2-3 cm nontender maculopapular rash on both shins. Investigations reveal normal urine analysis, hemoglobin, white cell count, serum sodium and plasma urea. Random glucose 180 mg/dl, HbAlc 6.7%, serum potassium 5.7 mmol/L (3.5-4.9mmol/L).\n\n1. What is the most appropriate explanation for the new symptoms?\n\n2. Give only one investigation to reach the diagnosis?\n\n3. Mention the differential diagnoses of this patient?", "back": "1. The salient features in this young woman with type 1 diabetes is the weight loss, lethargy, hyperkalemia and reduced insulin requirements with increasing frequency of hypoglycaemic events. The latter in particular points to a general increase in insulin sensitivity and with her history of autoimmune disease (type 1 diabetes), hypoadrenalism should be considered as the cause.\n2. APS type 2 (autoimmune polyglandular syndrome) should be considered.\n3. A short Synacthen test is the most appropriate diagnostic test.\n4. Differential diagnoses include:\n-   Thyroid disease:\n-   Hypothyroidism would cause weight gain.\n-   Hyperthyroidism may be expected to increase insulin requirements and have typical signs tachycardia for instance, fine tremor, etc.\n\n-   There are no symptoms to suggest inflammatory bowel discase. The rash on the shins is typical of necrobiosis rather than indicating pyoderma.\n-   Cocliac disease would not be expected to have this impact on insulin requirements; anemia may be expected and for this diagnosis there should be a hint of some other features."}, {"num": 186, "chapter": "Endocrine", "front": "A 32-year old woman was diagnosed as having type 1 diabetes mellitus at age 20 y. She currently has abdominal discomfort and 3-4 bowel movements each day, noted that eliminating wheat bread from her diet reduced her stool frequency, her menses are normal. Physical examination is normal except for pallor, vitiligo in the forehead and both hands. Hb: 8 g/dl\n\n1. What is the probable diagnosis? Explain your diagnosis.\n2. Give the required investigations to confirm your answer?\n\n3. What are the main lines for treatment and follow up?", "back": "1. Celiac disease (gluten sensitive enteropathy). Celiac disease is the cause of diarrhea, an immune mediated disorder occur with increased frequency in type 1 diabetes compared to general population (1-16%).\n2. Imvestigations:\n\na. Stool analysis (exclude other causes of malabsorption as giardiasis) b. Tissue transglutaminase, antiendomysial antibodies which are high in Celiac disease c. Upper endoscopy and jejeunal biopsy to show total villus atrophy that recovers after eliminating gluten containing food.\n\nd. In addition, serum calcium, phosphorus, as Celiac disease enteropathy resulting in malabsorption, rickets, and iron deficiency may be the only manifestation.\n3. Elimination of gluten containing food and follow up endoscopy after 1-2 month is useful to prove the diagnosis."}, {"num": 187, "chapter": "Endocrine", "front": "16-year-old girl presented with short stature noticed since 10 years of age along with lack of puberty. She had normal childhood, without any history of failure to thrive, head injury or polyuria. Examination revealed significant short stature and cubitus valgus. Bone age was of 10 years. Sexual maturity rating was pre-pubertal. Ultrasonography revealed infantile uterus with lack of visualization of ovaries.\n\n1. What is your diagnesis and why?\n\n2. What are investigations needed to prove your diagnosis?\n\n3. How to treat the condition?", "back": "1. The diagnosis is Turner syndrome. It is caused by the complete or partial absence of one of the two X chromosomes in a phenotypic female is usuvally accompanied by short stature, gonadal dysgenesis, lymphedema, and characteristic dysmorphic appearance in the severe phenotype, though it has a minimal impact on stature or secondary amenorrhea in the mild phenotype. Monosomy 45X0 is prevalent. Some individuals are mosaic and carry one or more additional cell lines. The described karyotype variability reflects the wide clinical spectrum of the syndrome. Patients with monosomy X tend to have the most severe phenotype. Diagnosis: clinically, the most common trigger for diagnosis during infancy is lymphedema, and during childhood and adolescence are short stature and gonadal insufficiency. Others eye, ear, cardiac, renal, autoimmune diseases, skeletal, skin nails, hair abnormalities and Psychosocial disturbances. The diagnosis 1s confirmed by karyotyping it will show 45,x. High levels of follicle-stimulating hormone (FSH) and luteinizing hormone (LH) are present in early childhood (2—5 years) and after the time of normal onset of puberty (11 years). Pubertal induction should be started, estrogen starting with very low doses of estrogen as monotherapy, which can be monitored in terms of the development of secondary sex characteristics, serum LH and FSH, bone maturation or uterine volume.\n\nThe progesterone is added when breakthrough bleeding occurs. Estrogen therapy should be coordinated with the use of growth hormone (GH); these treatments should be individualized for each patient, so as to optimize both growth and pubertal development. Growth hormone is essential to increase their final height regardless of whether there is a lack of GH or insulin-like growth factor 1, its effector hormone."}, {"num": 188, "chapter": "Endocrine", "front": "A 22 years old female with elevated blood glucose levels detected during a routine health check-up. She reports no symptoms of hyperglycemia, such as increased thirst or urination. She has a strong family history of diabetes, which affected her mother and maternal grandmother. Both were diagnosed with diabetes at a young age. She is otherwise healthy, with a normal body mass index (BMI). Laboratory Results:\n\n-   Fasting Plasma Glucose: 140 mg/dL\n-   Hemoglobin Alc (HbAlc): 8.5%\n-   Autoantibody Tests: Negative for glutamic acid decarboxylase (GAD) and insulinoma-associated antigen 2 (I1A-2) antibodies\n\n1. Based on the case scenario what is your diagnosis?\n\n2. How would you approach treatment for her, considering her age, family history, and laboratory results, and what lifestyle? modifications would you recommend?", "back": "1. Diagnosis of Maturity-Onset Diabetes of the Young (MODY) is suspected due to the following factors:\n\nYoung female 22 years old diagnosed diabetes mellitus with strong family history of diabetes, this is characteristic of MODY that has an autosomal dominant pattern of inheritance.\n\nAbsence of autoantibodies tests (GAD and I[A-2) make type 1 diabetes less likely, as type 1 diabetes is typically associated with autoimmune destruction of pancreatic beta cells. In addition to absence of ketoacidosis or overt symptoms. Normal Body Mass Index (BMI) reduces the likelihood of type 2 diabetes, which is often associated with insulin resistance and obesity. A genetic test would be necessary to confirm the diagnosis and identify the specific mutation involved.\n2. The treatment approach for MODY may differ from that of type 1 or type 2 diabetes. Treatment options may include: Identify the specific gene mutation for type of MODY give guide treatment decision Sulfonylureas: often effective in patients with MODY3 (HNF1A mutations), as they stimulate insulin secretion. Some forms of MODY may respond well to oral medications or lifestyle changes. Some people with MODY 1 and MODY 4 may also need to take insulin. Lifestyle Modifications: maintaining a healthy diet and regular physical activity It's essential to monitor glycemic control and adjust treatment to prevent long-term complications."}, {"num": 189, "chapter": "Endocrine", "front": "A 62-year-old female presents to the outpatient clinic with right wrist pain and swelling following a fall on an outstretched hand in the garage at home. This patient has a past medical history of hypertension, dyslipidemia, bronchial asthma and vertebral bone fracture. She is menopausal since 50 years of age. The patient is currently taking lisinopril, atorvastatin , inhaled corticosteroids for her asthma and epidural steroid injections for lower back pain.\n\nOn physical examination: The patient exhibits a stooped posture characterized by forward flexion of the thoracic spine, forward head position. The right wrist is swollen and hurts to move. The patient was sent to the hospital to get an X-ray of the right hand, which revealed Colles’ fracture (distal radius) on the right hand. The blood tests were normal in this patient except for low levels of Vitamin D. The patient was also asked to get a DEXA scan, which revealed a T score lumbar spine -2.9, T score hips -2.\n\n1. What do you think about diagnosis?\n2. What are the risk factors for fractures in this patient?\n\n3. Outline the management.", "back": "1. Postmenopausal female with prolonged corticosteroid uses and history of vertebral fractures presenting by recent Colles’ fracture suggests this patient has osteoporosis.\n2. Risk factors: Menopause, steroid medications and old age.\n3. The most pivotal step in the diagnosis of osteoporosis is a DEXA scan (dual-energy x-ray absorptiometry). This test measures Bone Mineral Density (BMD). T score of less than -2.5 is considered a diagnosis of osteoporosis. A score of -1 to -2.5 is considered osteopenia. The most common osteoporotic fractures are vertebrae and hips.\n-   Treatment: bisphosphonates is the first line of therapy which will help in inhibiting the osteoclast function. Vitamin D and calcium supplements will help in increasing the BMD in the bones and decrease the risk of osteoporosis. Due to an increase in fracture risk from falling, the patient was advised to use a supportive walker while walking."}, {"num": 190, "chapter": "Endocrine", "front": "A 34-year-old man presents with resistant hypertension despite taking 3 antihypertensives. He also complains of fatigue and muscle cramps. Blood pressure is 170/100 mmHg, serum potassium: 2.9 mmol/L, plasma aldosterone concentration (PAC): High, plasma renin activity (PRA): low, aldosterone-to-renin ratio (ARR): elevated\n\n1- What is the most likely diagnosis? Why?\n\n2- What is the differential diagnesis of hypertension with hypokalemia? 3- What imaging is recommended to localize the lesion?", "back": "1- The most likely diagnosis is Conn’s syndrome (primary hyperaldosteronism) due to autonomous aldosterone secretion, presenting with resistant hypertension and hypokalemia. 2- Differential diagnosis of Primary Aldosteronism (hypertension with hypokalemia)\n\nEssential HTN with diuretic use\n\nRenal artery stenosis Various causes of secondary aldosteronism — (renin is elevated) Deoxycorticosterone (DOC)—secreting adrenal tumors Renin-sécreting tumor Excessive licorice intake Cushing syndrome 3~ CT scan of the adrenal glands to detect adenoma or hyperplasia."}, {"num": 191, "chapter": "Endocrine", "front": "A 35-year-old female presents with a right-sided thyroid nodule discovered incidentally during a routine check-up. She is clinically euthyroid. Ultrasound findings: Solid, hypoechoic nodule measuring 1.4 cm, irregular margins,     microcalcifications   present,   no        significant      cervical lymphadenopathy\n\n1. What is the risk stratification of this nodule?\n\n2. What is the next best step in management?\n\n3. If cytology reveals Bethesda Category V, what does this imply?", "back": "1. High suspicion pattern of nodule by ultrasonography per ATA guidelines (solid, hypoechoic, irregular margins, microcalcifications). Next step: Fine-needle aspiration (FNA). Bethesda Category V: Suspicious for malignancy — risk of malignancy ~60—75%. Recommend surgical total thyroidectomy."}, {"num": 192, "chapter": "Endocrine", "front": "A 25 years old female reports a several-week history of polydipsia and polyuria. She states that she is drinking large amounts of water throughout the day and night, and is urinating frequently. She has to wake up several times at night to pass large amounts of urine. She has no significant medical history and is not taking any medications. Vital signs are norma, physical examination is unremarkable. Laboratory results: Urine Osmolality: Low (100 mOsm/kg), serum Osmolality: High (300 mOsm/kg), serum Sodium; Elevated (150 mmol/L)\n\n1. What is the most likely diagnosis for her condition, considering her symptoms and laboratory results?\n\n2. What treatment options would you consider for her, and how would you monitor her response to treatment?", "back": "1. Based on the patient symptoms and laboratory results, the most likely diagnosis is Diabetes Insipidus (IDI). The key features supporting this diagnosis are:\n-    Polyuria and polydipsia.\n-    Low urine osmolality: indicates that the urine is dilute.\n-    High serum osmolality and sodium: indicates that the blood is becoming concentrated due to excessive water loss. Specifically, the diagnosis is likely central diabetes insipidus or nephrogenic diabetes insipidus, depending on the underlying cause.\n-    Central DI: Due to a deficiency in antidiuretic hormone (ADH) production or secretion from the pituitary gland.\n-    Nephrogenic DI: Due to a lack of response to ADH in the kidneys, often caused by a genetic mutation or certain medications.\n2. Treatment for Diabetes Insipidus depends on the underlying cause:\n-    Central DI: desmopressin (DDAVP): a synthetic analogue of ADH, administered intranasal, sublingual or oral, to replace the deficient hormone and reduce urine output.\n-    Nephrogenic DI:\no Thiazide diuretics: paradoxically, thiazide diuretics can help reduce urine output in nephrogenic DI by promoting mild volume depletion and increasing water reabsorption in the proximal tubule.\no Amiloride: can be used in combination with thiazides to further reduce urine output.\no Dietary modifications: reducing salt intake and ensuring adequate hydration. Monitoring would include:\n-    Fluid intake and output to ensure adequate hydration and adjust treatment as needed.\n-    Serum sodium and osmolality to prevent               overcorrection or undercorrection of serum sodium levels.\n-    Urine specific gravity or osmolality to assess the effectiveness of treatment."}, {"num": 193, "chapter": "Endocrine", "front": "A 9 years old girl presents to the outpatient clinic. Her parents have noticed that she is significantly shorter than her peers. They report that her growth rate has slowed down over the past few years. Her medical history is unremarkable, and she has no known chronic illnesses.\n\nPhysical Examination: height: 115 cm (below the 3rd percentile for age), weight: 20 kg (proportionate to height), pubertal status: prepubertal, physical examination: Otherwise unremarkable.\n\n1. What are some potential differential diagnoses for patient’s short stature?\n\n2. When evaluating this patient with short stature, what are investigations should be considered?\n\n3. Let's assume that further evaluation reveals that Growth Hormone Stimulation Test: peak growth hormeone level: 3 ng/mL (abnormal response). What treatment options would you consider?", "back": "1. Differential Diagnosis of short stature in this patient:\n\n-   Growth Hormone Deficiency\n-   Hypothyroidism\n-   Tumer Syndrome\n-   Constitutional Growth Delay\n-   Other genetic or chronic conditions\n2. The investigation that needed\n\nLaboratory Tests\n-   Complete blood count: for anemia or other hematological disorders.\n-   Electrolyte: to assess electrolyte balance and kidney function.\n-   Thyroid function tests: to rule out hypothyroidism.\n-   Insulin-like Growth Factor-1 (IGF-1) Level that assess growth hormone activity.\n-   Growth hormone stimulation test: To diagnose growth hormone deficiency.\n-   Genetic Testing: Karyotype int genetic disorders such as Turner syndrome. Imaging Studies\n\n-   Bone age X-ray: determine bone age and skeletal maturity.\n-   MRI may be ordered to evaluate the pituitary gland or hypothalamus if a central cause of short stature is suspected. Other Tests\n\n-   Nutritional Assessment.\n-   Screening for chronic Diseases.\n3. Growth hormone replacement therapy: recombinant human growth hormone (thGH) subcutaneous injections administered, typically daily, to stimulate growth and development. Dose adjustments may be necessary based on patient response to treatment and any side effects."}, {"num": 194, "chapter": "Endocrine", "front": "A male patient 42 years old, presented to the clinic seeking for blood sugar control. He has diabetes mellitus since 2 years, presented with rapid onset of mild polyuria, polydipsia, mouth dryness, and fatigue. The patient did not report weight loss, nausea, vomiting, abdominal pain, or dizziness. Physical examination was unremarkable. His blood pressure was 125/80, BMI 24, no signs suggestive of insulin resistance. The patient has weak positive family history of diabetes (one of the elder aunts was diabetic) and has negative consanguinity. On lab assessment his random blood sugar was 268 mg/dl, and HbA1C was 9.2%. Urine test showed glucosuria, and was negative for ketones. Lipid profile, kidney functions, electrolytes, and complete blood count were normal. He was advised to follow low carb balanced diet, and treatment was initiated with a fixed dose combination of metformin and vildagliptin. Three months later; glimepiride was added for further blood sugar control and the dose was upgraded from 1 mg to 4 mg daily over 1 year. The patient symptoms improved but his blood sugar was not on targets and HbA1C remained between 8-9% over the treatment course. In the last 3 months the fasting blood sugar was persistently elevated, ranging from 250- 300 mg/dl most of the days and his HbA1C increased to 10.4%.\n\nHow can you categorize the type of diabetes of this patient? A\n\nWhat are the criteria of late onset diabetes in adults?\n\nWhat is the suggested work up?\n\nWhat are your recommendations for the treatment plan?", "back": "L. This patient was empirically managed as T2 DM (most probably based on the age criteria alone), with inadequate control on oral hypoglycemic agents over 2 years and progressive increase in glycemic parameters. He has many features that are not matching with T2 DM. The patient is lean with normal BMI, lacks any feature of metabolic syndrome or insulin resistance, he also has relatively rapid onset of hyperglycemia which was relatively severe at the onset, and in addition there was no supportive family history of diabetes. On the other side; the absence of ketosis, partial response to initial oral medications, and insulin independence make the diagnosis of T1 DM unlikely. LADA appears to be the most suitable diagnosis in this patient. Most studies use the following criteria to classify a subject with LADA: (1) Diagnosis of diabetes at > 30 years of age (because of the age of onset, many people are mistakenly diagnosed for years with T2DM, (2) No requirement for insulin therapy for > 6 months, and (3) Presence of diabetesassociated autoantibodies. Assess for autoantibodies can help in settling the diagnosis. Glutamic Acid Decarboxylase Antibodies (GADA) is the most common autoantibody seen in people with LADA and are considered the most specific and sensitive biomarker. The titer of GADA can help in predicting the course of the disease. Those with high GADA exhibit a more rapid decline in C-peptide level and progression to insulin therapy. People with GADA-low LADA tend to be more phenotypically similar to those with T2DM, they have an increased prevalence of metabolic syndrome and slower decline in C-peptide and progression to insulin therapy. Testing for C-peptide may help support the diagnosis of LADA. If the result is >1.8 ng/mL, the circumstances of testing do not matter and the result indicates type 2 diabetes mellitus. If the result is <1.8 ng/mlLand the concurrent glucose is <70 mg/dL or the person may have been fasting, consider repeating the test. Results showing very low levels <0.24 ng/mL]) is indicative for T1 DM, Intermediate values usually suggest LADA and monogenic diabetes. People with LADA also have a higher frequency of autoimmune thyroid disease, estimated to occur in 27% of GADA-positive patients. The treatment is early insulin therapy."}, {"num": 195, "chapter": "Endocrine", "front": "A 30 year old female patient presents with hypercalcemia, with elevated serum parathormone (PTH), low serum phosphorus. A sestamibi scan was consistent with multifocal primary hyperparathyroidism. The patient has a history of left laparoscopic adrenalectomy 2 years ago, due to a diagnosis of pheochromocytoma. The patient has an elder sibling who had undergone parathyroid removal (surgical removal of 3 and a half gland) due to a similar presentation of multifocal primary hyperparathyroidism.\n\n1. What is the familial disease that should be suspected in this case?\n\n2. What is the workup that should be done?\n\n3. Any further treatment recommended?", "back": "1. Multiple Endocrine Neoplasia 2 (MEN 2)\n-   Pheochromocytoma\n-   Associated with primary hyperparathyroidism\n-   Similar condition in family member\n2. Before surgery, recurrent pheochromocytoma should be ruled out. (Commonly recurrent and bilateral). Screening is done by measuring serum free metanephrines. If positive, adrenalectomy should be done first. Also, medullary thyroid cancer should be screened by serum calcitonin and thyroid ultrasound. Genetic study should be done if available with genetic screening for family members.\n3. Prophylactic thyroidectomy should be considered\n-   Screening for other family members"}, {"num": 196, "chapter": "Endocrine", "front": "A 25 years old girl, presented to the endocrinology clinic with excessive hair growth on the chin, the upper and lower lips. She described the hair as coarse, thick, and dark in color. She had also coarse thick hair on the upper chest and both thighs. The patient uses mechanical methods for removing the hair on the chest and thighs and had repeated cessions of LASER therapy for the facial hair with recurrence. She had menarche at the age of 13 years, after a period of menstrual irregularities for 4 years after menarche, the menses started to be regular, and she used to have menstruation on almost regular basis every 20-21 days. The initial assessment showed a high normal blood pressure of 135/85, BMI of 28, with mild dark pigmentations on the nap of the neck. Hirsutism could not be assessed because of recent hair removal. Lab assessment showed a FBS of 108 mg/dl, total cholesterol 202 mg/dl, LDL-C 124 mg/dl, HDL, 36 mg/dl, and triglycerides 210 mg/dl. Her fasting total testosterone was 2.8 ng/dl (normal 0.5-2.4 ng/dl), which is equivalent to 80.8 ng/dl (normal 15 to 70 ng/dl), and DHEA was 436 ug/dl (normal 45-380 ug/dl). The patient denied intake of any regular medications and her family history was positive for type 2 diabetes mellitus with negative consanguinity.\n\n1. What are the other items im history and physical examination would you like to check for?\n\n2. What is the differential diagnosis? State the most likely diagnosis.\n\n3. What are the treatment options?", "back": "I.   Assessment of the severity of hirsutism using clinical scores like modified Ferriman-Gallwey score, assessment of other symptoms and signs of hyperandrogenism like acne, seborrhoea, scalp hair thinning, change of voice, increased muscularity, breast thinning, or oligomenorrhea. Physical examination may reveal additional data like acanthosis, hepatomegaly, or pelvic masses. The differential diagnosis includes polycystic ovary disease (PCOS), idiopathic hirsutism, non- classic congenital adrenal hyperplasia (NCCAH), ovarian or adrenal androgen secreting tumor. Clinicians must consider Cushing       syndrome,    acromegaly,     hypothyroidism,      and   rarely hyperprolactinemia, but patients typically will present with the features specific to these disorders. Clinicians must also consider exogenous androgens or anabolic steroids, or valproic acid. —    The most probable diagnosis in our patient is PCOS as the patient has clinical and lab evidence of hyperandrogensim, her short menstrual cycles are suggestive of anovulation, in addition she has some features of metabolic syndrome (overweight, acanthosis, high normal blood pressure and FBS, and metabolic dyslipidaemia). Treatment plan depends on the severity of hirsutism, patient expectations, the desire for pregnancy in near future, and the severity of cardio-metabolic risk. The term “patient important hirsutism”is preferred as any degree can cause sufficient distress for women to seek additional treatment. There are 2 approaches that may be used either alone or in combination: (1) pharmacologic therapies that target androgen production and action.        (2) direct hair removal methods (electrolysis and photoepilation). Medical therapy —    Oral contraceptive pills (OCPs) — most efficient in reducing ovarian androgens —~   Metformin -~ decreases androgens to a lesser extent, may restore ovulation (especially important in this patient with impaired fasting glucose) —    Spironolactone is androgen receptor blocker 50-200 mg /day for hirsutism —    Finasteride — alpha reductase inhibitor that blocks testosterone conversion to active dihydrotestosterone (DHT) —    Flutamide — anti-androgen (blocks androgen receptors)"}, {"num": 197, "chapter": "Hematology", "front": "A 69-year-old woman was admitted to the hospital due to fatigue over the past several months. She claimed that she had been healthy her entire life. Her current problems began about 3 months ago when she noticed decreased appetite and fatigue, which was progressive. She denies bleeding from any orifice. Physical examination revealed pallor of mucous membranes, the tongue is red glazed, angular stomatitis, and the nails are flat. The blood picture showed HB 6.0 g/dl, HCT 18.2 % (normal 41%-53%), MCV 69 fL, platelets 600 x10%/dl, WBC 5 x10%/dl (normal differential count).\n\n1. What is the most probable diagnosis?\n\n2. What would be your first diagnostic step in evaluating this patient's anemia?\n\n3. What are the major morphologic classifications of anemia based on RBC volume? Give three examples of each.", "back": "1. Severe iron deficiency anemia (IDA).\n\nExplanation: Angular stomatitis, red glazed tongue can be seen in both B12 deficiency and iron deficiency, although angular stomatitis is more of a sign of iron deficiency.\n-   But the key to the question is the mean cell volume. As this is decreased, it cannot be B12 deficiency or folate deficiency. Iron deficiency leads to microcytic anemia, so we would expect the MCYV to be low.\n-   Also the presence of thrombocytosis (reactive) associated with IDA.\n\n2. First diagnostic steps would be:\n\nSerum iron, ferritin, total iron binding capacity, transferrin saturation. Reticulocyte count. Stool analysis for occult blood. Investigations of gastrointestinal (GIT) blood loss: upper endoscopy and colonoscopy are mandatory in this case,as presentation of IDA in high-risk groups (males, postmenopausal females) requires GIT endoscopies to exclude GIT malignancies.\n3. Morphologic classifications of anemia based on RBC volume: Microcvtic anemia (low MCV < BOfL): iron deficiency anemia, thalassemia, anemia of chronic disease.\n\nMacrocytic anemia (high MCV > 96fL): Vitamin B12 or folate deficiency, alcohol, hypothyroidism, and reticulocytosis.\n\nNormocytic anemia (normal MCV): acute blood loss, aplastic anemia, hemolytic anemia except thalassemia, renal failure, bone marrow infiltration."}, {"num": 198, "chapter": "Hematology", "front": "A 26-year-old farmer was initially admitted to the hospital complaining of worsening fatigue. Physical examination was unremarkable apart from signs of anemia. Occult blood in stool was positive. Stool culture showed no pathogen. On his admission, anemia was diagnosed [HCT 15.6%, Hb: 4.8 g/dL, MCV: 62.9 fI(78-100 f1)] along with eosinophilia [Eosinophils: 10% (1%-6%), WBC: 9.02x10%dl1]. Abdominal ultrasonography and colonoscopy were normal. Upper GI endoscopy showed multiple mucosal erosions with slow oozing of blood and several small slender reddish worms in the duodenum.\n\n1. What is the most likely diagnosis?\n\n2, What is the treatment?", "back": "1. The diagnosis is iron deficiency anemia with eosinophilia due to parasitic infestation (hookworm, Ancylostoma duodenale). Hookworm is one of the most common parasites in the world and is usuvally associatedwith eosinophilia. The characteristic shape of the egg on microscopic stool examination is diagnostic. The treatment is mebendazole 100 mg PO bid for 3 days or 500 mg PO as a one-time dose; administer a second course if the patient is not cured n 3-4 weeks or albendazole 400 mg/d PO, one-time dose, and oral iron supplementation."}, {"num": 199, "chapter": "Hematology", "front": "A 70-year-old woman presented with progressive weakness and fatigue. The symptoms had begun about a month earlier, and she no longer felt well enough to do her housework or take her daily walk. Although her breathing was normal at rest, she was too short of breath to walk more than two or three blocks.\n\nHer physical examination showed a sore tongue and tachycardia at rest. The results of the complete blood cell count, hemoglobin, 7.4 gm/dl; RBCs 2.8 10%/d1, MCV 103 fl, WBC 2,9 x 10%/dl (48% neutrophils, 43% lymphocytes, 8% monocytes, 1% eosinophils); and platelets, 62 x 10°/dl and serum LDH 810 U/L (200-480 U/L)\n\n1. Comment on CBC and what is the most likely diagnosis?\n2. What is the type of anemia?\n3. Mention the investigations required for this anemia.", "back": "1. The blood picture showed pancytopenia with megaloblastic change (low RBCs, leucocytes, and platelet counts). The diagnosis is most likely pernicious anemia. Pernicious anemia is a chronic illness caused by impaired absorption of vitamin B2 because of a lack of intrinsic factor (IF) in gastric secretions. The anemia is macrocytic (megaloblastic) anemia as mean cell volume (MCV) greater than 100 fL.\n-   Common causes are vitamin B12 deficiency or folic acid deficiency. Lack of intrinsic factor, the prevalence of its deficiency increases in older populations, In this case, achlorthydria may be the cause of intrinsic factor deficiency. In CBC: in vitamin B-12 deficiency, blood film may reveal hypersegmented neutrophils and anisopoikilocytosis.\n-   An increased serum LDH and indirect bilirubin levels, along with a decreased reticulocyte count, suggest ineffective hemopoiesis in which intramedullary hemolysis is occurring.\n-   Reticulocyte count is a very important test to differentiate between reticulocytosis associated with hemolytic anemia and megaloblastic anemia, as both are characterized by macrocytic anemia.\n-   Measuring the serum cobalamin and folate levels. Additional testing for intermediates in vitamin Bl2 and folate metabolism (methylmalonic acid [MMA] and homocysteine) may be measured. Interpretation is as follows: MMA is elevated in vitamin B12 deficiency but not in folate deficiency. MMIA normal, homocysteine elevated— No deficiency of vitamin B12. Consistent with a deficiency of folate.\n-   Autoantibodies to intrinsic factor: to identify pernicious anemia (PA), an autoimmune condition that leads to severely impaired vitamin B12 absorption. The specificity of autoantibodies to IF is high.\n-   The bone marrow: marked erythroid hyperplasia, myeloid-erythroid ratio is reversed. Erythroid precursors have megaloblastic features, granulocytic     hyperplasia with giant metamyelocytes, and megakaryocytes may be large and hyperlobulated."}, {"num": 200, "chapter": "Hematology", "front": "An 18-year-old boy was referred to the hospital, presenting with vomiting and crampy right upper abdominal pain for two days. These were associated with dark-colored urine and pallor. The condition was recurrent, infrequently from the age of 4 years, mainly after infection. He had received his first blood transfusion at that time,\n\nOn admission, physical examination revealed pallor, jaundice, and splenomegaly. Results of laboratory investigations showed a hemoglobin level of 7.8 g/dl, WBC 6 x 10%dl, RBC 2.9 x 10°/dl, and platelets 342 x 10%/dl, reticulocytosis of 10% and Heinz bodies in peripheral blood. His family history revealed that his uncle had a similar condition.\n\nWhat is the most likely type of hemolytic anemia? Lol L\n\nWhat are the trigger factors for this anemia? What are the investigations needed? What is the treatment?", "back": "1. The chronic hemolytic anemia that started at the age of 4 years and continues to 18 years. It is a hereditary type of chronic hemolytic anemia. Either glucose-6-phosphate      dehydrogenase (G6PD) deficiency, hereditary spherocytosis, or hemoglobinopathies (structural defects in the hemoglobin molecule). Being male with a similar condition in the family supports the possibility of a sex-linked condition like G6PD.\n\n2. The triggering factors are infections, bacterial or viral, certain drugs, antibiotics, especially sulfonamides, nonsteroidal anti-inflammatory drugs (NSAIDs), and quinidine and Fava beans (broad beans): The classic trigger, causing favism.\n3. Laboratory investigations indicate hemolysis: Reticulocytosis, increased indirect bilirubin level, low haptoglobin, increased LDH, and Urine analysis for hemoglobinuria In the context of G6PD deficiency, Heinz bodies are a hallmark of oxidative damage to red blood cells. They are inclusions of denatured hemoglobin inside red blood cells. Confirmatory tests\n-   Quantitative G6PD essays are available at several reference laboratories. G6PD activity results are expressed as units of enzyme activity per gram of hemoglobin.\no   Typical normal range at 25°C: 5.5 to 8.8 units/gram of hemoglobin\no   Typical normal range at 37°C: 8.0 to 13.5 units/gram of hemoglobin\n-   Abdominal ultrasonography: to detect gallstones, the size of the spleen.\n4. The most effective management of G6PD deficiency is to prevent hemolysis by avoiding oxidative stress.\n-   Identification and discontinuation of the precipitating agent is critical in cases of glucose-6-phosphate dehydrogenase (G6PD) deficiency. Patients must avoid broad beans (ie, fava beans), certain drugs (eg, sulfonamides).\n-   Spontaneous recovery from hemolytic crises is the usual outcome. In acute severe hemolytic anemia, blood transfusions may be needed, and folic acid is administered."}, {"num": 201, "chapter": "Hematology", "front": "A 15-year-old female came to the outpatient clinic with a history of recurrent jaundice for the last 6 months, with episodes of bony and abdominal pains associated with fever. She presented with bony aches, received meperidine 75 mg IM 1 hour after she came into the emergency room, and every 3 hours thereafter. She reported minimal pain relief after receiving the medication. On clinical examination, there was jaundice. Her hemoglobin was 7.3 g/dl, total WBC 10 x 10%dl, and the reticulocyte count was 5%. ESR 23 mm in the Ist hour. Serum total bilirubin was 4 mg/dl, and direct bilirubin was 1.2 mg/dl. Her family history reveals positive consanguinity. Her brother and sister also have a similar condition,\n\n1. What is the most likely diagnosis? Give your justifications?\n\n2. How can you confirm your diagnosis?\n\n3. Mention three complications of this type of anemia.", "back": "1. The diagnosis is chronic hemolytic anemia in a 15-year-old female with severe bony aches that needed pain medication. Positive consanguinity with a similar condition in the family supports a hereditary autosomal disorder. Sickle cell anemia should be considered, sickle cell painful vaso-occlusive crisis. The pain is due to repeated infarction of joints, bones, and growth plates.\n2.   Itis confirmed by:\n\nExamination of the peripheral blood smear for the presence of sickled erythrocytes.\n\nEvidence of hemolysis: Increase in reticulocyte count, indirect bilirubin & serum LDH. Hemoglobin electrophoresis establishes the diagnosis of sickle cell disease by demonstrating a single band of Hb S (in Hb SS) or Hb S with another mutant hemoglobin in compound heterozygosity (Hb SC, or Hb S-betat+ thalassemia). Electrophoretic study of all the family members (parents and brothers).\n3. The complications are:\n\nThe aplastic crisis is caused by infection with the Parvovirus B-19 (B19V). There is worsening of anemia without deepening of jaundice, and a decrease in the reticulocyte count, The acute chest syndrome consists of chest pain, fever, tachypnea, leukocytosis, and pulmonary infiltrates. Central nervous system involvement is one of the most devastating aspects of sickle cell disease. The most severe manifestation is stroke, resulting in varying degrees of neurological deficit."}, {"num": 202, "chapter": "Hematology", "front": "A 36-year-old woman developed progressive fatigue over ten days, exertional dyspnea, dark urine, and jaundice. On examination, there was splenomegaly. Laboratory studies showed a drop in hemoglobin from 14.7 to 6.6 g/dl over 4 days, markedly elevated lactate dehydrogenase, indirect bilirubin, and reticulocyte count, and a low haptoglobin level.\n\n1. What is the most likely diagnosis, and mention its causes?\n\n2. How can you confirm the type of anemia?\n\n3. What is the treatment?", "back": "1. The diagnosis is hemolytic anemia due to the presence of laboratory results of hemolysis. Hemolytic anemia in this female at that age group suggests an autoimmune nature.\n\nThe causes of autoimmune hemolytic anemia are: Idiopathic autoimmune hemolytic anemia Autoimmune collagen diseases: systemic lupus erythematosus, rheumatoid arthritis Drugs: eg alpha-methyldopa, ampicillin, carbenicillin, diclofenac, procainamide. Infections: CMV, EBV, HIV, HCV, COVIDI19, Mycoplasma pneumoniae (classic trigger for cold AIHA) Associated with lymphoma, chronic lymphocytic leukemia\n2. Imvestigations to confirm the diagnosis: Serologic evidence of autoantibody: direct, indirect Coomb's test Exclude secondary cause of autoimmune hemolytic anemia eg. ANA secondary to SLE, virology screen. Bone marrow biopsy in certain cases to exclude lymphoma.\n3. The treatment varies depending on the underlying cause and severity of the condition.\n-   Corticosteroids and immunosuppressive            drugs   (azathioprine, monoclonal anti-CD20 Rituximab).\n-   Folic acid - active hemolysis consumes folate.\n-   Blood transfusions and even surgical removal of the spleen may be carried out in severe cases"}, {"num": 203, "chapter": "Hematology", "front": "A 22-year-old man came to the outpatient clinic with general fatigue and a bleeding tendency from the gums for two months. He developed a fever last week. On physical examination, temperature 38°C, purpuric eruptions were distributed all over the body. Abdominal examination showed no evidence of organomegaly or generalized lymphadenopathy. Hemoglobin was 5.4 g/dl, RBCs 1.9 x 10%dl, TLC 2x 10° /dl, and platelets 25x 10%/dl at that time. He started folic acid and ferrous sulfate with no improvement. Then, he came to a hematologist, and bone marrow aspiration and biopsy were performed. The result was a decrease in bone marrow cellularity and no evidence of abnormal cells. The reticulocyte is 0.2%.\n\n1. What is the most likely diagnosis? Explain and justify your diagnosis.\n\n2. What are the causes of pancytopenia?\n\n3. How do you treat this case?", "back": "1. The diagnosis is mostly aplastic anemia. The patient presented with symptoms of anemia, infection (fever) due to leucopenia, bleeding tendency, and purpuric eruption due to thrombocytopenia. Suppressed bone marrow as evidenced by low reticulocyte count and hypocellular bone marrow. Causes of pancytopenia: bone marrow suppression or hypersplenism. Causes of bone marrow suppression include: Pernicious anemia, autoimmune as systemic lupus erythematosus, infections as viral infections (parvovirus B19, COVID) or brucellosis, lymphoma, aplastic anemia,      myelodysplastic     syndrome,     Paroxysmal    nocturnal haemoglobinuria, iatrogenic by (drugs as carbamazepine, irradiation or chemotherapy) and myelophthisic anemia may result from marrow destruction because of tumor invasion or granulomas. Treatment:\n\n-   Blood and platelet transfusions: support is needed until the diagnosis is established and until specific therapy can be instituted, and blood products must be irradiated to avoid sensitization against antigens of possible donors.\n-   Discontinue any offending drug or chemical exposure\n-   Treatment of infection: since infection is a major cause of mortality, empirical antibiotic therapy should be started after appropriate cultures are obtained:; broad-based with gram-negative and staphylococcal coverage. Especially consider anti-pseudomonal coverage at the start of treatment for patients with febrile neutropenia, and consider early introduction of antifungal agents for those with persistent fever,\n-   Cytokine support with granulocyte colony-stimulating factor (G-CSF) may be considered in refractory infections and may lead to transient improvement in neutrophil count, but they do not correct the stem cell defect.\n-   Hematopoietic support with thrombopoietin receptor agonist (TPO-RA) (Eltrombopag) to induce megakaryocyte proliferation,\n-   Bone marrow _transplantation with an HLA-matched sibling donor in patients less than 40 years or more than 40 years, not responding to immunosuppressive cyciosporine and antithymocyte globulins (ATG).\n-   Immune suppression therapy (cyclosporine and ATG may be combined for improved response) is especially useful if a matched sibling donor for BMT is not available or if the patient is transplant ineligible."}, {"num": 204, "chapter": "Hematology", "front": "A 62-year-old male attends a general practitioner’s clinic with a 4-week history of back pain, tiredness, and lethargy. The patient's relative informs that he has had poor concentration during the last two weeks. His physical examination showed pale conjunctivae and tenderness to deep palpation over his vertebrac (T4-T6). Initial investigations revealed normochromic normocytic anemia with Hb 8.4g/dl, raised ESR (>140 mm/hr), and total serum protein level was elevated with a normal albumin level. Serum creatinine was 1.8mg/dl. Total serum calcium was elevated. B2- microglobulin was elevated. Thoracic spine films showed osteolytic lesions in T4 and T5.\n\nWhat is the probable diagnosis? el o\n\nWhat further investigations would be indicated for the diagnosis? What is the most likely metabolic abnormality present? Mention the possible causes of raised serum creatinine in this patient,", "back": "1. The probable diagnosis is multiple myeloma. It should be suspected in any elderly patient presenting with a non-hemolytic normocytic anemia, high ESR, bony pains, and renal impairment. There is a monoclonal proliferation of plasma cells that produce whole monoclonal antibodies or fragments. The monoclonal antibodies are most often IgG, then IgA or light, then heavy chains. The CRAB criteria are a set of clinical features used to diagnose active multiple myeloma. The acronym CRAB stands for: Calcium elevation: (hypercalcemia), often due to bone breakdown. Renal insufficiency: Impaired kidney function, often from abnormal proteins produced by myeloma cells damaging the kidneys. Anemia: leading to fatigue, weakness, and shortness of breath. Bone lesions: often seen as lytic lesions on imaging. This can cause bone pain, fractures, or spinal cord compression.\n2. The   investigation: Plasma protein electrophoresis will show a monoclonal gamma globulin spike (M band). Bence-Jones proteinuria can be detected by urine protein electrophoresis, serum free light chains assay, and serum immunoglobulin levels. Bone marrow examination for increased monoclonal plasma cells. Radiological skeletal survey for osteolytic lesions by plain radiography, PET/CT, or MRI, which are more sensitive and better diagnose osteolytic lesions. Hypercalcemia leads to confusion and lack of concentration, polyuria, and severe dehydration. Hypercalcemia is associated with abdominal pain and constipation. ECG should be done for a short QT interval. The raised creatinine is the result of acute renal injury.\n-   The renal injury is direct tubular injury by possible deposition of immunoglobulin light chains or obstruction of distal tubules by proteinaceous casts.\n-   Amyloidosis (AL amyloidosis) is usually present with nephrotic syndrome.\n-   The deposition of calcium in the kidney, together with dehydration, contributes to renal impairment.\n-   Marked hyperuricemia, which may be present,also contributes to kidney injury."}, {"num": 205, "chapter": "Hematology", "front": "A 68-year-old man presents with fatigue and generalized weakness for 4 months. He has a history of recurrent pneumonia and night sweats. By Examination, He has an enlarged spleen and generalized lymphadenopathy. His blood count shows the following: Hb 10.5 g/dL, the RBCs normochromic normocytic, WBC 65.5 x 10%/dl (90% mature lymphocytes {smudge cells}) with a normal platelet count.\n\nWhat is the most likely diagnosis? s\n\nWhat is the next step to confirm the diagnosis? A\n\nWhy would he have recurrent infections?\n\nIf he suddenly developed anemia and jaundice, what would be the most likely explanation? What investigations would you carry out?", "back": "L. The diagnosis is lymphoproliferative disorders, mostly chronic lymphocytic leukaemia (CLL). The diagnosis is supported by the presence of lymphadenopathy, splenomegaly, B symptoms, and the complete blood counts with differentials show an absolute lymphocyte count of more than 5000 B-lymphocytes/uL, Smudge Cells are fragile remnants of lymphocytes that rupture during blood smear preparation, their presence reflects the mechanical fragility of CLL lymphocytes. Immunophenotyping by flow cytometry on peripheral blood = Bone marrow examination £ LN biopsy. Recurrent infection explained by:\n-    Patients with CLL commonly have B-cell dysfunction — hypogamaglobulinemia and impaired T-cell function — weak cellular immunity predispose patients to potentially serious infections, such as pneumonia and septicemia. May be chemotherapy-related IMmMunNosuppression. A sudden drop in Hb (in the absence of bleeding) and development of jaundice is explained by autoimmune hemolysis, which is commonly associated with lymphoproliferative disorders (lymphoma, CLL) The required investigations 10 confirm the presence of autoimmune hemolytic anemia:\n\n-   Reticulocyte count, bilirubin (direct and indirect), and LDH. Coombs test (to detect antibody and /or complement bound to RBCs membrane)."}, {"num": 206, "chapter": "Hematology", "front": "A 46-year-old man presents to the hospital with a history of fever, fatigue, early satiety, and a feeling of fullness in his left side for 4 months. No recent history of infections or bleeding. On examination, there was an enlarged spleen. A CBC shows: Hb 11.5 g/dL, WBC     80.8    x   10%dl    with    differential:   myeloblasts,   myelocytes, metamyelocytes (early WBC forms) and basophilia. His platelet count is 600x 10°/d1.\n\n1. What is the most likely diagnosis?\n\n2. How to confirm the diagnosis?\n\n3. What is the treatment of choice for this disease?", "back": "1. The presence of splenomegaly with characteristic changes in CBC makes the diagnosis most probably chronic myeloid leukemia (CML). It is a myeloproliferative disorder characterized by increased proliferation of the granulocytic cell line without the loss of their capacity to differentiate. Peripheral blood shows neutrophilia with immature precursors (early granulocyte forms but not blast cells). Confirmation of diagnosis: - Identification of Philadelphia chromosomes by cytogenetic analysis or the FISH method. Also, detection of BCR-ABL protein by PCR (molecular testing). Bone marrow examination to evaluate the phase of the disease. Pelvi-abdominal ultrasonographyto assess splenomegaly. Serum electrolytes, uric acid, LDH, liver and kidney function tests\n\nTreatment:\n\n- Reduce the total leucocytic count using hydroxyurea.\n\nAllopurinol to prevent and treat hyperuricemia. Leukapheresis may be used in an emergency with severe leukocytosis symptoms, €.g. priapism. Molecular target therapy i.e., tyrosine kinase inhibitor like Imatinib Pegylated interferon may be used in some cases during pregnancy"}, {"num": 207, "chapter": "Hematology", "front": "A 27-year-oldwoman presents with attacks of epistaxis and heavy menstrual bleeding. She denies any history of drug intake. She also mentioned no history of fever or weight loss. The examination revealed scattered petechiae over the whole body and bruises on both left and right lower limbs. Petechial hemorrhages were also noted on the palate. There was no hepatosplenomegaly. A full blood count reveals a platelet count of < 10 x 10%/uL, WBC 4.5x10°/L and Hb 9.5 g/dL,MCV: 65 fL. Normal reticulocytic count and LDH, Normal PT and PTT.\n\n1. What is the most probable diagnosis?\n\n2. What is the differential diagnosis?\n\n3. Describe a peripheral blood and bone marrow picture of the most probable diagnosis, and mention the investigations required for her?\n\n4. What is the treatment?", "back": "1. Immune thrombocytopenia (ITP) is likely. In the absence of constitutional manifestations and any physical findings, especially an enlarged spleen, only mucocutaneous bleeding is present. Other causes of thrombocytopenia include drugs, viral infection (HCV, EBV, HIV), leukemia, bone marrow infiltration, myelodysplastic syndrome (MDS), aplastic anemia, and other autoimmune diseases (as SLE). ITP is basically a diagnosis of exclusion: On CBC the hallmark of ITP is isolated thrombocytopenia. On peripheral blood smear, red blood cells and leukocytes are normal. (Microcytic hypochromic anemia may be present secondary to bleeding) Bone marrow aspirate is not mandatory to diagnose ITP unless diagnosis is doubtful. Bone marrow aspirate and biopsy will show normal erythroid, myeloid precursors and cellularity and no fibrosis. Normal/increased number of megakaryocytes with defective budding. Other investigations: a workup to exclude secondary causes for ITP: Auto-immune: ANA, Anti-DNA, C3, C4, HCV Ab, HBsAg, HBsAb, CMV Ab, EBV Ab, HIV Ab, H Pylori Ag in stool, Abdominal US Treatment:     Adults   with platelet    count   >30x10%/dlwho     are asymptomatic or have mild mucocutaneous bleeding do not require freatment.\n\nPlatelet transfusion is indicated for bleeding, PLT count < 10x10%/dl, or before surgery. First-line treatment, Corticosteroids: either prednisone (0.5-2 mg/kg per day) or dexamethasone 40 mg per day for 4 days. IVIG may be used when a more rapid response in platelet count is required. Second-line treatment (depends on preference): thrombopoietin receptor agonist (TPO-RAs) (either eltrombopag or romiplostim) Rituximab - Splenectomy (delayed for at least 1 year after diagnosis)"}, {"num": 208, "chapter": "Hematology", "front": "A 29-year-old woman presents to the emergency department with confusion. She was well until 3 days ago, when she developed fever, dark colored urine, and rash on her legs. On examination: her conscious level (GCS 13/15), with petechiae over both legs. Hb is 7g/dl, MCV 85 fL, WBCs 11 x 10°/dl, with a normal differential, Platelets 10 x 10%L. Peripheral blood smear showed severe thrombocytopenia and schistocytes (fragmented red blood cells). An increased reticulocyte counts, elevated indirect bilirubin and LDH. PT and PTT are normal\n\n1. What is the most likely diagnosis?\n2. What is the Differential diagnosis?\n\n3. What is the main line of treatment of such case?", "back": "1. In the context of a confused patient, fever, hemolytic anemia, thrombocytopenia, and blood film revealed fragmented RBCs, acquired Thrombotic Thrombocytopenic Purpura (aTTP) is most likely the diagnosis.\n-   Diagnosis is confirmed by testing ADAMTS13, which is < 10% in cases of TTP. The presence of Coomb's-negative hemolytic anemia and thrombocytopenia should raise the suspicion of TTP. The differential diagneosis in this case is: ITP, but could not explain hemolytic anemia. Sepsis and DIC, but no suggestive history, and PTT and PT are normal. SLE with lupus cerebritis, immune thrombocytopenia, and vasculitis is a possibility. The main line of treatment:\n\nPlasma exchange with fresh frozen plasma and immunosuppression: “steroids” is the main line of treatment           of the    acquired Thrombocytopenic Purpura (aTTP). Rituximab is also considered part of the first line, along with plasma exchange and steroids (prolong remission and better response). Caplacizumab is an FDA-approved treatment for TTP, which is a humanized anti-von Willebrand factor monoclonal antibody fragment that inhibits the interaction between von Willebrand factor and platelets."}, {"num": 209, "chapter": "Hematology", "front": "A 69-year-old patient presents with a headache and peripheral numbness. Two years ago, he developed deep venous thrombosis of his right leg after cholecystectomy. He was treated with warfarin for three months with good recovery. On examination, there were plethoric facies and splenomegaly. No manifestations of chronic liver disease. The rest of the examination is normal,\n\nInvestigations show: Hb 19.5g/dl, a peripheral blood film shows numerous RBCs, no abnormal or immature cells are seen, WBCs: 16.6 x 10%/dl, platelets 550 x 10%/dl, ESR was 3, uric acid 8.4 mg/dl.\n\n1. What is the underlying diagnosis? Define this condition?\n\n2. What are the following investigations you can ask for?\n\n3. How will you treat this patient?", "back": "&   The patient has a high Hb level, elevation of platelet count, with mild leukocytosis, low ESR, and raised uric acid, indicating rapid cell turnover; all of these are suggestive of polycythemia. The following investigations are recommended: - Exclude secondary causes of polycythemia: Oxygen saturation, CXR, and echocardiography. To confirm polycythemia vera (PV) serum erythropoietin level, JAK2 mutation =+ bone marrow biopsy with reticulin stain In polycythemia vera, there is high red cell mass and normal oxygen saturation, subnormal erythropoietin level, and JAK2 mutation present in 90% of cases.\n\nThe treatment will be:\n\nCyto-reductive therapy: hydroxyurea, interferon alpha (as this patient is high risk (age, previous DVT), low-risk patients (age less than 60, no thrombotic events, and negative JAK2 mutation) are not candidates for cytoreductive therapy. Periodic phlebotomy (venesection) reaching the target hematocrit level, which is in men < 45% women <42%.\n\nLow-dose aspirin is a line of therapy to prevent thrombosis"}, {"num": 210, "chapter": "Hematology", "front": "A 19-year-old Egyptian female patient from El Menia presents for evaluation of anemia. She is 7 months pregnant. There is no history of bleeding or episodic bone pain. Physical examination reveals no hepatosplenomegaly or lymphadenopathy. The complete blood count (CBC) shows a leukocyte countof 5,400/ul. hemoglobin 8.8 g/dl with MCV 62.7 FL and platelet count 251,000/ul. Her ferritin level is 200ng/dl. No previous history of blood transfusion, but there is a history of repeated oral iron intake by herself due to mild anemia since childhood. There is positive consanguinity.\n\n1. What would support a diagnosis of beta thalassemia trait rather than simple iron deficiency?\n\n2. What is her possible diagnosis if her HB electrophoresis and iron profilewere normal?\n\n3. Is there a simple index to differentiate between iron deficiency andthalassemia?", "back": "1. This case represents the classic presentation of the thalassemia trait. She was misdiagnosed as having iron deficiency, received iron preparations without investigating her iron status, whichis normal in most cases of thalassemia trait.\no A consistent finding in carriers of beta thalassemia is microcytic anemia with an elevated RBC count. The blood smear shows microcytic hypochromic red cells and target cells. Iron-deficiency anemia is associated with an increased red cell distribution width (RDW) anddecreased RBC counts. The confirmation of diagnosis is with hemoglobin electrophoresis, as in B thalassemia trait increased HbA2, with values ranging from 3.5% to 7% (mean, 5%). HbF is in the range of 1% to 3% that increased in approximately 50% of patients,\n2. Alpha thalassemia trait results from a deletion of 2 alpha globin genes. The clinical phenotype is that of mild hypochromic microcytic anemiain an asymptomatic or minimally symptomatic individual. Hemoglobin electrophoresis is typically normal in contrast to increased HbA2fraction seen in cases of beta thalassemia. Diagnosis confirmed by genetic studies of alpha globin gene mutations.\n3. The Mentzer Index is a diagnostic tool used to help differentiate between iron deficiency anemia (IDA) and beta thalassemia trait (BTT). It is the MCV divided by the RBC count. The principle involved is as follows: In iron deficiency, the marrow cannot produce as many RBCs, and they are small (microcytic), so the RBC count andthe MCV will both be low, and as a result, the index will be greater than 13. Conversely, in thalassemia, which is a disorder of globin synthesis, the number of RBCs produced is normal, but the cells are smaller and more fragile. Therefore, the RBC count is normal, but the MCV is low, so the index will be less than 13."}, {"num": 211, "chapter": "Hematology", "front": "A 31-year-old woman from El Wadi El Gedid governorate was admitted to thehospital with diffuse lower back pain, as well as right shoulder and knee pain, The patient reports several similar episodes in the past. On physical exam, there is decreased range of motion in the affected joints due to pain, with no obvious swelling. Laboratory tests show a hemoglobin level of 7.7 g/dL, a mean corpuscular volume (MCYV) of 85 fL, and normal white blood cell and platelet counts. Her peripheral blood smear shows a few sickled red blood cells(RBCs) and some basophilic RBC inchysions.\n\n1. What      is   your    provisional   diagnosis?        What    are   the recommended investigations?\n2. What     do    her    RBC   inclusions   refer   to?    What    are its managementimplications?", "back": "1. The case describes a young female with multifocal bone pain. Laboratory evaluation reveals a moderately severe normocytic anemia. The blood film shows that the patient has the features expected in sickle cell anemia, including hyposplenic features (a Howell— Jolly body). Confirmation of diagnosis is by Hb% electrophoresis.\no   Hemoglobin electrophoresis separates different types of hemoglobin (Hb) based on their electrical charge. It helps identify abnormal variants like HbS.\no   In Sickle Cell disease: HbS: ~85-95%, HbF: 1 (often 5-15%), HbA:Absent, while in Sickle cell Trait HbA: ~50-65%, HbS: ~35- 45%, HbF: Normal, HbA2: Normal.\n\n2. Peripheral blood smear reveals few sickled red blood cells (RBC), few basophilic RBC inclusions representing Howell-Jolly bodies, which are nuclear remnants that are removed by the spleen. Their presence in the peripheral blood is suggestive of decreasedsplenic function. Functional asplenia is an early complication of sickle cell disease that is evident within the first year of life. Nuclear medicine spleen and liver scan was obtained and revealed nearly absent splenic uptake consistent with functional asplenia. Once diagnosed, patients require:\no   Vaccinations (pneumococcal, meningococcal, Hib)\no   Antibiotic prophylaxis in some cases\n\no   Education on infection risks and early signs of sepsis"}, {"num": 212, "chapter": "Hematology", "front": "An 18-year-old male, was diagnosed at the age of 1 year with transfusiondependent (TDT) P-thalassemia major. He has been on regular blood transfusions every 3—4 weeks since infancy. Presenting complaints are fatigue and exertion dyspnea, palpitations, poor growth, delayedpuberty, and Occasional joint pain. Physical Exam: pale, mildly jaundiced, Hepatosplenomegaly, Tanner stage I, systolic murmur, his investigations work up revealed hemoglobin: 9.2 g/dL (post-transfusion), Ferritin: 3,500 ng/mL (elevated). Endocrine panel: Low testosterone, borderline hypothyroidism\n\n1. Please explain his presentation. What other complications are expected?\n\n2. Please recommend a further plan of management.", "back": "L. The case describes a classic thalassemia major case with complications secondary to iron overload due to repeated blood transfusions. He has manifestations of chronic hemolytic anemia, delayed puberty, and Cardiomyopathy. a. Complications include iron load that affect:\n-   Cardiac: early iron-induced cardiomyopathy and anemic heart failure,\n-   Hepatic: risk of fibrosis and cirrhosis,\n-   Endocrine: Hypogonadism, hypothyroidism, risk of diabetes,\n-   Skeletal: Osteopenia and joint pain, Growth delay: Due to chronic anemiaand endocrine dysfunction. b. Complications of repeated blood transfusions, blood-borne infections like hepatitis B, hepatitis C, and HIV, febrile nonhemolytic reactions, allergic reactions, hemolytic reactions, and alloimmunizations. ¢. Impaired Quality of life: physical, psychological, and social effects. Management Plan: iron chelation start when ferritin exceeds 1000 ng/mlL e   Deferasirox: oral 20-40mg/kg/day - Deferoxamine: effective but SC or IV, requires infusion pumps 20-40mg/kg/day over 8-12 hrs 5-7 days/week — Deferiprone: oral 25 mg/kg Threetimes daily (TID)\n-   Monitor iron burden: ferritin (every 3 months) is not perfectly reliable alone. Always interpret ferritin alongside MRI iron quantification of liver and heart\n-   Endocrine support: hormone replacement therapy for hypogonadism\n-   Cardiac care: Echocardiogram and cardiology follow-up\n-   Psychosocial support: Counseling for chronic illness and delayed puberty\n-   Emerging therapies for thalassemia: Luspatercept: A newer drug that enhances red blood cell maturation, reducing transfusion needs. Gene therapy trials: aiming to correct genetic defects directly. Bone marrow transplantation: Still a curative option forsome, especially with matched donors."}, {"num": 213, "chapter": "Hematology", "front": "A 28-year-old gir]l presented with a two-month history of weakness, chills, fever, anorexia, and weight loss. Her medical history was not remarkable. Physical examinations showed marked pallor, generalized lymphadenopathy, and hepatosplenomegaly. Laboratory findings included anemia with moderate anisopoikilocytosis, hemoglobin level of 8.2 g/dl, ESR 90 mm/hr, and positive C-reactive protein. Polymerase chain reaction for tuberculosis, blood culture, urine culture, hydatid antibody, direct Coomb's test, bone marrow culture, and blood smear for malaria were all negative.\n\n1. What is the most likely diagnosis?\n2. What are the investigations needed?", "back": "1. The diagnosis is most probably lymphoma. In the presence of prolonged fever, hepatosplenomegaly, and generalized lymphadenopathy, lymphoma should be considered. Most patients present with overt disease, most often as               an asymptomatic enlarged lymph node. However, the presenting symptoms and signs may be relatively nonspecific and more compatible with infection than malignant disease. o Another D.D 1s systemic sarcoidosis (LN biopsy will differentiate) Each type of lymphoma has distinct histology, biologic behavior, and clinical characteristics: PET CT scan will show enlarged lymph nodes, hepatomegaly, and/or splenomegaly and define its metabolic activity, which will guide us for staging of lymphoma and to select the lymph node to be biopsied (with the highest metabolic activity), Lymph     node     biopsy,   pathology     for   morphology,         and Immunohistochemistry are the most important steps for diagnosis.\n\nBone marrow biopsy confirming the diagnosis and to show the histological type and grade of lymphoma Serum uric acid, LDH and p-2 microglobulin (prognostic markers)"}, {"num": 214, "chapter": "Hematology", "front": "A 38-year-old man was admitted with a femur fracture. Surgical repair was performed, and prophylactic-dose enoxaparin was administered along with oxycodone as needed for pain. Two days later, he experienced increasing pain and swelling in his right leg. His medical history is unremarkable. However, family history reveals that his mother had pulmonary embolism at age 66 while receiving breast cancer treatment, and a maternal uncle experienced a deep vein thrombosis (DVT) at age 78.\n\nPhysical examination: vital signs were normal. The right leg showed an increased circumference of 2 cm at the mid calf compared with the left. The surgical site is clean and dry.\n\n1. What is your provisional diagnosis? What are the recommended investigations?\n\n2. Is this case indicated for inherited thrombophilia screening?\n\n3. What is your plar of management?", "back": "1. Deep Vein Thrombosis (DVT) of the right lewer limb as the patient has recent orthopedic surgery (major risk factor for DVT, provoked DVT), unilateral leg swelling and pain, > 2 cm difference in leg circumference, and a family history that may suggest a prothrombotic tendency (although weak). Recommended Investigations:\n\n-   Compression duplex ultrasonography: diagnostic gold standard for proximal DVT\n-   D-dimer: Useful in cases of low clinical suspicion, but likely not needed here due to high probability\n-   CBC.: to check for thrombocytosis or polycythemia.\n-   Coagulation Profile (PT/INR, aPTT): To establish baseline before initiating therapeutic anticoagulation Thrombophilia testing is not indicated in patient who develop a venous thromboembolism in the setting of a major transient risk factor (major surgery or trauma or prolonged immobility), Furthermore, the family history is weakly positive (DVT occurred in the context of malignancy and old age) Plan of Management:\n\n-   Escalate Enoxaparin to full therapeutic dose (1 mg/kg SC qi2h) or start direct oral anticoagulants (DOACs) like rivaroxaban or apixaban, if kidney function is impaired use unfractionated heparin (UFH) with aPTT monitoring\n-   Pain and mobility: Leg elevation, compression stockings (after acute phase), and continue oxycodone as needed, monitor for opioid side effects\n-   Duration of anticoagulation in case of provoked DVT is 3 months\n-   Follow-up: monitor for thrombus resolution, bleeding, symptoms and signs of pulmonary embolism.\n-   Evaluate for inherited thrombophilia if unprovoked events occur in the future."}, {"num": 215, "chapter": "Hematology", "front": "A 28-year-old man has a sudden onset of bone pain. He also begins experiencing bleeding from his gums. Looking retrospectively, he notes a decreased energy level over the past weeks. He feels dizzy and has dyspnea on exertion. He looks pale and has numerous ecchymoses over his body. Hepatosplenomegaly is noted. A full blood count shows WBC of 102 x 10° /dl. A bone marrow biopsy shows numerous blasts.\n\n1. What is the SINGLE most likely diagnosis? Justified the diagnosis?\n2. What are the investigations required?", "back": "Acute myeloid leukemia (AMIL)\n\nExplanation:\n\nIn the context of rapidly progressive symptoms, anemia, bony pains with marked leukocytosis, and blasts cells in the bone marrow all suggest the diagnosis of acute leukemia. This neoplastic proliferation of blast cells is derived from marrow myeloid elements. It progresses rapidly (death in about 2 months if untreated)\n\nInvestigations\n\nCBC: Total WBC count is often high. However, it may also be normal or even low, Neutrophils are usually depleted, and blast cells are seen in their place Bone marrow aspiration is the diagnostic procedure. (The WHO classification requires more than 20% blasts in the peripheral blood, to make a diagnosis of AML) Flow cytometry (immunophenotyping) is used to help distinguish AML from acute lymphocytic leukemia (ALL). Most AML subtypes show more than 20% blasts of a myeloid lineage in the blood, bone marrow, or both."}, {"num": 216, "chapter": "Hematology", "front": "A 53-year-old man was presented to the outpatient clinic because of lowgrade fever, pruritus, headache, and paresthesia over the past few months, with no past significant medical history. Recently, he also experienced 3 attacks of epistaxis over the last 2 weeks. Physical examination revealed dusky extremities and a just palpable spleen. The blood picture showed HB 11 g/dl, MCV 78 fL, platelets 1200 x10°/dl, WBC: 9 x10%dl, Basophils 1%, Eosinophils 1%, Lymphocytes 22%, Monocytes: 2%, Staff 4%, Segments 70%.\n\n1. What is the most probable differential diagnosis?\n\n2. What would be the diagnestic workup in evaluating this patient's condition?\n3. What are the complications of this condition?\n\n4, What is the main line of treatment for this condition?", "back": "1. Thrombocytosis is either primary (essential thrombocytosis ET) or secondary due      to   (iron    deficiency,      infection,    inflammation   or malignancy).\n\nEssential thrombocytosis is the most probable diagnesis due to the presence of symptoms and splenomegaly with the absence of anemia or inflammation. The diagnostic workup would be:\n-   Persistent platelet count > 450 x 10%/dl\n-   Iron profile, inflammatory markers e.g., C-reactive protein).\n-   BM biopsy: megakaryocyte proliferation with large and mature morphology.\n-   Philadelphia chromosome and BCR-ABL to rule out chronic myeloid leukemia.\n\n-   JAK2 mutation is present in ET. (50% of cases) The main complications:\n\n-   Thrombotic     events       and      bleeding      (usually     with   extreme thrombocytosis (platelet count > 1500 x 10%/dl due to acquired VWD) Main lines of treatment:\n\n-   Manage cardiovascular risk factors.\n\n-   Aspirin (81-100 mg daily) should be used with caution in patients with acquired VWD.\n-   Cytoreduction e.g. hydroxyurea (10-30mg/kg/day) in high-risk patients (age > 60, thrombotic event, JAK2 mutation)"}, {"num": 217, "chapter": "Nephro", "front": "A female patient 50 years old, known to have long standing hypertension on irregular treatment, presented with history of generalized fatigue over the last 6 months. Over the last 2 months, she complained of nausea with occasional vomiting and she reported to have weight loss and some itching. On examination, her BP was 170/110 mmHg, she was found to be pale with some scraich marks over the LL. Her skin was dry and cardiac examination revealed a systolic murmur. Investigations showed serum creatinine 9 mg/dl, BUN 100 mg/dl, serum Na 135mmol/L, K 5.8mmol/L, Ca 7.5 mg/dl, P 6.5mg/dl, Hb 8gm/dl, WBC 4.7 x 10° /mm?, Platelets count 190 x 10° /mm?.\n\nWhat is the most likely diagmsis? o=\n\nWhat further investigation would you like to perform?\n\nHow can you manage her anemia? Ao\n\nDiscuss treatment strategies for this patient?", "back": "1. The patient presents with typical symptoms of end stage renal failure, namely anorexia, nausea, weight loss, fatigue and pruritus. The elevated urea and creatinine    levels confirm     renal    failure,   anemia,      hypocalcemia, hyperphosphatemia and dry skin indicate the chronic nature of the condition. Ultrasonography: either showing shrunken kidsneys with reduced echogenicity, or obvious causes of renal failure such as a polycystic kidney disease or obstruction causing bilateral hydronephrosis. Asymmetrically sized kidneys suggest reflux nephropathy or renovascular disease.\n\nPTH level: elevated in secondary hyperparathyroidism in CKD patients.\n\nComplete blood picture with RBC indices, reticulocytic count and iron study (serum Fe, TIBC and ferritin ) are done provisionally to investigate the type of anemia: ( target Hb in CKD patients is usually 10-11.5 g/dl)\n\n-   If normochromic normocytic, is predominantly due to erythropoietin deficiency, erythropoietin injection is usually needed.\n-   If inadequate iron stores (if ferritin <500 ng/ml, transferrin saturation <30 %), iron should be replaced by oral iron, however, if iron absorption is not adequate or the IV route which is the preferred route on dialysis.\n-   Hypoxia inducible factor (HIF) stabilizers as Roxadustat that stimulate endogenous EPO production & improve iron metabolism.\n-   Blood transfusion is considered when Hb falls below 7 g/d! (or higher in patients with comorbidities like cardiovascular disease).\n-   Being symptomatic with raised chemistry and shrunken kidneys and no correctable factor (dehydration, infection, obstruction), renal replacement therapy (hemodialysis HD or peritoneal dialysis PD) or transplantation are indicated. In case of HD, an AV fistula should be constructed. This should actually have been done earlier while the patient is in chronic kidney disease CKD stage 4 (GFR 30-15).\n\n-   If transplantation is the chosen option, a compatible donor should be available. This modality resumes function to normal but needs life long immunosuppression and follow up."}, {"num": 218, "chapter": "Nephro", "front": "A 70 years old male, living alone developed an attack of diarrhea that persisted for 3 days before coming to the hospital. He complained of reduced urine output and marked weakness and reported that he was too weak even to bring himself a glass of water. He has no past history of medical importance. On examination his BP was 90/60, he had dry mucous membranes and skin turgor showed evident dehydration. Laboratory work revealed serum creatinine 6 mg/dl, urea 200 mg/dl, Hb
