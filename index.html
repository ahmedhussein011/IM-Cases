<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Internal Medicine Case Bank — Diagnosis Recall</title>
<style>
  :root{
    --paper:#f5f3ee;
    --paper-raised:#ffffff;
    --ink:#20262b;
    --ink-soft:#5a6570;
    --navy:#173a4d;
    --navy-deep:#0e2733;
    --teal:#3c7d78;
    --amber:#b8863b;
    --line:#dcd6c9;
    --chart-green:#4a7c59;
    --danger:#a44a3f;
    --shadow: 0 1px 2px rgba(20,30,35,.06), 0 8px 24px -12px rgba(20,30,35,.25);
    --radius: 14px;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --mono: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
  }
  body::before{
    content:"";
    position:fixed;inset:0;
    pointer-events:none;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(23,58,77,.055) 1px, transparent 0);
    background-size:22px 22px;
    z-index:0;
  }

  #app{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}

  .screen{display:none;flex:1;flex-direction:column;}
  .screen.active{display:flex;}

  button{font-family:inherit;cursor:pointer;}
  button:disabled{cursor:not-allowed;}
  button:focus-visible, [tabindex]:focus-visible{
    outline:3px solid var(--amber);
    outline-offset:2px;
  }

  /* ============ SETUP SCREEN ============ */
  .masthead{
    background:linear-gradient(180deg, var(--navy-deep), var(--navy) 85%);
    color:#f2ede0;
    padding:38px 20px 30px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .pulse-line{
    position:absolute;
    left:0;right:0;top:14px;
    height:34px;
    opacity:.55;
  }
  .pulse-line svg{width:200%;height:100%;animation:drift 9s linear infinite;}
  @keyframes drift{ from{transform:translateX(0);} to{transform:translateX(-50%);} }

  .masthead h1{
    font-family:var(--serif);
    font-weight:400;
    font-size:clamp(28px,7vw,40px);
    line-height:1.15;
    margin:14px 0 6px;
    letter-spacing:.2px;
  }
  .masthead h1 span{
    display:block;
    font-style:italic;
    color:#d7c9a3;
    font-size:.72em;
    margin-top:2px;
  }
  .tagline{
    margin:0;
    font-size:13.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#a9c2c9;
  }

  .setup-body{
    max-width:640px;
    width:100%;
    margin:0 auto;
    padding:26px 18px 100px;
    flex:1;
  }

  .setup-block{margin-bottom:30px;}

  .overall-progress-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:#eef4f1;
    border:1px solid #cfe0d8;
    border-radius:10px;
    padding:10px 14px;
    margin-bottom:22px;
  }
  .overall-progress-text{
    font-size:12.5px;
    font-weight:600;
    color:var(--navy-deep);
  }
  .overall-progress-text b{color:var(--chart-green);font-weight:700;}
  #reset-progress-btn{font-size:11.5px;flex:none;white-space:nowrap;}

  .resume-btn{
    max-width:640px;margin:0 auto 10px;
    display:block;width:100%;
    background:#fff;
    color:var(--navy-deep);
    border:1.5px solid var(--navy-deep);
    padding:13px 18px;
    border-radius:11px;
    font-size:14px;
    font-weight:700;
  }
  .resume-btn:active{transform:scale(.99);}

  .setup-block-head{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:12px;
  }
  .setup-block h2{
    font-family:var(--serif);
    font-weight:400;
    font-size:19px;
    margin:0 0 12px;
    color:var(--navy-deep);
  }
  .setup-block-head h2{margin-bottom:0;}
  .link-btn{
    background:none;border:none;color:var(--teal);
    font-size:13px;font-weight:600;text-decoration:underline;
    padding:4px 0;
  }

  .chapter-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .chapter-card{
    background:var(--paper-raised);
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:13px 14px;
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:6px;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
    position:relative;
  }
  .chapter-card:active{transform:scale(.98);}
  .chapter-card .cc-top{display:flex;align-items:center;gap:8px;}
  .chapter-card .cc-check{
    width:17px;height:17px;flex:none;
    border-radius:5px;
    border:1.5px solid #b8c0bd;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
  }
  .chapter-card .cc-check svg{width:11px;height:11px;opacity:0;transition:opacity .1s;}
  .chapter-card .cc-name{font-weight:600;font-size:14.5px;color:var(--ink);}
  .chapter-card .cc-count{font-size:12px;color:var(--ink-soft);padding-left:25px;}
  .chapter-card.selected{
    border-color:var(--teal);
    background:#eef4f1;
  }
  .chapter-card.selected .cc-check{background:var(--teal);border-color:var(--teal);}
  .chapter-card.selected .cc-check svg{opacity:1;}

  .mode-toggle{
    display:flex;
    background:#eae6db;
    border-radius:10px;
    padding:4px;
    gap:4px;
  }
  .mode-toggle.browse-toggle{ margin-bottom:14px; }
  .mode-btn{
    flex:1;
    border:none;background:transparent;
    padding:10px 8px;
    border-radius:7px;
    font-size:13.5px;font-weight:600;
    color:var(--ink-soft);
    transition:background .15s, color .15s;
  }
  .mode-btn.active{background:#fff;color:var(--navy-deep);box-shadow:var(--shadow);}

  .setup-footer{
    position:fixed;left:0;right:0;bottom:0;
    background:linear-gradient(0deg, var(--paper) 70%, rgba(245,243,238,0));
    padding:22px 18px 18px;
    z-index:5;
  }
  .start-btn{
    max-width:640px;margin:0 auto;
    display:block;width:100%;
    background:var(--navy-deep);
    color:#f2ede0;
    border:none;
    padding:15px 18px;
    border-radius:11px;
    font-size:15.5px;
    font-weight:700;
    letter-spacing:.01em;
    box-shadow:var(--shadow);
    transition:opacity .15s, transform .1s;
  }
  .start-btn:active{transform:scale(.99);}
  .start-btn:disabled{background:#b9b2a0;color:#fff;box-shadow:none;}
  .start-hint{
    max-width:640px;margin:8px auto 0;
    text-align:center;font-size:12px;color:var(--ink-soft);
  }

  /* ============ STUDY SCREEN ============ */
  .study-topbar{
    padding:14px 16px 10px;
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--paper);
  }
  .icon-btn{
    background:none;border:none;
    color:var(--navy);
    font-size:14px;font-weight:600;
    padding:6px 4px;
    white-space:nowrap;
  }
  .progress-wrap{flex:1;min-width:0;}
  .progress-info{
    display:flex;align-items:center;
    margin-bottom:6px;
    gap:6px;
    flex-wrap:wrap;
  }
  .chapter-badge{
    font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    color:var(--teal);
    background:#e4efec;
    padding:3px 9px;
    border-radius:100px;
    white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
    border:none;
    font-family:inherit;
    cursor:default;
  }
  .chapter-badge.is-hidden{
    color:#9aa2a0;
    background:#eae6db;
    cursor:pointer;
    letter-spacing:.03em;
  }
  .class-badge{
    font-size:11px;font-weight:700;letter-spacing:.03em;
    color:var(--amber);
    background:#f6ecd9;
    padding:3px 9px;
    border-radius:100px;
    white-space:nowrap;
  }
  .fl-num.is-hidden{
    cursor:pointer;
    text-decoration:underline dotted;
    text-underline-offset:2px;
  }
  #progress-text{
    font-size:12.5px;font-weight:600;color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
    margin-left:auto;
  }
  .progress-bar{
    height:5px;background:#e4e0d3;border-radius:100px;overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--teal), var(--chart-green));
    border-radius:100px;
    width:0%;
    transition:width .25s ease;
  }

  .card-stage{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px 18px 4px;
    perspective:1800px;
    min-height:360px;
  }

  /* Height is set in viewport units rather than a % of an ancestor —
     percentage heights through nested flex containers resolve
     inconsistently on some mobile browsers/webviews and can collapse
     the card to zero height. vh/dvh always resolve regardless of
     ancestor layout, so this keeps the card reliably visible. */
  .flashcard{
    width:100%;
    max-width:560px;
    height:56vh;
    height:56dvh;
    min-height:340px;
    max-height:520px;
  }
  .flashcard-inner{
    position:relative;
    width:100%;height:100%;
    transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.4,.2,.2,1);
    cursor:pointer;
  }
  .flashcard.flipped .flashcard-inner{transform:rotateY(180deg);}

  .flashcard-face{
    position:absolute;inset:0;
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
    background:var(--paper-raised);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    border:1px solid var(--line);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .flashcard-front{border-top:5px solid var(--navy);}
  .flashcard-back{
    transform:rotateY(180deg);
    border-top:5px solid var(--chart-green);
  }

  .face-label{
    flex:none;
    padding:14px 22px 8px;
    font-family:var(--serif);
    font-style:italic;
    font-size:13px;
    letter-spacing:.04em;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .flashcard-front .face-label{color:var(--navy);}
  .flashcard-back .face-label{color:var(--chart-green);}
  .face-label .fl-num{
    font-family:var(--mono);
    font-style:normal;
    font-size:11px;
    color:var(--ink-soft);
  }

  .face-scroll{
    flex:1;
    overflow-y:auto;
    padding:2px 22px 10px;
    -webkit-overflow-scrolling:touch;
  }
  .face-scroll p{
    margin:0;
    white-space:pre-wrap;
    font-size:15.5px;
    line-height:1.62;
    color:var(--ink);
  }
  .flashcard-back .face-scroll p{color:#233229;}

  .face-hint{
    flex:none;
    text-align:center;
    font-size:11px;
    color:#9aa2a0;
    padding:6px 0 12px;
    letter-spacing:.03em;
  }

  .controls{
    flex:none;
    display:flex;
    gap:10px;
    padding:14px 18px 6px;
    max-width:560px;
    width:100%;
    margin:0 auto;
  }
  .ctrl-btn{
    flex:1;
    background:#fff;
    border:1.5px solid var(--line);
    color:var(--navy-deep);
    padding:13px 10px;
    border-radius:10px;
    font-size:14px;
    font-weight:700;
  }
  .ctrl-btn:disabled{opacity:.4;}
  .ctrl-primary{
    background:var(--navy-deep);
    color:#f2ede0;
    border-color:var(--navy-deep);
    flex:1.3;
  }
  .ctrl-primary:active{transform:scale(.98);}

  .restart-btn{
    display:block;
    margin:6px auto 22px;
    background:none;border:none;
    color:var(--ink-soft);
    font-size:12.5px;
    text-decoration:underline;
    padding:8px;
  }

  .end-note{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    padding:0 24px 10px;
  }

  @media (min-width:720px){
    .chapter-grid{grid-template-columns:1fr 1fr 1fr;}
  }
  @media (max-width:380px){
    .chapter-grid{grid-template-columns:1fr;}
  }

  @media (prefers-reduced-motion: reduce){
    .flashcard-inner{transition:none;}
    .pulse-line svg{animation:none;}
  }
</style>
</head>
<body>
<div id="app">

  <!-- ============ SETUP SCREEN ============ -->
  <section id="setup-screen" class="screen active">
    <div class="masthead">
      <div class="pulse-line" aria-hidden="true">
        <svg viewBox="0 0 600 34" preserveAspectRatio="none">
          <polyline points="0,17 60,17 75,17 85,4 95,30 105,17 160,17 175,17 185,4 195,30 205,17 260,17
                     300,17 360,17 375,17 385,4 395,30 405,17 460,17 475,17 485,4 495,30 505,17 560,17
                     600,17 660,17 675,17 685,4 695,30 705,17 760,17 775,17 785,4 795,30 805,17 860,17
                     900,17 960,17 975,17 985,4 995,30 1005,17 1060,17 1075,17 1085,4 1095,30 1105,17 1160,17"
                     fill="none" stroke="#d7c9a3" stroke-width="1.6"/>
        </svg>
      </div>
      <h1>Internal Medicine<span>Diagnosis Recall</span></h1>
      <p class="tagline">264 cases · 9 specialties · diagnosis only</p>
    </div>

    <div class="setup-body">
      <div id="overall-progress-row" class="overall-progress-row" style="display:none;">
        <span id="overall-progress-text" class="overall-progress-text"></span>
        <button id="reset-progress-btn" class="link-btn" type="button">Reset progress</button>
      </div>

      <div class="setup-block">
        <div class="setup-block-head">
          <h2 id="picker-heading">Choose chapters</h2>
          <button id="select-all-btn" class="link-btn" type="button">Select all</button>
        </div>
        <div class="mode-toggle browse-toggle" role="group" aria-label="Browse by">
          <button class="mode-btn browse-btn active" data-browse="chapter" type="button">By chapter</button>
          <button class="mode-btn browse-btn" data-browse="class" type="button">By classification</button>
        </div>
        <div id="chapter-grid" class="chapter-grid"></div>
        <div id="class-grid" class="chapter-grid" style="display:none;"></div>
      </div>

      <div class="setup-block">
        <h2>Study mode</h2>
        <div class="mode-toggle" role="group" aria-label="Study mode">
          <button class="mode-btn active" data-mode="sequential" type="button">Sequential</button>
          <button class="mode-btn" data-mode="shuffled" type="button">Shuffled</button>
        </div>
      </div>
    </div>

    <div class="setup-footer">
      <button id="resume-btn" class="resume-btn" type="button" style="display:none;"></button>
      <button id="start-btn" class="start-btn" type="button" disabled>Select a chapter to begin</button>
      <p id="start-hint" class="start-hint">Tap a chapter to add or remove it from your session</p>
    </div>
  </section>

  <!-- ============ STUDY SCREEN ============ -->
  <section id="study-screen" class="screen">
    <div class="study-topbar">
      <button id="back-btn" class="icon-btn" type="button">‹ Chapters</button>
      <div class="progress-wrap">
        <div class="progress-info">
          <button type="button" id="chapter-badge" class="chapter-badge">—</button>
          <span id="class-badge" class="class-badge"></span>
          <span id="progress-text">Case 0 / 0</span>
        </div>
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      </div>
    </div>

    <div class="card-stage">
      <div id="flashcard" class="flashcard">
        <div class="flashcard-inner">
          <div class="flashcard-face flashcard-front">
            <div class="face-label"><span>Case</span><span class="fl-num" id="front-chapter-tag"></span></div>
            <div class="face-scroll"><p id="front-text"></p></div>
            <div class="face-hint">Tap the card, or press Flip Card, to reveal the diagnosis</div>
          </div>
          <div class="flashcard-face flashcard-back">
            <div class="face-label"><span>Diagnosis</span><span class="fl-num" id="back-chapter-tag"></span></div>
            <div class="face-scroll"><p id="back-text"></p></div>
            <div class="face-hint">Tap the card to flip back to the case</div>
          </div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="prev-btn" class="ctrl-btn" type="button">Previous</button>
      <button id="flip-btn" class="ctrl-btn ctrl-primary" type="button">Flip Card</button>
      <button id="next-btn" class="ctrl-btn" type="button">Next</button>
    </div>
    <button id="restart-btn" class="restart-btn" type="button">Restart this session</button>
  </section>

</div>

<script>
(function(){
  "use strict";

  const CASES = [{"num": 1, "chapter": "Cardio", "front": "A 42-year-old male patient with a 35-year history of hypertension first diagnosed during pre-employment check up. His family history is positive for hypertension. He is complaining of headache and has been taking lisinopril 20mg daily. Inspite of taking this antihypertensive drug regularly, his blood pressure remained elevated, ranging from 150/110 to 160/95 mm Hg. Physical assessment was unremarkable except for the presence of obesity. Serum sodium 138 mEq/L (135 to 147 mEq/L); potassium 4.1 mEq/L (3.5 to 5 mEq/L); BUN 19 mg/dL (10 to 20 mg/dL), creatinine 0.9 mg/dL (0.35 to 0.93 mg/dL), total cholesterol 268 mg/dL (<245 mg/dL), triglycerides 120 mg/dL (<160 mg/dL), and fasting glucose 105 mg/dL (70 to 100 mg/dL).\n\n1. What is the treatment plan for this patient?", "back": "Hypertension inadequately controlled on ACE-inhibitor monotherapy.", "cls": "New"}, {"num": 2, "chapter": "Cardio", "front": "A 52-year old woman, housewife, has 5 children. Her BP is repeatedly 160/105. She refused to take antihypertensive drugs as she feels fine and has no complaints.\n\nFew days ago, she started to complain of chest pain when she climbs 3 floors. This pain disappears without medication.\n\nWhat is the most likely diagnosis of this patient? Bow o=\n\nWhat are the important points in history you need to ask about? Enumerate essential investigations\n\nWhat are the drugs used in the treatment of these conditions?", "back": "Stage 2 hypertension with exertional angina (suspected coronary artery disease).", "cls": "4-star"}, {"num": 3, "chapter": "Cardio", "front": "A 64-year-old male presented to the outpatient clinic taking antihypertensive therapy for almost 15 years. At that time he was taking hydrochlorothiazide 25 mg qd., amlodipine 5 mg bid., and bisoprolol 5 mg qd and his blood pressure was well-controlled. Recently he developed exertional dyspnea and paroxysmal    nocturnal   dyspnea.   Blood   pressure   measurments     were consistently ranging from 180/110-200/100 mm Hg and failed to respond to increased dose of amlopidine. A lipid profile revealed total cholesterol 261 mg/dL, low-density lipoprotein 174 mg/dL, and high-density lipoprotein 40 mg/dL. Ultrasonography demonstrated size discrepancy of greater than 1.5 cm between both kidneys.\n\n1. What is the explanation for accelerated hypertension?\n\n2. What is the most appropriate pharmacological therapy for hypertension and why?", "back": "Secondary (renovascular) hypertension due to renal artery stenosis.", "cls": "New"}, {"num": 4, "chapter": "Cardio", "front": "A 45 year-old male came complaining of chest pain with exertion , several weeks of worsening exertional dyspnea and history of lightheadedness as if he was about to faint. He has orthopnea with occasional paroxysmal nocturnal dyspnea. He does not smoke. On examination, temperature 37°C, pulse 104 bpm, BP 115/90 mm Hg, and respiratory rate 16 breaths per minute. Examination of the head and neck revealed congested neck veins. Chest examination:             Bilateral basal inspiratory crackles. Cardiac examination, apex is felt in the 5™ space, his heart rhythm is regular with a normal S1 and a splitting second heart sound during expiration, an S4 at the apex . An ejection systolic murmur is at the upper right sternal border that radiates to his carotids.\n\n1. What is the most likely diagnosis?\n\n2. What is the most appropriate investigation to reach the diagnosis? Explain why.\n\n3. What are the indications of surgery?", "back": "Congestive heart failure (CHF) (dyspnea, orthopnea with occasional paroxysmal nocturnal dyspnea, congested neck veins , Bilateral basal inspiratory crackles.)..", "cls": "3-star"}, {"num": 5, "chapter": "Cardio", "front": "A 26-year-old woman, with known RHD presents to the emergency room complaining of sudden onset of palpitations, shortness of breath and coughing of scanty amount of frothy pink sputum. On examination, she is uncomfortable, has red cheeks, her heart rate is 130 bpm, irregular., BP 90/60 mmHg, respiratory rate 30 breaths per minute. Normal jugular venous pressure. She has bilateral inspiratory crackles in the lower lung fields, but no lower limb edema. On cardiac examination, apical impulse is non displaced. Heart rhythm is irregular with variable mtensity of S1 and low-pitched diastolic murmur at the apex. The oxygen saturation is 94% at room air.\n\n1. What is your most likely diagnosis?\n\n2. What is the emergency treatment for this patient?\n3. What is the long term management plan for this patient?", "back": "Rheumatic heart disease, Mitral stenosis, Atrial fibrillation (A.F), Cardiac asthma due to AF.", "cls": "4-star"}, {"num": 6, "chapter": "Cardio", "front": "A 28-year-old woman presents to the emergency room complaining of palpitations, severe shortness of breath and cough. She also, reports change of the color of her urine. She has a history of rheumatic fever at the age of 14 years. On examination, heart rate is 130 bpm and is regular, blood pressure 120/70 mm Hg, temperature 38.4°C, respiratory rate 32 breaths per minute, and oxygen saturation of 90% on room air. Jugular venous pressure is normal, no peripheral edema. Abdominal examination revealed a just palpable spleen. Chest examination showed bilateral inspiratory crackles in the lower lung fields. On cardiac examination, apical impulse is non displaced, a muffled S1, and high-pitched systolic murmur at the apex propagating to the axilla.\n\n1. What is your most likely diagnosis? Explain why?\n\n2. What are the most important investigations for this patient? (mention 4) and why?.\n\n3. What is the treatment?", "back": "Rheumatic heart disease, Mitral valve disease (mitral regurge), left sided heart failure, precipitating factor is infective endocarditis.", "cls": "4-star"}, {"num": 7, "chapter": "Cardio", "front": "A 28-year-old man presented to the emergency department with high fever for 3weeks. He complained of malaise and poor appetite. There was no previous history of heart disease or rheumatic fever. He is a smoker and an intravenous drug user. On examination, temperature was 39.5°C, pulse rate 120bpm and blood pressure 100/60 mm Hg. Cardiac examination revealed a pansystolic murmur in the tricuspid area, splenomegaly. Laboratory invesﬁgations revealed hemoglobin 7 g/dl, WBC 17.5x107/, platelets 540x10°/1, ESR 110 mm/hour, C-reactive protein 280 mg/l, blood urea 45 mg/dL and serum creatinine 1.0 mg/dl. Chest X-ray was normal. ECG showed sinus tachycardia. Transthoracic echocardiogram showed two vegetations with severe tricuspid regurgitation. CT scan of the chest showed metastatic infection in the form of microabscesses in both lung bases. Two sets of blood cultures grew Staphylococcus aureus sensitive to vancomycin and gentamicin\n\n1. Which type of infective endocarditis belong to this patient and why?\n\n2. Criteria for failure of medical treatment and further steps for management?", "back": "The patient has acute infective endocarditis (IE) of right sided affection.", "cls": "4-star"}, {"num": 8, "chapter": "Cardio", "front": "A 58-year-old man presents complaining of several weeks of worsening exertional dyspnea. He previously had chest pain on walking and on performance of strenuous exertion. He gave history of orthopnea and paroxysmal nocturnal dyspnea with edema of the lower limb. He has a history of hypercholesterolemia and smokes 20 cigarettes per day. On physical examination, temperature37°C, heart rate 110 bpm, blood pressure 120/90 mm Hg, and respiratory rate 36 breaths per minute. Examination of the head and neck revealed congested pulsating neck veins. Chest examination revealed bilateral basal inspiratory crepitations. On cardiac examination, apical impulse was displaced outwards and downwards, his heart thythm is regular with a normal S1, and S3 at the apex.\n\n1. What is the most likely diagnosis?\n2. What are the risk factors of his condition?\n3. What are the recommended investigations to assess the condition? Explain why.", "back": "Congestive        heart   failure   due    to   ischemic cardiomyopathy.", "cls": "4-star"}, {"num": 9, "chapter": "Cardio", "front": "A 43-year-old man presents to the ENT clinic complaining of recurrent attacks of epistaxis. He was discovered to have hypertension. He has a history of smoking 20 cigarettes per day for the last 25 years.\n\nOn examination, his heart rate 80 bpm and is regular, with blood pressure 170/110 mm Hg, respiratory rate 24 breaths per minute. Head and neck examination showed normal jugular venous pressure, both carotid impulses were felt equally. Cardiac examination revealed non displaced apical impulse, it is localized and heaving in character with normal S1, accentuated S2 , 84 at the apex , no murmurs.\n\n1. When to diagnose a case of hypertension?\n\n2. Explain the physical findings detected in this patient?\n3. What are the investigations recommended to such patient?", "back": "Hypertension with left ventricular hypertrophy (LVH).", "cls": "3-star"}, {"num": 10, "chapter": "Cardio", "front": "A 53-year-old man is admitted from the emergency room with shortness of breath which began about 2 weeks ago and last night he awoke from sleep and had to get up to \"get some air\", He denies any cough, hemoptysis, chest pain or discomfort, back pain, urinary abnormalities, abdominal pain or ankle swelling. He is known to be hypertensive on irregular treatment. Physical examination: pulse 120/min, regular, BP180/100. Chest examination showed basal rales audible about half way up bilaterally. Heart examination showed normal JVP. There is a palpable LV heave. Auscultation revealed regular thythm, S2 is loud and there is evidence for an S4 and S3. There is a 2/6 holosystolic murmur heard at the apex that radiates to the left axillary line. Abdomen showed no organomegaly.\n\n1. What is the most likely diagnosis?\n2. What aspects of history and physical exam support your diagnosis?\n3. What are the most likely precipitating medical causes for his problem?\n\n4. What investigations you like to do to this patient?\n\n5. What are the main lines of treatment for this patient?", "back": "Left ventricular failure secondary to hypertensive cardiomyopathy.", "cls": "4-star"}, {"num": 11, "chapter": "Cardio", "front": "A 30 year-old women is admitted with a persistent cough , paroxysmal nocturnal dyspnea and orthopnea 3 days after normal vaginal delivery which were accompanied by edema in both lower limbs and pain in the right hypochondrium. Physical Examination: pulse 120 bpm with occasional irregularity, respiratory rate 26/min, blood pressure 90/60, jugular venous pulsations is seen at 6 c¢cm above angle of Louis at 45°. Extremities: peripheral edema. Lungs: bibasilar rales. Abdomen: hepatomegaly. Cardiac: apex is shifted down and out, diffuse in character with apical high —pitched systolic murmur of 2/6 intensity and S3 gallop.\n\n1. What is the most probable diagnosis?\n\n2. What are the recommended investigations to reach the diagnosis? Justify.\n\n3. Mention 3 other causes of that condition?", "back": "Congestive heart failure; Peri-partum cardiomyopathy (dilated cardiomyopathy).", "cls": "2-star"}, {"num": 12, "chapter": "Cardio", "front": "A 45-year-old man, smoker, arrives at the emergency department with severe retrosternal chest pain with left arm radiation, the pain is partially relieved by sublingual nitroglycerin. Physical examination: vital signs: pulse 90 bpm; blood pressure 130/80. Cardiac: regular rhythm; no murmur or extra sounds. Laboratory findings: CBC: normal, cardiac enzymes: moderately elevated CK-MB and troponin. ECG: on first day, ST depression of 2 mm in V1-V4\n\n1. What is the diagnosis?\n2. How would you manage this patient?", "back": "Pain is typical of acute coronary syndrome (ACS).", "cls": "3-star"}, {"num": 13, "chapter": "Cardio", "front": "A 57-year-old man with triple coronary artery disease was scheduled for coronary artery bypass grafting. He had a myocardial infarction 7 months ago. He was taking nitroglycerin, digoxin, propranolol, isosorbide dinitrate and nifedipine. His blood pressure was 120/80 mm Hg and his heart rate 60 beats per minute.\n\n1. What are the indications for coronary artery bypass grafting (CABG)?\n2. What is triple-vessel coronary artery disease?", "back": "Triple-vessel coronary artery disease (post-MI, referred for CABG).", "cls": "New"}, {"num": 14, "chapter": "Cardio", "front": "A 68 year old male patient presented to the ER with 2 hour history of severe central chest pain associated with nausea and profuse sweating. On examination: there is pallor, BP 150/80 mmHg, pulse 60 bpm, S4 gallop over the apex.\n\n1. What is the most likely diagnosis?\n\n2. What further investigations would you recommend for him?\n\n3. Outline your management strategy?", "back": "An acute inferior myocardial infarction as the patient has bradycardic due to AV block, which may be temporary or permanent necessitating cardiac pacemaker.", "cls": "New"}, {"num": 15, "chapter": "Cardio", "front": "A 24-year-old medical student had sudden onset of substernal pain with radiation to his shoulders and neck. He describes the pain as sharp especially if he takes a deep breath. The patient also noted fever with flu-like symptoms one week before. Physical Examination; vital signs: pulse 120, blood pressure 110/70. Cardiac: friction rub over the precordium best heard along the left sternal border with the patient sitting up and leaning forward. Laboratory findings: CBC, urine analysis, and blood chemistry: normal. ECG: shows elevated ST segment in all ECG leads, cardiac enzymes are normal\n\n1. What is the most probable diagnosis?\n\n2. Mention 3 other etiological causes of this condition?\n\n3. What is the treatment of this particular patient?", "back": "Viral pericarditis.", "cls": "4-star"}, {"num": 16, "chapter": "Cardio", "front": "A 22-year-old woman presents with fatigue, shortness of breath, and loss of appetite. Her symptoms had started 2 weeks ago and have progressively worsened. She has had a fever for the past 3 days and night sweats. Her past medical history is unremarkable except for a wisdom tooth extraction approximately 2 months before she came to the clinic. On physical examination, she has a temperature of 38.6° C, heart rate of 120/min, respiratory rate of 24/min, and BP of 110/85 mm Hg. She has a 4/6 holosystolic murmur that radiates to the left axilla. Skin examination reveals scattered petechiae on her extremities.\n\n1. What is the most likely diagnosis? Justify.\n\n2. What are common clinical findings on physical exam that are associated with this condition?\n3. What risk factors are associated with an increased incidence of this condition?\n\n4. What are the most common pathogens associated with this condition?\n5. What are the most appropriate next steps in the investigations of this patient?\n\n6. What are the possible complications of this condition?", "back": "Most likely diagnosis: The patient’s symptoms, fever, combined with a heart murmur and associated skin lesions, are most suggestive of infective endocarditis following bacteremia from her dental procedure.", "cls": "2-star"}, {"num": 17, "chapter": "Cardio", "front": "A 35 year old male presented to the ER with fever and sudden onset of left sided weakness and hemi-hypoesthesia. On examination his pulse was irregular and he was on anticoagulation for atrial fibrillation . BP 140/70mmHg, Temp 38.7 with a toxic look. Peripheral pulsations were intact with 1 degree clubbing Cardiac examination revealed muffled 1% and 2% sounds with pansystolic murmur over the apex radiating to the axilla and early diastolic murmur over the aortic area. Brain CT scan showed massive right frontoparietal infarction.\n\n1. What is the possible cause of this patient’s fever?\n\n2. Mention two        important    investigations   to   prove   your diagnosis?\n\n3. Would you like this patient to continue on anticoagulation ?", "back": "Infective endocarditis complicating chronic rheumatic valvular heart disease.", "cls": "New"}, {"num": 18, "chapter": "Cardio", "front": "A 15-year-old girl presents to the clinic with a 3-week history of joints pain. The pain initially began in her legs. That pain resolved spontaneously, and then she experienced pain in her knees followed by her wrists. She recalls having a sore throat 2 weeks before her symptoms began. Vital signs are temperature 38°C, pulse 130 bpm, respiratory rate 12/minute, and blood pressure 110/70. Physical examination shows active arthritis in the wrist joint. Auscultation of the heart reveals a 2/6 blowing pansystolic murmur that is heard best at the apex and radiates to the axilla.\n\n1. What is the most likely diagnosis? (Explain Why)\n2. What is the cause of her condition?\n\n3. How would you treat her?", "back": "Rheumatic fever.", "cls": "4-star"}, {"num": 19, "chapter": "Cardio", "front": "A 75 -year-old female presented to the ER complaining of nausea, vomiting, dizziness, confusion and blurred vision for 5 days. She has history of hypertension and angina. Last month she was admitted in the ICU complaining of dyspnea that awakened her from sleep and rapid irregular palpitations. She was discharged after one week on the following medications: digoxin, lisinopril, furosemide and warfarin. Physical examination: The patient is confused. BP: 135/95, Pulse: 100 bpm, irregular. Elevated jugular venous pressure with systolic expansion, variable intensity of S1, pansystolic murmur and S3 over the apex and tricuspid area. Abdominal examination:       tender epigastrium, no rigidity or rebound tenderness. Chest: Bibasilar end inspiratory fine crackles. Extremities: No edema.\n\n1. What is the most likely diagnosis?\n\n2, What is the management of this patient during her hospital admission and after discharge?", "back": "The most likely diagnosis: Being 75 years old with angina of coronary artery disease (CAD) , Hypertension, MR, TR, AF and evidence of congestive heart failure (clarified from history and signs in physical examination), diagnosis of ischemic cardiomyopathy is the most likely diagnosis.", "cls": "2-star"}, {"num": 20, "chapter": "Cardio", "front": "A 65 year old male with a past medical history of hypertension, type 2 diabetes, coronary artery disease. He presented to the ER with acute epigastric pain and heart burn which started 4 hours ago and did not respond to antacids, the pain was associated with nausea, vomiting and sweating. The patient mentioned that his random blood glucose level 2 hours ago was 168 mg. No chest pain or shortness of breath. Physical examination: Temp: 37.5 C Respiratory rate: 22/min Pulse: 110 bpm, BP: 210/100mm/Hg. Accentuated A2 over the aortic area and S4 over the apex. Abdomen: normal. The rest of the examination was not remarkable. Upper and lower limb pulsations are bilaterally felt and equal. Random blood glucose 230 mg/dl.\n\n1. What is the most likely diagnosis?\n\n2. What is the differential diagnosis?\n3. What is the short and long term management of this patient?", "back": "Inferior myocardial infarction: Acute epigastric pain resistant to antacids, nausea, vomiting and sweating in a diabetic patient, inferior myocardial infarction must be considered .", "cls": "4-star"}, {"num": 21, "chapter": "Cardio", "front": "A 50-year-old man with diabetes mellitus, hypertension, dyslipidaemia and a recent history of crescendo chest pains on exertion called for an ambulance when he developed severe crushing central chest pain at rest 30 minutes before the arrival of the ambulance. The pain radiated into his jaw and down both arms. On examination BP 100/60mmHg, pulse 110/min regular, The patient was orthopneic. Cardiac examination showed S3 gallop with recent pansystolic murmur over the apex with bilateral fine basal crepitations. ECG revealed ST elevation from V1-V5 with reciprocal inversion of T waves in inferior leads. Troponin was significantly high.\n\n1. What the possible diagnosis ?\n\n2. What is the proper management of this patient after arrival to the hospital?\n\n3. Mention one possible complication that had happened based on clinical examination.?", "back": "ST elevation myocardial infarction (MI) complicated by cardiac decompansation due to papillary muscle rupture and acute mitral regurge.", "cls": "New"}, {"num": 22, "chapter": "Cardio", "front": "A 65-year-old man. heavy cigarette smoker presents with the chief complaint of leg pain. He noticed bilateral buttocks and thighs ache when he walks more than few blocks, the pain resolves with rest. He denies any history of trauma or problems with his joints. His past medical history is significant for myocardial infarction (MI) at the age of 61 years when questioned, he had impotence beginning a few months prior to his MI.\n\nOn physical examination, his heart and lung examination were within normal limits. His radial pulses are intact and equal but his femoral and dorsalis pedis pulses are diminished bilaterally. The skin of the legs is cool to touch and appears shiny with very little hair growth. There is no swelling or erythema of his hip or knee joints.\n\n1. What is the most likely diagnosis?\n2. What tests and/or imaging tools could be used to confirm the diagnosis?\n\n3. What risk factors are associated with an increased incidence of this condition?\n4. What is the most appropriate treatment for this patient?\n\n5. What are the treatment options for patients who fail conservative therapy?", "back": "Peripheral vascular disease.", "cls": "3-star"}, {"num": 23, "chapter": "Cardio", "front": "A 45-year-old male presented with shortness of breath and fast palpitation that developed suddenly one hour prior to presentation. On examination B/P was 80/50. ECG revealed supraventricular tachycardia for which he received Intravenous adenosine and a rhythm strip was recorded from lead V2.\n\nWhat is the role of carotid sinus massage as 1% aid in this patient? N\n\nWhat is the acute management of this case?\n\nMention 3 possible causes for this rapid palpitation? LY\n\nWhat will be the first choice drug to be administered for >\n\nmaintenance therapy?", "back": "Supraventricular tachycardia (SVT).", "cls": "New"}, {"num": 24, "chapter": "Cardio", "front": "28-year-old previously healthy female is brought to the emergency department complaining of sudden onset of palpitations and a “fluttering” sensation in her chest. She quickly became short of breath and light-headed. Physical examination reveals an oral temperature of 37.0° C, a pulse rate of 195/min, a respiratory rate of 20/min, and a blood pressure of 90/60 mm Hg. Examination of the lungs is unremarkable, and a cardiac examination is significant only for tachycardia. Her electrocardiogram revealed narrow complex tachycardia with absent p wave.\n\nWhat is the most likely diagnosis? BN\n\nWhat is the epidemiology of this condition? What is the pathogenesis of this condition?\n\nWhat is the treatment of her condition", "back": "Paroxysmal supraventricular tachycardia (PSVT) refers to a number of tachyarrhythmias.", "cls": "1-star"}, {"num": 25, "chapter": "Cardio", "front": "A 28-year-old woman presents with recurrent attacks of palpitation, associated with dizziness, chest pain, near syncope. The attack lasted 10 to 60 minute and terminates spontaneously. Inbetween the attacks, she was completely normal. On examination, cardiac, chest and abdomen are normal. Resting ECG and echocardiography are normal, while Holter ECG shows regular narrow QRS tachyarrhythmia 150 beat/min, short P-R interval, that preceded by a premature atrial impulse.\n\n1. What is the diagnosis?\n\n2. How to manage this condition?", "back": "Paroxysmal supraventricular tachycardia, AV nodal reentrant tachycardia.", "cls": "2-star"}, {"num": 26, "chapter": "Cardio", "front": "A 54 year old man came with chief complaints of generalized edema and oliguria. He had been receiving oral drug therapy for hypertension for more than 10 years. His medications include nifedipine (40mg/d) and losartan (50mg/d). His drug regimen had not been altered recently. Upon admission, his blood pressure was 210/130, heart rate 100/min. there was generalized edema, cardiac examination S4 over apex, normal respiratory sounds. The funduscopic changes are flame-shaped retinal hemorrhages, soft exudates, and papilledema. Serum creatinine 4.5mg/dl, BUN 143mg/dl, the previous kidney function was normal within last two months.\n\n1. What is your provisional diagnosis?\n2. Mention three possible causes of raised kidney function?\n\n3. What is the initial therapy in this case? Mention 3 parenteral drugs that can be used in hypertension emergencies", "back": "The patient has hypertension emergency as his BP > 180/120 mmHg and there 1s ongoing end organ damage in the form of Acute kidney injury (AKI) (serum creatinine 4.5mg/dl, BUN 143mg/d which were normal in the last 2 months).", "cls": "2-star"}, {"num": 27, "chapter": "Cardio", "front": "A 37-year-old woman presents complaining of dyspnea on exertion accompanied by mild chest pain. She recently fainted after climbing stairs. She 1s afebrile, with a heart rate of 90/min, respiratory rate of 12/min, blood pressure of 90/70 mm Hg, and oxygen saturation of 89% by pulse oximetry on room air. Cardiac examination is notable for a loud pulmonary component of 52 and a systolic murmur best appreciated at the lower sternal border. Increased jugular venous pressure, hepatomegaly, and lower extremity edema are appreciated. Skin and musculoskeletal examinations are normal. X-ray of the chest reveals normal lung fields with cardiomegaly and enlarged pulmonary vessels. Pulmonary function tests (PFTs) reveal a diffusion capacity of 50%.\n\nWhat is the most likely diagnosis?\n\nWhat are some etiologies of this condition? o\n\nWhat tests could be used to confirm the diagnosis?\n\nHow is the definitive diagnosis made? S\n\nWhat is the most appropriate treatment for this condition? LA", "back": "Idiopathic pulmonary arterial hypertension (PAH).", "cls": "1-star"}, {"num": 28, "chapter": "Cardio", "front": "A 50 year old man is hypertensive with repeated blood pressure recordings of >160/95 mmHg. He is already taking a thiazide diuretic as well as aspirin and a statin. There are no apparent secondary causes of hypertension. He has previously undergone CABG.\n\n1. What is the blood pressure target in this patient?\n\n2. What      drug    would    be    the   most   appropriate    add    on antihypertensive treatment? And why?\n3. Would you continue with aspirin and statins? What are the lipid levels targets in this case?", "back": "Hypertension in a patient with established coronary artery disease (post-CABG).", "cls": "2-star"}, {"num": 29, "chapter": "Cardio", "front": "A 22-year-old athletic man was admitted directly to ICU after suffering a cardiac arrest at a local gym. Fortunately, automated defibrillation had been available. The defibrillator had diagnosed ventricular fibrillation and had administered a DC shock. The patient was not known to have any previous medical history and had been well recently. Trans-thoracic echocardiography in ICU showed a structurally normal heart but with depressed systolic function, presumed consequent upon the arrest.\n\n1. What are the probable causes of cardiac arrest in this athletic man?\n\n2. How can you screen for these disorders in a young athlete starting his carrier in sport?", "back": "Athlete's heart is a constellation of structural and functional changes that occur in the heart of people who train for > 1 h most days.", "cls": "1-star"}, {"num": 30, "chapter": "Cardio", "front": "A 30-year-old man presented to the emergency department and complained of dizziness and presyncope with subsequent fall to the floor. Three weeks ago, he was reported a syncope following physical exercise. On physical examination, pulse was 80/ min, blood pressure was 130/80mmHg. The abdomen and lungs were normal. There were no abnormal heart sounds and a grade 3/4 holosystolic murmur was heard over the mitral area radiating to the left axilla. The ECG observed signs of left ventricular hypertrophy.\n\n1. How you proceed to reach the diagnosis?\n\n2. Mention the steps in management of this case?", "back": "Hypertrophic cardiomyopathy (HCM).", "cls": "New"}, {"num": 31, "chapter": "Cardio", "front": "A 30-year-old woman presented to the outpatient clinic complaining of infrequent atypical chest pain and palpitation. On examination: pulse rate 90/min with infrequent irregularity, blood pressure 120/70 mm Hg. Cardiac examination revealed a mid systolic click over the mitral area.\n\n1. What is the expected diagnosis and how will confirm it?\n\n2. What is the prognosis of this diagnosis?", "back": "Mitral valve prolapsed (MIVP).", "cls": "New"}, {"num": 32, "chapter": "Cardio", "front": "A male patient 48 years old, is complaining of peripheral edema one month ago and increasing abdominal distension. There was exertional dyspnea and easy fatigability. There was no orthopnea or paroxysmal nocturnal dyspnea. On examination he was afebrile, a raised JVP mild crackles at the bases of both lungs and ascites. ECG: atrial fibrillation. An abdominal ultrasound showed distended hepatic veins consistent with right ventricular cardiac failure,\n\n1. What is the cause of systemic venous congestion in this case?", "back": "Right-sided heart failure with systemic venous congestion (differential includes constrictive pericarditis).", "cls": "New"}, {"num": 33, "chapter": "Cardio", "front": "A 60-year-old man with long standing hypertension presented to the ER with a sudden onset of severe excruciating central chest pain referred to the back. On examination B/P was 170/90 right arm and 110/70 left arm with unequal pulses. Carotid pulsations were faint on the left side. ECG and cardiac enzymes were reported to be normal. Chest x ray showed mild left sided pleural effusion.\n\n1. What is possible cause of this patient’s chest pain?\n\n2. What is the examination of cheice to prove your diagnosis?\n\n3. Mention two possible complications that happened to this patient based on examination and chest x ray findings ?", "back": "Aortic dissection in a male with long standing hypertension.", "cls": "4-star"}, {"num": 34, "chapter": "Cardio", "front": "A 69- year- old male patient presented to ER with chest pain referred to the back and mild dyspnea starting few hours ago. He is a chronic heavy smoker and hypertensive for more than 20 years ago, non compliant to treatment. On examination BP was 180/120 on the right arm and 100/70 on the left, mild tachypnea with no hypoxia, afebrile. There was increased second heart sound over the aortic area. Normal other system review ECG showed criteria of left ventricular hypertrophy, chest x-ray showed wide mediastinum Doppler of left upper limb showed monophasic damped flow pattern and the right showed normal triphasic waveform.\n\n1. What is most likely diagnosis?\n\n2. What other investigations to be done?\n\n3. Discuss lines of management?", "back": "A case of aortic dissection mostly located at ascending or aortic arch, before the origin of left subclavian artery, and may include aortic valve due to chronic hypertension not compliant to adequate treatment Multislice CT angiography to demonstrate the extent of dissection and if renal arteries were included: Laboratory examination to…", "cls": "4-star"}, {"num": 35, "chapter": "Cardio", "front": "A 45- year- old male patient, heavy smoker with BMI of 35 was admitted to the ER with sudden collapse following right calf swelling and tenderness of 2 days duration. On examination the patient was drowsy his B/P was 80/60, pulse110/m, with pale and cold extremities the right lower limb was swollen with tense calf muscles .Cardiac examination was unremarkable with evidence of dullness over the base of the right lung posteriorly.\n\n1. What is the possible cause of this patient’s collapse?\n\n2. Mention the initial screening test that can help in diagnosis and what is the diagnostic modality?\n\n3. What will be the 1 line of treatment in such a case?", "back": "The initial screening test: D-dimer.", "cls": "New"}, {"num": 36, "chapter": "Cardio", "front": "A female patient 42 year old presented to the ER with dyspnea and frothy expectorations with a history of persistent headache of one day duration, not relieved by analgesics On examination the pulse was 120 bpm , afebrile, the blood pressure was 210 /140, bilateral mid-zonal inspiratory crepitations and audible abdominal bruit , hypoxic, hypocapnic. He was rapidly kept on non invasive mechanical ventilation All laboratory investigations were within normal ranges\n\nAbdominal ultrasound revealed unequal kidney size and echocardiography showed mild concentric left ventricular hypertrophy in addition to normal contractility and other dimensions.\n\n1. What is most likely diagnosis?\n\n2. What other investigations to be done?\n\n3. Discuss other lines of management?", "back": "Hypertensive emergency complicated by pulmonary congestion mostly accelerated hypertension and flash pulmonary oedema secondary to renal artery stenosis which is one of the causes of secondary hypertension.", "cls": "New"}, {"num": 37, "chapter": "Cardio", "front": "A 53 -year- old female presented with severe epigastric pain, vomiting, mild abdominal distension together with dark colored stools few hours ago. She is non smoker, was known to have atrial fibrillation, non compliant to anticoagulant therapy which was given for the last 4 years. On examination, she had rapid irregular pulse 130 bpm, BP 120/60, low grade fever, normal blood glucose, mild abdominal distension and decrease intestinal sounds. Chest and neurological examinations were free\n\nOn laboratory investigations normal hemoglobin and coagulation profile, mild leukocytosis, increase serum amylase. There was metabolic acidosis and high lactate level. Abdominal ultrasound showed jejunal distension. ECG showed atrial fibrillation with rapid ventricular response\n\n1. What is most likely diagnosis?\n2. What other investigations to be done?\n\n3. Discuss lines of management?", "back": "Acute mesenteric ischemia likely embolic due to atrial fibrillation non adequately anticoagulated Other differential diagnoses but less likely include: perforated gut, acute pancreatitis or bleeding gastric or duodenal lesion (ulcer or malignancy) and acute portal venous thrombosis.", "cls": "New"}, {"num": 38, "chapter": "Cardio", "front": "A 65 year old female with a history of dyslipidemia presents to your office with complaints of palpitations that started last evening. No other past medical history. She admits to similar episodes on and off for the last few months. ECG showed atrial fibrillation with ventricular rate of 114/ minute.\n\n1. What is your general management plan?", "back": "Atrial fibrillation (AF).", "cls": "New"}, {"num": 39, "chapter": "Cardio", "front": "A 56 —year- old known hypertensive male patient, presented with an attack of palpitation. By examination he was conscious lying flat in bed, blood pressure 220/110, radial pulse 130/min and apical pulse 150/min, irregular. His past medical history, apart from hypertension, was unremarkable.\n\nWhat is your possible diagnosis? A\n\nWhat further investigations would you do?\n\nWhat is your plan of management in this emergency situation?\n\nWhat is your further plan of management after stabilization of his emergency condition?", "back": "Atrial Fibrillation (AF).", "cls": "New"}, {"num": 40, "chapter": "Cardio", "front": "An 83-year-old known hypertensive female patient, fell down and unfortunately had fracture neck femur and she was operated upon and discharged from hospital. One week after discharge, she started to develop unilateral painful lower limb edema.\n\n1. What is your possible differential diagnosis for her unilateral lower limb edema?\n\n2. After two days she started to develop acute dyspnea and palpitation, what is your final diagnosis?\n3. What further imaging and laboratory tests do you suggest for this patient?\n\n4. What is your plan for management for this patient?\n\n5. What are the possible risk factors for her condition?", "back": "The possible differential diagnosis for unilateral lower limb edema: deep    venous   thrombosis   (DVT),    rupture   Baker’s   cyst,   cellulitis, lymphedema, trauma, venous insufficiency thrombophlebilits.", "cls": "New"}, {"num": 41, "chapter": "Cardio", "front": "A 33 -—year-old female patient presented with recurrent post prandial abdominal pain. Her past medical history and examination were free, vital signs were normal, CBC was normal, ESR was 20 in the first hour, kidney and liver functions were normal. The patient isn’t diabetic or hypertensive.\n\n1. What is the possible differential diagnosis for this patient?\n\n2. What investigations will you ask for?\n\n3. The patient then entered the emergency department with acute abdomen, and she was operated upon, and she was found to have gangrenous intestine, what is your final diagnosis?\n\n4. What is your plan of management?", "back": "The differential diagnosis is wide ranging from simple indigestion to serious condition, dyspepsia, irritable bowel syndrome, peptic ulcer, Crohn's disease, mesenteric vascular occlusion, familial meditarean fever (FMF) and rare Celiac compression syndrome.", "cls": "New"}, {"num": 42, "chapter": "Cardio", "front": "A 50 —year- old male patient with history of deep venous thrombosis {reated with warfarin within its therapeutic range, had an attack of haematemesis. Upper endoscopy revealed active bleeding peptic ulcer. Duplex ultrasound revealed subacute thrombosis of the common femoral, and superficial femoral veins.\n\n1. What is the next step you suggest for this patient?\n\n2. What is the long term recommendation for this patient?\n\n3. What is the work up you recommend for this patient for unprovoked deep venous thrombosis?", "back": "Bleeding peptic ulcer in a patient on warfarin, with concurrent deep vein thrombosis.", "cls": "New"}, {"num": 43, "chapter": "Cardio", "front": "A 55 —year- old woman known hypertensive , presented with vertigo and attacks of disturbed conscious level, and attacks of loss of vision, carotid duplex ultrasound revealed right internal carotid artery plaque causing 55% stenosis.\n\n1. What is the possible laboratory and imaging investigation do you recommend for this patient?\n\n2. What is your plan for management of this woman?\n\n3. What is her possible risk factor?", "back": "Symptomatic carotid artery stenosis (causing TIA).", "cls": "New"}, {"num": 44, "chapter": "Chest", "front": "A 30-year-old woman presents with episodes of dyspnea, chest tightness, and cough productive of clear sputum. She says that she has had similar episodes over the last 2 years. The episodes occur approximately twice per month, and they are sometimes triggered by vigorous exercise. This is the first time she has sought clinical attention for these episodes. She does not take any medication. Physical examination is significant for bilateral wheezes on forced expiration. Vital signs are temperature 36.6°C, pulse 86 /minute, RR 18/min, blood pressure 120/80.\n\n1. What is the most likely diagnosis?\n\n2. What is the next step in diagnosis?\n\n3. Office spirometry demonstrates an FEV1I/FVC below 70% that increases to 90% after administration of inhaled albuterol. How would you manage her condition?\n\n4. The patient does not wish to stop exercising because it is a very important part of her social life. What options exist for this patient?", "back": "Bronchial asthma.", "cls": "4-star"}, {"num": 45, "chapter": "Chest", "front": "A 26-year-old man comes for follow up. He was diagnosed with bronchial asthma 3 years ago. His current therapy is salbutamol 100 mcg on need and beclometasone diproprionate 200 mcg. However, his asthma is not properly controlled. Chest examination is unremarkable.\n\n1. What is the most appropriate next step?\n\n2. Enumerate the criteria of asthma control?\n\n3. Summarize stepwise management of asthma in adults?", "back": "Poorly controlled bronchial asthma.", "cls": "New"}, {"num": 46, "chapter": "Chest", "front": "A 22-year-old woman presents with episodes of dyspnea, wheezing, and thinorrhea approximately 1 hour after she consumes aspirin. Her medical history is significant for bacterial sinusitis that required a prolonged course of antibiotics. On physical examination, there are nasal polyps.\n\n1. What is the most likely diagnosis?\n2. What is the treatment strategy for such patient?", "back": "Aspirin sensitivity (Aspirin-Exacerbated Respiratory Disease (AERD): occurring about an hour after aspirin consumption.", "cls": "3-star"}, {"num": 47, "chapter": "Chest", "front": "A 36-year-old man has had asthma since he was 10 years old. He presents with a 2-day history of low-grade fever, malaise, and cough productive of brownish mucous cords. This is his fourth such episode in the last 2 years. CXR shows bronchiectasis. A complete blood count (CBC) is significant for eosinophilia\n\nWhat is the most likely cause of his symptoms? w D= o\n\nWhat is bronchiectasis and how to prevent its complications? How can you confirm diagnosis?\n\nHow can you treat this patient?", "back": "The cause of these symptoms is probably allergic bronchopulmonary aspergillosis (ABPA).", "cls": "2-star"}, {"num": 48, "chapter": "Chest", "front": "A 52-year-old patient has had allergic rhinitis, atopic dermatitis, and asthma of increasing severity for the last 10 years. He also has hypertension and is being treated by a neurologist for a mononeuropathy multiplex of unknown cause. During his last hospital admission, a CBC was significant for 20% eosinophils, and a CXR was indicative of patchy opacities. On physical examination, subcutaneous nodules are seen on the extensor surface of his arms.\n\n1. What diagnosis should you suspect?\n\n2. When to suspect the diagnosis of that disease?\n\n3. How would you treat this patient?", "back": "Eosinophilic Granulomatosis with Pelyangiitis (EGPA) (formerly Churg-Strauss Syndrome).", "cls": "1-star"}, {"num": 49, "chapter": "Chest", "front": "A 60-year-old man presents with a 6-month history of dyspnea on exertion. His dyspnea has progressively worsened to the point where he experiences shortness of breath after walking no more than 100 meters. He also reports increased cough productive of yellow sputum over the last 10 years. He has smoked two packs of cigarettes every day for the last 30 years.\n\nPhysical examination demonstrates hyperresonance on lung percussion, vesicular breathing with prolonged expiration and expiratory wheezes at the posterior lung bases. Vital signs are temperature 36.8°C, pulse 88 bpm, RR 18/min, BP 130/70. Body mass index (BMI) is 20.\n\n1. What is the differential diagnosis of chronic progressive cough and dyspnea?\n\nWhat is the most likely cause in this patient? W\n\nHow would you confirm the diagnosis?\n\nHow would you classify his disease severity? Mo\n\nWhat measures are recommended initially in such patients?", "back": "The differential diagnosis chronic progressive cough and dyspnea: -   Pulmonary: chronic obstructive pulmonary disease (COPD), bronchial asthma, interstitial lung disease (ILD).", "cls": "4-star"}, {"num": 50, "chapter": "Chest", "front": "A 46 years old patient presented with progressive dyspnea and productive cough. He has never smoked cigarettes. His father died of lung disease in his 40s. His grandfather and paternal uncle died of liver failure in their 30. Spirometry reveals an obstructive pattern not reversible with bronchodilators. CXR shows bullous changes in lung bases.\n\n1. What is the cause of COPD?\n\n2. Enumerate treatment options?", "back": "The development of COPD at an early age in a nonsmoker with a family history of lung disease and liver failure should raise suspicion for a-1- antitrypsin (AAT) deficiency.", "cls": "2-star"}, {"num": 51, "chapter": "Chest", "front": "A 63-year-old man with COPD is reviewed in the outpatient clinic, he stated that he feels breathlessness despite adding long-acting beta 2 agonist (LABA) in addition to inhaled iprairopium bromide inhaler as required as he was advised the last visit for 3 months. He stated that he gave up smoking for 4 months. FEV1 43%.\n\nWhat is the most appropriate next step? D=\n\nGive a brief plan for management in patients with stable COPD?\n\nWhat are the indications of long term oxygen therapy? BB\n\nIs this patient candidate for assessment for long term oxygen therapy?", "back": "COPD, inadequately controlled on LAMA monotherapy.", "cls": "New"}, {"num": 52, "chapter": "Chest", "front": "A 55-year-old female complains of increasing dyspnea on exertion and a dry cough for the last 12 months. She does not take any medication. She has never smoked cigarettes, and occupational history does not reveal any workplace irritants. Physical examination reveals digital clubbing and fine bilateral basal crackles. CXR shows reduced lung volume and diffuse interstitial opacities with basal predominance. Pulmonary function tests show a decreased FEV1, decreased FVC, Normal FEV1/FVC, and decreased TLC.\n\n1. What is the interpretation of pulmonary functions? What category of lung diseases is she suffering from?\n2. Mention major causes of such category?\n\n3. Which cause is most likely responsible for this patient's symptoms?\n\n4, What is this patient's prognosis?", "back": "She has restrictive lung disease (diminished FEV1, FVC with normal FEV1/FVG most probably due to interstitial lung disease (ILD).", "cls": "4-star"}, {"num": 53, "chapter": "Chest", "front": "A 29-year-old man presents with a 2-month history of dyspnea and dry cough. He does not have any environmental or occupational exposures to chest irritants. Spirometry reveals a restrictive pattern. CXR shows bilateral hilar adenopathy and upper lung field reticular opacities. Lung biopsy reveals noncaseating granulomas.\n\n1. What is the diagnosis?\n\n2. What other organ systems can be affected?\n\n3. Is treatment indicated for this patient stage? If so, how is it treated?", "back": "Bilateral hilar adenopathy and reticular opacities in the upper lung fields are highly suggestive of sarcoidosis.", "cls": "4-star"}, {"num": 54, "chapter": "Chest", "front": "A 33-year-old woman is admitted to the hospital because of acute dyspnea and right sided chest pain which increased with inspiration. She delivered 5 days ago her 5% offspring. She denies fever, cough, headache, abdominal pain, back pain. Physical examination: reveals a dyspneic obese woman (BMI 35 kg/m?). Temp 36.7 C°, pulse 120/minute, RR 32/minute, BP 130/84 mmHg. Heart, chest, abdominal and neurological examination are free.\n\n1. What is the        most   probable    diagnosis     of   this   patient's presentation?\n\n2. What are the risk factors in this particular patient that predispose to such condition?\n\n3. Mention 3 important investigations you would like to do to this patient?\n\n4. What acute therapy would you choose?\n5. What would be your approach to long term management?", "back": "The most probable diagnosis of this patients presentation: is pulmonary embolism.", "cls": "4-star"}, {"num": 55, "chapter": "Chest", "front": "A 40-year-old woman presents with a 3-hour history of shortness of breath associated with sharp localized pain that increases with inspiration. She was on a 15-hour bus ride 2 days ago. She does not have any known medical problems. Her only medications are oral contraceptive pills. Her right calf is swollen and tender. Heart and lung findings are within normal limits. Vital signs are; temperature 37.2 C°, pulse 120 bpm, respiratory rate 30/min, blood pressure 140/90 mmHg. CXR shows atelectasis; ECG shows sinus tachycardia with nonspecific ST and T wave changes. ABG shows pH 7.45, PCO2 30 %, and PO> 80 %.\n\nWhat is the most likely diagnosis in this patient? o\n\nWhere is the original source of her chest problem?\n\nHow can you confirm the diagnosis? What is the treatment suggested? O\n\nHow long should this patient receive treatment? A", "back": "Pulmonary embolism (PE).", "cls": "4-star"}, {"num": 56, "chapter": "Chest", "front": "A tall, thin 27-year-old man presents with a sudden onset of dyspnea and sharp, right-sided chest pain that worsens with inspiration (pleuritic). The symptoms began 2 hours ago while he was working in the yard and smoking a cigarette. On examination, breath sounds are decreased on the right side, and his arterial oxygen saturation (Sa02) is 81%.\n\n1. What is the diagnosis?\n\n2. How could you confirm that diagnosis?\n3. How is his condition treated?", "back": "The patient has a right-sided primary spontaneous pneumothorax.", "cls": "3-star"}, {"num": 57, "chapter": "Chest", "front": "A 68 years old woman is admitted with fever and a productive cough yielding yellowish sputum, associated with left-sided chest pain. Two days later, she developed chills and a temperature of 39°C. She denies hemoptysis, weight loss, sore throat, sinusitis, back pain, diarrhea, rash, joint pain, or headaches. Her medical history includes congestive heart failure secondary to ischemic heart disease, well controlled with furosemide and an ACE inhibitor. She is a former smoker, having quit three months ago. On examination, she is fully conscious, appears thin with respiratory distress. Vital signs: temperature 39.2°C, RR 33 /min, pulse 120 bpm, BP 125/80 mmHg, and oxygen saturation 89% on room air. Chest examination reveals dullness in the left infra-mammary region, with egophony and bronchial breath sounds on the left; the right lung is clear. Cardiovascular, abdominal, and neurological examinations are unremarkable. Laboratory findings: hemoglobin 13.8 g/dL, WBC 18 x 10°L (54% segmented neutrophils, 5% bands, 41% lymphocytes), platelets 255 x 10°/L. BUN is 25 mg/dL. ECG is normal. Chest X-ray shows a normal heart size with an infiltrate in the left lower lobe obscuring the left heart border. Sputum Gram stain reveals a few polymorphonuclear leukocytes, many epithelial cells, and scattered Gram-positive and Gram-negative cocci and rods.\n1. What is your most likely diagnosis?\n2. What host factors unique to this patient places her at risk for such a diagnosis?\n\n3. What features of the history and physical exam support this diagnosis?\n4. What kinds of infectious agents can produce this syndrome? Which would be most common?\n\n5. Are there any other diagnostic tests you would order before initiating therapy?\n6. Mention briefly the proper management of the patient and what antibiotic(s) would you initiate in this patient empirically?", "back": "Community acquired pneumonia (CAP).", "cls": "3-star"}, {"num": 58, "chapter": "Chest", "front": "A 32-year-old man presents with a 2-day history of fever, shaking chills (rigor), and cough productive of yellow sputum, dyspnea, and pleuritic chest pain. Past medical history is unremarkable. He is fully conscious, temperature 39°C, pulse 110 bpm, respiratory rate 25/min., blood pressure 110/80. Chest examination: increased tactile fremitus, dullness to percussion, decreased breath sounds crackles, and aegophony at the left upper lobe. BUN 15 MG/dL, Sa0; is 92%.\n\nWhat is the most likely cause of these symptoms?\n\nWhat are the “atypical” signs of that disease?\n\nWhat is the next step in management? Ll\n\nHow should you manage this patient's condition?", "back": "“Typical” community-acquired pneumonia (CAP) classically presents with abrupt onset of fever, cough productive of purulent sputum, and pleuritic chest pain along with physical findings of lobar consolidation.", "cls": "3-star"}, {"num": 59, "chapter": "Chest", "front": "A 55-year-old man with a history of chronic bronchitis presents with a 2- month history of increasing dyspnea and cough that has changed in character and is tinged with blood. His voice has become hoarse, and he has unintentionally lost 10 Kg in the last 2 months. He often wakes up drenched in sweat. He works as a teacher. He smokes 20 cigarette/day for 20 years. On examination, there is digital clubbing. Vital signs are normal. X ray chest shows mediastinal adenopathy and a 5-cm central pulmonary nodule with irregular borders. Abnormal laboratory findings are elevated calcium and anemia.\n\nWhat is the differential diagnosis of hemoptysis in this patient?\n\nWhat diagnosis should you suspect in this patient at this stage? A\n\nWhat is the next step in the evaluation of this lesion? i\n\nWhat is the next step in management? S\n\nWhy does this patient have hypercalcemia? A\n\nWhat is the most likely cause of hoarseness in this patient?", "back": "The differential diagnosis of hemoptysis in this patient: bronchogenic carcinoma, chronic bronchitis and bronchiectasis, pulmonary tuberculosis.", "cls": "4-star"}, {"num": 60, "chapter": "Chest", "front": "A 55-year-old man presents with a 2-year history of progressively worsening daytime somnolence. He recently crashed his car into a tree because he fell asleep at the wheel during the day. His wife reports that he snores loudly every night. Past medical history is significant for hypertension controlled with hydrochlorothiazide. On physical examination, he has a low-hanging soft palate. His neck is wide, and his BMI is 40. Vital signs are within normal limits.\n\nWhat is the most likely cause of his symptoms? M=\n\nWhat are the complications of that condition?\n\nWhat testing is indicated to evaluate this patient? BB\n\nHow to manage this patient?", "back": "Suspect obstructive sleep apnea (OSA) in a patient with snoring and excessive daytime sleepiness.", "cls": "2-star"}, {"num": 61, "chapter": "Chest", "front": "A 75-year-old woman presents to the emergency department complaining of shortness of breath at rest. She has a history of pneumonia treated 1 month ago with partial improvement of symptoms. Her temperature 38.0° C, pulse 120/min, RR 25/min, and BP 135/80 mm Hg. Chest examination reveals absent breath sounds and dullness to percussion at the base of the left lung. CXR revealed blunted costophrenic angle, homogeneous opacity at the left lung base that rises to axilla. A left-sided thoracentesis yields 1 L of non bloody, turbid fluid. The fluid is analysed: Protein: 4.0 g/dL, Lactate dehydrogenase (LDH): 230 U/L, Glucose: 35 mg/dL, Triglycerides: 50 mg/dL. The fluid cytology: negative for malignant cells. Gram stain: negative for bacteria. Cell count: 1500 WBC, 65% Neutrophils. Relevant laboratory test (in serum) are as follows: Protein: 7.0 g/dL, LDH: 250 U/L, Glucose: 90 mg/dL, Hemoglobin: 12 g/dL, Triglycerides: 100 mg/dL\n\n1. What is the most likely diagnosis?\n\n2. Mention the causes of pleural effusion?", "back": "Exudative pleural effusion, likely secondary to infection (Post pneumonic or Synpneumonic).", "cls": "3-star"}, {"num": 62, "chapter": "Chest", "front": "A 56-year-old construction worker presents with increasing difficulty catching his breath and chest pain that increased within months. The pain is right-sided, sharp, worse with deep breathing, and nonradiating. The condition was associated with nonproductive cough. He also gives history of asthenia and weight loss. The patient gives history of previous admission to hospital three months before with dyspnea with pleural effusion and analysis was done with exclusion of tuberculosis and slight improvement on antibiotics. He has been in construction for most of his life, working for a company that remodels old buildings. On physical examination, there is dullness to percussion over his right lung base as well as decreased breath sounds. Serum chemistries, complete blood counts, and electrocardiogram are all within normal limits. A chest x-ray demonstrates a pleural-based mass and effusion in the right lower lung.\n\n1. What is the most likely diagnosis?\n\n2. What tests and/or imaging tools could be used to confirm the diagnosis?\n3. What is the most appropriate treatment for this condition?", "back": "The patient’s occupation of remodeling old buildings places him at risk for asbestos exposure, which is the primary risk factor for mesothelioma.", "cls": "2-star"}, {"num": 63, "chapter": "Chest", "front": "A 50-year old female presented with dyspnea, dry cough and facial swelling with neck and upper limbs with a bluish tinge. On examination she had fever of 37.8°C, neck veins were congested and non-pulsating. There were also dilated superficial veins over the chest. There were two lymph nodes (3 cm in size) felt in the left supraclavicular area and the upper sternum was dull. Bilateral axillary nodes were detected and a firm. The spleen was felt 2 fingers below costal margin.\n\n1. What is the diagnosis of her chest condition?\n\n2. Mention the various causes for this chest condition?\n\n3. What are further investigations you would order to diagnose her chest condition and to reach the full diagnosis?", "back": "Superior mediastinal syndrome (SVC obstruction), likely due to lymphoma.", "cls": "3-star"}, {"num": 64, "chapter": "Chest", "front": "A male patient 62 years old, retired. He is chronic heavy smoker (40 packs/year). He is complaining of progressive persistent cough and dyspnea for 5 months. Two weeks ago, he developed hemoptysis. He also reported unexpained weight loss (8 Kgs in 2 months). Chest examination revealed dullness all over the left side chest.\n\n1. What is the most likely diagnesis in this condition?\n\n2. How do you investigate this case?\n\n3. Mentions other causes of hemoptysis?", "back": "The most probable diagnesis is Bronchogenic carcinoma; male, cigarette smoker, presented with hemoptysis, marked weight loss, and massive pleural effusion.", "cls": "4-star"}, {"num": 65, "chapter": "Chest", "front": "A 52-year-old male is known history of COPD (GOLD Stage II), presented to the emergency department with sudden onset left sided chest pain (sharp and pleuritic) for 3 hours. He 1s also complaining of dyspnea with no fever or hemoptysis. He denies any trauma. On examination: fully conscious and alert, but appears anxious, RR: 26 breaths/min, SO, 93% on room air. No cyanosis, no tracheal deviation. Decreased chest expansion, hyperresonance on percussion, and markedly diminished breath sounds over the left side.\n\n~ 1- What is the most likely diagnosis?\n\n~ 2- How to manage this case? 3- What are causes of this condition? |", "back": "A left-sided secondary spontaneous pneumothorax (SSP) Occurred in a patient with underlying COPD Triggered by increased intra-alveolar pressure from coughing, causing rupture of subpleural bullae.", "cls": "3-star"}, {"num": 66, "chapter": "Chest", "front": "A 50-year heavy smoker man presented to the outpatient clinic with dyspnea, purulent sputum, and productive cough of few days’ duration. No history of hemoptysis or pleuritic chest pain. On examination his chest was hyperinflated and bilateral basal medium sized crepitations were detected.\n\nWhat is the probable diagnosis? b=\n\nMention required investigations.\n\nHow do you treat this case? ¥\n\nHow can he stop smoking? =", "back": "Acute respiratory    tract   infection   im   a   COPD      patient   with bronchiectasis.", "cls": "3-star"}, {"num": 67, "chapter": "Chest", "front": "A 68-year-old man, heavy smoker, known case of COPD was admitted because of recent history of progressive productive cough, dyspnea. He received repeated courses of steroids and antibiotics as a case of COPD with exacerbation with unsatisfactory response. Physical examination: no clubbing, chest examination: signs of hyperinflated chest: increased anteroposterior diameter, encroachment on hepatic and cardiac dullness, auscultation a fixed monophonic wheeze in the right lung. CXR revealed a suspicious mass (4.5 cm) in right hilum and changes of COPD. laboratory: serum Na* 124 mmol/l s K 4 mmol/l, blood urea 40 mg/dL and creatinine 1 mg/dL.\n\n1. What is the most likely diagnosis? Specify it’s type.\n2. Mention other features expected to be present in conjunction of the low s Na™ level.\n3. Mention other extra pulmonary manifestations? 4, How is his condition treated?", "back": "Bronchogenic carcinoma.", "cls": "New"}, {"num": 68, "chapter": "Chest", "front": "A 26-year-old man presented to outpatient clinic because of progressively increased dyspnea with exertion over the last 3 months. Red painful nodules over the legs, Chest auscultation: normal shape chest, respiratory rate 28 /min. End inspiratory medium sized crackles that are persistent after cough. Chest x ray shows bilateral hilar adenopathy and bilateral basal interstitial infiltrate. ESR 97 mm/hr and rheumatoid factor —ve, serum Ca* 11.5 mg/dL\n\n1. What is the most likely outcome? Justify?\n\n2. Mention required investigations?", "back": "Sarcoidosis: is a multisystem disease of unknown etiology characterized by noncaseating granulomas.", "cls": "4-star"}, {"num": 69, "chapter": "GIT", "front": "A 60-year-old male with CHILD C liver cirrhosis is admitted to the ICU following a variceal bleeding. He feels cold extremities and has mottled skin. He is hypotensive and tachycardic. Exam revealed ascites and bilateral lower limb edema. Lactate level is 14mmol/L. One liter of IV saline was given. Terlipressin was initiated. Although the bleeding was stopped after variceal band ligation, he is still hypotensive 80/35 mmHg (MAP 50 mmHg). Lactate level dropped only to 10mmol/L. When applying a passive leg raise, his BP rose to 90/40 (MAP 59 mmHg).\n\n1.   Would you prescribe an additional fluid bolus to this patient?\n\n2,   What type of fluid is preferred in this situation?\n3.   What is your comment on the lactate level in this patient?", "back": "Decompensated liver cirrhosis with variceal bleeding and ongoing hypovolemic shoc
