 to confirm SVR\n-   Abdominal US to look for the texture of the liver and search for ascites and determine the shape and size of both kidneys.\n- Renal        biopsy:    shows         evidence    of       cryoglobulinemic glomerulonephritis\n\nTreatment:\n\n- Antiviral    therapy   if PCR     for    HCV     is    raised   along   with Immunosuppressive        therapy        (eg;    corticosteroids       and cyclophosphamide).\n- Plasma exchange and Rituximab (a chimeric monoclonal antibody that binds to the CD20 surface marker expressed on B cells)."}, {"num": 103, "chapter": "Hepatology", "front": "A 33 year old male patient presents complaining of generalized fatigue, anorexia, dull aching right hypochondrial pain and dark urine for 5 days. There is no past history or family history of liver disease. No history of drug intake during the last 6 months. On examination he is fully conscious with tinge of jaundice, Liver was tender and felt 4 fingers below the costal margin. Laboratory results: CBC was normal apart from mild leucopenia (WBCs 3.2) with relative lymphocytosis, serum ALT 278 U/L, AST 211 U/L, total bilirubin 2.3 mg/dL, direct 1.9 mg/dL. (serum ALP, GGT & albumin, creatinine, INR, fasting blood sugar, lipid profile) were within normal ranges. Hepatitis B sAg was positive. Abdominal ultrasound was normal apart from mild hepatosplenomegaly.\n\n1. What is the most likely diagnosis?\n\n2. What further investigations do you recommend?\n\n3.   [Is this patient candidate for starting antiviral therapy?", "back": "1. The diagnosis is acute viral hepatitis\n2. Hepatitis markers: HAV IgM, HBe Ag, HBc Ab IgM, HBeAb, HBV PCR, HCV PCR, EBV IgM and CMV IgM. If patient has negative HAV IgM, HCV PCR, EBV IgM and CMV IgM while, HBsAg, HBe Ag, HBc Ab IgM and HBV PCR are positive, diagnosis of acute hepatitis B will be confirmed.\n\n3. Plan of treatment will be:\n\n-   More than 95% of aduits with acute HBV hepatitis do not require specific treatment, because they will fully recover spontaneously.\n-   Antiviral treatment is recommended in certain high risk cases with acute liver failure (encephalopathy and coagulopathy with INR >1.5) or in protracted course.\n-   Chronicity 1s defined by persistence of HBsAg more than 6 months."}, {"num": 104, "chapter": "Hepatology", "front": "A 44 -years-old male patient accidentally discovered to be infected with HBYV during blood donation and his investigations were as follows: ALT 17 U/L, AST 15 U/L, Bilirubin total 0.9 mg/dL direct 0.3 mg/dL, HBsAg, HBe Ab were positive. HBeAg, HBc Ab IgM, and HBs Ab were negative. HBV PCR 700 IU/ml. Abdominal ultrasound was normal.\n\n1. What is the current HBV state in this phase?\n2. Is this patient candidate for treatment in this phase?\n\n3. What is the next step?", "back": "1. This patient had normal liver enzymes, positive HBsAg and HBe Ab, negative HBeAg with HBV-DNA less than 2000 IU/ml so he can be categorized as HBeAg -ve inactive chronic HBV infection (old terminology was inactive catrier).\n2. Inactive phase of HBeAg-negative chronic HBV infection do not need treatment. However, if he is a high risk patient (cirrhosis, family history of HCC or there are extrahepatic manifestations) or the patient is going to be treated with immunosuppressive drugs, he should receive antiviral therapy even if typical treatment indications are not fulfilled.\n3. The next step is to follow up the patient clinically and by laboratory investigations (liver enzymes, CBC & HBV DNA) together with abdominal ultrasonography every 3-6 months.\n\n-   HCC screening every 6 months in high risk group.\n-    Transient elastography (fibroscan) has a role also in assessment of degree of liver affection by determining degree of fibrosis."}, {"num": 105, "chapter": "Hepatology", "front": "A 42-years-old female patient presented to the outpatient clinic with elevated liver enzymes. Laboratory investigations were as follows; serum ALT 115 U/L, AST 123 U/L, Bilirubin total 2 mg/dL. direct 0.9 mg/dL, AFP was negative. Hepatitis markers HBsAg, HBe Ab, HBc Ab IgG were positive. HBeAg, HBs Ab and HCV Ab were negative. HBV DNA PCR 22100 IU/ml. Abdominal ultrasound was normal.\n\n1. What is the current HBV state in this phase?\n\n2, Is this patient candidate for treatment in this phase?\n3. What are the recommended drugs will you preseribe to treat this patient?\n\n4. What is the main end point for treatment?", "back": "1. The hepatitis B state is active HBeAg-negative chronic hepatitis B.\n2. Treatment is indicated in @\n\nPatients having HBeAg-negative with HBV DNA > 2,000 TU/ml, ALT persistantly > ULN and/or at least moderate liver necroinflammation or fibrosis by liver biopsy or noninvasive assessment (e.g; fibroscan, APRI score or FIB-4). High risk patients (cirrhosis, family history positive for HCC or on immunosuppressive therapy ) should be treated irrespective of the presence of these criteria\n3. The long-term administration of a potent nucleoside analogue with high barrier to resistance is the treatment of choice regardless of the severity of liver disease. The preferred regimens are tenofovir or enticavir as monotherapies. Lamivudine, telbevudine and adefovir are not recommended as first line therapy in the treatment of CHB because of higher drug resistance and response inferiority.\n4. The induction of long-term suppression of HBV DNA levels represents the main endpoint of all current treatment strategies.\no   HBsAg loss, with or without anti-HBs seroconversion, is an optimal endpoint, as it indicates profound suppression of HBV replication and viral protein expression."}, {"num": 106, "chapter": "Hepatology", "front": "A 17- year -old male presented with 4 days of fever, anorexia, vomiting and right hypochondrial pain not related to meals. His mother noticed teacoloured urine on the last day. No history of drug intake or previous illnesses. On examination: Temp 38°C, pulse 120 bpm, normal BP. He was jaundiced. Abdominal examination revealed right hypochondrial tenderness and hepatomegaly (5 cm below the costal margin). No splenomegaly or ascites. Investigations: serum ALT 2650 U/L, AST 2320 U/L, Total bilirubin 5 mg/dL, indirect bilirubin 2.2 mg/dL.                                    |\n\n1. What would be the possible diagnosis?\n\n2. What further tests would you recommend to confirm the diagnosis?\n3. What is the treatment?", "back": "1. The clinical picture is consistent with acute viral hepatitis, most likely hepatitis A. This is supported by the patient's age, acute presentation, absence of drug exposure, and markedly elevated liver enzymes. Anti HAV Ab (IgM) is recommended to confirm the diagnesis. In case of negative HAV IgM, other investigations are needed to rule out other causes of viral hepatitis (e g; HbsAg, HBc IgM, HCV antibodies and PCR test, HEV IgM, EBV IgM, CMV IgM). HAV infection is self limiting. Treatment is supportive (bed rest, adequate hydration, and symptomatic treatment). Hospitalization is rarely required unless complications arise. No antiviral treatment is needed. Patients should avoid hepatotoxic drugs and alcohol until full recovery."}, {"num": 107, "chapter": "Hepatology", "front": "A 30 year old woman presents to the outpatient clinic complaining of upper right quadrant abdominal discomfort of 2 months duration, and easy fatigability. No history of other GIT symptoms. By examination, height was 161cm, weight 83kg, B.P. 125/80, pulse 88/min, regular, temperature is 36.8° C. Abdominal examination revealed; mild hepatomegaly soft, non-pulsating, not tender. Laboratory Profiles show; fasting blood sugar 118mg/dl, AST 60 IU/L, ALT 70 IU/L, GGT 80 IU/L, total cholesterol 223mg/dl, LDL-c 153mg/dl, HDL-c 32mg/dl, Triglycerides 93mg/dl. HCV antibody and HBVs antigen are negative. Abdominal ultrasound shows hepatomegaly with bright echo pattern.\n\nComment on the laboratory test results? ol\n\nWhat is the most probable diagnosis? A\n\nHow can you confirm the diagnosis? What about the management plane?", "back": "1. The patient had impaired fasting plasma glucose, elevated AST, ALT and GGT, hypercholesterolemia and high LDL-C.\n\nMost probably metabolic dysfunction associated steatohepatitis (MASH).\no   Metabolic dysfunction associated fatty liver disease (MAFLD) refers to a wide spectrum of liver diseases, ranging from simple fatty liver (steatosis) to metabolic dysfunction associated steatohepatitis (MASH), to cirthosis or even hepatocellular carcinoma (even without cirrhosis). . Fibroscan with controlled attenuation parameter (CAP) scoring and Magnetic resonance imaging (MRI) are the best imaging modalities for fatty liver. Liver biopsy is the most specific test to confirm the diagnosis. Management plan:\n\n-   Weight reduction is highly recommended for the condition: -a. Life style modification; weight reducing diet and physical exercises.\n\nb. Pharmacotherapy including orlistat, phentermine-topiramate, naltrexone-bupropion, liraglutide, semaglutide, and tirzepatide. c. Bariatric surgery if lifestyle modification and drugs failed to reduce weight.\n-   Medical treatment targeting hepatic oxidative stress as ursodeoxycholic acid, and Vit. E (a-tocopherol) had a limited role in treatment.\n\n-   Recently FDA approved a novel thyroid hormone receptor-f§ (THR-) agonist known as Rezdiffra for the treatment of non cirrhotic patients with metabolic dysfunction associated steatohepatitis (MASH) to be used along with diet and exercise."}, {"num": 108, "chapter": "Hepatology", "front": "A- 28y -old male comes complaining of 5-days history of nausea, vomiting, diffuse abdominal pain, muscle aches, anorexia and fever up to 38°C. He has no significant medical past or family history. He denies any drug abuse. He takes no medications routinely, but he has been taking acetaminophen, approximately 30 tablets per day for 3 days for tennis elbow. On examination, Temperature is 37.8°C, pulse 98 bpm, BP 120/75 mm Hg. He has jaundice. Chest and heart are clear. The liver is slightly tender. No abdominal distention or peripheral edema. Investigations: normal complete blood count, creatinine 1.1 mg/dL, ALT 3440 U/L, AST 2705 U/L, total bilirubin 24.5 mg/dL & direct bilirubin 18.2 mg/dL, alkaline phosphatase 349 IU/L (NL:40-129), serum albumin 4.0 g/dL and INR is 1.4.\n\n1. What is the most likely diagnosis?\n\n2. What is the most important immediate diagnostic test?", "back": "1. The most likely diagnosis: Drug induced liver injury (DILI) mostly due to drug (acetaminophen) The degree and pattern of transaminase (ALT and AST) elevation can provide some clues to help differentiate possible etiologies.\n\n-   Transaminase levels more than 1000 IU/L are seen in conditions that produce extensive hepatic necrosis, such as drug induced liver injury, acute viral A hepatitis, ischemia (“shock liver”), autoimmune hepatitis and Wilson’s disease. The most important immediate diagnostic test: acetaminophen level.\n\n-   The markedly elevated hepatic transaminases and bilirubin level with normal albumin are consistent with acute viral hepatitis or acute drug induced liver injury.\n-   Obtaining serum acetaminophen level and knowing the time of his last ingestion help in diagnosing acetaminophen-related liver damage and the possible need for N-acetylcysteine that acts as an effective antidote."}, {"num": 109, "chapter": "Hepatology", "front": "A 49 year old female presents to the ER complaining of a 4 weeks history of progressive abdominal swelling and discomfort. She has no other GI symptoms. Medical history is significant only for three pregnancies, one of which was complicated by excessive blood loss, requiring a blood transfusion. She is married for 20 years. On examination: temperature is 37°C, pulse 88 bpm, and BP 95/60 mm Hg. She has jaundice Chest and heart are clinically free. Her abdomen is distended, with mild diffuse tenderness, hypoactive bowel sounds and shifting dullness to percussion. There is mild peripheral edema. Investigations: serum Na 129 mEqg/L, serum albumin 2.8 mg/dL, total bilirubin 4 mg/dL, prothrombin concentration 45%, Hb 12 g/dL and Platelet count 78 x10%/L.\n\n1. What is the most likely diagnosis?\n2. Explain laboratory findings in this patient?\n\n3. What is your next step?                        /", "back": "1. The most likely diagnosis: ascites caused by portal hypertension as a complication of hepatic cirrhosis.\n\n2. Laboratory finding:\no   Low albumin level and low prothrombin concentration refer to the chronicity of liver pathology.\no   Increase total bilirubin level indicates decompensated liver that clinically leads to jaundice.\no   The patient suffers from hyponatremia that may be due to the use of diuretics.\no   Hypokalemia is manifested clinically by hypoactive bowel sounds.\no   Thrombocytopenia is mostly due to hypersplenism.\n3. Next step is to do:\n\n-   Abdominal ultrasonography to confirm the diagnosis.\n-   Paracentesis to analyze the ascitic fluid to determine the possible etiology and to exclude spontaneous bacterial peritonitis.\n-   Investigations to detect the cause of her cirrhosis ¢.g. Markers for viral hepatitis (HBV and HCV), autoimmune profile (ANA, ASMA and Anti-LKM, anti SLA/LP), 24 urinary copper excretion should be done."}, {"num": 110, "chapter": "Hepatology", "front": "A 62- year-old female was referred to the outpatient clinic with 8 months history of pruritis. She had loose motions for the past 4 weeks and felt generally tired. There was no loss of weight or appetite and no abdominal pain. On examination: She was mildly jaundiced and had clubbing of her fingers. No lymphadenopathy. BP was 170/60. Pulse was 80bpm and regular. Skin was dry and pigmented with scratch marks all over her body together with bilateral xanthelasmas. Abdominal examination revealed hepatomegaly. Spleen was 3 fingers below the costal margin. Abdomen was distended with shifting dullness.\n\nInvestigations: serum albumin 2 g/dL, total bilirubin 3.8 mg/dL, direct bilirubin 3.0 mg/dL, alkaline phosphatase 640 U/L, GGT 230 U/L, prothrombin time 15 seconds.\n\n1. What is the most likely diagnosis?\n\n2. What further investigations would you like to perform?\n3. What is the treatment of this disease?", "back": "1. The most likely diagnosis is primary biliary cholangiopathy (previously known as primary biliary cirrhosis). The investigations needed are:\n\nAutoimmune markers of primary biliary cirrhosis such as antimitochondrial Ab (AMA) especially M2 is specific and present in over 95% of patients. ANA, smooth muscle antibodies may be present but non-specific. Elevated serum alkaline phosphatase is often the earliest abnormality in liver enzymes.\n\nAminotransferases, GGT and serum cholesterol are usually elevated. Abdominal ultrasonography. Treatment: Ursodeoxycholic acid (UDCA) is the treatment of choice as it helps to slow the progression of the disease. Obeticholic acid can be used as an adjuvant therapy in cases with inadequate response to UDCA . Supplementation with fat soluble vitamins and calcium. Pruritus is difficult to treat, however it can be treated by cholestyramine and naloxone. Corticosteroids may alleviate symptoms and improve biochemical and histologic findings. Corticosteroid-induced osteoporosis is of great concern.\n\nLiver transplantation is highly indicated in cases with end stage liver disease or intractable pruritis."}, {"num": 111, "chapter": "Hepatology", "front": "A 59-year-old retired accountant was admitted with a 6 months history of increasing tiredness and lethargy and 2 months history of poor appetite. His weight was increasing in the last few weeks. There was no history of chest pain, cough or expectoration. He was started on frusemide 3 weeks ago but this in fact had worsened his tiredness.\n\nOn examination: He was alert with jaundice and bilateral LL pitting edema. Abdominal examination revealed shifting dullness. Liver was not palpable and spleen was moderately enlarged.\n\nInvestigations: total bilirubin 2.3 mg/dL, direct bilirubin 1.1 mg/dL, ALT 120 U/L, AST 130 U/L, serum albumin 2.5g/dL, K 2.5 mEq/L, Na 129 mEq/L.\n\nWhat is the most likely diagnosis? Ae\n\nList the most important causes of such a disease in Egypt?\n\nExplain the laboratory findings in view of your diagnosis?\n\nWhat investigations would you like to do to define the etioclogy of this condition?", "back": "1. The most likely diagnosis is liver cirrhosis.\n\n2. The most important causes in Egypt are steatosis and chronic viral hepatitis (especially chronic HCV and HBV). Other less common causes include chronic auto-immune hepatitis, Wilson’s disease, drug induced liver injury and hemochromatosis.\n3. There is hypokalemia and hyponatremia mostly drug induced due to frusemide use. Both increased the sense of tiredness he has.\n\n-   Hypoalbuminemia is due to failure of protein synthesis in the cirrhotic failing liver.\n-   The elevation of liver transaminases means that the process of liver damage is going on.\n-   Hyperbilirubinemia is due to failure of its excretory function.\n4. Markers of HCV and HBV, autoimmune antibodies (ANA, ASMA, LKMA and ASMA, SLA/LP) and 24 H urinary copper excretion (to exclude Wilson’s disease) should be done. Ultrasonography may help in diagnosis of other etiology such as vascular causes, e.g.: Budd-Chiari, veno-occlusive disease."}, {"num": 112, "chapter": "Hepatology", "front": "A 54- year- old female presents to the ER with hematemesis and melena. She gives a 4 months history of upper abdominal discomfort and marked itching. No history of drug intake or receiving blood transfusion. On examination; Pulse is 120bpm regular. BP 85/50mmHg. Prominent xanthelasmas are present. She has clubbing of fingers but no palmar erythema or spider nevi. Chest examination is unremarkable. Abdominal examination revealed mild hepatomegaly with smooth surface and 3cm splenomegaly below the costal margin. Investigations: Hb 7.1 g/dL, WCC 13.5x10%L, platelets 540 x10°/L, Na 138mEq/L, K 4.5mEq/L, ALT 41U/L, AST 65 U/L, INR 1.1, Protein 8 g/dL, albumin 3.3 g/dL. alkaline phosphatase 570 U/L, GGT 195 U/L.\n\n1. What is your diagnosis?\n\n2. What would be the most appropriate immediate therapies whilst you are organizing for upper GI endoscopy?\n\n3. What test would best confirm the likely underlying diagnosis?", "back": "1. This patient has hematemesis and melena, itching, clubbing, prominent xanthelasmas and raised serum alkaline phosphatase. The possible diagnosis is primary biliary cholangitis with cirrhosis and bleeding esophageal varices. The immediate therapy is to correct the hypovolemic shock by giving plasma expanders, vasopressors and blood transfusion. Prophylactic antibiotics are usually needed. IV proton pump inhibitors can be considered in certain cases not as primary treatment but as adjunctive to reduce the risk of bleeding from post sclerotherapy ulcers. Abdominal ultrasonography to exclude secondary biliary cirrhosis due to prolonged biliary obstruction by stone or stricture. Serum antimitochondrial Ab (AMA), ANA and cholesterol should be done to confirm the diagnosis."}, {"num": 113, "chapter": "Hepatology", "front": "A 38-year-old woman presents for further evaluation of vague right upper quadrant pain, pruritus, and abnormal liver test results. Her primary care physician has already ordered a right upper quadrant ultrasound scan, which showed no abnormality. A quantitative hepatobiliary iminodiacetic acid scan showed a normal GB ejection fraction. Laboratory: serum albumin level of 4.0 g/dL, bilirubin 1.2 mg/dL, alkaline phosphatase 350 U/L, AST 65 U/L, ALT 72 U/L, antimitochondrial antibody 1:1280, ANA 1:20, HCV antibody negative, antibody to anti-HBc negative, HBsAg negative, and anti-HBs positive.\n\n1. What is this patient’s most likely diagnosis?\n2. Mention the drugs that can be used in treatment of pruritus in such patients?", "back": "1. This patient has primary biliary chnlangitis (formerly referred to as primary biliary cirrhosis). She has no evidence of HCV and is immune by previous vaccination to HBV.\n-   PBC typically presents in middle-aged females with symptoms of fatigue, pruritus, right upper quadrant abdominal pain, anorexia, and jaundice.\n-   Such patients are identified by elevated serum alkaline phosphatase (ALP) and antimitochondrial antibody (AMA). Fifty percent of patients with PBC may have a positive ANA.\n-   Other findings may include mild elevations in the aminotransferases and an elevated bilirubin level.\n-   A diagnosis of PBC is established if there is no extrahepatic biliary obstruction and at least two of the following are present: s   Elevated ALP levels. =   Positive AMA.\no   Histologic evidence of PBC. The first choice would be a bile acid sequestrant (cholestyramine or colestipol hydrochloride), and ursodeoxycholic acid (UDCA) with or without antihistamines.\n-   Other anti-pruritogenic agents that may control itching in some patients are: rifampin, naltrexone (opioid antagonist), and sertraline."}, {"num": 114, "chapter": "Hepatology", "front": "A 40 year old female presents with acute abdominal pain. She takes no regular medications except contraceptive pills and occasional analgesics for back pain. She has no current illnesses, but had a lower limb deep venous thrombosis Syears ago. No previous abdominal surgeries. On examination, she is in pain, pulse 110 bpm regular, BP 120/80, JVP not raised with absent hepatojugular reflex. Heart sounds are normal, with no ankle edema. Chest is clear, and abdominal examination reveals tender hepatomegaly and ascites. Investigations: Hb 12g/dL, bilirubin 3mg/dL, platelets 114x x10°/L, INR 1.1, HBsAg and anti-HCV Ab were negative, anti-smooth muscle Ab was negative, anti-mitichondrial Ab and RF were also negative.\n\n1. What is the most likely diagnosis?\n\n2. What investigation would you do to confirm the diagnosis?\n\n3. What are the most likely causes of such a disease?", "back": "1. The classic triad of acute abdominal pain, ascites, and hepatomegaly, besides absent hepatojugular reflux, suggests hepatic venous outflow tract obstruction. Budd-Chiari syndrome is the most likely diagnosis. The investigation: Abdominal ultrasonography and duplex study of the hepatic veins are required to reach the diagnosis. Contrast-enhanced computed tomography (CT) or magnetic resonance imaging (MRI) can confirm the diagnosis and aid with treatment planning. Venography should be performed if noninvasive tests are negative or nondiagnostic, but there is strong clinical suspicion for the disease. In this particular patient, the most likely cause is the use of contraceptive pills, which predispose to thrombophilia (increased risk of blood clotting).\no   This patient also had history of previous DVT, which makes investigation for another cause of thrombophilia mandatory.\no Acquired causes of thrombophilia include: myeloproliferative diseases e.g, chronic myeloid leukemia, paroxysmal nocturnal hemoglobinuria, and antiphospholipid syndrome.\no   Inherited causes of thrombophilia, like prothrombin gene mutation, MTHFR mutation, protein C, protein S, and Antithrombin III deficiency can also trigger such condition.\n\no   Other systemic autoimmune diseases that can predispose to BuddChiari syndrome include: Vasculitis (Behget disease, connective tissue disease) and inflammatory bowel disease."}, {"num": 115, "chapter": "Hepatology", "front": "A 25- year- old lady presented with acute onset of right hypochondrial pain, jaundice and increase of abdominal girth. She was married since 4 years and gave history of two consecutive abortions. There was no history of alopecia, photosensitivity or skin rash. Examination revealed BP 110/70, pulse 90/min regular. Patient was jaundiced with an enlarged tender liver and ascites by shifting dullness. CBC showed mild thrombocytopenia platelet count 110.000/dl with hyperbilirubinaemia bilirubin 3 mg/dl with biphasic pattern and normal liver enzymes.\n\n1. What is your diagnosis?\n\n2. Mention the possible cause for this patient’s condition?\n\n3. Mention lines of treatment?", "back": "1.The classic triad of acute abdominal pain, ascites, and hepatomegaly in a middle-aged female suggests hepatic venous outflow tract obstruction. Budd-Chiari syndrome is the most likely diagnosis. 2.The previous history of 2 consecutive abortions makes the diagnosis of antiphospholipid syndrome more likely. Antiphospholipid syndrome is a prothrombotic condition that can occur primary (idiopathic) or secondary to autotmmune disease, such as systemic lupus erythematosus. 3.Treatment of Budd-Chiari syndrome aims to prevent the propagation of the clot, restore patency of thrombosed veins, decompress the congested liver, and prevent or manage complications. A stepwise approach is usually followed:\n\nTreatment of the underlying condition, if possible. Anticoagulation (Warfarin) is given to all patients and continued indefinitely unless a major contraindication is present or a complication occurs. Thrombolytic therapy is offered to cases with acute Budd-Chiari syndrome (within 3 to 4 weeks) and a well-defined clot in the absence of contraindications. Angioplasty + stenting is offered to patients with acute or subacute Budd-Chiari syndrome and segmental stenosis of the hepatic veins.\n\nTreatment chronic Budd-Chiari syndrome typically focuses on decompressing the liver (TIPS placement, surgical shunts, or liver transplantation). Upper endoscopy to screen for esophageal varices, and adequate prophylactic measures (Non-selective beta blocker + band ligation) if present."}, {"num": 116, "chapter": "Hepatology", "front": "A 22 -year- old female presents with jaundice, abdominal pain and confusion. She was unable to give any further history but her parents denied any previous ill health, medications or depression. On examination, she was afebrile, pulse 95 bpm, BP 100/50, normal JVP and chest was clear. She was jaundiced, abdominal examination revealed 5 cm tender hepatomegaly and ascites. Flapping tremors were present and her Glasgo coma scale GCS was 13/15\n\nInvestigations: Hb 10g/dL, WCC 11x10%L, platelets 186x10°1L, ESR >100 mms, INR 2.3, ALT 3565 U/L, ALP 410 U/L, hepatitis viral markers are negative. ANA 1/160, antimitochondrial and anti-smooth muscle antibodies were negative, serum ceruloplasmin and urinary copper were normal, paracetamol levels undetectable\n\n1. What is the most likely diagnosis? and why?", "back": "1. This is a 22-year-old female with clinical (encephalopathy) and laboratory (coagulopathy) evidence of acute liver failure without preexisting liver disease. Causes may include: acute viral hepatitis, druginduced liver injury (e.g., paracetamol, INH), autoimmune hepatitis, Wilson’s disease and Budd-Chiari syndrome, Laboratory investigations showed elevation of ALT and ANA titer (1/160), making the most likely diagnosis to be auteimmune hepatitis (AIH). Further confirmation would be done by assessment of other serologic markers of AIH, elevated serum IgG level and liver biopsy, which would be postponed till correction of her coagulopathy or if urgent it can be performed by transjugular approach.\n-   When a liver biopsy is obtained, the diagnosis can be confirmed by histology showing interface hepatitis and/or a predominantly lymphoplasmacytic infiltrate.\n-   The investigations had excluded Wilson's disease          as   serum ceruloplasmin and urinary copper excretion were normal.\n-   Paracetamol level was undetectable, excluding paracetamol-induced acute hepatitis, and there was no history of the use of other drugs. Also, serum viral markers for acute viral hepatitis were negative."}, {"num": 117, "chapter": "Hepatology", "front": "A 57 -year- old male presents with increasing abdominal girth, abdominal discomfort and tiredness. He was diagnosed as having chronic HCV hepatitis 3 years ago but he is recieved only supportive hepatotropic treatment. On examination, he is jaundiced and several spider nevi. There is no astrexis. Pulse is regular, 80bpm. BP 135/75. Normal JVP. Chest and heart examinations are unremarkable. Abdominal examination reveals mild tenderness in right hypochondrium without organomegaly but there is shifting dullness. Investigations: Bilirubin 3.5 mg/dL, albumin 2.8 g/dL, alkaline phosphatase S00U/L, INR 2, alpha-fetoprotien 2000IU/L\n\n1. What is the likely diagnosis?\n2. What diagnostic test(s) would confirm the diagnosis?", "back": "1. The likely diagnosis is liver cirrhosis due to chronic HCV hepatitis, mostly complicated by hepatocellular carcinoma (HCC).\n\nLaboratory investigations show very high alkaline phosphatase level and serum AFP pointing to a possible infiltrative disease like malignancy. HCC is the most likely diagnosis.\n2. Confirmation of the diagnosis should be made by:\n-   Imaging studies e g; abdominal US and contrast-enhanced triphasic CT scan. The later will show increased enhancement of the mass (if present) in the arterial phase and rapid washout in the venous phase.\n\n-   Contrast-enhanced dynamic MRI is an alternative, especially for patients with an allergy to iodinated contrast material."}, {"num": 118, "chapter": "Hepatology", "front": "A 52 -year- old male with a 4 years history of ulcerative colitis presents for his usual follow up. He complains of intermittent abdominal pain, worse in the right upper quadrant. During the last episode of pain, he noticed that his eyes look rather yellow. His bowel motions 2-3/d. They are loose but no blood. He takes mesalazine and azathioprine. He underwent cholycystectomy 15year ago.\n\nOn examination, He is jaundiced with no spider nevi or palmar erythema. Pulse is 80bpm and regular. BP is 140/85. Chest is clear, heart sounds are within normal. Abdominal examination mild right upper quadrant tenderness but no palpable organomegaly.\n\n1. What is the most likely diagnosis?\n2. How would you confirm the diagnosis?", "back": "1. Jaundice and right hypochondrial pain and tenderness in a patient with ulcerative colitis should raise the suspicion of a hepatobiliary complication. Sclerosing cholangitis is a strong possibility and is one of the known extracolonic manifestations of ulcerative colitis. Laboratory studies: will show elevated serum markers of cholestasis. Imaging: magnetic resonance cholangiopancreatography (MRCP) that helps to demonstrate characteristic bile duct changes with multifocal strictures and segmental dilatations in addition to exclusion of cholangiocarcinoma in high risk patients. Endoscopic retrograde cholangiopancreatography (ERCP) will confirm the characteristic lesion in biliary tracts. A percutaneous liver biopsy may support the diagnosis of PSC, but it is rarely diagnostic. However, liver biopsy is required for patients with suspected small duct PSC or if other conditions, such as an overlap syndrome       with   autoimmune     hepatitis,  or    IgG4-associated cholangitis/autoimmune pancreatitis, are suspected."}, {"num": 119, "chapter": "Hepatology", "front": "A 42 -year- old male presents to the ER with one day history of vomiting of fresh blood. He also reported passing black tarry stools for the last 3 days and feeling generally unwell for the last 6 weeks. He gives history of previous 3 attacks of jaundice.\n\nOn examination, he was jaundiced, and pale. Pulse 110 bpm. BP 110/70. Abdominal examination showed palpable liver 2cm below the right costal margin and firm in consistency. Spleen was also felt 4 fingers below the left costal margin. Few spider nevi were present on the chest and back.\n\nWhat is the diagnosis? S\n\n.List 3 common causes of such condition?\n\nWhat is the cause of black tarry stools?\n\nWhat is the priority in the management of this patient?\n\nWhat investigations would order for this patient? U", "back": "1. This patient has jaundice, a firm liver, and splenomegaly plus spider nevi, so the diagnosis will be hematemesis and melena due to vascular decompensation of liver cirrhosis. The cause of bleeding is most probably due to portal hypertension and variceal hemorrhage.\n\nThe most common causes are: esophageal and gastric varices, peptic ulcer, gastritis secondary to NSAIDs., Other less common causes: esophageal or gastric malignancy, and telangiectasia. Black tarry stool is termed melena and is due to the passage of digested blood (acid hematin) in stools. The site of bleeding is upper GIT above the ligament of Tietz. Rarely, ileal and right side of the colon lesions, especially in cases with slow transit, can present with similar presentation. The priority will be towards the management of the GI bleeding by resuscitation.\n\n-   Upper endoscopy is mandatory because it is not only diagnostic but also therapeutic through sclerotherapy and endoscopic band ligation,\n\nBeside upper endoscopy, abdominal US to confirm the presence of cirrhosis, liver function tests including serum albumin and INR to assess the synthetic function of the liver. Laboratory investigations to diagnose the etiology (e.g., viral markers) and complications (e.g., Alphafetoprotein level for HCC)."}, {"num": 120, "chapter": "Hepatology", "front": "A 40- year- old female presents to the casualty complaining of 2 months history of progressive abdominal distension with no change in appetite or in bowel habits and no other gastrointestinal tract symptoms. On examination: She was icteric, her temperature was 38°C with no lower limb edema. Chest and heart examination showed no abnormality. The abdomen was distended with diffuse tenderness and shifting dullness.\n\nInvestigations: HB 11 g/dL, total leucocytic count 15x10°/L, platelets 78x10°/L, albumin 2.8 g/dL, total bilirubin 4 mg/d}, direct bilirubin 2 mg/dl, prothrombin time 15 seconds.\n\n1. What is the most likely diagnosis?\n\n2. What further investigations should be done?\n3. What is the cause of shifting dullness and fever?", "back": "1. The most likely diagnosis is liver cirrhosis with ascites, complicated by spontaneous bacterial peritonitis (SBP) due to the presence of fever and abdominal tenderness in a cirrhotic patient.\n2. Abdominal ultrasound is required to confirm ascites.\n-   Diagnostic paracentesis 1s needed to analyze the ascitic fluid. Ascitic fluid PMN count > 250 cells/mm® is diagnostic for SBP. Gram staining and culture are needed to assess the effect of covering antibiotic therapy.\n\n-   Renal functions are required to exclude hepatorenal syndrome.\n\n-    CT abdomen may be considered if secondary peritonitis is suspected or atypical clinical presentation is present.\n2. Accumulation of free fluid in the abdomen (ascites) is the cause of shifting dullness. SBP is the cause of fever, but sepsis from other sources (e.g., urinary tract, chest) and hepatocellular carcinoma (HCC) should also be considered."}, {"num": 121, "chapter": "Hepatology", "front": "A 48-year-old man with HCV —and alcohol-related cirrhosis hospitalized with a two-day history of fever and abdominal discomfort. His temperature is 38C°. He has abdominal distension with shifting dullness and a small, reducible umbilical hernia is noted. Laboratory test results reveal a sodium level of 130 mEq/L, albumin of 2.5g/dL, and ALT of 75 U/L. Ascitic fluid has an albumin level of 1g/dLL and a polymorphonuclear leukocyte (PMN) count of 500 cells/mm3.\n\n1. What is the most likely diagnosis?\n2. Which are the most appropriate next steps in managing this patient?", "back": "1. The most likely diagnosis is spontaneous bacterial peritonitis (SBP), confirmed by PMN count > 250/mm? in ascitic fluid in the absence of surgical infection and in the presence of cirrhosis. Begin empirical IV antibiotics immediately - typically cefotaxime 2g IV every 8 hours or ceftriaxone. Oral fluoroquinolones (e.g., ofloxacin) can be used in stable patients without renal dysfunction or vomiting. Albumin infusion (1.5 g/kg on day 1 and 1 g/kg on day 3) is indicated to prevent renal impairment. Recurrence of SBP is common, so long term antibiotic prophylaxis is recommended, e.g. norfloxacin or ciprofloxacin. Hernia repair should be delayed until ascites is controlled."}, {"num": 122, "chapter": "Hepatology", "front": "A 45-year-old man with HCV related liver cirthosis is admitted with refractory ascites, oliguria, and failure to thrive. No fever, jaundice, edema or encephalopathy. Laboratory: BUN and creatinine increased from 18 mg/dL and 1.5 mg/dL to 25 mg/dL and 1.8mg/dL over 6 weeks. Blood and urine cultures are negative. Ascitic fluid 120 neutrophils/mm?®. Nasogastric lavage is negative for blood.\n\n1. What is the most probable diagnosis?\n\n2. What is the best next step in managing this patient?", "back": "1. The most probable diagnosis is hepatorenal syndrome (HRS), a functional renal failure in patients with advanced liver disease. Diagnostic criteria include:\n\nCirrhosis with ascites, rising serum creatinine with no improvement after plasma expansion and diuretic withdrawal for 2 consecutive days, absence of shock or nephrotoxins, and absence of evidence of structural kidney disease. Management:\n\nStart of vasopressor therapy (e.g., terlipressin, midodrine and octreotide) and Expand intravascular volume with IV albumin for 2 days. Renal replacement therapy (RRT) may be needed in refractory cases as a bridge for transplantation. For refractory HRS, liver transplant referral is recommended."}, {"num": 123, "chapter": "Hepatology", "front": "A 14 -year- old boy presents with yellowish sclera, fatigue and abnormal upper limb movements. Family history reveals his sister had similar symptoms and died. Examination: jaundiced, mild lower limb edema, shifting dullness and abnormal limb movements. Investigations: total bilirubin 3.5mg/dL, direct bilirubin 2.8mg/dL, albumin 3g/dL, AST 556 U/L, ALT 678 U/L, INR 2.5.\n\n1. What is the most likely diagnosis?\n\n2. What further investigations should be done?\n3. What is the treatment of this condition?", "back": "1. The most likely diagnosis is Wilson's disease, an autosomal recessive disorder of copper metabolism leading to liver and neurologic damage.\n2. Confirmatory investigations:\n\no   Serum ceruloplasmin (low) O   24-hour urinary copper (high)\no   Slit-lamp exam for Kayser-Fleischer rings O   Liver biopsy to measure hepatic copper content (>250 mcg/g dry weight)\n\n3.   Treatment:\n\nO   Start copper chelators (e.g., D-penicillamine or trientine)\n\nProvide supportive care for acute liver dysfunction\n\nZinc can be used as maintenance therapy\n\nConsider liver transplant in fulminant or decompensated cases"}, {"num": 124, "chapter": "Hepatology", "front": "18-year-old female presented with a 3-day history of jaundice, nausea, and abdominal discomfort. She had noticed dark urine, but normal stool and no itching. Examination: normal apart from jaundice. Urine output was less than 30 ml/h Investigations: Hb 7.0g/dL, WBC 21.800 /mcL, platelets 144.000/mcL, blood film: polychromasia, burr cells, microspherocytes; no fragmented cells, reticulocytes 6.7% (normal range <2%). Coomb’s test is negative. Prothrombin time 30 sec. serum Na 134mmol/L; K 4.8mmol/L; creatinine 1.85 mg/dL. Bilirubin 28.9 mg/dL; AST 89 TU/L, ALT 62 IU/L, ALP 69 IU/L, albumin 2.3 g/dL, abdominal ultrasound: no comment on liver texture, mild splenomegaly.\n\n1. What is the most probable diagnosis?\n\n2. What are your next step investigations?\n3. What is your initial management?", "back": "1. The most likely diagnesis is Wilson disease (WD): The clinical presentation is acute jaundice with rising bilirubin, decreasing Hb and dark urine and elevated creatinine. This combination of clinical and laboratory data suggests hemolytic crisis with hemoglobinuria and acute kidney injury. a.   The abnormal synthetic liver functions (decreased albumin and prolonged prothrombin time) are suggestive of chronic liver disease with mild increase in transaminases and splenomegaly in ultrasound.\n\nThe spherocytic coomb’s negative hemolytic anemia in a patient with chronic liver disease may suggest WD.\n\nHemolytic anemia is a recognized but uncommon (10-15%) complication of this disease. The prodrome to WD is occasionally a severe spherocytic hemolytic anemia. The hemolysis in Wilson’s disease is due to deficiency of ceruloplasmin, the copper transport protein which results in excessive inorganic copper inside RBCs resulting in damage the cell membrane. The increased spherocytes number in peripheral blood in this patient suggests cell membrane damage.\n\n2. Investigations:\n\nSlit lamp examination for Kayser—Fleischer (KF) rings on corneas. Serum ceruloplasmin level 1s decreased in Wilson’s disease. Twenty-four urinary copper excretion which is increased in Wilson’s disease. Increased hepatic copper in liver biopsy is the definitive diagnostic fest\n3. Management:\n\nBlood transfusion and iv fluids during acute hemolysis Starting long term penicillamine Liver transplantation in late cases with cirrhosis and liver cell failure"}, {"num": 125, "chapter": "Hepatology", "front": "A 55 -year- old obese female presented in the ER with fever and right upper quadrant abdominal pain that increases with meals for the last two weeks. There were 2 attacks of vomiting. In the last few days there were itching and clay colored stools. She is a mother of 4 children. On examination: the patient was conscious, temp 38°C, pulse 120 bpm, BP 120/80, jaundice with scratch marks all over her body. Abdominal examination right hypochondrial tenderness but no organomegaly. Investigations: total bilirubin 3.5mg/dL, direct bilirubin 3mg/dL, alkaline phosphatase 1000 U/L, GGT 567 U/L, total leucocytic count 14x10%/L\n\n1. What is the most likely diagnosis?\n\n2. What is your interpretation of the Laboratory tests?\n\n3. What further investigations would you do?", "back": "1. The diagnosis is obstructive jaundice. This obese fertile female patient had jaundice, itching and clay-colored stools all point to the diagnosis of obstructive jaundice. The presence of right hypochondrial pain and tenderness makes the gall bladder the most likely site of pathology.\n2. The laboratory tests show direct hyperbilirubinemia, elevation of the alkaline phosphatase and GGT both are canalicular enzymes and this supports the presence of biliary cause of the direct hyperbilirubinemia. The elevated TLC should raise the possibility of cholangitis complicating the condition.\n3. Abdominal US is the first step in the diagnosis.\no   Then   ERCP      when   contrast   enhanced   fluroscopic   ductal visualization is needed particularly for studying subtle intraducal lesions, tissue sampling and differentiation between benign and malignant strictures.\no MRCP is a sensitive, non invasive method, that has a particular value when ultrasound or CT imaging reveals bile duct dilatation or the etiology of jaundice is unclear and in cases where ERCP is contraindicated or high risk."}, {"num": 126, "chapter": "Hepatology", "front": "A 66 -year -old female patient presented to the ER with high fever, delirium and right hypochondrial pain. She had a history of recurrent diarrhea in the last month. On examination: temp 39.4°C, pulse 125bpm, BP 135/85. She was drowsy. Neurological examination showed no lateralization or neck rigidity. No jaundice. Abdominal examination showed right hypochondrial and right intercostal tendemess, liver 6cm below the right costal margin. No splenomegaly. Investigations: total bilirubin 1.2 mg/dL, ALT 110 U/L, alkaline phosphatase 456 U/L, Abdominal US revealed the presence of a large cystic lesion in the right lobe of the liver.\n\n1. What are the causes of such a cystic lesion in this patient?\n\n2. What further investigations would you like to ask?", "back": "1. Cystic lesion in the liver in this case with fever and liver tenderness, is mostly due to an infectious cause as:\n\nBacterial liver abscess\n\nHydatid disease of the liver\n\nAmebic liver abscess\n\n2. The investigations required are:\n\nComplete blood picture for evidence of infection Blood culture and sensitivity.\n\nSerology i.e Ecchinococcus IgG Abdominal CT to confirm the nature of the cystic lesion and its contents.\n\nAspiration (CT or US guided), microscopic examination and culture of the cyst content.                                        |"}, {"num": 127, "chapter": "Hepatology", "front": "A 70 -year -old male presented with jaundice and anorexia of one month duration. He lost 8 kilograms in the last few weeks.\n\nOn examination he was deeply jaundiced and cachectic. The liver was felt 3 fingers below the costal margin in the mid-clavicular line and was smooth surface and soft in consistency. Spleen was not felt and there was no ascites. Investigations: abdominal sonography revealed a distended gall bladder and dilated intra hepatic and cystic duct but no stones were present.\n\nWhat is the likely diagnosis? State why? Ae\n\nWhat further investigations would you like to order?\n\nHow would you manage him?\n\nCan you prescribe ursodeoxycholic acid (UDA) to such patient?", "back": "1. Malignant obstructive jaundice would be the likely diagnosis. The age of the patient and the presence of anorexia and cachexia pomt to a malignant etiology. Abdominal US findings showed the presence of obstructive jaundice. A tumor of the pancreas, bile ducts or ampulla of Vater are the possible etiologies.\n2. The investigation: Abdominal CT for better visualization of the pancreas. MRCP, endosonography (EUS) and ERCP to detect the cause of obstruction.\n3. Management: Medical:\n\n- Patient stabilization i.e proper hydration. Mannitol is given to avoid acute renal failure caused by the effect of hyperbilirubinemia on the renal tubules,\n-   Cholestyramine to control itching\n- Antibiotics for management of cholangitis if present\n-   Correction of coagulopathy          (vitamin   K   supplements    to   correct hypoprothrombinemia). Interventional: ERCP is not only needed to diagnose but also to treat. ERCP helps to manage malignant strictures by stenting until preparing the patient for surgery if feasible. Percutaneous drainage, in cases with failed ERCP. Surgery: after assessment of tumor resectability.\n4. Ursodeoxy cholic acid (UDCA) is generally contraindicated in obstructive jaundice. This is because UDCA, while beneficial in some liver conditions, disrupts biliary integrity in obstructive scenarios which worsens the condition."}, {"num": 128, "chapter": "Hepatology", "front": "A 52-year-old male, with a chief Complaint: \"I'm feeling more tired than usual.\" He visited the clinic for a routine check-up. He has a history of type 2 diabetes mellitus and hypertension. He is overweight (BMI: 31 kg/m?) and admits to a sedentary lifestyle and a diet high in processed foods. He denies alcohol use. Physical Examination mild hepatomegaly. No signs of liver failure. Lab Tests revealed ALT: 65 U/L, AST: 55 U/L, fasting glucose: 145 mg/dL, HbAlc: 7.5%, and lipid profile shows elevated triglycerides and LDL\n\nAbdominal ultrasound shows increased echogenicity of the liver consistent with hepatic steatosis.\n\n1. What is the most likely diagnosis, and what criteria are used to establish it?\n\n2. What are the recommended management strategies for this condition?", "back": "1. The most likely diagnosis is metabolic dysfunction-associated steatotic liver disease (MIASLLD). Diagnostic criteria include:\n\nEvidence of hepatic steatosis on imaging or histology. At least one metabolic risk factor, such as:\n\nOverweight or obesity Type 2 diabetes mellitus Metabolic abnormalities (e.g., elevated triglycerides, insulin resistance) Exclusion of significant alcohol intake and other causes of fatty liver (e.g., viral hepatitis, medications).\n\nManagement is centered on lifestyle changes: Weight loss (aim for 7-10% of body weight) Dietary improvements such as adopting a Mediterranean-style diet Regular exercise, at least 150 minutes of moderate-intensity activity weekly Control of associated conditions, including diabetes, hypertension, and dyslipidemia. There are currently no specific medications approved for MASLD, but treating underlying metabolic issues can slow progression."}, {"num": 129, "chapter": "Hepatology", "front": "A 25-year-old male presents with jaundice, fatigue, and right upper quadrant pain 2 weeks after traveling to a hepatitis A-endemic region. Labs: ALT 480 U/L, AST 390 U/L, total bilirubin 3.8 mg/dL. He drinks 10-12 units of alcohol/week.\n\n1. Mention three differential diagnoses for the condition?\n2. What are the most important investigations?\n3. Outline management plan for the patient.", "back": "1. Differential Diagnoses include: O   Acute hepatitis A virus (HAV) infection (most likely). Due to presence in an endemic area that has increased risk of fecal-oral transmission through street food or contaminated water. Hepeatitis E virus (HEV) infection. Alcoholic hepatitis (less likely). Moderate alcohol use, acute onset and lack of AST: ALT >2:1 ratio make this less likely.\n2. Investigations include: IgM anti-HAV to confirms               acute   HAV, abdominal ultrasound to rule out biliary obstruction.\n3. Acute Management Plan include the following: O   Supportive   care: Hydration,   antiemetics,   avoid   alcohol   and hepatotoxic drugs. Monitor for acute liver failure: check INR, glucose and mental status.\n\nPrevent transmission: HAV vaccine/immunoglobulin for close contacts."}, {"num": 130, "chapter": "Hepatology", "front": "A 62-year-old Egyptian male with 20-year history of untreated HCV infection presents with weight loss around 6 kg in two months and right upper quadrant pain.\n\nLaboratoy: AFP 620 ng/mL, platelets 90,000/uL, ALT 85 U/L. Ultrasound shows a 6 cm liver mass.\n\n1. List three differential diagnoses for the liver mass?\n\n2. Prioritize investigations to confirm HCC?\n\n3. Outline a treatment plan?", "back": "1. Differential Diagnoses include:\n\na,   Hepatocellular carcinoma (HCC) is the most likely diagnosis due to elevated AFP (>400 ng/mL) and history of HCV cirrhosis with thrombocytopenia (portal hypertension). b.    Metastatic liver disease.\n\nC.   Hepatic adenoma (less likely in cirrhosis).\n2. Key Investigations in this case include:\n\nTriple-phase CT/MRI that shows arterial hyperenhancement with washout in venous phase. Core biopsy if imaging is inconclusive. Chest/abdominal imaging to exclude metastases. 3, Treatment Plan:\n\nCurative: Surgical resection or radiofrequency ablation (if tumor < 3 cm and preserved liver function). Palliative: Sorafenib/lenvatinib    (tyrosine   kinase   inhibitors   for advanced HCC). HCYV treatment: Direct-acting antivirals (DAAs) to reduce recurrence risk."}, {"num": 131, "chapter": "Hepatology", "front": "A 28-year-old pregnant female (32 weeks) presents with jaundice, dark urine, and right upper quadrant pain after consuming untreated water. Labs: ALT 1200 U/L, INR 1.8, IgM anti-HEYV is positive.\n\n1. List three differential diagnoses.\n\n2. What are the key investigations?\n3. What are the maternal and fetal management outlines?", "back": "1. Differential Diagnoses include:\n\na. Acute hepatitis E virus (HEV) infection (most likely). b. Intrahepatic cholestasis of pregnancy (ICP), that presents with pruritus, normal INR, and elevated bile acids. ¢. HELLP syndrome that manifests by hypertension, proteinuria and hemolysis.\n2. Key Investigations are: IgM anti-HEV that confirms acute infection.\n-   Coagulation profile as INR >1.5 indicates severe hepatitis.\n-   Fetal ultrasound to assess growth, placental insufficiency.\n3. Maternal-fetal Management cutlines include:                |\n-   Maternal care: Supportive care in the form of IV fluids, vitamin K supplementation and monitoring for encephalopathy. Fetal care: Daily kick counts, biweekly ultrasounds, early delivery if maternal deterioration.\n-   Prevention: Boil water, hygiene education and HEV vaccine, if available,"}, {"num": 132, "chapter": "Neuro", "front": "A 65-year-old man was found collapsed in his bedroom during the night at his residential care facility. He had reportedly risen to use the toilet and then developed weakness on the right side of his body. He has a 15-year history of type 2 diabetes mellitus and hypertension and smokes 10 cigarettes per day. His current medications include amlodipine 5 mg daily and a combined metformin/glibenclamide (850/5 mg) oral tablet twice daily. On examination, he demonstrated a right homonymous hemianopia, right lower motor neuron facial palsy, right hypoglossal nerve paralysis, and expressive aphasia. The remainder of the cranial nerves was intact. There was right-sided weakness with muscle strength graded at 2/5 in the upper limb and 3/5 in the lower limb, in a pyramidal distribution. Deep tendon reflexes were reduced on the right side, and plantar response was extensor bilaterally. His blood pressure was 170/95 mmHg. A left carotid bruit was audible. Cardiac examination was unremarkable. Laboratory findings included hemoglobin 12 g/dL, WBC 10 x 10°/L, platelets 330 x 10°/L, normal coagulation profile, sodium 138 mmol/L, potassium 4.2 mmol/L, BUN 15 mg/dL, and creatinine 1.0 mg/dL. ECG and serum troponin levels were normal.\n\n1. What is the most likely cause of the patient’s neurological manifestations?\n2. What is the most critical diagnostic investigation?\n3. What is the recommended management plan?", "back": "L. The most likely cause is cerebrovascular stroke (CVS). The age, male sex, smoking, diabetes and hypertension are risk factors for atherosclerosis. Vascular lesion is the most likely cause: Thrombosis of the left middle cerebral artery (main artery). Urgent CT brain without contrast to rule out cerebral hemorrhage. In the initial hours after cerebral infarction, the CT may be normal. So follow up CT, better after 24-48 hr, is recommended if no CT changes are apparent early. MRI brain with diffusion and MRA stroke protocol is highly sensitive can diagnosis infraction within minutes of vascular occlusion, detecting and localizing acute ischemia and help guide ftreatment decisions revasculization        either        thrombolytic    or    catheter   intervention (thrombectomy). Assessment of airway, breathing, and circulation, including vital signs. Nothing by mouth until swallowing is ensured. Bladder, bowel and skin care, air mattress to avoid bed sores.\n- The time of stroke could not exactly be determined as it occurred during sleep, so thrombolytic therapy is not licensed (maximum within 3-4.5 hr after onset). Antiplatelet agents: aspirin 80-325 mg combined with extended release dipyridamole 200 mg or clopidogrel 75 mg.\n- Antihypertensive therapy is indicated in severe hypertension. ie, systolic blood pressure =220 mm Hg or diastolic blood pressure =120 mm Hg)       or   in    those     with hypertensive   encephalopathy,   aortic dissection, acute pulmonary edema, or acute myocardial infarction.\n- Aggressive treatment of elevated blood pressure could be detrimental because of secondary reduction of perfusion in the area of ischemia, which could expand the size of the infarction.\n- Blood glucose management: Current guidelines recommend a goal glucose concentration of 140 to 180 mg/dL by insulin therapy.\n-   Statins (LDL cholesterol goal < 70 mg/dl), fibrates are added if TG remains elevated after statins (TG goal < 150 mg/dl).\n-    If carotid Doppler shows stenosis >70% carotid end-arterectomy is indicated. Endovascular carotid artery stenting is an alternative if not suitable for surgery."}, {"num": 133, "chapter": "Neuro", "front": "A 65-year-old man presented to the emergency department in a comatose state. His relatives reported a history of untreated hypertension. He had developed a sudden, severe headache followed by repeated episodes of vomiting and loss of consciousness. On examination, his vital signs were as follows: blood pressure 220/130 mmHg, pulse 58 bpm, respiratory rate 22/min, and temperature 37.2°C. Glasgow Coma Scale (GCS) was 11. Neurological examination revealed right-sided hypotonia, hyporeflexia, and an extensor plantar response. There were no signs of meningeal irritation.\n\n1. What is the most likely diagnosis?\n2. What investigations are required to confirm the diagnosis?\n3. Outline the treatment plan for this patient.", "back": "1. The most likely diagnosis is cerebrovascular accident, etiology is vascular mostly intracranial hemorrhage (ICH). The acute onset of coma, vomiting, and focal neurological deficits in the setting of markedly elevated blood pressure supports this diagnosis. CT scan brain without contrast is essential to prove the diagnosis. I. General measures e Airway protection and ventilation support if GCS <8 or if respiratory compromise is present. e Head elevation (30 degrees) to reduce intracranial pressure. e Prevention of complications such as aspiration pneumonia, deep vein thrombosis, and pressure sores.\n\nIl. Medical treatment e Blood Pressure Management:\no Current guidelines recommend reducing systolic BP to <140-160 mmHg in patients with SBP >180 mmHg, using agents such as IV labetalol or nicardipine.\no Rapid overcorrection should be avoided to prevent hypoperfusion of perihematomal brain tissue. e Seizure Control:\no Antiepileptic drugs are not routinely used unless seizures occur, but EEG monitoring is advised in comatose patients. e Management of Intracranial Hypertension:\no Osmotic therapy (mannitol or hypertonic saline) may be employed in cases of suspected raised ICP.\no Antiplatelets and anticoagulants are contraindicated\n\nITI. Surgical treatment when indicated\no Hematoma evacuation reducing mass effect s Decompressive craniectonty"}, {"num": 134, "chapter": "Neuro", "front": "A 55-year-old man presents to the emergency department reporting sudden onset of dysarthria and right arm numbness. He is notably anxious, but his symptoms had improved spontaneously by the time of arrival. He is a known diabetic on sulfonylurea therapy. On examination, blood pressure was 145/90 mmHg, pulse 86/min (regular), and neurologic examination was normal. Blood glucose was 190 mg/dL. ECG showed no abnormalities, and non-contrast CT brain was unremarkable.\n\n1. What is the most probable diagnosis?\n\n2. What are the investigations required?\n\n3. What’s your plan of treatment?", "back": "1.   The diagnosis: Type 2 diabetes, hypertension, Transient ischemic attack (TTA). 1t is an acute episode of temporary neurologic dysfunction resulting from focal cerebral ischemia not associated with permanent cerebral infarction. Investigations: Lipid profile, HbA1c, urinary albumin/creatinine ratio, urea and creatinine (for diabetic nephropathy). Opthalmoscopic examination for diabetic retinopathy or hypertensive changes. Echocardiography (TTE/TEE) can evaluate for a cardioembolic source. Carotid duplex for evidence and extent of atherosclerosis. Management plan :\n-   Correction of dyslipidemia (diet + statin with LDLc (goal <70 mg/dl), fibrates if TG high despite diet and statin :goal < 130mg/dl)\n-   Antiplatelet drug (aspirin 300mg in the 1% 2 weeks then 75 mg/dl + dipyridamole 200 mg/12 h, if aspirin allergy or intolerance: give clopidogrel 75mg/d).\n-   Better control of diabetes (Goals fasting plasama glucse 70-130 mg/dl, postprandial plasma glucose < 180 mg/dl, Hb Alc < 7%).\n-   Follow up blood pressure and control of possible hypertension (goals in diabetes with no nephropathy <130/80, if there is nephropathy goal is <125/75, ACEi or ARBs are the preferred drugs\n-   If carotid duplex revealed > 70% stenosis carotid endarterectomy or carotid artery stenting are recommended."}, {"num": 135, "chapter": "Neuro", "front": "A 67-year-old woman presents to the emergency room with sudden onset of dizziness, severe vertigo, and repeated vomiting. She also complains of numbness over the right side of the face and the left upper and lower limbs. She remains fully conscious and is able to move all limbs. On examination, BP is 160/95 mmHg, pulse 78/min, regular. Mild dysarthria is noted. There is decreased pinprick sensation on the right side of the face and on the left side of the body. Horizontal nystagmus is present on right gaze.\n\n1. What is the most likely diagnosis?\n\n2. What is the etiological cause? What are the other findings you may get in her neurological examination?\n\n3. What is the important investigation to prove your suggested diagnosis?", "back": "1. The most likely diagnosis is ischemic stroke in the vertebrobasilar system, most consistent with lateral medullary syndrome (Wallenberg syndrome) due to right posterior inferior cerebellar artery (PICA) occlusion. Diagnosis is based on the following key clinical points:\n- Crossed sensory loss: RIGHT trigeminal nerve (5 cranial nerve) and LEFT upper and lower limbs) — localizes to brainstem\n-   Vertigo, vomiting, and nystagmus — vestibular nucleus involvement\n-   Bulbar sigus (dysarthria, diminished gag) — nucleus ambiguus involvement\n-   No hemiparesis, aphasia, or cortical signs — rules out anterior circulation stroke Atherosclerosis is by far the most common cause of vertebrobasilar insufficiency, most common among patients with cardiovascular risk factors such as age (as in our case), and search for other risk factors in this case. Other findings in neurological examination: dysarthria, right sided Horner’s syndrome, right sided cerebellar ataxia and right sided pharyngeal and laryngeal paralysis. Investigations: CT brain without contrast is useful to exclude cerebellar hematoma that results in unsteadiness and requires urgent surgical intervention. MRI brain with diffusion and MRA is more sensitive to visualize early and small infarctions of the brain stem, assess the affected vascular territory, differentiate recent from old infraction.\n\n-   Convential MRI may not demonstrate an infarct for 6 hrs"}, {"num": 136, "chapter": "Neuro", "front": "A 38-year-old woman presents to the emergency department with progressive lower limb weakness. She reports flu-like illness one week ago with fever, nausea, and diarrhea, which resolved spontaneously two days prior to symptom onset. Upon waking today, she had difficulty standing and nearly fell. As the day progressed, she noticed increasing weakness in her arms. She reports NO sensory loss, headache, back pain, visual or auditory symptoms, or bowel/bladder incontinence. On examination: Temperature 37.0°C, BP 100/60 mmHg, pulse 70/min, respiratory rate 22/min, Cranial nerves are intact. Lower limb exam: hypotonia, bilateral weakness 3/5 power, areflexia, bilateral flexor plantar reflexes, normal sensation. Upper limbs: mild weakness (4/5), hypotonia, and hyporeflexia bilaterally. Investigations: CBC, electrolytes, renal, glucose, calcium, LFTs are normal. CSF shows protein 146 mg/dL, glucose 70 mg/dL, no cells. Gram stain was negative,\n\n1. What conditions should be considered in the differemtial diagnosis?\n\n2. What is the most likely diagnosis?\n\n3. What are the required investigations to diagnose this condition?\n\n4. What is the most appropriate treatment for this condition?", "back": "1. The differential diagnosis for an individual presenting with rapidly progressing flaccid quadriparesis includes:\n\nGuillain—Barré syndrome (GBS): ascending weakness, areflexia, postinfectious, CSF with albuminocytologic dissociation. Acute transverse myelitis: would present with sensory level, early bladder/bowel dysfunction, and UMN signs over time; CSF would show pleocytosis. Myasthenia gravis: typically affects cranial muscles first, diurnal fluctuation, no sensory or reflex loss, normal CSF. Toxic neuropathy (e.g. heavy metals): usually subacute or chronic; CSF usually normal.\n-   Hypokalemic periodic paralysis:        Fluctuating weakness     without areflexia; labs show low potassium.\n-   Botulism: descending paralysis, pupillary involvement, and autonomic features. The most likely diagnosis Guillain-Barre syndrome (GBS) The patient experienced acute progressive ascending paralysis. The absence of sensory loss, or sphincteric disturbance and the presence of bilateral flexor planter response. Guillain-Barre syndrome is the possible diagnosis . Investigations:\n\nNerve conduction study findings: prolonged distal motor latencies, F waves, and conduction block.\n\nCSF examination: albuminocytologic dissociation (high protein count with a low cell count). The most appropriate treatment for this condition: Immuno-modulation: plasmapharesis or intravenous immunoglobulins. Both therapies, if given early, slow the progression of the disease and hasten the recovery of lost motor function.\n\nCases with respiratory distress may require mechanical ventilation in addition to immuno-modulation."}, {"num": 137, "chapter": "Neuro", "front": "A 27-year-old woman presents to the neurology clinic with a history of recurrent headaches since adolescence. Over the past 6 months, the frequency has increased to approximately three episodes per month. Each episode is characterized by unilateral throbbing pain localized to the left temporal region, typically lasting 8—12 hours. The headache is preceded by visual symptoms described as flashing lights in the right lower visual field that begin about 45 to 60 minutes prior to pain onset and resolve spontaneously. During the headaches, she experiences photophobia, phonophobia, nausea, and occasional vomiting. Headache episodes are aggravated by physical activity and relieved by rest in a dark, quiet room. She denies fever, neck stiffness, focal neurological weakness, seizures, loss of consciousness, or visual loss. There is no history of trauma, substance use, recent travel, or systemic illness. She is otherwise healthy and takes no regular medications. On examination: Temperature 37.0°C, HR 80/min, RR 12/min, BP 120/80 mmHg. Neurological examination is completely normal including fundoscopy. No focal signs, cerebellar dysfunction, or signs of raised intracranial pressure were noted.\n\n1. What is the most likely diagnosis? Justify your diagnosis?\n\n2. What is the treatment?", "back": "1. The most likely diagnosis: Migraine with aura. This patient most likely has a primary headache disorder due to the chronic presentation and lack of fever and focal neurologic findings.\n\nCriteria to make the diagnosis of migraine: a patient must have recurrent headaches lasting hours to days with at least two of the following characteristics: aggravated by physical activity, moderate to severe intensity, pulsating quality and unilateral location.\n\nAnd at least one of the following: Nausea and/or vomiting, photophobia or phonophobia\n2. Migraine treatment involves acute (abortive) and preventive (prophylactic) therapy. Patients with frequent attacks usually require both. Measures directed toward reducing migraine triggers are also generally advisable (eg, lack of sleep, fatigue, stress, certain foods, use of vasodilators).\n\nMedical therapy ]   Acute treatment (abortive):\no First-line: Triptans (e.g., sumatriptan 50-100 mg orally at onset, may repeat after 2 hours; max 200 mg/day). All the triptans are most effective when taken early during a migraine. Limit use to <2-3 days/week to avoid rebound headache.\no   NSAIDs (e.g., naproxen), acetaminophen,\no   Treatment of nausea and vomting by                 antiemetics   (e.g., metoclopramide). @   Preventive therapy (prophylactic) (indicated if >4 attacks/month or disabling attacks):\no   Beta-blockers (e.g., propranolol), calcium channel blockers verapamil.\no   Tricyclic antidepressants (e.g., amitriptyline).\no   Anticonvulsants (e.g., topiramate, valproic acid), gabapentin, topiramate.\no   Calcitonon gene related peptide antagonist (CGRP) monoclonal antibodies (e.g., erenumab, fremanezumab): effective in reducing migraine frequency and severity, especially in patient refractory to conventional prophylaxis."}, {"num": 138, "chapter": "Neuro", "front": "56-year-old man is brought to the emergency department by a co-worker after suffering from severe headache, nausea, and vomiting over the past 2 hours. The headache was sudden in onset, as the patient was sitting at his desk. It was the first time for him to experience a headache of such severity. Shortly after headache onset, the patient became nauseous and vomited a few times before insisting to go to the ER. On examination, the patient was drowsy, with marked neck rigidity, positive Kernig's sign and Brudzinski's sign. He reported NO recent illness, head trauma, nor history of migraine. His temperature was 37°C, heart rate was 80/min, respiratory rate 14/min, and blood pressure 120/60 mm Hg. WBC, blood chemistry, and coagulation laboratory values were all within normal limits.\n\n1. What is the most likely diagnosis?\n\n2. What risk factors are associated with an increased incidence of this condition?\n\n3. What tests and/or imaging tools could be used to comfirm the diagnosis?\n\n4. What conditions shouid be included in the differential diagnosis?", "back": "1. The most likely diagnosis is Subarachneid hemorrhage (SAH). This patient's presentation of sudden onset of severe headache, nausea, vomiting, confusion and meningeal irritation signs (neck rigidity, positive Kernig's sign and positive Brudzinski's sign) in the absence of abnormal laboratory findings, is classic for SAH. Most SAHs are caused by a ruptured saccular (berry) aneurysm.\n\nRisk factors associated with an increased incidence of SAH include:\n\n-   Family history of SAH, cigarette smoking, alcohol abuse, hypertension, and estrogen deficiency.\n-   Risk factors for saccular aneurysms:\no longstanding uncontrolled hypertension\no conditions that weaken blood vessel walls (e.g., connective tissue disorders, infections)\n-   The condition may be associated with coarctation of the aorta or autosomal dominant polycystic kidney disease. Tests and/or imaging tools are: a non contrast CT scan of the brain is a sensitive diagnostic tool and detects 92% of bleeds in the subarachnoid space within the first 24 hours.\n\n-   Patients in whom there is a strong suspicion of SAH but a negative CT scan should have a lumbar puncture. CSF analysis demonstrates an increased number of red blood cells. Centrifugation of the CSF will demonstrate xanthochromia (an amber or pink hue) in the supernatant that results from the degradation of hemoglobin. Conditions that should be included in the differential diagnosis: In a patient with a history of nontraumatic sudden onset of severe headache, the differential diagnosis should include migraine, cluster headache, meningitis, encephalitis, hemorrhagic stroke and temporal arteritis."}, {"num": 139, "chapter": "Neuro", "front": "Case Presentation\n\nA 31-year-old woman presents with diminution of vision in the right eye of 2 day duration, during an episode of a common cold. The condition was associated with pain in the same eye (right) that increased with eye movements. She had a history of mild right lower limb weakness, 3 years ago, that was ignored as it seemed to resolve over time. Last month, she developed weakness in her left upper and lower limbs, with an insidious onset and regressive course. She also reported unsteadiness of her gait, which was gradually progressive over the past year. Many of her symptoms sometimes get worse after a hot bath and after physical effort. On examination, the patient is found to be afebrile and has normal vital signs. Her visual acuity is 6/60 in the right eye and 6/6 in the left eye. WBC count, erythrocyte sedimentation rate, and C-reactive protein were mnormal. Cerebrospinal fluid analysis revealed slightly elevated protein, with elevated immunoglobulin G and oligoclonal bands.\n\n1. What is the most likely diagnosis?\n\n2. What     conditions   should     be   included   in   the   differential diagnosis?\n\n3. What are the recommended investigations to diagnose this condition? -\n\n4. What is the most appropriate treatment for this condition?", "back": "L. The most likely diagnosis is Moultiple sclerosis (MS):         The patient experienced recurrent neurological deficits (muscle weakness, unsteadiness, diminished vision) not anatomically related to each other (disseminated nature) with exacerbating and remitting course. CSF shows increased protein, increased IgG and oligoclonal band. Conditions should be included in the differential diagnosis:\n\nConnective tissue disorders (SLE) Acute disseminated encephalomyelitis (ADEM) Cerebral arteritis (CNS wvasculitis) or systemic vasculitis (polyarteritis nodosa, Behcet's disease) Chronic infections (HIV) Paraneoplastic Subacute Combined Degeneration (B12 deficiency) . Imvestigations:\n\nBlood tests (CBC, renal and liver function tests, electrolyte levels, ESR, CRP, B12, folate and vitamin D, thyroid function tests, lipid panel, viral serology (anti HIV, anti HCV, HbsAg, anti-Hbs), VDRL-RPR, ANA (1/320 titer and patterns), if ANA positive ENA profile, antiphospholipid antibodies, anti-ds DNA MRI (cranial and spinal) CSF analyses (CSF protein, CSF and concurrent blood glucose, CSF albumin and IgG, CSF lactate, serum albumin and IgG) In patients with optic neuritis: VEP Visual Evoked Potential The most appropriate treatment for this condition: IV steroids reduce the duration and severity of an acute flare, but probably do not change the overall disease progression. Immunomodulatory agents as Interferon B, Ocrelizumab L.V. infusion, Natalizaumab, Glatiramer acetate S.C every day: for Relapsingremitting MS (RRMS) are dimethyl fumarate, Terifbunomide. Symptomatic therapy for depression, spasticity, urinary incontinence/ retention."}, {"num": 140, "chapter": "Neuro", "front": "A 65-year-old man presents with resting tremors affecting both hands of 1 year duration. He is accompanied by his wife, who points out that her husband has been moving much more slowly, has not been sleeping well, and has been depressed and anxious. During the interview, the patient spoke m a monotonous manner without facial expressions. On examination, vital signs: temperature 37°C, heart rate is 90/min, and blood pressure 140/85 mm Hg. His hands had a static tremor involving the fingers and wrists. He had hypertonia (lead pipe rigidity) affecting all 4 limbs, which was more proximal than distal. Deep reflexes were diminished. He had a shuffling gait without arm swinging.\n\n1. What is the most likely diagnosis?\n\n2. What comorbid conditions are associated with this condition?\n\n3. What is the most appropriate treatment for this condition?", "back": "1. The most likely diagnosis is Parkinson’s disease (PD). The patient has resting tremors, rigidity through out the movement (lead pipe), bradykinesia, loss of facial expressions, monotonous speech, shuffiing gait with absent hand swinging, depression and insomnia., Co-morbid conditions associated with Parkinson’s disease include psychiatric      conditions   such   as:   psychosis,   sleep   disturbances,   and depression and dementia (six times higher in PD patients than in the general population). In addition to physical conditions such as: cardiovascular disease, diabetes, hypertension, osteoarthritis and osteoporosis.\n\nTreatment in PD focuses on repleting depamine:\n\n-   Dopamine agonists: Levodopa is a dopamine precursor with a shorter half life. The addition of carbidopa in the levodopa preparation prevents peripheral decarboxylation and minimizes adverse effects, such as nausea and orthostasis. Long-term use of levodopa is associated with motor     fluctuations    and    dyskinesias.    Small   doses   of combined carbidopa-levodopa, such as 25/100 mg half tablet, are typically administered 2 or 3 times daily with meals.\n\n-   Dopamine agonists: stimulate dopamine receptors directly, the ergot derivative bromocriptine and non-ergot derivatives ropinirole 0.25 mg 3 times daily and pramipexole (0.125 mg 3 times daily).\n\n-   Additional agents include monoamine oxidase type B (MAO-B) inhibitors selegiline and rasagiline, reduce dopamine metabolism which     may be    neuroprotective.    Catechol      O-methyltransferase    (COMT) inhibitors (lock the peripheral enzyme responsible for dopamine degradation). Anticholinergic medications: benztropine and trihexyphenidyl result in the blockade of acetylcholine receptors. They can be helpful for the treatment of tremors and rigidity. And the antiviral drug amantadine are also useful in younger patients with tremors 100 mg 2-3 times daily.\n\n-   Surgical options include deep brain stimulation or, less frequently, pallidotomy."}, {"num": 141, "chapter": "Neuro", "front": "A 30-year-old woman presents complaining of double vision and fatigue. Her symptoms are absent in the morning but become progressively worse by the end of the day. Physical examination reveals a heart rate of 90/min and a blood pressure of 120/75 mm Hg. Ophthalmologic examination is remarkable for bilateral symmetric ptosis and intact pupillary responses bilaterally, Weakness of the muscles of the hand is evident bilaterally, but only after multiple contractions. Sensory examination is completely normal and deep tendon reflexes are intact.\n\n1. What is the most likely diagnosis?\n\n2. What tests and/or imaging tools could be used to confirm the diagnosis?\n\n3. What is the most appropriate treatment for this condition?\n\n4. What is the potential complication of this condition and how to manage?", "back": "1. The most likely diagnosis is Myasthenia gravis (MG).\no   The patient is complaining of symptoms of diplopia and fatigue that become worse by the end of the day and hand weakness after repeated contractions. No sensory changes and intact deep reflexes. The most probable diagnosis is Myasthenia gravis (MG).\n\nThe investigations are:\n\nNerve conduction velocity and EMG: repetitive nerve stimulation tests will demonstrate a characteristic decrement of evoked compound muscle action potential (CMAP) amplitude Edrophonium test: this fast acting acetylcholinesterase inhibitor will cause a transient resolution of symptoms in the myasthenic patient as more ACh is available in the cleft. Acetylcholine receptor antibodies. Computed tomography of the chest is recommended, since 15% of MG patients have an associated thymoma. The treatment: acetylcholinesterase inhibitors (pyridostigmine) inhibit the enzyme that degrades acetylcholine (acetylcholine esterase) and allow acetylcholine to build up in the neuromuscular junction. In patients with associated thymoma, thymectomy may be curative. If symptoms persist, immunosuppressive therapy is initiated, primarily with corticosteroids and immunosuppressants. New lines of treatment are now approved as Zilucoplan, Eculizumab and Rituximab The potential complication: myasthenic crisis is a serious complication characterized by severe weakness with respiratory and pharyngeal muscle paresis leading to respiratory failure. It may occur spontaneously or after physiologic stress (infection/surgery). Management consists of: Early elective intubation Withdrawal of anticholinergic medication Plasmapharesis or intravenous immunoglobulin."}, {"num": 142, "chapter": "Neuro", "front": "A 20-year-old college student presents to the clinic with fever and headache. The headache began the night before and has significantly disrupted her routine. She describes it as a severe, non-pulsating headache, exacerbated by moving her neck. She also notes that loud noises and bright lights seem to bother her much more than usual. On physical examination, her temperature is 39.1°C, pulse is 110/min, and the respiratory rate is 20/min. She is unable to touch her chin to her chest, and she experiences significant pain upon flexion of her thigh with extension of her leg. There is a macular purple rash over both legs, which she had not noticed before. Her funduscopic exam is normal, and she has no focal neurologic deficits. A lumbar puncture reveals clo
