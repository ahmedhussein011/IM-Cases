he and visual affection. He started treatment for hypertension and diabetes mellitus. Both serum prolactin and IGF-1 levels are high. Visual field showed bitemporal hemianopia.\n\n1. What is the diagnosis?\n\n2. What laboratory tests and imaging would you order to evaluate this patient?\n\n3. What is the explanation for raised prolactin level?\n\n4. What is the most preferred line of treatment?", "back": "Acromegaly (due to excess secretion of growth hormone mostly from growth hormone secreting pituitary tumor).", "cls": "3-star"}, {"num": 156, "chapter": "Endocrine", "front": "60-year-old woman complains of postural dizziness, increased sleep and constipation. Her daughter was noticed cognitive dysfunction in the form of loss of recent memory few months ago. On examination she has slightly puffy face and pallor. Her pulse is 60/min regular, BP is 130/90. Chest, heart and abdominal examination are normal, neurological examination show slow relaxation of tendon reflex. Laboratory: Hb 9.2, urea 25, creatinine 1.5 mg/dl, glucose 81 mg/dl\n\n1. What is the likely diagnosis?\n\n2.   Which investigations will support your diagnosis?\n\n3.   Give an explanation for anemia?", "back": "Hypothyroidism that manifested by sleepiness, cognitive dysfunction constipation,       mild   hypertension,     relative bradycardia and hyporeflexia.", "cls": "New"}, {"num": 157, "chapter": "Endocrine", "front": "A 34-year old woman presents with somnolence, headache, weight gain, menorrhagia. Physical examination reveals periorbital swelling, coarse hair, blood pressure 135/95, pulse 56 min and regular. Neck examination is unremarkable. Laboratory evaluation reveals the following: Free T4 0.2 ng/dl (N 4.5 — 12 ng/dl), TSH > 100 pU/ml (N 0.5-5), plasma cholesterol 280 mg/dL\n\n1. What is the probable diagnosis, explaining the present findings?\n\n2. Mention the different causes that result in this condition\n\n3. What is the treatment?", "back": "Primary hypothyroidism Periorbital swelling, coarse hair, weight gain (decreased basal metabolic rate), diastolic hypertension (increased peripheral resistance), bradycardia (decreased response to catecholamines), hypercholesterolemia and the high TSH are the classical features of hypothyroidism.", "cls": "2-star"}, {"num": 158, "chapter": "Endocrine", "front": "51 -year- old female with headache and nausea found to have a pituitary incidentaloma. CT brain revealed marked, mass-like diffuse enlargement of the pituitary gland extending and compressing the optic chiasm. Visual field testing: Normal. Laboratory investigations: TSH 150 (Normal: 0.40 - 4.50 mlIU/L), FT4: 0.1 (Normal: 0.8 - 1.8 ng/dL). Symptoms typical of hypothyroidism (fatigue, weight gain, cold intolerance, constipation, dry skin, and hair loss) were neglected for years. She was diagnosed with severe primary hypothyroidism and started levothyroxine replacement. Post treatment follow-up revealed marked regression of the size of the pituitary m the CT imaging and gradual improvement of thyroid function.\n\nLabs (Normal)                              12/2012      3/2013      9/2014\n\nTSH (0.40-4.50 mIU/L)                          150       22           1.2\n\nFT4(Normal: 0.8 - 1.8 ng/dL)                   0.1        0.9         1.6\n\n1. Given the presentation, serial imaging and lab findings, what is the correct diagnosis?                )", "back": "Longstanding primary hypothyroidism can induce massive pituitary hyperplasia, which can simulate a primary mass.", "cls": "New"}, {"num": 159, "chapter": "Endocrine", "front": "A 29-year-old woman presents with fatigue, tiredness, increase in body weight and infertility of 2 years duration. Her family history discloses a mother with type 1 diabetes mellitus. Examination revealed a pulse of 60/min, BP 130/95 and 125/90 in a visit to family doctor 1 month ago. Her thyroid functions were checked to reveal a TSH 8 mIU/L (normal range 0.4 - 4 mIU/L) and a normal FT3 and FT4.\n\n1. What’s your diagnosis?\n\n2. Explain the clinical situation and discuss the treatment policy", "back": "It is a state of subelinical hypothyroidism which could be due to an autoimmune cause if we consider the autoimmune diseases which are running in her family.", "cls": "2-star"}, {"num": 160, "chapter": "Endocrine", "front": "A 25 year-old female patient presented with palpitation, dyspnea on exertion and loss of weight in spite of good appetite over the past 2 months. She has oligomenorrhea and irregular cycle. On examination, she is irritable, looked under built (BMI 19), exophthalmos with non-pitting L.L edema, diffuse symmetrical non tender thyroid swelling, There was fine tremors in the outstretched hands. Pulse rate was 130 bpm, regular, BP 150/70 mmHg.\n\n1. What is the most likely diagnosis?\n\n2. What investigations would you require to               confirm your diagnosis?\n\n3. How you proceed for treatment?", "back": "Thyrotoxicosis due to Graves' disease.", "cls": "3-star"}, {"num": 161, "chapter": "Endocrine", "front": "A 56 year-old male patient presented to the emergency room with chest pain of one hour duration. He used to have similar episodes over the past 6 months, but with increasing frequency and severity. On examination, his BMI 19, he was apprehensive, staring, flushed and sweaty. There were bilateral and symmetrical fine tremors in his outstretched hands. Radial pulse rate was 140 bpm, irregular, Blood pressure was 170/50 mmHg. Temperature was 37.5 C. Examination of the neck showed congested pulsating neck veins with systolic expansion. There was an olive-size smooth swelling to the right of the trachea that freely moved up and down with deglutition. ECG showed AF and depression ST segment in V3, V4, V5, & V6.\n\n1. What is the most likely diagnosis? How would your diagnosis explain all the described abnormal physical signs?\n\n2. What would you expect to see on examination of his eyes?\n\n3. What investigations would you require to             confirm your diagnosis?\n\n4. Describe your immediate and subsequent treatment plans for this case?", "back": "Acute coronary syndrome as myocardial infarction or unstable angina.", "cls": "2-star"}, {"num": 162, "chapter": "Endocrine", "front": "A 65-year- old man is referred by the cardiologist because he begins to complain from repeated anginal pains associated with dyspnea on mild exertion. He is generally healthy and his family history is inconclusive. On examination he was sweaty, pulse was 104/min irregular, BP was 125/80. A diffuse thyroid swelling was palpated, with irregular surface and fine tremors in both hands. ECG revealed AF. The following drugs were prescribed: propranolol, aspirin 81 mg/d and sublingual nitrates.\n\n1. What is your diagnesis? ~\n\n2. Mention essential investigations?\n\n3. Mention briefly how to treat the thyroid state in such case?", "back": "This is a case of hyperthyroidism which usually present by atypical presentation in elderly e.g.", "cls": "2-star"}, {"num": 163, "chapter": "Endocrine", "front": "A 30 year old female patient presented to outpatient clinic by palpitation, 3 months after delivery of her last baby. On examination there was tachycardia, diffuse enlargement and tenderness of the thyroid gland. Her ESR was 80. Free T4 was high and TSH was low.\n\nWhat is your diagnosis? D=\n\nDefine this condition?\n\nHow to proceed to prove it? R\n\nHow treat this case? B", "back": "Post partum thyroiditis.", "cls": "2-star"}, {"num": 164, "chapter": "Endocrine", "front": "A 32-year-old lady was diagnosed as Graves Disease. She presented with typical symptoms which included tiredness, palpitations, eye redness, ophthalmopathy, and exopthalmos. She received carbimazole and propranolol, but there is worsening of her eye condition. She had bilateral exopthalmos, reduced vision in the left eye, double vision, pain, grittiness, lid lag and lid retraction she was referred to the ophthalmology department. At this point her medication was increased, but still her eye condition.\n\n1. Define this ophthalmopathy?\n\n2. What is the plan for eye condition?", "back": "The eye condition is thyroid-associated orbitopathy, in this case termed Graves' orbitopathy.", "cls": "New"}, {"num": 165, "chapter": "Endocrine", "front": "A 27-year-old man presents with recently discovered diabetes mellitus. On physical examination, there is increased facial fullness and weight gain, proximal muscle weakness. Abdominal examination revealed purple striae. His blood pressure 150/95, fasting blood glucose 250 mg/dl, post-prandial 385mg/dl, serum Na 150 mEg/L, K 3.3 mEq/L. White blood cell count greater than 12,000/mm.\n\n1. What do you think about the diagnosis?\n\n2. What laboratory tests and imaging would you order to reach the proper diagnosis?", "back": "Cushing’s syndrome is the most likely diagnosis because of presence of facial fullness, an increased in weight, purple striae, and proximal muscle weakness, with diabetes mellitus and hypertension and hypokalemia.", "cls": "4-star"}, {"num": 166, "chapter": "Endocrine", "front": "A 42 year old male presented with marked loss of weight, anorexia, progressive muscle weakness and newly discovered diabetes mellitus. He is a heavy cigarette smoker for the last 20 years. On examination he was plethoric, with proximal myopathy. Pulse 80/min, BP 160/100, RR 13/min, temp 37°C, ESR 100 mm/hr, s Na 131 mEg/L and K 2.9 mEq/L.\n\n1. What is your provisional diagnosis and explain?\n\n2. How to investigate your case?", "back": "Marked weight loss with very high ESR could point to malignancy.", "cls": "2-star"}, {"num": 167, "chapter": "Endocrine", "front": "A 28-year-old female patient, married, has three daughters, suffers from gradual onset of weakness, lethargy and easy fatigability. Poor appetite with loss of weight about 15 Kg in one year. No fever, no symptoms suggestive chest, abdominal, cardiac troubles. She also received treatment for hypothyroidism 8 years ago and controlled. She has normal ESR, serum Na 124 mmol/l, K 5.7 mmol/l, her fasting blood glucose 55mg/dL. and CBC shows eosinophil 8%.\n\n1. What is the possible diagnosis? What is the relation between this condition and hypothyroidism?\n2. How to reach the diagnosis?\n\n3. What is the complication?", "back": "Adrenal insufficiency (Al) is the most likely diagnosis.", "cls": "2-star"}, {"num": 168, "chapter": "Endocrine", "front": "A female patient was diagnosed as lupus nephritis. She was on 60 mg/d prednisolone, and then decreased to 15 mg/d. Three weeks ago, she developed fever, cough and expectoration. She interrupted her steroid doses, 4 days ago she suffered severe weakness, fatigue, nausea and vomiting. Physical examination: Glasgow coma score 7, BP 80/60, and no evidence of lupus activity.\n\n1. What is the diagnosis for last situation?\n2. How to treat it?", "back": "Acute adrenal insufficiency (adrenal crisis) In this case, the acute adrenal insufficiency is precipitated by sudden interruption of the dose of cortisol and infection.", "cls": "3-star"}, {"num": 169, "chapter": "Endocrine", "front": "A 26-year-old man presented with elevated blood pressure (180/110 seated). Three months ago, his blood pressure was normal. He was admitted twice in the last month due to apprehension, severe headache, palpitation and diaphoresis, flushing. These episodes had an abrupt onset and lasted 10-15 minutes.\n\n1. What do you think the patient primary problem is and explain the presentation?\n\n2. What laboratory tests and imaging would you order to evaluate this patient?", "back": "Pheochromocytoma.", "cls": "4-star"}, {"num": 170, "chapter": "Endocrine", "front": "A 47-year-old obese male (BMI 32.4 kg/m%) is suffering from burning sensation in feet, weight loss and fatigue. He noticed nocturia, polydipsia in the last month as well as cellulitis in right lower limb. Laboratory investigations showed normal complete blood picture, serum calcium and phosphorus, RBS: 350mg/dl, urine dipsticks glucose: +++, Ketones: negative, HBAlc: 11 %\n\n1. Whatis the diagnosis?\n\n2. What are the criteria for diagnosis of this disease?\n\n3. What is your plan in initial treatment of this case?", "back": "Type II diabetes mellitus.", "cls": "3-star"}, {"num": 171, "chapter": "Endocrine", "front": "A 34-year- old woman who is in her second pregnancy is seen for prenatal care at 24 weeks gestation. Her weight is 77 Kg, BMI 30 and her blood pressure is 130/80 mmHg. The patient's past obstetric history includes the spontaneous vaginal delivery of a 4.5 kg male infant at 40 weeks gestation. Her family history reveals that her mother has type 2 diabetes mellitus.\n\n1. Should this patient be screened for gestational diabetes?\n2. What tests should be done to evaluate the patient's glucose tolerance?\n3. How is the diagnosis of gestational diabetes mellitus (GDM) established?\n4. What are the management strategies of GDM?", "back": "Gestational diabetes defined as carbohydrate intolerance of varying degrees of severity with onset or first recognition during pregnancy is usually done between 24 and 28 weeks gestation when the \"diabetogenic stress\" of pregnancy is present.", "cls": "New"}, {"num": 172, "chapter": "Endocrine", "front": "A 48-year-old man with poorly controlled diabetes presented with a five-day history of facial and right eye pain, fever and blocked nose. He also suffered diffuse abdominal pain, nausea and repeated vomiting, On examination he was dehydrated, confused, and drowsy. There was acetone odor in breath and rapid deep respiration. His temperature was 39.2°C, pulse 116/minute, regular of small volume and BP 95/60. There was a swelling over the right maxilla with slight erythema, unilateral nasal obstruction with a necrotic inferior turbinate. Palatal ulceration was evident. There was right proptosis, chemosis, internal and external ophthalmoplegia. Hb 13.6 gm/dl, white cell count 20x10°/L. Random blood glucose 521 mg/dl. Blood urea 72 mg/dl, arterial PH 6.9, HCO3 12mmol/l, serum Na 135 mmol/ and urine dipsticks (ketones +++).\n\n1. What is the most likely diagnosis?\n\n2. What are the appropriate management steps?\n\n3. Enumerate another 4 life threatening infections in diabetics?", "back": "Diabetic ketoacidosis (DKA) in type 2 diabetes due to fungal infection (mucormycosis): hyperglycemia, metabolic acidosis with increased anion gap, urine is positive for ketones are the diagnostic criteria of DKA.", "cls": "2-star"}, {"num": 173, "chapter": "Endocrine", "front": "A 28 year old diabetic on insulin on awakening was found comatosed.\n\n1. What are the important points in the history?\n2. What are the important points in the examination?\n3. Mention 3 most important investigations?", "back": "Comatose diabetic patient — differential: hypoglycemia, diabetic ketoacidosis, CNS infection, stroke, or drug intoxication.", "cls": "3-star"}, {"num": 174, "chapter": "Endocrine", "front": "A 15-year-old girl presents with her mother because she had noticed marked weight loss over the past few weeks. She had also noticed that her daughter seems pale, unwell and has abdominal pain. The patient’s body mass index (BMI) is 19. An eating disorder had been excluded. The girl has not had any serious illness but the GP had seen her on a number of occasions with minor disorders such as sore throats and recurrent coughs and colds. On questioning the girl further, the girl tells that she has been feeling really thirsty recently and passes lots of urine, even getting up at night a few times to go to the toilet.\n\n1. What is the probable diagnosis?\n2. What investigations must be ordered now?\n\n3. What should the GP be concerned about long term follow-up of the patient?", "back": "Diagnosis: -   Typel diabetes mellitus, ketoacidosis.", "cls": "New"}, {"num": 175, "chapter": "Endocrine", "front": "A 15-year-old boy presented to the ER with abdominal pain, repeated vomiting not responding to antiemetic drugs for the last 2 days. On examination he was conscious, irritable, dehydrated, his pulse was 102/min regular, BP was 100/60. His mother noticed him with polyuria and polydipsia and bed wetting in last week.\n\n1.     What is your provisional diagnosis and how to prove it?\n2. What is the precipitating factor of this condition?\n3. How to manage this condition?", "back": "Diabetic ketoacidosis which is the classic initial presentation in type 1 diabetes (abdominal pain, vomiting, dehydration, hypotension, recent polyuria, polydipsia and bed wetting) a medical emergency that requires prompt recognition and management.", "cls": "4-star"}, {"num": 176, "chapter": "Endocrine", "front": "A 38-year-old female presents with recurrent vulval candidiasis together with polyuria. She is a smoker of 12 cigarettes per day. She has gained approximately 20 kg in weight since the birth of her last child five years ago. During this pregnancy she recalls that she received insulin for approximately four months although this was discontinued after the birth of her daughter who is quite well. She also has two older children who are well although she did not receive insulin during those pregnancies. There is a strong family history of coronary artery disease; her father and paternal uncle both died in their fourties of heart disease. Her mother has diabetes and takes thyroxine for a thyroid problem., On examination she weighs 90 kg with a body mass index of 36.5 kg/m*. Her 82/min pulse, 82 /min and 140/95 mmHg B.P. Otherwise examination of the heart, chest and abdomen is unremarkable.\n\nFundal examination reveals nonproliferative diabetic retinopathy. There are no abnormalities of sensation in the feet or hands. Peripheral pulses are all normal,\n\nInvestigations reveal: Fasting plasma glucose 199 mg/dl, HbAlc 8.4%, serum urea 35 mg/dl (20-40), serum creatinine 1 mg/dl, serum alkaline phosphatase, AST and ALT and TSH are in the normal ranges, cholesterol 270 mg/dl, HDL 37 mg/dl and fasting serum triglyceride 268 mg/dl.\n\n1. What are the goals for glycemic control?\n\n2. Give a plan to reach these glycemic targets, give advantages or disadvantages of the used anti-diabetic agents?\n3. What are other medications should this patient receive?", "back": "Type 2 diabetes mellitus with metabolic syndrome (dyslipidemia, hypertension, obesity).", "cls": "3-star"}, {"num": 177, "chapter": "Endocrine", "front": "A 50-year-old male presented with edema of the lower limbs. He is diabetic on metformin (500 mg twice daily) and glibenclamide (5 mg once daily) for 8 years. There was burning sensation in feet, more severe at night. The patient reported that he was not able to keep the legs under the cover as the cover hurts his legs. On examination the patient is lying comfortably flat in bed, BP was 170/110 mmHg, pulse 88/min and regular. Hyperthesia in both feet on LL examination. Fundus examination showed microaneurysms and soft exudates, His fasting blood sugar was 244 mg/dl, his creatinine was 2.7 mg/dl Hb 7.3 gm/dl s cholesterol 275 mg/dl, HbAlc 10.3% , urine is +++ for protein. Abdominal sonography revealed normal sized kidneys with grade one echogenicity.\n\n1. What is the likely diagnosis? Explain the different findings?\n\n2. What other investigations you would like to order?\n3. How would you treat him?", "back": "Type 2 diabetes mellitus with hypertension (hypertension is common in advanced diabetic nephropathy and accelerates the deterioration of renal functions) o The patient has the three microvascular complications: preproliferative diabetic retinopathy, CKD (LL edema, urine protein +++, elevated creatinine and echogenic kidney by sonar and…", "cls": "3-star"}, {"num": 178, "chapter": "Endocrine", "front": "An obese middle aged man presented to the clinic with a fasting blood sugar of 115 mg/ml and a 2 hours post-prandial of 186 mg/ml. BMI 34kg/m?2.\n\n1. Define his glycemic state?\n2. What are the complications of this condition?\n\n3. What are the lines of management at this phase?", "back": "Prediabetes (impaired fasting glucose / impaired glucose tolerance).", "cls": "3-star"}, {"num": 179, "chapter": "Endocrine", "front": "A 38-year old nurse presents in a stuporous state, the blood glucose is 20 mg/dl. Additional blood is drawn and the patient is quickly resuscitated with intravenous glucose. History of recurrent attacks of sweating, drowsiness relieved by eating chocolate together with weight gain. Further testing on the saved serum reveals the following: serum insulin 45mU/ml (normal < 22}, Cpeptide 4.2 ng/ml (N 0.5-2) and proinsulin 0.6 ng/ml (N 0-0.2). A sulphonylurea drugs screen was negative.\n\n1. What is the most likely diagnosis? (discuss DD)\n2. Mention further investigations needed?\n\n3. Mention the treatment of choice for this patient?", "back": "Fasting (hyperinsuinemic) hypoglycemia due to insulinoma -    The elevated C-peptide and proinsulin levels, hypoglycemia either insulinoma or exogenous sulophonylurea intake especially she is a nurse.", "cls": "3-star"}, {"num": 180, "chapter": "Endocrine", "front": "A 56 year old female patient presented for preoperative assessment for repair of a paraumbalical hernia, she gave history of hypertension for 3 years on medications. Her BMI was 43, BP 140/100, pulse 60/min regular, Plain x-ray chest and heart showed increased cardiothoracic ratio and ECG showed low voltage and sinus bradycardia.\n\n1. Explain and list the possibilities of the different data in this patient?\n\n2. What are other investigations you may need in this patient?", "back": "This patient is morbidly obese with BMI more than 40, hypertensive uncontrolled.", "cls": "2-star"}, {"num": 181, "chapter": "Endocrine", "front": "A 45 year old man who has been generally healthy, on his annual routine medical checkup, calcium was 12 mg/dl (nl 8.6-10.2 mg/dl) and phosphorus 2.2mg/dl (3-4.5 mg/dl).\n\n1. What is the most likely diagnosis?\n\n2. What symptoms and signs might the patient have had if questions were asked in a focused manner?\n\n3. What is the appropriate laboratory and radiclogy work up for this patient?\n\n4. What is the appropriate treatment of this asymptomatic patient?", "back": "The association of hypercalcemia and hypophosphatemia is most likely due to primary hyperparathyroidism.", "cls": "2-star"}, {"num": 182, "chapter": "Endocrine", "front": "A 23-year-old woman presented with concerns about intermittent numbness of her extremities and generalized bone aches. She reported having had an episode where she “lost control” of her right leg and fell. Her total serum calcium level was 7.5 mg/dl (8.6-10.2mg/dl), serum phosphours 1.9 mg/dl (3- 4.5 mg/dl), and alkaline phosphatase 350 IU/L (44-147 IU/L).\n\nWhat is the most likely diagnosis? e\n\nMention common causes of hypocalcemia and DD?\n\nWhat are other recommended investigations? A\n\nHow to treat this condition? I", "back": "Vit D deficiency (osteomalacia) because of hypocalcemia, hypophosphatemia and elevated serum alkaline phosphatase.", "cls": "2-star"}, {"num": 183, "chapter": "Endocrine", "front": "A 37-year-old woman presented with symptoms of fatigue and weakness in all extremities. Clinical evaluation revealed brisk deep tendon reflexes and positive Chvostek's and Trousseau's signs. The serum calcium level was 6.7 mg/dL (8.0 to 10.6 mg/dL) and the phosphorus level was 6.2 mg/dL (2.3 to 5.0 mg/dL), creatinine 1 mg/dl. Computed tomography of the head showed extensive bilateral symmetrical calcification of basal ganglia and dentate nucleus in the cerebellum and centrum semiovale.\n\nWhat is the cause of hypocalcemia in this case? Mention other clinical pictures of hypocalcemia?\n\nWhat other investigation needed in this case? O ol\n\nWhat is the treatment?", "back": "Hypoparathyroidism (low serum calcium and high phosphorus level with normal renal function).", "cls": "2-star"}, {"num": 184, "chapter": "Endocrine", "front": "A 17-year-old male is investigated for short stature. He has a previous diagnosis of slipped femoral epiphysis diagnosed at the age of 11, He presented with this disorder at this age with pain in the hip. This was treated by the orthopaedic surgeons with nonsurgical containment of the femoral head in the acetabulum using casts. However, his younger brother has also recently been diagnosed with bilateral slipped femoral capital epiphysis and is being treated by the orthopaedic surgeons at the age of 12. There is nothing else of note in family history and his progress at school and development are otherwise fine. On examination he is on the 12 per centile for height, a BMI of 30 and has normal pubertal development. His blood pressure is 110/70 mmHg and he has pulse 90 beat min. No abnormalities are noted on examination of the chest, heart and abdomen.\n\nInvestigations reveal: CBC, serum sodium, serum potassium, creatinine are normal. Serum Calcium 8 mg/dl ((8.6-10.2 mg/dl), serum phosphate 5.6 mg/dl (3-4.5 mg/dl), PTH 16 pmol/L (0.9-5.4pmol/L).\n\n1. What is the most likely explanation of this boy's presentation?\n\n2. What are the diagnostic tests?", "back": "Pseudohypoparathyroidism.", "cls": "2-star"}, {"num": 185, "chapter": "Endocrine", "front": "A 26-year-old female presents with a three month history of weight loss and general lethargy. She has a five year history of Type 1 diabetes for which she has been treated with basal bolus insulin consisting of short acting insulin thrice daily and long acting insulin in the evenings. Commensurate with her weight loss of 5 kg over the last three months she has noticed that she has recently encountered more hypoglycemic events and has reduced her insulin requirements from 60 units per day to 38 units daily. She takes no medication other than the oral contraceptive pill. She is a non-smoker. On examination she has a BMI of 21.2 kg/m? and appears comfortable. Her pulse is 68 beats per minute regular and her blood pressure is 110/70 mmHg. There are no specific abnormalities of the chest, heart or abdomen but she has a slight purplish-yellow, 2-3 cm nontender maculopapular rash on both shins. Investigations reveal normal urine analysis, hemoglobin, white cell count, serum sodium and plasma urea. Random glucose 180 mg/dl, HbAlc 6.7%, serum potassium 5.7 mmol/L (3.5-4.9mmol/L).\n\n1. What is the most appropriate explanation for the new symptoms?\n\n2. Give only one investigation to reach the diagnosis?\n\n3. Mention the differential diagnoses of this patient?", "back": "APS type 2 (autoimmune polyglandular syndrome) should be considered.", "cls": "3-star"}, {"num": 186, "chapter": "Endocrine", "front": "A 32-year old woman was diagnosed as having type 1 diabetes mellitus at age 20 y. She currently has abdominal discomfort and 3-4 bowel movements each day, noted that eliminating wheat bread from her diet reduced her stool frequency, her menses are normal. Physical examination is normal except for pallor, vitiligo in the forehead and both hands. Hb: 8 g/dl\n\n1. What is the probable diagnosis? Explain your diagnosis.\n2. Give the required investigations to confirm your answer?\n\n3. What are the main lines for treatment and follow up?", "back": "Celiac disease (gluten sensitive enteropathy).", "cls": "2-star"}, {"num": 187, "chapter": "Endocrine", "front": "16-year-old girl presented with short stature noticed since 10 years of age along with lack of puberty. She had normal childhood, without any history of failure to thrive, head injury or polyuria. Examination revealed significant short stature and cubitus valgus. Bone age was of 10 years. Sexual maturity rating was pre-pubertal. Ultrasonography revealed infantile uterus with lack of visualization of ovaries.\n\n1. What is your diagnesis and why?\n\n2. What are investigations needed to prove your diagnosis?\n\n3. How to treat the condition?", "back": "Turner syndrome.", "cls": "New"}, {"num": 188, "chapter": "Endocrine", "front": "A 22 years old female with elevated blood glucose levels detected during a routine health check-up. She reports no symptoms of hyperglycemia, such as increased thirst or urination. She has a strong family history of diabetes, which affected her mother and maternal grandmother. Both were diagnosed with diabetes at a young age. She is otherwise healthy, with a normal body mass index (BMI). Laboratory Results:\n\n-   Fasting Plasma Glucose: 140 mg/dL\n-   Hemoglobin Alc (HbAlc): 8.5%\n-   Autoantibody Tests: Negative for glutamic acid decarboxylase (GAD) and insulinoma-associated antigen 2 (I1A-2) antibodies\n\n1. Based on the case scenario what is your diagnosis?\n\n2. How would you approach treatment for her, considering her age, family history, and laboratory results, and what lifestyle? modifications would you recommend?", "back": "Diagnosis of Maturity-Onset Diabetes of the Young (MODY) is suspected due to the following factors: Young female 22 years old diagnosed diabetes mellitus with strong family history of diabetes, this is characteristic of MODY that has an autosomal dominant pattern of inheritance.", "cls": "Unclassified"}, {"num": 189, "chapter": "Endocrine", "front": "A 62-year-old female presents to the outpatient clinic with right wrist pain and swelling following a fall on an outstretched hand in the garage at home. This patient has a past medical history of hypertension, dyslipidemia, bronchial asthma and vertebral bone fracture. She is menopausal since 50 years of age. The patient is currently taking lisinopril, atorvastatin , inhaled corticosteroids for her asthma and epidural steroid injections for lower back pain.\n\nOn physical examination: The patient exhibits a stooped posture characterized by forward flexion of the thoracic spine, forward head position. The right wrist is swollen and hurts to move. The patient was sent to the hospital to get an X-ray of the right hand, which revealed Colles’ fracture (distal radius) on the right hand. The blood tests were normal in this patient except for low levels of Vitamin D. The patient was also asked to get a DEXA scan, which revealed a T score lumbar spine -2.9, T score hips -2.\n\n1. What do you think about diagnosis?\n2. What are the risk factors for fractures in this patient?\n\n3. Outline the management.", "back": "Postmenopausal female with prolonged corticosteroid uses and history of vertebral fractures presenting by recent Colles’ fracture suggests this patient has osteoporosis.", "cls": "Unclassified"}, {"num": 190, "chapter": "Endocrine", "front": "A 34-year-old man presents with resistant hypertension despite taking 3 antihypertensives. He also complains of fatigue and muscle cramps. Blood pressure is 170/100 mmHg, serum potassium: 2.9 mmol/L, plasma aldosterone concentration (PAC): High, plasma renin activity (PRA): low, aldosterone-to-renin ratio (ARR): elevated\n\n1- What is the most likely diagnosis? Why?\n\n2- What is the differential diagnesis of hypertension with hypokalemia? 3- What imaging is recommended to localize the lesion?", "back": "Conn’s syndrome (primary hyperaldosteronism) due to autonomous aldosterone secretion, presenting with resistant hypertension and hypokalemia.", "cls": "Unclassified"}, {"num": 191, "chapter": "Endocrine", "front": "A 35-year-old female presents with a right-sided thyroid nodule discovered incidentally during a routine check-up. She is clinically euthyroid. Ultrasound findings: Solid, hypoechoic nodule measuring 1.4 cm, irregular margins,     microcalcifications   present,   no        significant      cervical lymphadenopathy\n\n1. What is the risk stratification of this nodule?\n\n2. What is the next best step in management?\n\n3. If cytology reveals Bethesda Category V, what does this imply?", "back": "High-risk thyroid nodule (Bethesda V on FNA — suspicious for malignancy).", "cls": "Unclassified"}, {"num": 192, "chapter": "Endocrine", "front": "A 25 years old female reports a several-week history of polydipsia and polyuria. She states that she is drinking large amounts of water throughout the day and night, and is urinating frequently. She has to wake up several times at night to pass large amounts of urine. She has no significant medical history and is not taking any medications. Vital signs are normal, physical examination is unremarkable. Laboratory results: Urine Osmolality: Low (100 mOsm/kg), serum Osmolality: High (300 mOsm/kg), serum Sodium; Elevated (150 mmol/L)\n\n1. What is the most likely diagnosis for her condition, considering her symptoms and laboratory results?\n\n2. What treatment options would you consider for her, and how would you monitor her response to treatment?", "back": "Based on the patient symptoms and laboratory results, the most likely diagnosis is Diabetes Insipidus (IDI).", "cls": "Unclassified"}, {"num": 193, "chapter": "Endocrine", "front": "A 9 years old girl presents to the outpatient clinic. Her parents have noticed that she is significantly shorter than her peers. They report that her growth rate has slowed down over the past few years. Her medical history is unremarkable, and she has no known chronic illnesses.\n\nPhysical Examination: height: 115 cm (below the 3rd percentile for age), weight: 20 kg (proportionate to height), pubertal status: prepubertal, physical examination: Otherwise unremarkable.\n\n1. What are some potential differential diagnoses for patient’s short stature?\n\n2. When evaluating this patient with short stature, what are investigations should be considered?\n\n3. Let's assume that further evaluation reveals that Growth Hormone Stimulation Test: peak growth hormone level: 3 ng/mL (abnormal response). What treatment options would you consider?", "back": "Differential Diagnosis of short stature in this patient: -   Growth Hormone Deficiency -   Hypothyroidism -   Turner Syndrome -   Constitutional Growth Delay -   Other genetic or chronic conditions.", "cls": "Unclassified"}, {"num": 194, "chapter": "Endocrine", "front": "A male patient 42 years old, presented to the clinic seeking for blood sugar control. He has diabetes mellitus since 2 years, presented with rapid onset of mild polyuria, polydipsia, mouth dryness, and fatigue. The patient did not report weight loss, nausea, vomiting, abdominal pain, or dizziness. Physical examination was unremarkable. His blood pressure was 125/80, BMI 24, no signs suggestive of insulin resistance. The patient has weak positive family history of diabetes (one of the elder aunts was diabetic) and has negative consanguinity. On lab assessment his random blood sugar was 268 mg/dl, and HbA1C was 9.2%. Urine test showed glucosuria, and was negative for ketones. Lipid profile, kidney functions, electrolytes, and complete blood count were normal. He was advised to follow low carb balanced diet, and treatment was initiated with a fixed dose combination of metformin and vildagliptin. Three months later; glimepiride was added for further blood sugar control and the dose was upgraded from 1 mg to 4 mg daily over 1 year. The patient symptoms improved but his blood sugar was not on targets and HbA1C remained between 8-9% over the treatment course. In the last 3 months the fasting blood sugar was persistently elevated, ranging from 250- 300 mg/dl most of the days and his HbA1C increased to 10.4%.\n\nHow can you categorize the type of diabetes of this patient? A\n\nWhat are the criteria of late onset diabetes in adults?\n\nWhat is the suggested work up?\n\nWhat are your recommendations for the treatment plan?", "back": "This patient was empirically managed as T2 DM (most probably based on the age criteria alone), with inadequate control on oral hypoglycemic agents over 2 years and progressive increase in glycemic parameters.", "cls": "Unclassified"}, {"num": 195, "chapter": "Endocrine", "front": "A 30 year old female patient presents with hypercalcemia, with elevated serum parathormone (PTH), low serum phosphorus. A sestamibi scan was consistent with multifocal primary hyperparathyroidism. The patient has a history of left laparoscopic adrenalectomy 2 years ago, due to a diagnosis of pheochromocytoma. The patient has an elder sibling who had undergone parathyroid removal (surgical removal of 3 and a half gland) due to a similar presentation of multifocal primary hyperparathyroidism.\n\n1. What is the familial disease that should be suspected in this case?\n\n2. What is the workup that should be done?\n\n3. Any further treatment recommended?", "back": "Multiple Endocrine Neoplasia 2 (MEN 2) -   Pheochromocytoma -   Associated with primary hyperparathyroidism -   Similar condition in family member.", "cls": "Unclassified"}, {"num": 196, "chapter": "Endocrine", "front": "A 25 years old girl, presented to the endocrinology clinic with excessive hair growth on the chin, the upper and lower lips. She described the hair as coarse, thick, and dark in color. She had also coarse thick hair on the upper chest and both thighs. The patient uses mechanical methods for removing the hair on the chest and thighs and had repeated cessions of LASER therapy for the facial hair with recurrence. She had menarche at the age of 13 years, after a period of menstrual irregularities for 4 years after menarche, the menses started to be regular, and she used to have menstruation on almost regular basis every 20-21 days. The initial assessment showed a high normal blood pressure of 135/85, BMI of 28, with mild dark pigmentations on the nap of the neck. Hirsutism could not be assessed because of recent hair removal. Lab assessment showed a FBS of 108 mg/dl, total cholesterol 202 mg/dl, LDL-C 124 mg/dl, HDL, 36 mg/dl, and triglycerides 210 mg/dl. Her fasting total testosterone was 2.8 ng/dl (normal 0.5-2.4 ng/dl), which is equivalent to 80.8 ng/dl (normal 15 to 70 ng/dl), and DHEA was 436 ug/dl (normal 45-380 ug/dl). The patient denied intake of any regular medications and her family history was positive for type 2 diabetes mellitus with negative consanguinity.\n\n1. What are the other items im history and physical examination would you like to check for?\n\n2. What is the differential diagnosis? State the most likely diagnosis.\n\n3. What are the treatment options?", "back": "Polycystic ovary syndrome (PCOS).", "cls": "Unclassified"}, {"num": 197, "chapter": "Hematology", "front": "A 69-year-old woman was admitted to the hospital due to fatigue over the past several months. She claimed that she had been healthy her entire life. Her current problems began about 3 months ago when she noticed decreased appetite and fatigue, which was progressive. She denies bleeding from any orifice. Physical examination revealed pallor of mucous membranes, the tongue is red glazed, angular stomatitis, and the nails are flat. The blood picture showed HB 6.0 g/dl, HCT 18.2 % (normal 41%-53%), MCV 69 fL, platelets 600 x10%/dl, WBC 5 x10%/dl (normal differential count).\n\n1. What is the most probable diagnosis?\n\n2. What would be your first diagnostic step in evaluating this patient's anemia?\n\n3. What are the major morphologic classifications of anemia based on RBC volume? Give three examples of each.", "back": "Severe iron deficiency anemia (IDA).", "cls": "3-star"}, {"num": 198, "chapter": "Hematology", "front": "A 26-year-old farmer was initially admitted to the hospital complaining of worsening fatigue. Physical examination was unremarkable apart from signs of anemia. Occult blood in stool was positive. Stool culture showed no pathogen. On his admission, anemia was diagnosed [HCT 15.6%, Hb: 4.8 g/dL, MCV: 62.9 fI(78-100 f1)] along with eosinophilia [Eosinophils: 10% (1%-6%), WBC: 9.02x10%dl1]. Abdominal ultrasonography and colonoscopy were normal. Upper GI endoscopy showed multiple mucosal erosions with slow oozing of blood and several small slender reddish worms in the duodenum.\n\n1. What is the most likely diagnosis?\n\n2, What is the treatment?", "back": "Iron deficiency anemia with eosinophilia due to parasitic infestation (hookworm, Ancylostoma duodenale).", "cls": "4-star"}, {"num": 199, "chapter": "Hematology", "front": "A 70-year-old woman presented with progressive weakness and fatigue. The symptoms had begun about a month earlier, and she no longer felt well enough to do her housework or take her daily walk. Although her breathing was normal at rest, she was too short of breath to walk more than two or three blocks.\n\nHer physical examination showed a sore tongue and tachycardia at rest. The results of the complete blood cell count, hemoglobin, 7.4 gm/dl; RBCs 2.8 10%/d1, MCV 103 fl, WBC 2,9 x 10%/dl (48% neutrophils, 43% lymphocytes, 8% monocytes, 1% eosinophils); and platelets, 62 x 10°/dl and serum LDH 810 U/L (200-480 U/L)\n\n1. Comment on CBC and what is the most likely diagnosis?\n2. What is the type of anemia?\n3. Mention the investigations required for this anemia.", "back": "The blood picture showed pancytopenia with megaloblastic change (low RBCs, leucocytes, and platelet counts).", "cls": "3-star"}, {"num": 200, "chapter": "Hematology", "front": "An 18-year-old boy was referred to the hospital, presenting with vomiting and crampy right upper abdominal pain for two days. These were associated with dark-colored urine and pallor. The condition was recurrent, infrequently from the age of 4 years, mainly after infection. He had received his first blood transfusion at that time,\n\nOn admission, physical examination revealed pallor, jaundice, and splenomegaly. Results of laboratory investigations showed a hemoglobin level of 7.8 g/dl, WBC 6 x 10%dl, RBC 2.9 x 10°/dl, and platelets 342 x 10%/dl, reticulocytosis of 10% and Heinz bodies in peripheral blood. His family history revealed that his uncle had a similar condition.\n\nWhat is the most likely type of hemolytic anemia? Lol L\n\nWhat are the trigger factors for this anemia? What are the investigations needed? What is the treatment?", "back": "G6PD (glucose-6-phosphate dehydrogenase) deficiency — hemolytic anemia.", "cls": "4-star"}, {"num": 201, "chapter": "Hematology", "front": "A 15-year-old female came to the outpatient clinic with a history of recurrent jaundice for the last 6 months, with episodes of bony and abdominal pains associated with fever. She presented with bony aches, received meperidine 75 mg IM 1 hour after she came into the emergency room, and every 3 hours thereafter. She reported minimal pain relief after receiving the medication. On clinical examination, there was jaundice. Her hemoglobin was 7.3 g/dl, total WBC 10 x 10%dl, and the reticulocyte count was 5%. ESR 23 mm in the Ist hour. Serum total bilirubin was 4 mg/dl, and direct bilirubin was 1.2 mg/dl. Her family history reveals positive consanguinity. Her brother and sister also have a similar condition,\n\n1. What is the most likely diagnosis? Give your justifications?\n\n2. How can you confirm your diagnosis?\n\n3. Mention three complications of this type of anemia.", "back": "Chronic hemolytic anemia in a 15-year-old female with severe bony aches that needed pain medication.", "cls": "3-star"}, {"num": 202, "chapter": "Hematology", "front": "A 36-year-old woman developed progressive fatigue over ten days, exertional dyspnea, dark urine, and jaundice. On examination, there was splenomegaly. Laboratory studies showed a drop in hemoglobin from 14.7 to 6.6 g/dl over 4 days, markedly elevated lactate dehydrogenase, indirect bilirubin, and reticulocyte count, and a low haptoglobin level.\n\n1. What is the most likely diagnosis, and mention its causes?\n\n2. How can you confirm the type of anemia?\n\n3. What is the treatment?", "back": "Hemolytic anemia due to the presence of laboratory results of hemolysis.", "cls": "4-star"}, {"num": 203, "chapter": "Hematology", "front": "A 22-year-old man came to the outpatient clinic with general fatigue and a bleeding tendency from the gums for two months. He developed a fever last week. On physical examination, temperature 38°C, purpuric eruptions were distributed all over the body. Abdominal examination showed no evidence of organomegaly or generalized lymphadenopathy. Hemoglobin was 5.4 g/dl, RBCs 1.9 x 10%dl, TLC 2x 10° /dl, and platelets 25x 10%/dl at that time. He started folic acid and ferrous sulfate with no improvement. Then, he came to a hematologist, and bone marrow aspiration and biopsy were performed. The result was a decrease in bone marrow cellularity and no evidence of abnormal cells. The reticulocyte is 0.2%.\n\n1. What is the most likely diagnosis? Explain and justify your diagnosis.\n\n2. What are the causes of pancytopenia?\n\n3. How do you treat this case?", "back": "Mostly aplastic anemia.", "cls": "4-star"}, {"num": 204, "chapter": "Hematology", "front": "A 62-year-old male attends a general practitioner’s clinic with a 4-week history of back pain, tiredness, and lethargy. The patient's relative informs that he has had poor concentration during the last two weeks. His physical examination showed pale conjunctivae and tenderness to deep palpation over his vertebrae (T4-T6). Initial investigations revealed normochromic normocytic anemia with Hb 8.4g/dl, raised ESR (>140 mm/hr), and total serum protein level was elevated with a normal albumin level. Serum creatinine was 1.8mg/dl. Total serum calcium was elevated. B2- microglobulin was elevated. Thoracic spine films showed osteolytic lesions in T4 and T5.\n\nWhat is the probable diagnosis? el o\n\nWhat further investigations would be indicated for the diagnosis? What is the most likely metabolic abnormality present? Mention the possible causes of raised serum creatinine in this patient,", "back": "Multiple myeloma.", "cls": "2-star"}, {"num": 205, "chapter": "Hematology", "front": "A 68-year-old man presents with fatigue and generalized weakness for 4 months. He has a history of recurrent pneumonia and night sweats. By Examination, He has an enlarged spleen and generalized lymphadenopathy. His blood count shows the following: Hb 10.5 g/dL, the RBCs normochromic normocytic, WBC 65.5 x 10%/dl (90% mature lymphocytes {smudge cells}) with a normal platelet count.\n\nWhat is the most likely diagnosis? s\n\nWhat is the next step to confirm the diagnosis? A\n\nWhy would he have recurrent infections?\n\nIf he suddenly developed anemia and jaundice, what would be the most likely explanation? What investigations would you carry out?", "back": "Lymphoproliferative disorders, mostly chronic lymphocytic leukaemia (CLL).", "cls": "4-star"}, {"num": 206, "chapter": "Hematology", "front": "A 46-year-old man presents to the hospital with a history of fever, fatigue, early satiety, and a feeling of fullness in his left side for 4 months. No recent history of infections or bleeding. On examination, there was an enlarged spleen. A CBC shows: Hb 11.5 g/dL, WBC     80.8    x   10%dl    with    differential:   myeloblasts,   myelocytes, metamyelocytes (early WBC forms) and basophilia. His platelet count is 600x 10°/d1.\n\n1. What is the most likely diagnosis?\n\n2. How to confirm the diagnosis?\n\n3. What is the treatment of choice for this disease?", "back": "The presence of splenomegaly with characteristic changes in CBC makes the diagnosis most probably chronic myeloid leukemia (CML).", "cls": "3-star"}, {"num": 207, "chapter": "Hematology", "front": "A 27-year-oldwoman presents with attacks of epistaxis and heavy menstrual bleeding. She denies any history of drug intake. She also mentioned no history of fever or weight loss. The examination revealed scattered petechiae over the whole body and bruises on both left and right lower limbs. Petechial hemorrhages were also noted on the palate. There was no hepatosplenomegaly. A full blood count reveals a platelet count of < 10 x 10%/uL, WBC 4.5x10°/L and Hb 9.5 g/dL,MCV: 65 fL. Normal reticulocytic count and LDH, Normal PT and PTT.\n\n1. What is the most probable diagnosis?\n\n2. What is the differential diagnosis?\n\n3. Describe a peripheral blood and bone marrow picture of the most probable diagnosis, and mention the investigations required for her?\n\n4. What is the treatment?", "back": "Immune thrombocytopenia (ITP) is likely.", "cls": "4-star"}, {"num": 208, "chapter": "Hematology", "front": "A 29-year-old woman presents to the emergency department with confusion. She was well until 3 days ago, when she developed fever, dark colored urine, and rash on her legs. On examination: her conscious level (GCS 13/15), with petechiae over both legs. Hb is 7g/dl, MCV 85 fL, WBCs 11 x 10°/dl, with a normal differential, Platelets 10 x 10%L. Peripheral blood smear showed severe thrombocytopenia and schistocytes (fragmented red blood cells). An increased reticulocyte counts, elevated indirect bilirubin and LDH. PT and PTT are normal\n\n1. What is the most likely diagnosis?\n2. What is the Differential diagnosis?\n\n3. What is the main line of treatment of such case?", "back": "In the context of a confused patient, fever, hemolytic anemia, thrombocytopenia, and blood film revealed fragmented RBCs, acquired Thrombotic Thrombocytopenic Purpura (aTTP) is most likely the diagnosis.", "cls": "2-star"}, {"num": 209, "chapter": "Hematology", "front": "A 69-year-old patient presents with a headache and peripheral numbness. Two years ago, he developed deep venous thrombosis of his right leg after cholecystectomy. He was treated with warfarin for three months with good recovery. On examination, there were plethoric facies and splenomegaly. No manifestations of chronic liver disease. The rest of the examination is normal,\n\nInvestigations show: Hb 19.5g/dl, a peripheral blood film shows numerous RBCs, no abnormal or immature cells are seen, WBCs: 16.6 x 10%/dl, platelets 550 x 10%/dl, ESR was 3, uric acid 8.4 mg/dl.\n\n1. What is the underlying diagnosis? Define this condition?\n\n2. What are the following investigations you can ask for?\n\n3. How will you treat this patient?", "back": "Polycythemia vera (PV).", "cls": "2-star"}, {"num": 210, "chapter": "Hematology", "front": "A 19-year-old Egyptian female patient from El Menia presents for evaluation of anemia. She is 7 months pregnant. There is no history of bleeding or episodic bone pain. Physical examination reveals no hepatosplenomegaly or lymphadenopathy. The complete blood count (CBC) shows a leukocyte countof 5,400/ul. hemoglobin 8.8 g/dl with MCV 62.7 FL and platelet count 251,000/ul. Her ferritin level is 200ng/dl. No previous history of blood transfusion, but there is a history of repeated oral iron intake by herself due to mild anemia since childhood. There is positive consanguinity.\n\n1. What would support a diagnosis of beta thalassemia trait rather than simple iron deficiency?\n\n2. What is her possible diagnosis if her HB electrophoresis and iron profilewere normal?\n\n3. Is there a simple index to differentiate between iron deficiency andthalassemia?", "back": "This case represents the classic presentation of the thalassemia trait.", "cls": "Unclassified"}, {"num": 211, "chapter": "Hematology", "front": "A 31-year-old woman from El Wadi El Gedid governorate was admitted to thehospital with diffuse lower back pain, as well as right shoulder and knee pain, The patient reports several similar episodes in the past. On physical exam, there is decreased range of motion in the affected joints due to pain, with no obvious swelling. Laboratory tests show a hemoglobin level of 7.7 g/dL, a mean corpuscular volume (MCYV) of 85 fL, and normal white blood cell and platelet counts. Her peripheral blood smear shows a few sickled red blood cells(RBCs) and some basophilic RBC inchysions.\n\n1. What      is   your    provisional   diagnosis?        What    are   the recommended investigations?\n2. What     do    her    RBC   inclusions   refer   to?    What    are its managementimplications?", "back": "Sickle cell disease.", "cls": "Unclassified"}, {"num": 212, "chapter": "Hematology", "front": "An 18-year-old male, was diagnosed at the age of 1 year with transfusiondependent (TDT) P-thalassemia major. He has been on regular blood transfusions every 3—4 weeks since infancy. Presenting complaints are fatigue and exertion dyspnea, palpitations, poor growth, delayedpuberty, and Occasional joint pain. Physical Exam: pale, mildly jaundiced, Hepatosplenomegaly, Tanner stage I, systolic murmur, his investigations work up revealed hemoglobin: 9.2 g/dL (post-transfusion), Ferritin: 3,500 ng/mL (elevated). Endocrine panel: Low testosterone, borderline hypothyroidism\n\n1. Please explain his presentation. What other complications are expected?\n\n2. Please recommend a further plan of management.", "back": "The case describes a classic thalassemia major case with complications secondary to iron overload due to repeated blood transfusions.", "cls": "Unclassified"}, {"num": 213, "chapter": "Hematology", "front": "A 28-year-old gir]l presented with a two-month history of weakness, chills, fever, anorexia, and weight loss. Her medical history was not remarkable. Physical examinations showed marked pallor, generalized lymphadenopathy, and hepatosplenomegaly. Laboratory findings included anemia with moderate anisopoikilocytosis, hemoglobin level of 8.2 g/dl, ESR 90 mm/hr, and positive C-reactive protein. Polymerase chain reaction for tuberculosis, blood culture, urine culture, hydatid antibody, direct Coomb's test, bone marrow culture, and blood smear for malaria were all negative.\n\n1. What is the most likely diagnosis?\n2. What are the investigations needed?", "back": "Most probably lymphoma.", "cls": "3-star"}, {"num": 214, "chapter": "Hematology", "front": "A 38-year-old man was admitted with a femur fracture. Surgical repair was performed, and prophylactic-dose enoxaparin was administered along with oxycodone as needed for pain. Two days later, he experienced increasing pain and swelling in his right leg. His medical history is unremarkable. However, family history reveals that his mother had pulmonary embolism at age 66 while receiving breast cancer treatment, and a maternal uncle experienced a deep vein thrombosis (DVT) at age 78.\n\nPhysical examination: vital signs were normal. The right leg showed an increased circumference of 2 cm at the mid calf compared with the left. The surgical site is clean and dry.\n\n1. What is your provisional diagnosis? What are the recommended investigations?\n\n2. Is this case indicated for inherited thrombophilia screening?\n\n3. What is your plar of management?", "back": "Deep Vein Thrombosis (DVT) of the right lower limb as the patient has recent orthopedic surgery (major risk factor for DVT, provoked DVT), unilateral leg swelling and pain, > 2 cm difference in leg circumference, and a family history that may suggest a prothrombotic tendency (although weak).", "cls": "Unclassified"}, {"num": 215, "chapter": "Hematology", "front": "A 28-year-old man has a sudden onset of bone pain. He also begins experiencing bleeding from his gums. Looking retrospectively, he notes a decreased energy level over the past weeks. He feels dizzy and has dyspnea on exertion. He looks pale and has numerous ecchymoses over his body. Hepatosplenomegaly is noted. A full blood count shows WBC of 102 x 10° /dl. A bone marrow biopsy shows numerous blasts.\n\n1. What is the SINGLE most likely diagnosis? Justified the diagnosis?\n2. What are the investigations required?", "back": "In the context of rapidly progressive symptoms, anemia, bony pains with marked leukocytosis, and blasts cells in the bone marrow all suggest the diagnosis of acute leukemia.", "cls": "Unclassified"}, {"num": 216, "chapter": "Hematology", "front": "A 53-year-old man was presented to the outpatient clinic because of lowgrade fever, pruritus, headache, and paresthesia over the past few months, with no past significant medical history. Recently, he also experienced 3 attacks of epistaxis over the last 2 weeks. Physical examination revealed dusky extremities and a just palpable spleen. The blood picture showed HB 11 g/dl, MCV 78 fL, platelets 1200 x10°/dl, WBC: 9 x10%dl, Basophils 1%, Eosinophils 1%, Lymphocytes 22%, Monocytes: 2%, Staff 4%, Segments 70%.\n\n1. What is the most probable differential diagnosis?\n\n2. What would be the diagnestic workup in evaluating this patient's condition?\n3. What are the complications of this condition?\n\n4, What is the main line of treatment for this condition?", "back": "Thrombocytosis is either primary (essential thrombocytosis ET) or secondary due      to   (iron    deficiency,      infection,    inflammation   or malignancy).", "cls": "Unclassified"}, {"num": 217, "chapter": "Nephro", "front": "A female patient 50 years old, known to have long standing hypertension on irregular treatment, presented with history of generalized fatigue over the last 6 months. Over the last 2 months, she complained of nausea with occasional vomiting and she reported to have weight loss and some itching. On examination, her BP was 170/110 mmHg, she was found to be pale with some scraich marks over the LL. Her skin was dry and cardiac examination revealed a systolic murmur. Investigations showed serum creatinine 9 mg/dl, BUN 100 mg/dl, serum Na 135mmol/L, K 5.8mmol/L, Ca 7.5 mg/dl, P 6.5mg/dl, Hb 8gm/dl, WBC 4.7 x 10° /mm?, Platelets count 190 x 10° /mm?.\n\nWhat is the most likely diagnosis? o=\n\nWhat further investigation would you like to perform?\n\nHow can you manage her anemia? Ao\n\nDiscuss treatment strategies for this patient?", "back": "Chronic kidney disease, end-stage (ESRD).", "cls": "4-star"}, {"num": 218, "chapter": "Nephro", "front": "A 70 years old male, living alone developed an attack of diarrhea that persisted for 3 days before coming to the hospital. He complained of reduced urine output and marked weakness and reported that he was too weak even to bring himself a glass of water. He has no past history of medical importance. On examination his BP was 90/60, he had dry mucous membranes and skin turgor showed evident dehydration. Laboratory work revealed serum creatinine 6 mg/dl, urea 200 mg/dl, Hb 12gm/dl. Urine analysis was unremarkable\n\nWhat is the most likely diagnosis? o=\n\nHow would you confirm the diagnosis?\n\nWhat other tests are needed?                            / W\n\nWhat is the first line of management to be done in this patient? B", "back": "The patient has prerenal acute kidney injury/acute tubular necrosis (AKI/ATN).", "cls": "3-star"}, {"num": 219, "chapter": "Nephro", "front": "A 37 year old male presented with lower limb edema and puffiness of the eye lids. He has no previous history of DM or HTN. Examination revealed BP 140/80, edema was restricted to the ankles. Chest, heart and abdominal examination was unremarkable.\n\nLab tests revealed urine albumin +++ WBC 5-10 cell/mm?® RBC 20-30 cell/mm?, serum Creatinine 1.5mg/dl, cholesterol 319mg/dl, TG 225mg/dl, HDL 48, LDL 240mg/dl, Hb 12gm/dl. Hepatitis markers were negative so as ANA and anti DNA. C3 and C4 were not consumed. Renal biopsy was done.\n\nWhat is the likely diagnosis? BowoRo=\n\nWhat is the most likely underlying etiology? Discuss possible measures to reduce proteinuria. Discuss possible pathologic findings.", "back": "Nephrotic syndrome, however 24 hours urinary protein and serum albumin are needed to confirm diagnosis: Hepatitis markers are negative, so as ANA and anti DNA, this exclude hepatitis and collagen diseases.", "cls": "4-star"}, {"num": 220, "chapter": "Nephro", "front": "A 45 year old male farmer presented with puffiness and lower limb edema and prostration that was increasing rapidly over the last few days. He had history of elevated liver enzymes that he was reluctant to follow up as feeling healthy. He also has past history of Bilharzial treatment by injections. Examination revealed BP 170/110, lower limbs edema reaching the lower abdomen with palpable skin purpura and some ulcers at the periphery of his toes. Abdominal examination: palpable liver and moderate ascites. Chest and heart examination; free.\n\nLaboratory tests showed serum Creatinine 3 mg/dl, urea 100 mg/dl, Bil 1.1 mg/dl. ALT 100 U/l, AST 80 U/l, serum albumin 2.2 g/dl, INR 1.1, Urine protein +++ RBCs 20 — 30/mm?®, WBC 15-20/mm?>, 24 hours urinary protein 6 gm/day. ANA, anti DNA and ANCA were all negative\n\n1. What is the patient suffering from at the point in time? What is the most likely cause of his condition?\n\n2. What investigations are needed to confirm the diagnosis?\n3. What is the most likely pathologic finding on kidney biopsy?\n4. How can you manage this patient?", "back": "The patient is suffering from nephrotic syndrome with deteriorating kidney functions, most probably caused by HCV induced glomerulonephritis.", "cls": "2-star"}, {"num": 221, "chapter": "Nephro", "front": "A 13 years old schoolgirl was noticed by her parents to have periorbital swelling. Ten days earlier she complained to her general practitioner of a sore throat and had received a one week course of penicillin. She returned to her doctor, and on direct questioning, admitted to having passed only small quantities of urine during the previous 48 hours.\n\nOn examination periorbital edema was confirmed, the jugular venous pressure was raised and blood pressure was 150/95 mmHg. Dipstick testing of her urine revealed the presence of blood and protein and she was referred to the local hospital for further investigation and management.\n\n1. What is the clinical diagnosis? 2, How may this be confirmed?\n\n3. What is the most likely pathological diagnosis?", "back": "This presentation is of an acute nephritic syndrome (ANS).", "cls": "4-star"}, {"num": 222, "chapter": "Nephro", "front": "A 35 year old man, was noted to be hypertensive but no other abnormality was revealed. His father had died at the age of 56 from a cerebrovascular accident (CVA). Two years later, his blood pressure having been controlled, he experienced several episodes of painless hematuria apparently unrelated to trauma or infection. There was no proteinuria. Examination revealed fullness in both flanks. Over the next 15 years his renal function deteriorated at a steady rate. The patient recently entered the phase of terminal renal failure and is currently being integrated into the dialysis and transplantation program.\n\n1. What is the most probable diagnosis?\n\n2. What anatomical abnormality may have been responsible for the cerebrovascular accident (CVA)?\n\n3. What investigation is needed to prove the condition?\n\n4. What are the implications of this disease for his children?\n5. What is the management of this disease at its earlier stages?", "back": "This man has an adult form of pelycystic renal disease which is inherited as an autosomal dominant condition.", "cls": "4-star"}, {"num": 223, "chapter": "Nephro", "front": "Two years ago, a 58 year-old man while carrying shopping and running for a bus, experienced severe thoracic spine pain radiating around his chest to the right side. He was referred to hospital and was found to have an isolated collapse of the sixth thoracic vertebrae. Skeletal survey was otherwise normal. Results showed Hb 13 g/dl, WBCs 10.9 x 10%/L with a normal differential and an ESR of 60 mm/hour. Urea 38 mg/dl, calcium 9.2mg/dl. Routine urine testing was normal. No specific diagnosis was made and he was treated with analgesics. Over the next two years his general health deteriorated He had recurrent chest and ear infections. The back pain persisted and there was a new severe pain in his right hip precipitated by movement, not occurring at night. He became dyspneic with no orthopnea or paroxysmal dyspnea. Over the last month he became increasingly thirsty but did not develop nocturia or polyuria. He was investigated in hospital. Results showed Hb 8 g/dl, WBC 154 x 10%/L normal differential, platelets 398 x 10%/L. Normocytic normochromic anemia. Urea 134 mg/dL, K 4.5 mmol/L, serum creatinine 6.62 mg/dL, Ca 14.0 mg/dL. Urine was negative for protein on dipstick testing.\n\nWhat is the probable diagnosis? o=\n\nWhat tests are necessary to confirm this?\n\nWhat is the prognosis? P\n\nWhat are the mechanisms of kidney injury? &", "back": "Multiple Myeloma, with CRAB criteria C hypercalcemia, R renal impairment, A anemia, B bone lesions.", "cls": "2-star"}, {"num": 224, "chapter": "Nephro", "front": "A 17 years old schoolboy developed ankle and periorbital swelling. The edema spread rapidly to involve the whole of his legs and abdomen and his weight increased by 10 kg. He had presented at the age of 5 with generalized edema and proteinuria, and had been treated with prednisolone which induced a prompt remission. Frequent relapses over the next two years led him to receive a course of cyclophosphamide (2.5 mg/kg daily for 8weeks) following which the proteinuria abated for 4 years, Subsequently he had yearly relapses, usually beginning during springtime, and each one being steroid sensitive. On this occasion there was marked edema of legs, genitalia, sacrum and abdominal wall with clinical evidence of ascites and bilateral pleural effusions, the latter being confirmed radiologically. Other investigations revealed: Hb 13.3 g/dl, ESR 70 mm/hr, collagen screen negative, plasma albumin 2 g/dl, plasma creatinine 0.7 mg/dl, with a creatinine clearance in excess of 100 ml/minute and 24 hour urine protein excretion 7 g.\n\n1. What is the diagnosis and what are the characteristic findings of the renal    biopsy    on   optical     and   electron   microscopy     and immunofluorescence?\n\n2. What is the usual treatment regimens employed?", "back": "This is a case of minimal change GN with multiple relapses.", "cls": "2-star"}, {"num": 225, "chapter": "Nephro", "front": "A 50 years old man is referred to a nephrologist for investigation of microscopic hematuria. This was first detected six months ago and has been confirmed on two occasions by his general practitioner. Previous urine analyses have been normal. He has never had macroscopic hematuria, and has no urinary symptoms. He is otherwise in excellent health. There is no significant past medical history. He has no symptoms of visual problem or deafness. There is no family history of renal disease. He is alcoholic and smokes 30 cigarettes per day. On examination, he looked well nourished, his pulse is 72/min, BP 145/100 mmHg. Chest, heart, abdomen and neurological examination were unremarkable.\n\nLab tests revealed Hb 13.6g/dl, WBC 4.2x10%1, plt 213x10%/1, Creatinine 2mg/dl, albumin 3.8g/dl, AST 33U/L, ALP 72U/L, GGT 221U/L, urine analysis protein ++, RBC >100, 24hr urinary protein 1.2g. Kidneys are normal by ultrasound.\n\nWhat is the most likely diagnosis? SRR S\n\nHow would you interpret the creatinine value?\n\nWhat further investigations would you organize?\n\nWhat advice would you give to this patient?", "back": "Microscopic hematuria has many renal and urological causes, e.g.", "cls": "1-star"}, {"num": 226, "chapter": "Nephro", "front": "A 61 years old male, retired, fertile, heavy smoker living in Giza. He has long standing history of D.M. controlled by 2 daily injections of premixed insulin. He also has systemic hypertension well controlled using a morning tablet of captopril + Hydrochlorothiazide. He has history of pain in the neck to which he was prescribed NSAID agent. One month ago, he got an attack of dysuria. Frequency and urgency and was prescribed a one week course of gentamycin 80 mg/8 hours. He recovered completely from this attack. 3 days ago he underwent coronary angiography, and was prescribed isosorbid mononitrate and acetyl salicylic acid. He’s coming complaining that he didn’t pass urine for the last 10 hours\n\n1. What is the differential diagnosis of his condition?\n\n2. What is the first step to be done to reach a diagnosis?\n3. Is there a place for doing FENa or FEurea? Which of the above 2 tests you prefer in this case?\n\n4. If the case is related to radiocontrast, how can we manage? And how it can be avoided?", "back": "Acute Kidney Injury (acute papillary necrosis, acute interstitial nephritis, ATN) due to (radiocontrast, gentamycin, NSAIDs) is the possibility.", "cls": "4-star"}, {"num": 227, "chapter": "Nephro", "front": "A 45 years old male working as excutive secretary born and living in Banha city. He’s married, fertile and has no special habits of medical importance. He’s presenting with pyrexia, repeated vomiting and diarrhea. Clinical examination showed: normal mental functions, toxic pale facies, temperature 38.1°C, B.P. 155/95 mmHg, R.R. 24/minute, diffuse mild tenderness in all abdominal quadrants with increased intensity of intestinal sounds.\n\nLaboratory investigations revealed: serum creatinine 2.4 mg/dl, eGFR 34 ml/minute, serum urea 97 mg/dl, serum uric acid 8 mg/dl, serum bicarbonate 11 mmol/L, urine protein +++, 24 hour urine protein 1.95 gm/dl, hemoglobin concentration is 10.4 g/dl and hematocrit value 31%\n\n1. What is the diagnesis? What are the other investigations needed to evaluate kidneys in this patient?\n\n2, Do you think         this   patient     deserves   other   therapeutic interventions?\n\n3. Which anti- hypertensive drug do you prefer in this patient?\n\n4. What are the other medications that should be prescribed?\n\n5. What are the targets for your treatment?", "back": "Being hypertensive, proteinuric with impaired kidney functions, chronic kidney disease (CKD) is considered, associated with attack of gastro-enteritis as manifested by fever, vomiting, diarrhea and tender abdomen.", "cls": "3-star"}, {"num": 228, "chapter": "Nephro", "front": "A 60 years old gentleman with a long-standing history of type 2 diabetes mellitus (6 years) and systemic hypertension (8 years) came for increasing lower limb edema. His medications include atenolol (100mg daily), hydrochlorothiazide (12.5 mg daily), lisinopril (40 mg daily), premixed insulin and metformin (500 mg twice daily). He does not smoke. His body-mass index is 32 kg/m? His systolic and diastolic blood pressures (measured three times while he was seated) range from175 to 180 mm Hg and 95 to 105 mmHg, respectively, and the pulse rate is 72 per minute. His JVP is elevated. Examination of his ocular fundi revealed arteriolar narrowing. Cardiovascular examination is normal. There are no abnormal bruits. The serum potassium level is 5.6 mEqg/L, and the serum creatinine level is 1.9 mg /dl. His fasting blood glucose ranges between 115 and 140 mg/dl and 2hours P.P. between 165 and 240 mg/dl, HbAlc > 8%, His serum cholesterol is 280 mg/dl, triglycerides level is 255mg/dl, HDL is 30 mg/dl and LDL 165 mg/dl. There is 2.7 gm protein in 24 hours urine otherwise, urine has no other abnormalities. Echo heart: diastolic dysfunction.\n\n1. For control of his diabetic state, what modification you suggest in therapy?\n\n2. When are we supposed to start RAS Blockade in type 2 Diabetic patients?\n3. What are the possible causes of increasing lower limb edema in this patient? & What are the investigations dene to support the diagnosis?\n\n4. What are other suggested lines of treatment & how to manage patient hyperkalemia?", "back": "Diabetic nephropathy (CKD) with volume overload, in a patient with type 2 diabetes and hypertension.", "cls": "3-star"}, {"num": 229, "chapter": "Nephro", "front": "A 15 years old boy presenting with morning puffiness of eyelids and lower limb edema associated with abdominal and scrotal swelling. On examination: B.P. 120/75 mmHg, Pulse 85/minute, Temp. 36.9 °, Neck veins not congested, L.L. edema up to mid thigh, moderate ascites and scrotal edema. Serum creatinine 0.75 mg/dl, Serum urea 23 mg/dl, Serum albumin 2.1 gm/dl, Serum sodium 129 m.Eq./L, Serum potassium 3.2 m.Eq./L, Urine analysis: albumin ++++, Casts : Hyaline 2-3 / H.P.F., waxy casts 0-1/H.P.F., RBCs: 2-4/H.P.F., WBCs: 1-3/ H.P.F., 24 hours urine protein excretion = 4.5 gm/day,\n\nWhat’s your diagnosis? O\n\nWhat’s the most likely pathologic diagnosis in this case? What are the causes of abdominal distension in this patient?\n\nWhat are additional laboratory findings that can be encountered in this patient?\n\nWhat is the indication of renal biopsy in this case? o\n\n6. What is the further management in this case?\n\n7. What are the complications that can be encountered in this case?", "back": "Minimal change nephrotic syndrome (MCNS).", "cls": "4-star"}, {"num": 230, "chapter": "Nephro", "front": "25 years old lady, working as executive secretary, married, fertile has no special habits of medical importance and is living in Manial. She came complaining from bilateral loin pain, associated with recurrent attacks of dysuria, frequency, urgency and strangury. On examination, apart from short stature she had body temp. 38.4°C. Bilateral renal angle tenderness. Investigations: Urine analysis: pH 6.0, turbid, WBCs: 60-70/HPF, RBCs: 10- 14/HPF, serum creatinine 1.9 mg/dl, serum urea 56mg/dl, serum sodium 139 m.Eq/L, serum potassium 3.1 m.Eq/L. Blood pH is 7.24, Serum bicarbonate 13 m.mol/L, Anion gap is 6 m.eq, Serum calcium, phosphate and uric acid are within normal range. The plain U.T. disclosed multiple radio-opaque stones.\n\nWhat are the investigations recommended for this patient? W=\n\nIn view of these lab findings, what is the diagnosis of this case?\n\nWhat are further tests needed to confirm diagnosis? What is the best therapeutic treatment of this condition?", "back": "Type I (distal) renal tubular acidosis (RTA), with nephrolithiasis.", "cls": "2-star"}, {"num": 231, "chapter": "Nephro", "front": "A 44 years old male was admitted to hospital with subarachnoid hemorrhage which was treated by surgical clipping. Four days later he was admitted to the ICU with disorientation, confusion and hallucinations. His temperature is 36.9C, BP 140/70 (upon standing 110/50), pulse rate 90/min. His lab studies on admission were normal. Current lab studies show: serum sodium 118mEq/l, potassium 4.1 mEq/l, chloride 85 mEqg/l, bicarbonate 23 mEq/l, serum osmolality 248mOsm/kg H20, spot urine Na 105mEq/l, spot urine K 20mEq/l, urine osmolality 633 mOsm/kg H20.\n\n1. What is the cause of hyponatremia in this patient and justify your diagnosis?", "back": "Hyponatremia in this patient is most probably secondary to cerebral salt wasting.", "cls": "1-star"}, {"num": 232, "chapter": "Nephro", "front": "During routine pre-employment check up, an asymptomatic 49 years-old male was found to suffer proteinuria. Clinically BP 145/100, pulse 92/min, BMI 33, mild bilateral painless pitting LL edema. Laboratory investigations revealed: serum cholesterol 270mg/dl, serum creatinine 1 mg/dl, urine analysis showed 4+ proteins; no leucocytes or RBCs, urinary protein/creatinine ratio is 5.7mg/mg. Kidney biopsy showed thickening of the glomerular basement membrane and electron microscopy showed subepithelial deposits.\n\n1. What is the pathoelogical diagnosis?\n\n2. What are the possible causes of this condition?\n\n3. What are the lines of treatment?", "back": "The patient has membranous nephropathy (MN).", "cls": "2-star"}, {"num": 233, "chapter": "Nephro", "front": "A male patient 25 years old presented to internal medicine clinic with smoky and frothy urine that he noticed two days before together with right hypochondrial pain. He is non smoker and was feeling well till the last couple of days On examination he was vitally stable, afebrile, right renal angle severe tenderness. Other systems review was free\n\nLaboratory investigations showed mild leukocytosis with no shift to the left, urine showed RBCs 70-80 and Albumin /Creatinine ratio 1355 mg/gm creatinine. Abdominal ultrasound showed swollen right kidney.\n\n1. What is the most likely diagnosis?\n\n2. What other investigations to be done?\n\n3. Discuss lines of management?", "back": "A case of subnephrotic proteinuria, hematuria together with unilateral tenderness over renal angle pointing to a case of renal vein thrombosis Other less likely differential diagnoses are glomerulonephritis, urological cause of hematuria (renal stones or masses) unilateral obstructive uropathy.", "cls": "New"}, {"num": 234, "chapter": "Nephro", "front": "A 55 years old, female, with medical history of chronic headaches, osteoarthritis, hypertension, she reports taking over-the-counter analgesics (acetaminophen, ibuprofen) for over 4 years about 2-3 tablets per day without consulting her doctor, considers it routine and she takes lisinopril for hypertension. She presents with complaints of fatigue, loss of appetite, and frequent urination. She also notes a dull ache in her lower back. Physical examination: BP160/95 mmHg, pulse 82 bpm, Temp: 36.9°C, pallor. Laboratory serum creatinine 2.4 mg/dL BUN: 46 mg/dL, urinalysis: mild proteinuria, sterile pyuria, microscopic hematuria. Electrolytes: Mild hyperkalemia, CBC: Normocytic normochromic anemia. Renal Ultrasound: Bilateral small kidneys with irregular contours and papillary calcifications\n\n1. What is the provisional Diagnosis?\n2. Evaluate the clinical presentation and diagnostic criteria that support the diagnosis in this patient.\n3. Propose a Ilong-term management plan for this patient. Address both renal preservation and modifiable risk factors.", "back": "Chronic interstitial nephritis secondary to amalgesic nephropathy        with   possible     contribution     of    hypertensive nephrosclerosis.", "cls": "Unclassified"}, {"num": 235, "chapter": "Nephro", "front": "62-year-old, Female patient, retired nurse, with medical history of recurrent urinary tract infections (UTIs), Hypertension (15 years), Osteoarthritis, No history of diabetes. She presents to the nephrology clinic with progressive fatigue, polyuria, and nocturia over several months. She denies hematuria, dysuria, or flank pain but notes she has had “low energy” and dry skin. She gave history of frequent courses of nitrofurantoin (over the past 18 months), typically self-initiated for UTI symptoms, Lisinopril 10 mg daily, Ibuprofen for joint pain. Physical Examination: BP 145/85 mmHg, HR: 76 bpm, General: Pale, no edema, Abdomen: Non-tender, no palpable masses, Neurologic: No asterixis or focal deficits. Laboratory: serum creatinine 2.1 mg/dL (baseline unknown), BUN38 mg/dL, eGFR 30 ml/min, potassium 4.9 mmol/L, Hemoglobin10.2 g/dL, Urinalysis:: bland sediment - trace protein - no blood or casts, Urine eosinophils negative, 24-hour protein 450 mg/day, Renal ultrasound bilateral small echogenic kidneys (9.2 cm, 9.0 cm), Kidney Biopsy: chronic interstitial fibrosis, tubular atrophy, lymphocytic infiltrates, minimal glomerular involvement, no granulomas or vasculitis\n\n1- What is the provisional Diagnosis? Outline the possible the pathophysioclogy and common causes?\n\n2- What clinical and laboratory features in this patient support the diagnosis?\n\n3. Outline 2 management strategy and discuss how further renal damage can be minimized?", "back": "1- Chronic Interstitial Nephritis (CIN) likely secondary to prolonged nitrofurantoin use.", "cls": "Unclassified"}, {"num": 236, "chapter": "Nephro", "front": "26 Years old, female, graduate student with medical history of mild hypertension diagnosed 6 months ago on non regular medications with family history: maternal aunt with “kidney failure of unknown cause” in her 30s. She presents to the emergency department with fatigue, decreased urine output, and dark-colored urine over the past 3 days. She also reports mild abdominal pain and nausea. There is no diarrhea and no recent travel. Examination: BP 160/100 mmHg, HR: 94 bpm, Temp: 37.2°C, Pallor, mild pedal edema, petechiae on lower extremities. Platelets 54,000/uL, Schistocytes present, reticulocyte count: elevated, LDH: 900 U/L, haptoglobin: undetectable, serum creatinine: 3.6 mg/dL, BUN: 54 mg/dL, urinalysis: proteinuria, hematuria, granular casts. ADAMTS13 activity:70% (normal), Stool culture: Negative for E. coli O157:H7 or Shiga toxin, serum C3 low, C4 normal, Anti-complement factor H (Anti-CFH) antibodies: Negative, Genetic testing pending. Renal ultrasound showedNormal-sized kidneys with increased echogenicity, no obstruction\n\n1. What is the
