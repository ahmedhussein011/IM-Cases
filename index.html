udy fluid and the following results: Protein: 75 g/dL, Glucose: 23 g/dL, WBCs: 678/mm3, 98% neutrophils, RBCs: 5/mm3. Bacteria: none visualized\n\n1. What is the most likely diagnosis?\n\n2. Should this patient have undergone CT scan prior to lumbar puncture?\n\n3. What is the treatment of this condition? When should patients receive steroids?", "back": "1. The most likely diagnosis is Bacterial meningitis. This is a classic presentation with severe headache, fever, nuchal rigidity, photophobia, and a positive Kernig’s sign. CSF revealed an elevated WBC count, increased protein, and decreased glucose. The rash is characteristic of meningitis due to Neisseria meningititis, although a viral exanthem is also a possibility, however the low glucose in CSF points to bacterial meningitis and not viral.\n\n2.    Neuroimaging is frequently performed prior to performing a lumbar puncture either to exclude other differential diagnoses or to assess for the presence of significantly raised intracranial pressure.\n\no However, obtaining neuroimaging in suspected bacterial meningitis may delays performing a lumbar puncture and obtaining CSF for important diagnostic investigations. We should be these put in consideration, in turn, this may also delay effective treatment and management.\n\n3.   Treatment:\n\n- Empiric coverage is started immediately (until results of microbial antibiotic sensitivity result becomes available), initial antimicrobial treatment consists of cefotaxime 2 gm every 6 hours slowly iv =+ ampicillin 2gm 1v every 6 hours. Also vancomycin plus a thirdgeneration cephalosporin can be effective. A range of 7 to 10 days is recommended for meningococcal meningitis, and longer courses (10 to 21 days) are recommended with other pathogens. Steroids are often administered to decrease the risk of long term complications dexamethasone may be effective in decreasing many of the pathophysiologic consequences of bacterial meningitis, such as cerebral edema, increased intracranial pressure, altered cerebral blood flow,   cerebral vasculitis,   and neuronal injury,   as mediated by proinflammatory cytokine expression."}, {"num": 143, "chapter": "Neuro", "front": "A 75-year-old man presents with difficulty in walking. His gait has become progressively more spastic and unsteady over the past several months, and he reports increased problems with fatigue and forgetfulness. He has lived in a residential facility for the past 5 years and complains that the food is terrible, so he has been eating very poorly. He is otherwise very healthy and takes no medications or supplements. On examination, his vital signs include a temperature of 36.3°C, pulse of 90/min, and blood pressure of 120/80 mm Hg. He is alert and oriented. Neurologic examination is significant for 4+/5 strength in the bilateral lower extremities, 5/5 in the bilateral upper extremities, a positive Romberg test, and increased muscle tone in the lower extremities. On sensory testing, there are notable deficits in fine discriminative touch, vibration and conscious proprioception but retained pain and temperature sensation in the lower extremities. The remainder of his examination is within normal limits. A complete blood count (CBC) reveals hemoglobin of 8.3 g/dL, hematocrit of 26%, and mean corpuscular volume (MCV) of 110 fl. Hypersegmented neutrophils are visible on peripheral smear.\n\n1. What is the most likely diagnosis? What are the common neurologic symptoms of this condition?\n\n2. What is the most appropriate next step in management?\n\n3. What is the treatment?", "back": "1. The diagnosis is subacute combined degeneration secondary to vitamin B12 due to dysfunction of the dorsal columns and corticospinal tracts in the spinal cord. The patient has many neurological manifestations: paraparesis, hypertonia in upper and lower limbs (corticospinal tract affection), lost deep touch, vibration sense and +ve Romberg test (sensory ataxia) and intact pain and temperature (posterior column affection) are resulting in discriminative sensory loss, amnesia (cortical affection) and Macrocytic anemia, hypersegmented neutrophils (megaloblastic anemia).\n-   The most probable diagnosis is subacute combined degeneration secondary to vitamin B12 (cobalamin) deficiency. B12 deficiency is also a treatable cause of dementia, B12 deficiency often coexists with folate deficiency, so patients should be evaluated for both conditions. The most appropriate next step in management:\n\n-   Measurement  of serum folate and B12 levels, checking homocysteine and methionine levels can confirm the diagnosis as one or both will be elevated in the setting of B12 deficiency.\n-   Gastroscopy and biopsy to exclude atrophic gastritis\n-   Anti - intrinsic factor antibodies for perinicious anemia.\n\nTreatment: early treatment improves the chances of a good outcome, so the disease should be treated promptly. Vitamin B12 is given IM. Injections are often given once daily for a week, then weekly for about 1 month, and then monthly. Vitamin B12 injections must continue throughout life to prevent symptoms from returning."}, {"num": 144, "chapter": "Neuro", "front": "An 18 -year-old man is having breakfast with his mother when suddenly he arches his back, turns his head to the side, shout loudly, and falls to the ground. His arms and legs remain extended for approximately 30 seconds, after which his arms and legs begin to flex and extend rhythmically for the next 2 minutes. The patient’s mother calls emergency, and on arrival the paramedics find the patient lying on the floor. He appears drowsy but can respond to vocal commands. He has bitten his tongue badly, and is soiled due to lost control of bowel and bladder functions. The patient is confused and appears to have no knowledge of what has happened to him. The paramedics transfer the patient to the ambulance and bring him to the emergency department for further evaluation.\n\n1. What is the most likely diagnosis?\n\n2, How is this condition diagnosed?\n\n3. What tests could be used to confirm the diagnesis and how to treat?", "back": "1. The most likely diagnosis is Generalized tounic-clonic seizures (partial with secondary generalization as at the onset of the fit the patient head was turned to one side)\n\nDiagnosis of this condition: In patients without a history of epilepsy or seizure, it can either indicate the new onset of primary epilepsy or may be the consequence of a provoking stimulus (i.e., secondary, or symptomatic, seizure). - Potential provoking factors include metabolic derangements, infections, inflammatory conditions, brain injury, drugs, or toxins. A thorough workup must carefully rule out secondary causes of seizure. A good medical history and neurologic examination are important. A brain MRI/MRA with contrast is standard for an initial seizure to rule out structural abnormality and visualize the meninges and vasculature. If there are any signs of infection—such as elevated WBC, fevers, nuchal rigidity lumbar puncture (LP) should be performed. Laboratory studies metabolic causes (eg electrolytes --- ). Tests that could be used to confirm the diagnosis:\n\nElectroencephalography (EEG) plays an important role in the evaluation of seizures; abnormalities on EEG may be evident in the inter-ictal, ictal, and/or post-ictal phases. Both hyperventilation and sleep deprivation may increase the likelihood of detecting abnormalities on EEG. Imaging studies such as MRI& MRA and CT scan can identify a structural lesion or congenital anomaly. Brain imaging is indicated in this case because of the new onset of seizures and focal onset of the seizure. Treatment: antiepileptic medication and patient education to promote an awareness of precipitating factors. Topiramate is effective for generalized tonic-clonic seizures alone. Sodium valproate, Lamotrigine, levetiracetam are also used as generalized tonic-clonic seizures."}, {"num": 145, "chapter": "Neuro", "front": "A 67-year-old woman is brought by her daughter for increased forgetfulness. During the visit, the patient has trouble answering questions about events that took place in the past month, and at one point stops to ask her daughter where she is. Her daughter comments that she has recently been disoriented in familiar environments, that she has trouble coming up with the names of people and objects.\n\nOn examination her temperature is 36.5°C with a heart rate of 90/min and a blood pressure of 130/80 mm Hg. Neurologic examination reveals no focal deficits, she is not oriented to the date or day of the week, is unable to recall words that she has been asked to remember after a brief delay, and is unable to copy a simple figure.\n\n1. What is the most likely diagnosis?\n\n2. What are the most common causes of this condition?\n\n3. What diagnostic tests should be performed?", "back": "1. The most likely diagnosis is dementia. Dementia is defined as a chronic progressive decline in multiple areas of cognitive functions that impairs activities of daily living. Memory is most commonly affected, but there are also language, problem-solving, mood, and neuropsychiatric deficits. This patient’s prominent deficits in memory, naming, and visuospatial processing are most consistent with a diagnosis of Alzheimer’s dementia .\n\nThe most common causes of this condition:\n\nDementia may be due to a primary neurodegenerative process (primary dementia). The most common cause of primary dementia is Alzheimer’s disease (AD); vascular dementia is the next most common, followed by dementia with Lewy bodies and frontotemporal lobar degeneration. Or due to other medical conditions (secondary dementia), the latter of which may be reversible if the medical condition can be treated early enough e.g. vitamin B12 deficiency, hypothyroidism, drug toxicity, ethanol, HIV, hepatic and renal failure, calcium and sodium imbalances and chronic sudural hematoma. The diagnostic tests that should be performed to idenmtify reversible causes are: Laboratory tests such as a complete blood count, electrolyte panel, thyroid and liver function tests, and vitamin B12 levels are performed in patients with dementia of recent onset. CT or MRI brain: particularly in patients with focal neurological deficits."}, {"num": 146, "chapter": "Neuro", "front": "A 74-year-old man was noted to have excellent cognitive and motor skill 12 months ago. His wife noted that 6 months ago his function deteriorated noticeably, and 2 months ago another level of deterioration was noted.\n\n1. What is the provisional diagnosis?\n2. Which investigations are most likely to reveal the etiology of his functional decline?\n\n3. What is your plan of management?", "back": "1. The provisional diagnosis is multi-infarct dementia. (The stepwise decline in function is typical for multi-infarct dementia,)\n2. The most likely investigation to view multiple areas of the brain infarct is brain imaging (CT or MRI). Doppler carotid and echo heart\n3. Plan of management:\n-   Anticoagulation should be considered especially if arrythmia is present eg A.F.\n-   Antiplatelet medications: aspirin.\n-   Correction of dyslipidemia and control of hypertension if present."}, {"num": 147, "chapter": "Neuro", "front": "A 49 year old man presented with 10 days history of low back pain, dull aching and had developed after a long car journey. It increased if he coughed or strained. It was relieved initially by NSAIDs, but now they are ineffective. Over the last 2 days the pain had begun to spread into his right buttock and down the back of the right thigh. Eight years ago he had a previous episode of low back pain which had responded to bed rest. Examination revealed BMI 40, BP 130/90, pulse 83 and temp. 37.1°C. There was loss of normal lumbar lordosis. Straight leg raising was limited bilaterally, more on the right side. Complete blood count and ESR were normal.\n\n1. What is the most likely diagnosis?\n\n2. What further investigations you need to confirm your diagnosis?", "back": "1. This patient may have a mechanical derangement of the lumbosacral spine. The history he gave was completely compatible with such diagnosis, both in the nature and site of the pain, its relation to cough and its pattern of radiation. Prolapsed intervertebral disc is the commonest cause of such a clinical picture. The obesity and the past history of previous episode, the normal CBC and ESR support the diagnosis.\n2. Plain X-ray lumbosacral spine and MRI are needed to prove the diagnosis."}, {"num": 148, "chapter": "Neuro", "front": "A 55 year old man has hypertensive, diabetic and heavy cigarette smoker, presented to emergency room by 24 hours duration of weakness of his legs accompanied by difficulty in walking. He had also noticed some hesitancy in his micturition. He had not passed urine for 12 hours. He suffered from dull aching back pain in the past 2 weeks. He also had repeated cough with one attack of hemoptysis. On examination BP was 150/90, pulse 85/min, temp 36.8C. The dorsal spines were tender. Abdominal examination showed full bladder and the prostate was normal. Neurological examination revealed weakness of both legs more marked on the left side. Tone was normal. The tendon reflexes in the legs were exaggerated. The planter response was extensor bilateral. Sensory testing revealed impairment of all modalities in both lower limbs and this extended up to the costal margin. No abnormality was found in the cranial nerves and the upper limbs. Investigations revealed normal complete blood count and ESR was 100.\n\n1. What is your provisional diagnosis? Justify why?\n\n2. Mention three other differential diagnoses?\n\n3. What are the investigations needed to reach a diagnosis?", "back": "1. The clinical picture of this patient is matching with an extramedullary compression of the spinal cord at the level of the mid thoracic vertebrae. Back pain, asymmetrical lower limb weakness of UMN nature, retention of urine and sensory level till the costal margins. The patient is heavy smoker with history of hemoptysis and tender spine at a level corresponding to the suggested level of compression with elevated ESR suggest the possibility of bronchogenic carcinoma with vertebral metastasis.\n\nDifferential diagnosis: a. Local infections either tuberculous or pyogenic spreading to involve the cord. b. Transverse myelitis: it is not preceded by back pain or local tenderness and there is no history suggesting previous viral infection. c. Trauma which is a frequent etiology but is self evident and not relevant here.\n\n2. The investigations needed:\n- CT scan chest to exclude bronchogenic carcinoma and to search for pulmonary TB. Plain x-ray thoracic vertebrae to detect local pathology.\n-   MRI spine on mid thoracic vertebrae. Biopsy may be needed from lesions seen in the MRI."}, {"num": 149, "chapter": "Neuro", "front": "A 45 year old female with a history of severe pricking pain, tingling and numbness sensation of both hands and feet of about 6 months duration. On examination vital signs were normal, cardiac, chest and abdominal examination were normal.\n\nThe mentality, speech and cranial nerve were nornal. Motor system examination and coordination also were normal. There was bilateral symetrical dimished superfical sensation in both hands and feet.\n\n1. What is your diagnosis?\n\n2. Mention 5 different causes of this condition?\n\n3. What are the investigations needed to prove your diagnosis and how to treat such condition?", "back": "1. The diagnosis is peripheral neuritis\n\n2. Causes of peripheral neuritis\n\n-   Metabolic: diabetes mellitus, end stage renal failure, vitamin deficiency B6 & B12\n-   Hypothyroidism,\n-   Paraneoplastic syndrome\n-   Amyloidosis\n-   Sarcoidosis\n-   Infection: leprosy, HIV, lyme disease\n-   Autoimmune: vasculitic syndrome, SLE, Rheumatoid arthritis\n-   Toxins:    Heavy     metal   toxicity,   drugs    (statins,   vincristine, Chemotherapy-related neuropathy ---)\n3. Investigations needed:\n-   Nerve conduction study.\n-   Blood glucose fasting, 2 hours postprandial and hemoglobin A1C,\n-   Screen for autoimmune disorders ESR, ANA, ANCA.\n\nTreatment some antiseizure medications (e.g., gabapentin, topiramate, “carbamazepine , pregabalin, and antidepressants (e.g., amitriptyline)."}, {"num": 150, "chapter": "Neuro", "front": "A 25 year old female presented with a history of numbness and loss of sensation over the left small and ring fingers. She first developed numbness about 6 months ago, and a few days prior to clinic visit she burnt her small finger while cooking but felt no pain. The numbness has gradually worsened and affects the whole of the 2 fingers as well as part of the palm. On examination the patient mentality, speech and cranial nerves were normal. She had wasting of the first dorsal interosseous and abductor digit minimi. There is a sensory loss to touch, pain and temperature over the 2 fingers and the medial aspect of the palm.\n\n1., What would be your differential diagnosis?\n\n2. What are the investigations needed for this patient", "back": "1. The distribution of motor and sensory affection point to an ulnar nerve lesion, a Cg/T root lesion or a lesion within the lower cervical cord such as syringomyelia or ulnar nerve compressed along its course.\n\nThe C8 and T1 nerve roots merge to form the lower trunk of the brachial plexus which continues as the medial cord to give rise to the ulnar nerve. The investigations needed includes: ESR, ANA, blood glucose fasting, 2 hours postprandial and HbAlc. Nerve conduction study Plain X-ray cervical vertebrae, CT cervical spine and MRI cervical spinal cord are indicated."}, {"num": 151, "chapter": "Endocrine", "front": "A woman 30 year old, developed post-partum hemorrhage, received four units of blood transfusion. She could not lactate her baby, three weeks later, she suffered from general weakness and fatigability. Later, there was no resumption of menstrual cycle and lack of re-growth of shaved axillary and pubic hair.\n\n1. What do you think about the diagnosis?\n\n2. How you proceed for her management? (investigations & treatment)", "back": "1.   The diagnosis is Sheehan's syndrome (hypopituitarism). This is due to necrosis of anterior pituitary as result of bleeding and hypotension during delivery.\n\n2.   Management:\n\nHormonal evaluation: Basal hormonal level (low levels of thyroxine, estradiol, and cortisol, with low or inappropriately normal TSH, FSH, LH and ACTH levels. Dynamic tests may be needed (insulin tolerance test, short synacthen test). MRI is indicated to exclude mass lesions in pituitary gland. Treatment includes hormone replacement with physiologic doses of: Glucocorticoid Replacement: hydrocortisone is the glucocorticoid of choice. The higher dose is given in the morning while the lower dose at 6 pm to simulate the physiological circadian rhythm, e.g. hydrocortisone 20 mg am, 10 mg pm, or prednisolone 5 mg am or dexamthazone 0.5 mg am. Adequate replacement is assessed by general well being, improvement in body weight and (plasma cortisol levels only with hydrocortisone replacement). Glucocorticoid doses should be increased in stress situations (trauma, surgery or acute illness) to avoid precepitating acute adrenal failure. Glucocorticoids replacement should be started before thyroid hormone replacement to avoid precepitating acute adrenal failure. Thyroid hormone replacement: levothyroxine (100-150ug/d) to keep T4 near the upper normal level. N.B.: it should started after steroid Sex hormones: If fertility is not the patient’ concern, sex hormones are given to improve body composition, bone mineral density and sexual function. Oral ethiny! estradiol 25-50 ug/d for 4 weeks, progesterone 5 mg/d is added in the 3™ and 4\" weeks to prevent possible unopposed effects of estrogen on the uterus. The cycle is repeated from the 5® day of the withdrawal bleeding. Pulsatile GnRH or exogenous gonadotropins (FSH) are used for ovulation induction if the patient desires to get pregnant. GH replacement is decided on a case-by-case basis, but the decision is made only after all other deficient hormones have been replaced. Growth hormone replacement in severe GH deficiency (GH<9muw/l), impaired quality of life (AGHDA score>/=11). Adult growth hormone deficiency assessment questionnaire, used to assess the quality of life."}, {"num": 152, "chapter": "Endocrine", "front": "45- year- old female with dull headache and visual changes which became significantly worse in the past week. CT brain revealed large sellar mass with cystic areas with marked compression of the optic chiasm. Further evaluation, revealed laboratory evidence of mild hypopituitarism and bilateral visual field defects.\n\n1. What are the most likely diagnostic possibilities?\n\n2.   What will be the most likely initial treatment approach?", "back": "L. The most likely diagnosis is pituitary apoplexy which is hemorrhagic infarction of an underlying macroadenoma.\n\nHemorrhagic Rathke’s cleft cyst and craniopharyngeoma are less likely diagnoses. The most likely initial treatment approach is surgical decompression as there 1s manifestation of increased intracranial tension and optic chiasma compression. Hormonal assessment is very important before and after the operation."}, {"num": 153, "chapter": "Endocrine", "front": "A 61- year- old female found to have a pituitary lesion during imaging workup for headaches CT brain revealed a round lesion within the left aspect of the pituitary gland. The suprasellar cistern is clear without contact on the optic chiasm. The patient had normal clinical evaluation and labs including hormonal profile. Visual field and fundus examination were normal.\n\n1. What should be done next?\n\n2. Give an algorithm for management of incidental pituitary mass", "back": "1. Follow-up pituitary MRI, for assessment of:\n-     The size: Microadenoma < 1cm, Macroadenoma >1cm\n\n-     The compression to adjacent structures: Symptoms of increased intracranial tension. Fundus examination to exclude papilledema, Perimetry to exclude field defects. Pituitary hormone screening to diagnose hormone deficiency.\n-     Pituitary   function,        Guided    by   clinical picture:               IGF-1     for acromegaly, prolactin for prolactinoma, ACTH and cortisol dynamic tests for Cushing.\n\n2. An algorithm for management of incidental pituitary mass:\n\nEvaluation & Treatment of Pituitary                             Incidentalomas\n\nEvaluation of Pltuitary Funclion®\n\n| Hyperfunclioning — Clinically Nonfunctioning\n\nE— Prolactinoma       Other      ' . Micro-                Macrol              l               Incidentaloma       Incidentaloma®\n\n;       é             abnormal« Dopamine    Surgery/Medical                        Vesu?é‘;:;gd(\\ﬁ?)__ﬁ Surgery Agonist       Therapy                             Hypopitvitarism Evaluation®\n\nnormal v Repazat MR         Repaat MRI9 Pituitary Funciion®, VFd\n\n!                    ! Tumor Growth, VF Abnormality\n\n! Surgery"}, {"num": 154, "chapter": "Endocrine", "front": "A 25-year-old female, single, has regular menstrual cycles since menarche. Four months ago, she developed secondary amenorrhea and noticed milky discharge from the nipples. She also suffered from recent onset of headache. She did not receive any medications in the last few months. She sought medical advice where serum prolactin was 400 ng/ml, MRI proved a small sellar mass.\n\n1. What is the diagnosis?\n\n2. Mention drugs that can increase serum prolactin?\n\n3. How you proceed in the treatment and follow up?", "back": "1. In a single female with secondary amenorrhea, galactorrhea & raised serum prolactin > 250 ng/ml, sellar mass in MRI, the most likely diagnosis 1s prolactinoma.\n\n-   Normal fasting serum prolactin 18 15-20 ng/ml depending on the individual laboratory. A prolactinoma is likely if the prolactin level is > 250 ng/ml and less likely if level < 100 ng/ml.\n\n-   Prolactinoma 1s the commonest functional pituitary tumor, It is a benign secreting tumor arises from lactotrophs in anterior pituitary. The tumor either micro (<lecm) and macroadenoma (>1cm). Hyperprolactinemia suppressess GnRH causing decreased FSH and LH so, patient presented with amenorrhea.\n\n2. Drugs causing prolactinemia, usually prolactin level < 200 ng/ml and galactorrhea disappears with normalization of prolactin level shortly after discontinuation of the drug. These include dopamine-receptor antagonists (metoclopramide, domperidone), sulpride, antidepressants (tricyclics, selective serotonin reuptake inhibitors), verapamil, methyldopa, reserpine.\n\n3. Treatment: The aim is reduction of tumor size & restoration of gonadal function Medical treatment: The Dopamine agonist cabergoline, lowers prolactin level in 70-100% of patients with marked reduction of the size or disappearance of prolactinoma. Starting dose is 0.25mg per week, the dose is increased according to response.\n\nSurgical treatment: in patients with drug intolerance, tumor resistant to - medical therapy, patients who have persistent visual-field defects in spite of medical treatment.\n\nFollow up: response to therapy should be monitored by checking fasting serum prolactin levels and checking tumor size with MRI. Therapy should be continued for approximately 12-24 months."}, {"num": 155, "chapter": "Endocrine", "front": "A 45-year old man, noticed over the last 5 years changes in size of his ring and shoes. Later he develops coarse facial features, hyperhidrosis, headache and visual affection. He started treatment for hypertension and diabetes mellitus. Both serum prolactin and IGF-1 levels are high. Visual field showed bitemporal hemianopia.\n\n1. What is the diagnosis?\n\n2. What laboratory tests and imaging would you order to evaluate this patient?\n\n3. What is the explanation for raised prolactin level?\n\n4. What is the most preferred line of treatment?", "back": "L. The diagnosis is acromegaly (due to excess secretion of growth hormone mostly from growth hormone secreting pituitary tumor). Laboratory tests:\n\nIGF-1 1s useful to monitor integrated GH secretion. So its measurement is useful to screen for acromegaly, and to monitor the efficacy of therapy. High basal GH that 1s not suppressed after oral glucose load (oral glucose tolerance test). In acromegaly, patient is unable to suppress GH after oral glucose (if GH level falls to <0.3 mcg/L acromegaly is excluded). Assessment of the remainder of pituitary hormones.\n\nImaging study: MRI sella is more sensitive than CT scan. MRI provides detailed information about surrounding structures such as the optic chiasma and cavernous sinuses. In this case most probably there is pituitary tumor compress optic chiasma that leads to field defect bitemporal hemianopia. . The raised prolactin level may be due to compression of the pituitary stalk that might cause hyperprolactinemia due to loss of inhibitory regulation of prolactin secretion by the hypothalamus or coserection of prolactin by the tumor ( 25% of pituitary adenomas secrete both GH and prolactin).\n\nSurgical treatment by trans-sphenoidal resection of the tumor or tranfrontal the later is indicated in large tumors with extrasellar extension"}, {"num": 156, "chapter": "Endocrine", "front": "60-year-old woman complains of postural dizziness, increased sleep and constipation. Her daughter was noticed cognitive dysfunction in the form of loss of recent memory few months ago. On examination she has slightly puffy face and pallor. Her pulse is 60/min regular, BP is 130/90. Chest, heart and abdominal examination are normal, neurological examination show slow relaxation of tendon reflex. Laboratory: Hb 9.2, urea 25, creatinine 1.5 mg/dl, glucose 81 mg/dl\n\n1. What is the likely diagnosis?\n\n2.   Which investigations will support your diagnosis?\n\n3.   Give an explanation for anemia?", "back": "1. The diagnosis is hypothyroidism that manifested by sleepiness, cognitive dysfunction constipation,       mild   hypertension,     relative bradycardia and hyporeflexia.\n2. The laboratory investigations support the diagnosis are low serum Free T4, and raised TSH in primary hypothyroidism. Raised serum cholesterol. Anti-thyroid peridoxidase Ab positive in autoimmune thyroiditis. Thyroid ultrasonography\n3. Anemia in hypothyroidism can be:\n\na. Normocytic anemia: due to lack of stimulation of erythroid colony development, reduction in oxygen distribution to tissues and diminution of erythropoietin level. Replacement of levothyroxine corrects this type of anemia\n\nb. Macrocytic anemia due to pernicious anemia accompanying hypothyroidism and folic acid malabsorpation.\n\n¢. Microcytic anemia due to iron deficiency related to malabsorption."}, {"num": 157, "chapter": "Endocrine", "front": "A 34-year old woman presents with somnolence, headache, weight gain, menorrhagia. Physical examination reveals periorbital swelling, coarse hair, blood pressure 135/95, pulse 56 min and regular. Neck examination is unremarkable. Laboratory evaluation reveals the following: Free T4 0.2 ng/dl (N 4.5 — 12 ng/dl), TSH > 100 pU/ml (N 0.5-5), plasma cholesterol 280 mg/dL\n\n1. What is the probable diagnosis, explaining the present findings?\n\n2. Mention the different causes that result in this condition\n\n3. What is the treatment?", "back": "1. Primary hypothyroidism\n\nPeriorbital swelling, coarse hair, weight gain (decreased basal metabolic rate), diastolic hypertension (increased peripheral resistance), bradycardia (decreased response to catecholamines), hypercholesterolemia and the high TSH are the classical features of hypothyroidism. Primary hypothyroidism is usually associated with menorrhagia.\n\n2. Hypothyroidism may be             associated    with     goiter   or   not. Hypothyroidism is either:\n\n- Primary (thyroidectomy, radioactive iodine, idiopathic or Hashimoto thyroiditis)\n- Rarely secondary (pituitary or hypothalamic lesion e.g. sellar tomor).\n- The high TSH associated with low T4 in this case with the diagnosis of primary hypothyroidism.\n\n3. Treatment:\n\n- Levothyroxine replacement by oral tablets 1 hour before breakfast (full dose 1.6 pgm/kg/day as the patient has no cardiac troubles).\n- Follow up TSH is done every 6 weeks, with modifying the dose accordingly till TSH reaches the normal range.\n- Levothyroxine replacement will gradually improve all the clinical and laboratory abnormalities."}, {"num": 158, "chapter": "Endocrine", "front": "51 -year- old female with headache and nausea found to have a pituitary incidentaloma. CT brain revealed marked, mass-like diffuse enlargement of the pituitary gland extending and compressing the optic chiasm. Visual field testing: Normal. Laboratory investigations: TSH 150 (Normal: 0.40 - 4.50 mlIU/L), FT4: 0.1 (Normal: 0.8 - 1.8 ng/dL). Symptoms typical of hypothyroidism (fatigue, weight gain, cold intolerance, constipation, dry skin, and hair loss) were neglected for years. She was diagnosed with severe primary hypothyroidism and started levothyroxine replacement. Post treatment follow-up revealed marked regression of the size of the pituitary m the CT imaging and gradual improvement of thyroid function.\n\nLabs (Normal)                              12/2012      3/2013      9/2014\n\nTSH (0.40-4.50 mIU/L)                          150       22           1.2\n\nFT4(Normal: 0.8 - 1.8 ng/dL)                   0.1        0.9         1.6\n\n1. Given the presentation, serial imaging and lab findings, what is the correct diagnosis?                )", "back": "1. Longstanding primary hypothyroidism can induce massive pituitary hyperplasia, which can simulate a primary mass. Gland enlargement usually resolves after exogenous administration of thyroxine."}, {"num": 159, "chapter": "Endocrine", "front": "A 29-year-old woman presents with fatigue, tiredness, increase in body weight and infertility of 2 years duration. Her family history discloses a mother with type 1 diabetes mellitus. Examination revealed a pulse of 60/min, BP 130/95 and 125/90 in a visit to family doctor 1 month ago. Her thyroid functions were checked to reveal a TSH 8 mIU/L (normal range 0.4 - 4 mIU/L) and a normal FT3 and FT4.\n\n1. What’s your diagnosis?\n\n2. Explain the clinical situation and discuss the treatment policy", "back": "1. It is a state of subelinical hypothyreidism which could be due to an autoimmune cause if we consider the autoimmune diseases which are running in her family.\n2. Although this lady 1is       suffering from the    subclinical form of hypothyroidism yet clinically speaking she has many symptoms as fatigue, tiredness, increase in her body weight which is explained easily by the disease. A very important issue of the discase is the menstrual irregularities, subfertility and an ovulation which are usually misdiagnosed as a primary gynecological problem. The treatment of subclinical hypothyroidism is controversial, but the following now is approved:\n\n-   Asymptomatic individuals with TSH <10mIU/l may not need treatment but just follow up for the TSH every 6 months, to detect disease progression.           '\n-   Otherwise in patients with symptoms or wishing fertility, cognitive dysfunction, unexplained hypercholesterolemia, even those with a TSH <10 mIU/l need thyroid hormone replacement therapy as in our case."}, {"num": 160, "chapter": "Endocrine", "front": "A 25 year-old female patient presented with palpitation, dyspnea on exertion and loss of weight in spite of good appetite over the past 2 months. She has oligomenorrhea and irregular cycle. On examination, she is irritable, looked under built (BMI 19), exophthalmos with non-pitting L.L edema, diffuse symmetrical non tender thyroid swelling, There was fine tremors in the outstretched hands. Pulse rate was 130 bpm, regular, BP 150/70 mmHg.\n\n1. What is the most likely diagnosis?\n\n2. What investigations would you require to               confirm your diagnosis?\n\n3. How you proceed for treatmemnt?", "back": "1. The most likely diagnosis is thyreitoxicosis due to Graves' disease. The presence of a diffusely enlarged thyroid gland, thyrotoxic signs and symptoms, together with evidence of ophthalmopathy or dermopathy, can establish the diagnosis.\n2. The investigations: Laboratory: Free T4, free T3, TSH, thyrotropin receptor antibodies— the presence of this antibody is diagnostic for Graves disease.\n1. Imaging studies: Radioactive iodine scanning and measurements of iodine uptake are useful in differentiating the causes of hyperthyroidism. In Graves’ disease, the radioactive iodine uptake is increased and the uptake is diffusely distributed over the entire gland.\n2.    Thyroid ultrasound shows enlarged gland with an increased vascularity.\n3. Options of treatment include: antithyroid drugs (carbimazole or propylthiouracil [PTU]), radioiodine, and surgery.\n-   Anti-thyroid drugs: carbimazole, the initial dose 1s 20-30mg/day, higher dose 40-60mg 1n severe cases. Follow up and dose tapering is done according to response and control of thyrotoxicosis. Usual course/duration of therapy is 1-2 y. Alternatively, propylthiouracil 300-450 mg/day PO divided g8hr, with maintenance 100-150 mg/day divided q8hr. Remission in 40% at 5 years duration, relapse more than 60%. Propranolol controls cardiac and psychomotor manifestations 40-120 mg/day.\n-   Radioactive iodine treatment (contraindicated in pregnant and lactating females, progressive Grave’s opthalmopathy).\n-   Thyroidectomy (Large, retrosternal extension, noncompliance with medical therapy) Follow wup of thyroid function after surgery or radioiodine, levothyroxine is given when TSH becomes elevated. Checking serum calcium and phosphorus after surgery to exclude hypoparathyroidism due to removal of the parathyroids and starting calcium and vit D replacement if required."}, {"num": 161, "chapter": "Endocrine", "front": "A 56 year-old male patient presented to the emergency room with chest pain of one hour duration. He used to have similar episodes over the past 6 months, but with increasing frequency and severity. On examination, his BMI 19, he was apprehensive, staring, flushed and sweaty. There were bilateral and symmetrical fine tremors in his outstretched hands. Radial pulse rate was 140 bpm, irregular, Blood pressure was 170/50 mmHg. Temperature was 37.5 C. Examination of the neck showed congested pulsating neck veins with systolic expansion. There was an olive-size smooth swelling to the right of the trachea that freely moved up and down with deglutition. ECG showed AF and depression ST segment in V3, V4, V5, & V6.\n\n1. What is the most likely diagnosis? How would your diagnosis explain all the described abnormal physical signs?\n\n2. What would you expect to see on examination of his eyes?\n\n3. What investigations would you require to             confirm your diagnosis?\n\n4. Describe your immediate and subsequent treatment plans for this case?", "back": "1. Acute coronary syndrome as myocardial infarction or unstable angina. Thyrotoxicosis with atrial fibrillation.\n\nHe has history of recurrent chest pain suggestive of angina; the pain was increasing in severity and duration. The patient has thyroid nodule with symptoms and signs of thyrotoxicosis. Atrial fibrillation (AF) (radial pulse rapid, marked irregularity, pulse deficit >10, neck veins systolic expansion (absent a wave). Wide pulse pressure because of the hyperkinetic state of hyperthyroidism (high systolic due to increase stroke volume and low diastolic pressure due to peripheral vasodilatation).\n2. The eye examination: exophthalmos, staring look, lid lag (signs of sympathetic over activity in thyrotoxicosis) other signs of Graves' ophthalmopathy are not present as the patient has either toxic solitary nodule or dominant nodule of toxic nodular goiter.\n3. The investigations: follow up ECG, cardiac enzymes (serum troponin, CK-MB), urgent echo heart. TSH, Free T4, free T3, thyroid sonar ultrasound.\n4. The treatment plans are:\n\nImmediate: Admission to CCU for treatment of acute coronary syndrome and atrial fibrillation.\n\nAnti-thyroid drugs : carbimazole or propylthiouracil.\n\nSubsequent management:        for acute coronary syndrome:        Beta blocker, nitrate, ACE-I, aspirin + clopidogrel, (+/-warfarin). Thyroid scintiscan to define the cause of thyrotoxicosis (solitary toxic nodule versus dominant nodule in toxic nodular goiter) -2 Radioactive iodine treatment and follow up of thyroid function."}, {"num": 162, "chapter": "Endocrine", "front": "A 65-year- old man is referred by the cardiologist because he begins to complain from repeated anginal pains associated with dyspnea on mild exertion. He is generally healthy and his family history is inconclusive. On examination he was sweaty, pulse was 104/min irregular, BP was 125/80. A diffuse thyroid swelling was palpated, with irregular surface and fine tremors in both hands. ECG revealed AF. The following drugs were prescribed: propranolol, aspirin 81 mg/d and sublingual nitrates.\n\n1. What is your diagnesis? ~\n\n2. Mention essential investigations?\n\n3. Mention briefly how to treat the thyroid state in such case?", "back": "1. This is a case of hyperthyroidism which usually present by atypical presentation in elderly e.g. arrhythmia (AF), heart failure, depression, lethargy, anxiety, confusion, agitation, weight loss and osteoporotic fracture.\n\n2. Thyroid function should be measured which usually reveals a suppressed TSH with elevated FT3 and FT4. A thyroid sonography for detailed anatomy and any nodule-s present (number, size, echogenecity, vascularity).\n\n3. Treatment option (antithyroid drugs, surgery, radioactive iodine) Radioactive iodine is favoured in this patient after control of the hyperthyroid state with pretreatment with antithyroid drugs. Radioactive iodine treatment is a definitive treatment and it avoids the risk of surgery. However hypothyroidism is common in elderly following radioactive 1odine."}, {"num": 163, "chapter": "Endocrine", "front": "A 30 year old female patient presented to outpatient clinic by palpitation, 3 months after delivery of her last baby. On examination there was tachycardia, diffuse enlargement and tenderness of the thyroid gland. Her ESR was 80. Free T4 was high and TSH was low.\n\nWhat is your diagnosis? D=\n\nDefine this condition?\n\nHow to proceed to prove it? R\n\nHow treat this case? B", "back": "1. Post partum thyroiditis.\n\n2. Thyroid dysfunction occurring in 5-7% in women within the first 6 months postpartum. In 30-52% of females thyroid peroxidase antibodies (TPO) are positive which suggest a possible autoimmune etiology to postpartum thyroiditis. Most patients have a complete remission but some may progress to permanent hypothyroidism.\n\n3. Anti-thyroid antibodies (anti-thyroid peroxidase Ab, anti-thyroglobulin Ab), an elevated ESR. Thyroid scan and uptake (contraindicated if she is lactating) shows decreased uptake of the radioactive substance. Thyroid ultrasound shows increased vascularity of the gland. TSH receptor Ab (TRAB) is negative.\n4. Treatment depends on phase of thyroiditis. Women presenting with thyrotoxicosis may be treated with beta blockers to decrease palpitations. As symptoms improve, the medication is tapered off (anti-thyroid medications is unnecessary). The hypothyroidism phase is often treated with thyroid hormone replacement. Annual follow up for TSH"}, {"num": 164, "chapter": "Endocrine", "front": "A 32-year-old lady was diagnosed as Graves Disease. She presented with typical symptoms which included tiredness, palpitations, eye redness, ophthalmopathy, and exopthalmos. She received carbimazole and propranolol, but there is worsening of her eye condition. She had bilateral exopthalmos, reduced vision in the left eye, double vision, pain, grittiness, lid lag and lid retraction she was referred to the ophthalmology department. At this point her medication was increased, but still her eye condition.\n\n1. Define this ophthalmopathy?\n\n2. What is the plan for eye condition?", "back": "1. The eye condition is thyroid-associated orbitopathy, in this case termed Graves' orbitopathy. It is an organ specific autoimmune disorder associated with a thyroid disease that targets the extraocular muscles and retrobulbar tissues. It may be present in hyperthyroid, hypothyroid or euthyroid state. Graves' disease is the most common cause of thyroid ophthalmopathy. The ophthalmopathy is characterized by swelling of extraocular muscles. The lesions develop due to an accumulation of glycosaminoglycans and a lymphocytic infiltration of orbital and retro-orbital tissues. The mechanism for ophthamoplegia and optic neuropathy is the orbital swelling leading to mechanical restriction of ocular muscles and compression of optic nerve. The patients with Graves' orbitopathy managed combined endocrinological and ophthalmological expertise - except for the mildest cases improving with normalizing thyroid status and local measures. Selecting the most appropriate treatment for individual patients depends on the activity and severity of the eye changes. a. Better control and strict follow-up of thyroid dysfunction. b. Use of antioxidants (selenium) in mild forms c.    Local measures (artificial tears, ointments and dark glasses) and control of risk factors for progression (smoking and thyroid dysfunction) are recommended for all patients. d. High-dose glucocorticoids (GCs), methylprednisolone IV infusion 250 mg /week for 6 weeks, for moderate-to-severe active Graves' orbitopathy. Rehabilitative treatment (orbital decompression surgery, squint surgery or eyelid surgery) is needed in the majority of patients when Graves' orbitopathy has been conservatively managed and inactivated by immunosuppressive treatment."}, {"num": 165, "chapter": "Endocrine", "front": "A 27-year-old man presents with recently discovered diabetes mellitus. On physical examination, there is increased facial fullness and weight gain, proximal muscle weakness. Abdominal examination revealed purple striae. His blood pressure 150/95, fasting blood glucose 250 mg/dl, post-prandial 385mg/dl, serum Na 150 mEg/L, K 3.3 mEq/L. White blood cell count greater than 12,000/mm.\n\n1. What do you think about the diagnosis?\n\n2. What laboratory tests and imaging would you order to reach the proper diagnosis?", "back": "1. Cushing’s syndrome is the most likely diagnosis because of presence of facial fullness, an increased in weight, purple striae, and proximal muscle weakness, with diabetes mellitus and hypertension and hypokalemia. The laboratory test include two steps:\n-   Screening tests: two positive tests of the following tests are needed to confirm the diagnosis of Cushing's syndrome: High 24 hour urinary free cortisol (3-4 folds higher than normal). I mg Overnight dexamethasone suppression test: failure of suppression of morning cortisol (> 1.8 mcg/dl) due to failure of negative feedback inhibition of cortisol secretion in Cushing. Increased salivary cortisol (due to the absence of diurnal variation of cortisol secretion in Cushing’s syndrome) (done on 2 nights between 11 pm and mid night).\n-   The next step requires determining the etiology of Cushing's syndrome, i.e. the source of excess glucocorticoids either: ACTH-dependent: ACTH 1s high (>15pg/dl) (ACTH secreting pituitary adenoma or ectopic ACTH secretion (e.g. ACTH secreting pancreatic, bronchogenic carcinoma) o1\n\nACTH independent (adrenal tumor or hyperplasia) ACTH is low. An undetectable plasma ACTH with a simultaneously elevated serum cortisol level >15 mecg/dl is diagnostic\n-   High dose 8 mg dexamethasone suppression test can differentiate between ACTH secreting pituitary adenoma from ectopic ACTH secretion. Suppression of plasma cortisol by > 50% compared to base line suggests pituitary disease.\n-   MRI sella if failed to visualize the basophil adenoma which is micro in most cases, inferior petrosal simus sampling is done to detect the source of ACTH whether pituitary or ectopic (petrosal/peripheral ACTH ratio>2 suggests Cushing disease.\n-   In ectopic ACTH secretion chest and abdominal CT scan. Abdominal ultrasonography, CT and MRI in ACTH mdependent Cushing syndrome (adrenal tumor or hyperplasia)."}, {"num": 166, "chapter": "Endocrine", "front": "A 42 year old male presented with marked loss of weight, anorexia, progressive muscle weakness and newly discovered diabetes mellitus. He is a heavy cigarette smoker for the last 20 years. On examination he was plethoric, with proximal myopathy. Pulse 80/min, BP 160/100, RR 13/min, temp 37°C, ESR 100 mm/hr, s Na 131 mEg/L and K 2.9 mEq/L.\n\n1. What is your provisional diagnosis and explain?\n\n2. How to investigate your case?", "back": "1. Marked weight loss with very high ESR could point to malignancy. He is heavy cigarette smoker, we must consider bronchogenic carcinoma. The presence of muscle weakness could be due to hypokalemia secondary  to ectopic ACTH (paraneoplastic syndrome). Ectopic ACTH produced excess corticosteroid giving picture of Cushing syndrome (plethoric face, hypertension and diabetes).\n\n2. Any suspected case of Cushing should be subjected to the following:\n\n-   Demonstrate the increased steroid secretion by one of the following screening three tests. (24 hours urinary cortisol secretion, 1 mg overnight dexamethasone suppression test or salivary cortisol). If negative the diagnosis of Cushing is unlikely, if positive proceed to other test to confirm the diagnosis if other test is positive.\n\n-   Diagnosing the site of secretion ACTH:\n\nACTH measurement: High ACTH occurs in ACTH dependent Cushing (pituitary ACTH producing adenoma and ectopic ACTH secretion as bronchogenic carcinoma).\n\nHigh dose 8 mg dexamethasone suppression test (failure of cortisol to be suppressed by <50% compared to base line suggest ectopic ACTH secretion). Imaging (CT chest), bronchoscopy.\n\nInferior petrosal sinus sampling if pituitary source is suspeCted (>50% suppression of cortisol compared to base line) with normal pituitary MRL"}, {"num": 167, "chapter": "Endocrine", "front": "A 28-year-old female patient, married, has three daughters, suffers from gradual onset of weakness, lethargy and easy fatigability. Poor appetite with loss of weight about 15 Kg in one year. No fever, no symptoms suggestive chest, abdominal, cardiac troubles. She also received treatment for hypothyroidism 8 years ago and controlled. She has normal ESR, serum Na 124 mmol/l, K 5.7 mmol/l, her fasting blood glucose 55mg/dL. and CBC shows eosinophil 8%.\n\n1. What is the possible diagnosis? What is the relation between this condition and hypothyreidism?\n2. How to reach the diagnosis?\n\n3. What is the complication?", "back": "1. Adrenal insufficiency (Al) is the most likely diagnosis. The underlying etiology of adrenal insufficiency and hypothyroidism are autoimmune process, therefore, we consider these two entities part from polyglandular autoimmune deficiency syndrome.\n2. The diagnosis depends on a high index of clinical suspicion and is confirmed by biochemical evidence:\n- Low morning serum cortisol < 5 ug/dl is highly suggestive of Al (The diagnosts of Al is ruled out if morning s cortisol > 18 ug/dl.\n- If morning serum cortisol level is within normal range or low normal, Short ACTH stimulation test is mandatory: take blood samples for baseline cortisol and after 30 minutes and 60 minutes of 250 mcg ACTH injected IM or IV. Al is present if cortisol level at 30 or 60 minutes < 18 ug/dl. Normal response > 18 ug/dl and reflects the functional integrity of the adrenal cortex.\n\n- Adrenal antibodies detected in more than 90% of patients (21- hydroxylase antibody)\n3. The complication is acute adrenal insufficiency (Adrenal crisis) in stress situation eg. intercurrent infection, surgery, trauma.,"}, {"num": 168, "chapter": "Endocrine", "front": "A female patient was diagnosed as lupus nephritis. She was on 60 mg/d prednisolone, and then decreased to 15 mg/d. Three weeks ago, she developed fever, cough and expectoration. She interrupted her steroid doses, 4 days ago she suffered severe weakness, fatigue, nausea and vomiting. Physical examination: Glasgow coma score 7, BP 80/60, and no evidence of lupus activity.\n\n1. What is the diagnosis for last situation?\n2. How to treat it?", "back": "1. The diagnosis is acute adrenal insufficiency (adrenal crisis) In this case, the acute adrenal insufficiency is precipitated by sudden interruption of the dose of cortisol and infection. The patient was on glucocorticoids for long period due to lupus, exogenous steroid suppressed the hypothalamic-pituitary-adrenal (HPA) axis. Too rapid withdrawal of exogenous steroid may precipitate adrenal crisis. Also stress may increase cortisol requirements in excess of the adrenal glands' ability to respond immediately. The dose of steroid must be increased in case of stress eg. infection, surgery, sepsis and trauma. The treatment of acute adrenal crisis is a life threatening emergency should be treated on strong clinical suspicion rather than waiting for confirmatory test results (SSS Sugar Saline Steroid):\n\n-   Fluid replacement; large volumes of saline and 5% IV dextrose solutions\n-   Hydrocortisone 100 mg IV every 6 hours for 24-48 h, double replacement dose can be instituted until condition is stabilized\n-   In addition, treatment of precipitating cause often infection\n-   Fludrocortisone, is often not needed during acute adrenal insufficiency because signs or symptoms of adrenal crisis should resolve quickly over the following 1-2 hours after glucocorticoid therapy."}, {"num": 169, "chapter": "Endocrine", "front": "A 26-year-old man presented with elevated blood pressure (180/110 seated). Three months ago, his blood pressure was normal. He was admitted twice in the last month due to apprehension, severe headache, palpitation and diaphoresis, flushing. These episodes had an abrupt onset and lasted 10-15 minutes.\n\n1. What do you think the patient primary problem is and explain the presentation?\n\n2. What laboratory tests and imaging would you order to evaluate this patient?", "back": "1. The patient primary problem is recent onset of marked elevated blood pressure in 26-year-old man with attacks of headache, palpitation and diaphoresis. These findings are consistent with excess catecholamines, and episodes of their secretion. So, the possible diagnosis is pheochromocytoma.\n\nPheochromocytoma is a rare catecholamine-secreting tumor derived from chromaffin cells. It originates from adrenal medulla or outside it. About 15-20% of such tumors are extra-adrenal in origin and is termed paraganglioma (PGL) or extra-adrenal pheochromocytoma. Extra-adrenal pheochromocytomas develop in the paraganglion chromaffin tissue of the sympathetic nervous system. They may occur anywhere from the base of the brain to the urinary bladder, but are mostly intra-abdominal. The clinical manifestations of a pheochromocytoma result from excessive catecholamine secretion by the tumor. Catecholamines typically secreted, either intermittently or continuously, include norepinephrine and epinephrine. The laboratory tests:\n\nPlasama level of free metanephrines, sensitivity 99%. 24-hour urinary total metanephrines. The imaging studies are done after confirming the diagnosis biochemically: MRI, this is preferred over CT scanning. MRI has a reported sensitivity up to         100% in detecting adrenal pheochromocytomas, superior to CT scanning for detecting extraadrenal pheochromocytomas. Metiodobenzylguanidine (MIBG) radionuclide            scan   is   largely replaced now by gallium dotatate scan. Pheochromocytoma can be either sporadic or hereditary, with up to a quarter of sporadic cases having a known gene mutation. Hereditary pheochromocytoma occurs with neurofibromatosis (NF), multiple endocrine neoplasia (MEN 1 and 2), von Hippel-Lindau (VHL), and familial paraganglioma syndromes,"}, {"num": 170, "chapter": "Endocrine", "front": "A 47-year-old obese male (BMI 32.4 kg/m%) is suffering from burning sensation in feet, weight loss and fatigue. He noticed nocturia, polydipsia in the last month as well as cellulitis in right lower limb. Laboratory investigations showed normal complete blood picture, serum calcium and phosphorus, RBS: 350mg/dl, urine dipsticks glucose: +++, Ketones: negative, HBAlc: 11 %\n\n1. Whatis the diagnosis?\n\n2. What are the criteria for diagnosis of this disease?\n\n3. What is your plan in initial treatment of this case?", "back": "1. The diagnosis is type II diabetes mellitus. The diabetes mellitus may present by classic symptoms of hyperglycemia (polyuria, polydipsia, polyphagia), fatigue, loss of weight or infections. Patients may present with micro or macrovascular complications The diagnostic ADA criteria for diabetes mellitus;\n\nFasting plasma glucose concentration > 126mg/dL. on two separate occasions. Two-hour plasma glucose concentration of >200mg/dL after a 75g oral glucose tolerance test (OGTT). Random BG >200mg/dl accompanied by classical symptoms of hyperglyceamia or hyperglyceamic crisis Al1C >6.5% In addition to life style measures, insulin therapy is started because of many reasons: the high A1C and accompanied hyperglycemic symptoms (poyuria, thirst, weight loss), and the presence of lower limb infection. American Diabetic Association recommend intial treatment with insulin if Alc > 10% Blood glucose > 300 or if the patient has symptomatic hyperglycemia. Treating the lower limb cellulitis by appropriate antibiotic."}, {"num": 171, "chapter": "Endocrine", "front": "A 34-year- old woman who is in her second pregnancy is seen for prenatal care at 24 weeks gestation. Her weight is 77 Kg, BMI 30 and her blood pressure is 130/80 mmHg. The patient's past obstetric history includes the spontaneous vaginal delivery of a 4.5 kg male infant at 40 weeks gestation. Her family history reveals that her mother has type 2 diabetes mellitus.\n\n1. Should this patient be screened for gestational diabetes?\n2. What tests should be done to evalnate the patient's glucose tolerance?\n3. How is the diagnosis of gestational diabetes mellitus (GDM) established?\n4. What are the management strategies of GDM?", "back": "L. Gestational diabetes defined as carbohydrate intolerance of varying degrees of severity with onset or first recognition during pregnancy is usually done between 24 and 28 weeks gestation when the \"diabetogenic stress\" of pregnancy is present. However, early screening at onset of pregnancy is recommended for high risk patients. This patient has several risk factors for GDM since she is over 30 years of age, obese, has previous delivery of macrosomic infant and has a first-degree relative with type 2 diabetes. Evaluation of the patient's glucose tolerance can be done by either:\n\n-   One step: 2h 75 g oral glucose tolerance test (OGTT) or\n\n-   Two step: 1h 50 g (non fasting) screen followed by 3h 100 OGTT for those who screen positive (>140 mg/dl) GDM diagnosis is established if two of the following values are met:\n\n-   Fasting: > 92 mg/dl\n-   1h: 2180 mg/dl\n-   2h: 2153 mg/dl\n-   3 h: 2140 mg/dl Management of GDM includes: diet, exercise, insulin therapy and frequent self-monitoring of blood glucose. Caloric requirements of obese pregnant women are 20- 25 kcal/kg actual body weight divided into three meals and a bedtime snack. The diet emphasized complex carbohydrates with the avoidance of simple sugars. Insulin is initiated if the patient has considerable hyperglycemia at onset of GDM diagnosis or glycemic targets are not achieved by lifestyle interventions alone (preprandial <95 mg/dl ,2hpp < 120 mg/dl ) and is usually given as bed time NPH + preprandial short acting regular insulin"}, {"num": 172, "chapter": "Endocrine", "front": "A 48-year-old man with poorly controlled diabetes presented with a five-day history of facial and right eye pain, fever and blocked nose. He also suffered diffuse abdominal pain, nausea and repeated vomiting, On examination he was dehydrated, confused, and drowsy. There was acetone odor in breath and rapid deep respiration. His temperature was 39.2°C, pulse 116/minute, regular of small volume and BP 95/60. There was a swelling over the right maxilla with slight erythema, unilateral nasal obstruction with a necrotic inferior turbinate. Palatal ulceration was evident. There was right proptosis, chemosis, internal and external ophthalmoplegia. Hb 13.6 gm/dl, white cell count 20x10°/L. Random blood glucose 521 mg/dl. Blood urea 72 mg/dl, arterial PH 6.9, HCO3 12mmol/l, serum Na 135 mmol/ and urine dipsticks (ketones +++).\n\n1. What is the most likely diagnosis?\n\n2. What are the appropriate management steps?\n\n3. Enumerate another 4 life threatening infections in diabetics?", "back": "1. Diabetic ketoacidosis (DKA) in type 2 diabetes due to fungal infection (mucormycosis): hyperglycemia, metabolic acidosis with increased anion gap, urine is positive for ketones are the diagnostic criteria of DKA.\n\n-   Mucormycosis is one of life threatening infection that occur in . patients with uncontrolled diabetes. Mucormycosis is a commensal in the nose and nasal sinuses that becomes aggressive in patients with uncontrolled diabetes resulting in spread and invasion of the soft tissues, bones of the palate and sinuses reaching the brain causing cavernous sinus thrombosis. Management (treatment of diabetic ketoacidosis and treatment of MUCOrMycosis):\n\n- Treatment of DKA:\n- Rehydration with normal saline a total deficit 4-6 liters.\n- Intravenous regular insulin bolus 0.1-0.15U/kg followed by continuous infusion 0.1U/kg/hour\n\n- if serum potassium is low or normal add KCl to intravenous fluid (20-30mEg KCIl to each liter iv fluids) to keep potassium level between 4-5 mmol/l\n- HCO3 is added to iv fluids only in severe acidosis PH <7.\n- Take a scrap from the lesions in the sinuses for microscopic examination.\n- CT sinuses and skull base -» surgical debridement.\n- Start antifungal therapy amphotericin, posaconazole.\n3. Malignant   otitis  external,   emphysematous        cholecystitis        and emphysematous pyelonephritis and necrotizing fasciitis."}, {"num": 173, "chapter": "Endocrine", "front": "A 28 year old diabetic on insulin on awakening was found comatosed.\n\n1. What are the important points in the history?\n2. What are the important points in the examination?\n3. Mention 3 most important investigations?", "back": "1. Differential diagnosis for comatosed diabetic patient at this age. First hypoglycemia, diabetic ketoacidosis, CNS infection, cerebrovascular stroke and drug abuse. The important points in the history are: The time of last dose of insulin, how many units of insulin was given. Type of insulin (regular, intermediate, long acting or mixed types). The time of last meal in relation to last dose of insulin. If he is compliant with the medical treatment, diet regulation, and follow up schedule for blood glucose level. Fever, influenza like picture, or any history suggesting respiratory, GIT, UT infections few days before his recent conditions. The important points in examinations are: - Vital signs: temperature — fever indicates infections, pulse — tachycardia (+ fever or dehydration in ketoacidosis), (bounding pulse, cold clammy skin with dilated pupils in hypoglycemia) , BP — hypotension (dehydration), respiration — rate and type (rapid and deep respiration in metabolic respiration due to ketosis). Acetone odor, skin turgor, searching any skin infection (eg abscess). Abdominal tenderness, chest infection (pneumonia) and neurological examination. Neck rigidty (meningitis), lateralizing signs (stroke).. The three most important investigations are: immediate measuring of blood glucose level (hypoglycemia or hyperglycemia), detect the presence of ketone bodies by urine analysis, serum electrolytes (Na & K) and arterial blood gases."}, {"num": 174, "chapter": "Endocrine", "front": "A 15-year-old girl presents with her mother because she had noticed marked weight loss over the past few weeks. She had also noticed that her daughter seems pale, unwell and has abdominal pain. The patient’s body mass index (BMI) is 19. An eating disorder had been excluded. The girl has not had any serious illness but the GP had seen her on a number of occasions with minor disorders such as sore throats and recurrent coughs and colds. On questioning the girl further, the girl tells that she has been feeling really thirsty recently and passes lots of urine, even getting up at night a few times to go to the toilet.\n\n1. What is the probable diagnosis?\n2. What investigations must be ordered now?\n\n3. What should the GP be concerned about long term follow-up of the patient?", "back": "1. Diagnosis:\n-   Typel diabetes mellitus, ketoacidosis.\n2. Investigations:\n\n-   Glucose and ketones in the urine\n-   A finger-prick blood glucose.\n-   ABGs (PH, Bicarbonate....)\n-   Serum Na, K, blood glucose, HbAlc\n\n3. Late plan: Diabetic retinal, renal screening and foot examination. Health education of DM & Healthy diet Access to psychological care and support Close monitoring blood glucose, her insulin doses, regular follow up to help her manage her condition effectively."}, {"num": 175, "chapter": "Endocrine", "front": "A 15-year-old boy presented to the ER with abdominal pain, repeated vomiting not responding to antiemetic drugs for the last 2 days. On examination he was conscious, irritable, dehydrated, his pulse was 102/min regular, BP was 100/60. His mother noticed him with polyuria and polydipsia and bed wetting in last week.\n\n1.     What is your provisional diagnosis and how to prove it?\n2. What is the precipitating factor of this condition?\n3. How to manage this condition?", "back": "1. Diabetic ketoacidosis which is the classic initial presentation in type 1 diabetes (abdominal pain, vomiting, dehydration, hypotension, recent polyuria, polydipsia and bed wetting) a medical emergency that requires prompt recognition and management.\n- Laboratory findings include: blood glucose >250mg/dl, urine dipticks (tve for glucose and ketones) ABGs: metabolic acidosis with increased anion gap.\n\nThe precipitating factors are: Infection (30-40%), non compliance to treatment (25%), newly diagnosed type I (10-20%), insulin pump malfunction, inadequate insulin dose, myocardial infarction (1%), surgery. Correction of dehydration, hypovolemia, electrolyte abnormalities, hyperglycemia, electrolyte disturbance and metabolic acidosis:\n-     Intravenous fluids initially with normal saline, administration of regular insulin (iv infusion or repeated IM), KCL added to iv fluids (to keep serum potassium 4-5 mmol/l) and HCO3 if PH < 7.\n-     Mointoring BG hourly, repeated monitoring of electrolyte, BUN, creatinine and fluid balance.\n-     When the blood glucose < 250 mg/dL dextrose is added to IV fluids.\n-     The management is continued till arterial PH > 7.3, HCO3 > 18 mmol/l, anion gap is normalized. Start subcutaneous insulin 30 min before stopping insulin IV infusion.\n-     Newly diagnosed patients require additional time in hospital for institution of insulin regimen and diabetes education.\n-      The insulin regimen should be premeal (regular insulin or rapid acting insulin analog) and basal bedtime (intermediate insulin NPH or long acting insulin analog (eg glargine or detemir),\n-     The patient and his family should be educated about dietary instructions, method of insulin injections, preserving insulin, self glucose monitoring, avoiding, early detection and management of hypoglycemia."}, {"num": 176, "chapter": "Endocrine", "front": "A 38-year-old female presents with recurrent vulval candidiasis together with polyuria. She is a smoker of 12 cigarettes per day. She has gained approximately 20 kg in weight since the birth of her last child five years ago. During this pregnancy she recalls that she received insulin for approximately four months although this was discontinued after the birth of her daughter who is quite well. She also has two older children who are well although she did not receive insulin during those pregnancies. There is a strong family history of coronary artery disease; her father and paternal uncle both died in their fourties of heart disease. Her mother has diabetes and takes thyroxine for a thyroid problem., On examination she weighs 90 kg with a body mass index of 36.5 kg/m*. Her 82/min pulse, 82 /min and 140/95 mmHg B.P. Otherwise examination of the heart, chest and abdomen is unremarkable.\n\nFundal examination reveals nonproliferative diabetic retinopathy. There are no abnormalities of sensation in the feet or hands. Peripheral pulses are all normal,\n\nInvestigations reveal: Fasting plasma glucose 199 mg/dl, HbAlc 8.4%, serum urea 35 mg/dl (20-40), serum creatinine 1 mg/dl, serum alkaline phosphatase, AST and ALT and TSH are in the normal ranges, cholesterol 270 mg/dl, HDL 37 mg/dl and fasting serum triglyceride 268 mg/dl.\n\n1. What are the goals for glycemic control?\n\n2. Give a plan to reach these glycemic targets, give advantages or disadvantages of the used anti-diabetic agents?\n3. What are other medications should this patient receive?", "back": "1.   Goals of glycemic control: Fasting plasma glucose 80-130 mg/dl peak postprandial plasma glucose <180 mg/dl and HbAlc <7% (according to American Diabetes Association).\n2.   This patient is young obese person with type 2 diabetes and should initially be treated with lifestyle and dietary advice and metformin (normal renal function and no other contraindications). This approach should be adopted for at least two-three months prior to considering the introduction of additional therapy. Should this approach fail, then additional therapy such as sulphonylurea, thiazolidinedione (pioglitazone), DPP-4 inhibitor (e.g. sitagiltin), GLP-1 analogues (e.g. exenatide or liraghutide), SGT2 inhibitors, or basal insulin should be considered. Although insulin and sulphonylurea have high potential of lowering Alc they are associated with weight gain and increased risk of hypoglycemia. Sulphonylureas are also associated with acceleration of beta cell function deterioration. Pioglitazone and DPP4 inhibitor as add on therapy to metformin are effective on Alc lowering with low risk of hypoglycemia. Pioglitazone is associated with weight gain making it not a good choice for this obese women, while DPP-4 inhibitors are weight neutral so DPP4 inhibitors are better options than pioglitazone, insulin or sulphonylurea as add on therapy to metformin in this patient. SGT2 inhibitors are also associated with weight loss and some of them have cardiovascular benefits in patients with atheroscierotic CVD and patients with high cardiovascular risk, but increase slightly the risk of genital infection. GLP-1 analogues (e.g. liraglutide, semaglutide sc) are associated with weight loss which is good option for this obese women, liraglutide has in addition cardiovascular benefits in patients with atherosclerotic CVD, however there is increased risk of nausea, slight increase in the risk of pancreatitis and risk of pancreatic cancer is controversial also the high cost is an important issue.\n3.   The deranged lipid profile is typical of T2DM and frequently improves with diet, weight loss and exercise. However, in view of her multiple cardiovascular risk factors, statin and aspirin should be considered for cardiovascular protection: High intensity statin therapy is presecribed with LDL cholesterol goal < 100 mg/dL. Aspirin is not routinely given for primary preveation. It should be given in established THD.                                                             _ In addition to salt restriction ACE-inhibitor, calcium channe! blocker, thiazide are equally effective in improving cardiovascular outcome in this patient. Although thiazides may be associated with unfavorable effects on blood glucose and plasma lipids. Patients with diabetes should be treated to a blood pressure target <130 mmHg systolic and < 80 mmHg diastolic.                              '"}, {"num": 177, "chapter": "Endocrine", "front": "A 50-year-old male presented with edema of the lower limbs. He is diabetic on metformin (500 mg twice daily) and glibenclamide (5 mg once daily) for 8 years. There was burning sensation in feet, more severe at night. The patient reported that he was not able to keep the legs under the cover as the cover hurts his legs. On examination the patient is lying comfortably flat in bed, BP was 170/110 mmHg, pulse 88/min and regular. Hyperthesia in both feet on LL examination. Fundus examination showed microaneurysms and soft exudates, His fasting blood sugar was 244 mg/dl, his creatinine was 2.7 mg/dl Hb 7.3 gm/dl s cholesterol 275 mg/dl, HbAlc 10.3% , urine is +++ for protein. Abdominal sonography revealed normal sized kidneys with grade one echogenicity.\n\n1. What is the likely diagnosis? Explain the different findings?\n\n2. What other investigations you would like to order?\n3. How would you treat him?", "back": "1. Type 2 diabetes mellitus with hypertension (hypertension is common in advanced diabetic nephropathy and accelerates the deterioration of renal functions)\no The patient has the three microvascular complications: preproliferative diabetic retinopathy, CKD (LL edema, urine protein +++, elevated creatinine and echogenic kidney by sonar and neuropathy (hyperthesia) and peripheral neuropathy. The investigations are: urine analysis, albumin creatinine ratio (ACR), serum albumin, eGFR, serum Na and K, calcium, phosphorus, PTH, uric acid , lipid profile, liver function. Imaging; ECG, echo heart, dupplex lower limbs arteries as diabetes increases the risk of atherosclerosis Treatment:\n- o Starting insulin for glycemic control due to renal impairment and the - uncontrolled diabetes with Alc >10%. Metformin is contraindicated as it increases the risk of lactic acidosis with serum creatinine >1.5 mg/dl in men. Glibenclamide is not suitable because of the high creatinine increases the risk of hypoglycemia as well as beta cell failure as the patient has 8 yrs diabetes duration.\no Blood pressure control with BP target < 120/75 decreases the progression of diabetic nephropathy using calcium channel blockers, diuretics, P-blockers. ACE & ARBs are not of choice as serum creatinine >2.25 mg/dl.\no   Salt restriction and protein restriction to 0.8 gm/kg slows the deterioration of renal function.\no   Statin for hypercholesterolemia.\no   For painful neuropathy: Duloxetine, amitryptyline, carbamazepine, gabapentine, capsicum cream.\no   Treatment of renal anemia by erythropoietin after excluding other causes as iron deficiency (serum iron, iron binding capacity, ferritin +/- GI endoscopy).\no   Treatment of secondary hyperparathyroidism if present (renal osteodystrophy low Ca, high Ph, high PTH) Calcium carbonate (also as phosphate binder and alphacalcidol."}, {"num": 178, "chapter": "Endocrine", "front": "An obese middle aged man presented to the clinic with a fasting blood sugar of 115 mg/ml and a 2 hours post-prandial of 186 mg/ml. BMI 34kg/m?2.\n\n1. Define his glycemic state?\n2. What are the complications of this condition?\n\n3. What are the lines of management at this phase?", "back": "1. The glycemic state is an impaired glucose tolerance refered as prediabetes\n\n-   ADA criteria for diagnosis of prediabetes\n-   IFG (FPG 100mg/dl-125mg/dl\n-   IGT(2 hours value on 75 g OGTT of 140mg/dl to 199 mg/dl) Or A1C of 5.7%t0 6.4% Impaired glucose tolerance (IGT) progresses to type 2 diabetes in 34% of cases, IGT +HIFG progresses to type 2 in 65% over 5 years, prediabetics are at higher risk for cardiovascular events.\n\n. Management plan:\n\n-   Search for other criteria of the metabolic syndrome (blood pressure, waist circumference, lipid profile), uric acid, smoking history, family history in early cardiovascular disease.\n-    Life style modifications +/- metformin (an insulin sensitizer). Life style modifications include medical nutritional therapy (MNT) and regular physical activity (150min/week) of moderate intensity exercise aiming BMI < 25 Kg/m2. These measures will improve insulin sensitivity, and reduces blood glucose and delays or prevents the progression to type 2 diabetes.\n-   Annual checking of blood glucose & HbAlc % unless symptoms of diabetes are present which needs immediate blood glucose measuring."}, {"num": 179, "chapter": "Endocrine", "front": "A 38-year old nurse presents in a stuporous state, the blood glucose is 20 mg/dl. Additional blood is drawn and the patient is quickly resuscitated with intravenous glucose. History of recurrent attacks of sweating, drowsiness relieved by eating chocolate together with weight gain. Further testing on the saved serum reveals the following: serum insulin 45mU/ml (normal < 22}, Cpeptide 4.2 ng/ml (N 0.5-2) and proinsulin 0.6 ng/ml (N 0-0.2). A sulphonylurea drugs screen was negative.\n\n1. What is the most likely diagnosis? (discuss DD)\n2. Mention further investigations needed?\n\n3. Mention the treatment of choice for this patient?", "back": "1. Fasting (hyperinsuinemic) hypeglycemia due to insulinoma\n\n-    The elevated C-peptide and proinsulin levels, hypoglyceamia either insulinoma or exogenous sulophonylurea intake especially she is a nurse. The negative sulphonylurea screen makes insulinoma the most probable diagnosis.\n-   DD of hypoglyceamia: insulin, oral hypoglyceamic, critical illness, sepsis, addisonian crisis, insulinoma,\n2. Further investigations: Appropriate localizing procedures: CT pancreas, endoscopic ultrasonography (EUS).\n3. Surgical removal is the treatment of choice"}, {"num": 180, "chapter": "Endocrine", "front": "A 56 year old female patient presented for preoperative assessment for repair of a paraumbalical hernia, she gave history of hypertension for 3 years on medications. Her BMI was 43, BP 140/100, pulse 60/min regular, Plain x-ray chest and heart showed increased cardiothoracic ratio and ECG showed low voltage and sinus bradycardia.\n\n1. Explain and list the possibilities of the different data in this patient?\n\n2. What are other investigations you may need in this patient?", "back": "1. This patient is morbidly obese with BMI more than 40, hypertensive uncontrolled. This could be simple obesity however the sinus bradycardia and the low voltage ECG raise the possibility of hypothyroidism. The increased cardiothoracic ratio in the plain X-ray chest and heart may be either due to chamber enlargement or pericardial effusion if the patient had hypothyroidism.\n2. Thyroid function, serum free T4, TSH (hypothyroidism), lipid profile, fasting and 2- hours postprandial blood glucose for detection of diabetes or impaired glucose tolerance (obesity).             Serum creatinine. Echocardiography to detect the cause of increased cardiothoracic ratio (eg pericardial effusion)."}, {"num": 181, "chapter": "Endocrine", "front": "A 45 year old man who has been generally healthy, on his annual routine medical checkup, calcium was 12 mg/dl (nl 8.6-10.2 mg/dl) and phosphorus 2.2mg/dl (3-4.5 mg/dl).\n\n1. What is the most likely diagnosis?\n\n2. What symptoms and signs might the patient have had if questions were asked in a focused manner?\n\n3. What is the appropriate laboratory and radiclogy work up for this patient?\n\n4. What is the appropriate treatment of this asymptomatic patient?", "back": "1. The association of hypercalcemia and hypophosphatemia is most likely due to primary hyperparathyroidism.\n2. The manifestations of hypercalcemia:\n- Renal manifestations include urinary frequency, kidney stones (episode of flank pain).\n-   Gastrointestinal manifestations include anorexia, nausea, vomiting, abdominal pain (peptic ulcer disease), constipation, and acute pancreatitis.\n- Neuromuscular and psychologic manifestations include proximal myopathy, weakness and easy fatigability, depression, inability to concentrate, and memory problems.\n- Cardiovascular manifestations include hypertension and bradycardia.\n3. Investigations:\n\n- Laboratory investigations: In addition to serum calcium and phosphorus, 24 hr urinary calcium and phosphorus (High), creatinine clearance and serum PTH (high).\n-   Imaging:\n-   Abdominal ultrasound and plain UT may detect silent renal calculi.\n-   Bone mineral density (DEXA)\n4. Localisation of parathyroid adenoma: technetium 99m (99 mTc) sestamibi scintigraphy, with a sensitivity reaching 70-80%. Parathyroid four-dimensional (4D) CT can be done if available, with higher performance.\n\n5. Treatment: Although this patient has no symptoms, surgical treatment (parathyroidectomy) is the appropriate treatment as this patient is < 50 years and his serum calcium is above the high normal by more than one."}, {"num": 182, "chapter": "Endocrine", "front": "A 23-year-old woman presented with concerns about intermittent numbness of her extremities and generalized bone aches. She reported having had an episode where she “lost control” of her right leg and fell. Her total serum calcium level was 7.5 mg/dl (8.6-10.2mg/dl), serum phosphours 1.9 mg/dl (3- 4.5 mg/dl), and alkaline phosphatase 350 IU/L (44-147 IU/L).\n\nWhat is the most likely diagnosis? e\n\nMention common causes of hypocalcemia and DD?\n\nWhat are other recommended investigations? A\n\nHow to treat this condition? I", "back": "1. The diagnosis is Vit D deficiency (osteomalacia) because of hypocalcemia, hypophosphatemia and elevated serum alkaline phosphatase. Common causes of hypocalcemia:\n-   Vitamin D deficiency: lack of vit D in diet, often in conjunction with inadequate sun exposure (infants, children, old subjects), impaired absorption (celiac disease, inflammatory bowel disease, cholestasis), inability to process vit D due to hepatic disease and renal f
