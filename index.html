 consequent upon the arrest.\n\n1. What are the probable causes of cardiac arrest in this athletic man?\n\n2. How can you screen for these disorders in a young athlete starting his carrier in sport?", "back": "1. Athlete's heart is a constellation of structural and functional changes that occur in the heart of people who train for > 1 h most days. The changes are asymptomatic; signs include bradycardia, a systolic murmur, and extra heart sounds. The following conditions are rare in general populations but are common causes of cardiac arrest in athletes: Hypertrophic cardiomyopathy Wolff-parkinson-white syndrome Coronary artery anomalies Myocarditis Arrhythmogenic right ventricular dysplasia Marfan syndrome Brugada syndrome is a disorder characterized by sudden death associated with one of several ECG patterns characterized by incomplete right bundle branch block and ST elevations in the anterior precordial leads. Drug-induced arthythmias or stimulant use (e.g. pre-workout supplements, anabolic steroids, or recreational drugs). The management: - For screening:\n-   History of excessive unexpected fatigue, shortness of breath, near syncope or chest pain with exercise.\n-   Medical family history of sudden cardiovascular arrest, certain cardiovascular diseases as hypertrophic cardiomyopathy, Marfan syndrome ), and drug history (drugs that predispose to long QT syndrome) Physical examination : BP and cardiac auscuitation supine and standing , stigmata of Marfan syndrome Selected testing    based   on findings    on history    and physical examination. e.g investigations include:\n-   ECG, Holter continnous ECG monitoring, Stress ECG\n-   Echocardiography"}, {"num": 30, "chapter": "Cardio", "front": "A 30-year-old man presented to the emergency department and complained of dizziness and presyncope with subsequent fall to the floor. Three weeks ago, he was reported a syncope following physical exercise. On physical examination, pulse was 80/ min, blood pressure was 130/80mmHg. The abdomen and lungs were normal. There were no abnormal heart sounds and a grade 3/4 holosystolic murmur was heard over the mitral area radiating to the left axilla. The ECG observed signs of left ventricular hypertrophy.\n\n1. How you proceed to reach the diagnosis?\n\n2. Mention the steps in management of this case?", "back": "To reach the diagnosis for this case: The Echocardiography will demonstrate a pronounced left ventricular hypertrophy and dynamic obstruction to the left ventricular outflow and calculate the gradient. A mitral regurgitation may be present secondary to systolic anterior mitral motion. Most patients with HCM have abnormal diastolic function (whether or not a pressure gradient is present), which impairs ventricular filling and increases filling pressure, despite a normal or small ventricular cavity. Syncope may be due to dynamic LV outflow tract obstruction or arrhythmia as VF. ECG: Holter to exclude significant arrhythmias. So the diagnosis is hypertrophic cardiomyopathy (HCM). It is a genetic cardiovascular disease, defined by an increase in left ventricular wall thickness and particularly the septum that is not solely explained by abnormal loading conditions. This disorder is caused by a mutation in cardiac sarcomere protein genes and is most frequently transmitted as an autosomal dominant trait. HCM has a variable presentation. HCM is the leading cause of sudden cardiac death in preadolescent and adolescent children. NB: It is recommended that first-degree relatives undergo cardiac screening periodically.\n\n1. The management will be:\n-  Medical treatment with negative inotropic drugs, such as betablockers, which diminish myocardial oxygen consumption by decreasing heart rate, contractility and myocardial stress. These drugs also relieve left ventricular outflow obstruction, during exercise, leading to clinical improvement. A second alternative is calcium channel Dblockers. Antiarrthythmic drugs: amiodarone, and disopyramide (rarely)\n-   Surgical and catheter-based therapeutic options:\n-   Left ventricular myomectomy\n-   Mitral valve replacement\n-   Permanent pacemaker implantation\n-   Catheter septal ablation\n-  Placement of an implantable cardioverter defibrillator, that can detect and correct any dangerous arrhythmias (VT, VF).\n- Heart transplantation The following caveats are warranted: Avoid nitrates and sympathomimetic amines, except in concomitant coronary artery disease, avoid digitalis, and use diuretics with caution."}, {"num": 31, "chapter": "Cardio", "front": "A 30-year-old woman presented to the outpatient clinic complaining of infrequent atypical chest pain and palpitation. On examination: pulse rate 90/min with infrequent irregularity, blood pressure 120/70 mm Hg. Cardiac examination revealed a mid systolic click over the mitral area.\n\n1. What is the expected diagnosis and how will confirm it?\n\n2. What is the prognosis of this diagnosis?", "back": "1. The diagnosis is mitral valve prolapsed (MIVP). MVP is a billowing of mitral valve leaflets into the left atrium during systole. The most common cause is idiopathic myxomatous degeneration. MVP is usually benign, but complications can occur.\n\n-   Diagnosis is depending on the echocardiographic criteria Classic MVP: The parasternal long-axis view shows more than 2- mm superior displacement of the mitral leaflets into the left atrium during systole, with a leaflet thickness of at least 5 mm. Nonclassic MVP: Displacement is more than 2 mm, with a maximal leaflet thickness below 5 mm. Other echocardiographic findings that should be considered as criteria are leaflet thickening, redundancy, annular dilatation, and chordal elongation. (Thickened (> 5 mm), redundant mitral valve leaflets are thought to indicate more extensive myxomatous degeneration) Additional tests may include: ECG: Often normal but may show nonspecific ST-T changes orarrhiythmias. Holter monitoring: If palpitations are significant or arrhythmia is suspected.\n\n2. The prognosis is excellent in the absence of significant regurgitation,\n-   Most patients are asymptomatic. Those with symptomatic MVP typically present with symptoms related to:\n-   Progression to mitral regurgitation\n\n-   An infective endocarditis, stroke or arrhythmia (atrial premature beats, paroxysmal atrial tachycardia, AF, ventricular premature beats, complex ventricular ectopy)\n-   ‘Sudden death occurs in < 1%, most often resulting from ruptured chordae tendineae and flail mitral valve leaflets.\n-   Death due to a ventricular arrhythmia is rare."}, {"num": 32, "chapter": "Cardio", "front": "A male patient 48 years old, is complaining of peripheral edema one month ago and increasing abdominal distension. There was exertional dyspnea and easy fatigability. There was no orthopnea or paroxysmal nocturnal dyspnea. On examination he was afebrile, a raised JVP mild crackles at the bases of both lungs and ascites. ECG: atrial fibrillation. An abdominal ultrasound showed distended hepatic veins consistent with right ventricular cardiac failure,\n\n1. What is the cause of systemic venous congestion in this case?", "back": "1. There are many causes of systemic venous congestion. Right ventricular failure leads to mcreased hydrostatic capillary pressure in systemic capillaries resulting in peripheral edema or genecralized edema, ascites and congestive hepato-splenomegaly. The most common cause of rightsided heart failure is left-sided heart failure (due to ischemic heart disease, cardiomyopathies, congenital, valvular and hypertensive heart diseases).\n\nAt the same time, it is equally important to emphasize that systemic venous congestion may not be specific for HF because it occurs in various states of end-stage organ dysfunction, such as advanced stages of nephropathy.\n\nConstrictive pericarditis should be considered in the differential diagnosis of systemic venous congestion. -Pathophysiclogy     of    constrictive     pericarditis:   in   constrictive pericarditis the thickened and non-compliant pericardial sac acts as a constraint around the heart preventing the diastolic filling phase of the heart. This serves to equalize the pressures in the four chambers during diastole, a subtle sign that may be identified by echocardiography. Functionally, the changes during diastole lead to impaired filling of the heart causing venous back pressure and failure of outflow -In the majority of cases, the underlying cause for this change in the pericardium is unknown. Common causes include tuberculosis, following open heart surgery, radiation, direct trauma, and following viral infection. The symptoms and signs of constrictive pericarditis are variable and often attributed to right sided heart failure or cirrhosis.\n\n-Due to the difficulty in the clinical diagnosis, investigations often prove vital   in making the     diagnosis.      Important investigations   include echocardiography, CT, MRI and cardiac catheterization ."}, {"num": 33, "chapter": "Cardio", "front": "A 60-year-old man with long standing hypertension presented to the ER with a sudden onset of severe excruciating central chest pain referred to the back. On examination B/P was 170/90 right arm and 110/70 left arm with unequal pulses. Carotid pulsations were faint on the left side. ECG and cardiac enzymes were reported to be normal. Chest x ray showed mild left sided pleural effusion.\n\n1. What is possible cause of this patient’s chest pain?\n\n2. What is the examination of cheice to prove your diagnosis?\n\n3. Mention two possible complications that happened to this patient based on examination and chest x ray findings ?", "back": "L. The possible diagnosis is aortic dissection in a male with long standing hypertension.\n\nAortic dissection is a life-threatening condition characterized by the tearing in intimal layer of the aortic wall, creating a false lumen that can compromise blood flow to vital organs. This condition typically presents with sudden, severe chest or back pain and may lead to catastrophic complications such as aortic rupture, cardiac tamponade, or organ ischemia. This involves after the origin of brachiocephalic artery extending to left common carotid and left subclavian arteries so BP is lower on the left arm than the right arm and carotid pulse is weak on the left side. Computed tomography angiography (CTA) is the first-line imaging modality in most cases due to its high sensitivity and specificity, widespread availability, and rapid acquisition.\n-   This modality provides detailed images of the aorta, showing the intimal flap, true and false lumens, aortic dilation, hematoma, and complications such as contrast leak (indicating rupture) and branch vessel involvement Dissection involving the left subclavian and carotid arteries (ischemia to affected area) and left side effusion points to possible leak from the aorta."}, {"num": 34, "chapter": "Cardio", "front": "A 69- year- old male patient presented to ER with chest pain referred to the back and mild dyspnea starting few hours ago. He is a chronic heavy smoker and hypertensive for more than 20 years ago, non compliant to treatment. On examination BP was 180/120 on the right arm and 100/70 on the left, mild tachypnea with no hypoxia, afebrile. There was increased second heart sound over the aortic area. Normal other system review ECG showed criteria of left ventricular hypertrophy, chest x-ray showed wide mediastinum Doppler of left upper limb showed monophasic damped flow pattern and the right showed normal triphasic waveform.\n\n1. What is most likely diagnosis?\n\n2. What other investigations to be done?\n\n3. Discuss lines of management?", "back": "1. A case of aortic dissection mostly located at ascending or aortic arch, before the origin of left subclavian artery, and may include aortic valve due to chronic hypertension not compliant to adequate treatment\n\nMultislice CT angiography to demonstrate the extent of dissection and if renal arteries were included:\n\nLaboratory examination to exclude renal affection and as preoperative preparation for urgent surgery\n\nWe must lower SBP to below 120 mm Hg during the first hour. The preferred medications are a combination of narcotic analgesics (morphine sulfate), labetalol, nicardipine, nitroprusside with beta-blocker (esmolol). Beta blockade should precede vasodilator administration, if needed for BP control or to prevent reflex tachycardia or inotropic effect CCBs (verapamil, diltiazem) are an alternative to beta blockers.\n\nEndovascular or surgical intervention: patient selection depends on factors like anatomy, dissection extent, and complications influence outcomes.\no   Thoracic endovascular aortic repair (TEVAR) involves placing a stent-graft to seal the dissection entry tear and - exclude the false lumen, promoting healing and remodeling of the aorta. TEVAR is associated with significantly lower morbidity and mortality compared to open surgical repair.\n\no   Open surgery 1is reserved for cases where TEVAR is not feasible or for patients with severe complications. Long term antihypertensive treatment with tight control\n\nCessation of smoking with treatment of COPD if present"}, {"num": 35, "chapter": "Cardio", "front": "A 45- year- old male patient, heavy smoker with BMI of 35 was admitted to the ER with sudden collapse following right calf swelling and tenderness of 2 days duration. On examination the patient was drowsy his B/P was 80/60, pulse110/m, with pale and cold extremities the right lower limb was swollen with tense calf muscles .Cardiac examination was unremarkable with evidence of dullness over the base of the right lung posteriorly.\n\n1. What is the possible cause of this patient’s collapse?\n\n2. Mention the initial screening test that can help in diagnosis and what is the diagnostic modality?\n\n3. What will be the 1 line of treatment in such a case?", "back": "I. Massive pulmonary embolism following right lower limb DVT\n\n2. The initial screening test: D-dimer.\n-   D-dimer is a marker of fibrinolysis, can be applied to rule out pulmonary embolism (PE). False positive D-dimer test in conditions of enhanced fibrin formation (e.g malignancy, DIC). So, the sensitivity of D-dimer 1s high in PE but it has poor specificity.\n\n-   The combination of a normal, high-sensitivity, quantitative D-dimer test result and an unlikely clinical probability has enough negative predictive value to rule out acute PE with further imaging.\n-   Computed tomography pulmonary angiography (CTPA): It has high sensitivity and specificity.\n3. Anticoagulation is the cornerstone of PE therapy for all risk levels, there is consensus to start empiric therapeutic anticoagulation while awaiting diagnostic    results. = Low-molecular-weight       heparin     (LMWH), fondaparinux or unfractionated heparin (UFH)             can be used for anticoagulation in acute PE. LMWH and fondaparinux are preferred since they lower the incidence of inducing major bleeding and heparin-induced thrombocytopenia. UFH is wusually only used in patients with hemodynamic instability in whom primary reperfusion treatment might be required or in patients with renal impairment.\n-   The reperfusion therapies 1s the most important either thrombolytic therapy (tPA) or catheter based therapy (suction embolectomy, rotational embolectomy, thrombus aspiration, or combining mechanical fragmentation with pharmacological catheter-directed thrombolysis).\n-   The hemodynamic instability is consistent with massive pulmonary embolism, following reperfusion treatment and hemodynamic stabilization, patients recovering from high-risk PE can be switched from parenteral to oral anticoagulation.\n-    The anticoagulant 3 to 6 month if provoked DVT or lifelong if unprovoked DVT: either newer oral anticoagulants (NOACs) or vitamin K antagonists (VKA) warfarin."}, {"num": 36, "chapter": "Cardio", "front": "A female patient 42 year old presented to the ER with dyspnea and frothy expectorations with a history of persistent headache of one day duration, not relieved by analgesics On examination the pulse was 120 bpm , afebrile, the blood pressure was 210 /140, bilateral mid-zonal inspiratory crepitations and audible abdominal bruit , hypoxic, hypocapnic. He was rapidly kept on non invasive mechanical ventilation All laboratory investigations were within normal ranges\n\nAbdominal ultrasound revealed unequal kidney size and echocardiography showed mild concentric left ventricular hypertrophy in addition to normal contractility and other dimensions.\n\n1. What is most likely diagnosis?\n\n2. What other investigations to be done?\n\n3. Discuss other lines of management?", "back": "1. Hypertensive emergency complicated by pulmonary congestion mostly accelerated hypertension and flash pulmonary oedema secondary to renal artery stenosis which is one of the causes of secondary hypertension. The diagnosis is supported by unequal kidney size in ultrasound. Being a female in child bearing period may point to diagnosis of fibromuscular dysplasia as a cause of renal artery stenosis.\n\nInvestigations needed:\n\nRadiological: Renal vessel duplex to search for direct evidence (stenotic segment with increase velocity and increased aorto-renal ratio in peaked systolic velocity (PSV) more than 3.5) or indirect evidence (low intrarenal resistivity index)\n\nMultislice CT renal angiography if normal kidney functions or magnetic resonance angiogram (MRA)\n\nConventional angiography as diagnosis and may be therapeutic if proved to have renal artery stenosis in same setting Lab: May be needed to exclude other causes of secondary hypertension if the imaging is not conclusive, (Cortisol level, thyroid profile and lipid profile ...). Kidney functions, ESR.\n\nHypertensive emergency treatment (e.g IV nitrates) improve after load, diuretics, morphia Weaning from mechanical ventilation.\n\nStart oral antihypertensive (ACE or ARB or CCB as she has unilateral lesion but ACE or ARB are contraindicated in case of bilateral renal artery stenosis or renal artery stenosis in single kidney). Renal angioplasty (balloon dilatation +stenting). Follow up hypertension that may resolve after intervention."}, {"num": 37, "chapter": "Cardio", "front": "A 53 -year- old female presented with severe epigastric pain, vomiting, mild abdominal distension together with dark colored stools few hours ago. She is non smoker, was known to have atrial fibrillation, non compliant to anticoagulant therapy which was given for the last 4 years. On examination, she had rapid irregular pulse 130 bpm, BP 120/60, low grade fever, normal blood glucose, mild abdominal distension and decrease intestinal sounds. Chest and neurological examinations were free\n\nOn laboratory investigations normal hemoglobin and coagulation profile, mild leukocytosis, increase serum amylase. There was metabolic acidosis and high lactate level. Abdominal ultrasound showed jejunal distension. ECG showed atrial fibrillation with rapid ventricular response\n\n1. What is most likely diagnosis?\n2. What other investigations to be done?\n\n3. Discuss lines of management?", "back": "1. Acute mesenteric ischemia likely embolic due to atrial fibrillation non adequately anticoagulated Other differential diagnoses but less likely include: perforated gut, acute pancreatitis or bleeding gastric or duodenal lesion (ulcer or malignancy) and acute portal venous thrombosis. The other investigations:\n\n-   Urgent X-ray abdomen in the erect posture.\n\n- Mesenteric arterial and venous colour Doppler and assessment of the portal vein as well. If the mesenteric vessels are non visualized due to colonic distension.\n- Multislice CT mesenteric angiopgraphy\n- CT abdomen and pelvis with IV and oral contrast\n- If negative results then upper GI endoscopy Lines of management: Control rate of fibrillation , analgesics , complete gut rest , nasogastric tube     insertion for gut decompression , broad spectrum antibiotics\n\nIf proved mesenteric ischemia then urgent exploration to resect gangrenous loops and re- anastomosis.\n\nAnticoagulation stopped just before surgery and resumed post operatively unless contraindicated ."}, {"num": 38, "chapter": "Cardio", "front": "A 65 year old female with a history of dyslipidemia presents to your office with complaints of palpitations that started last evening. No other past medical history. She admits to similar episodes on and off for the last few months. ECG showed atrial fibrillation with ventricular rate of 114/ minute.\n\n1. What is your general management plan?", "back": "Management plan: The comerstones of atrial fibrillation (AF) management are rate control and anticoagulation and rhythm control. Rhythm control strategy:\n\n-   Electrical cardioversion is the preferred due to its greater efficacy and rapidity compared to pharmacological cardioversion alone. Immediate synchronized electrical cardioversion is indicated for AF with associated hemodynamic instability. In patients with AF lasting >48 h, at least 3 weeks of therapeutic anticoagulation or imaging to rule out intracardiac thrombus 1s recommended before elective cardioversion, with continued anticoagulation for at least 4 weeks post-cardioversion to prevent thromboembolism.\n\n-   Pharmacological cardioversion: can be an option for stable patients, include intravenous amiodarone, which has a slower conversion time of up to 812 h. Dronedarone, flecainide, or propafenone are used in the absence of heart disease.\n\n-   Catheter ablation: among rhythm control strategies, catheter ablation is more effective in patients with recurrent symptomatic AF despite antiarrhythmic drug therapy and in those without significant left atrial enlargement or multiple comorbidities\n\nRate control: age > 65, less symptomatic, hypertension, recurrent AF, previous antiarrhythmic drug failure, unlikely to maintain sinus rhythm (enlarged LA). ~-A beta-blocker or calcium-channel blocker (verapamil or diltiazem) used for rate control. Digoxin is not advised as a first-line agent pertaining to its adverse effects and tolerance Selecting an anticoagulant regimen -For patients with AF and an elevated CHA2DS>-VASc (congestive heart failure, hypertension, age >75 years [doubled], diabetes mellitus, prior stroke or transient ischemic attack or thromboembolism [doubled], vascular disease, age 65-74 years, sex category) score of 2 or greater in men or 3 or greater in women, oral anticoagulants are recommended. -Direct oral anticoagulants (DOACs) (dabigatran, rivaroxaban, apixaban, and edoxaban) are recommended over warfarin, except in patients with moderate-to-severe mitral stenosis, a mechanical heart valve, or specific thrombophilia (such as antiphospholipid syndrome), where warfarin remains the recommended treatment. If warfarin is chosen for anticoagulation, a target international normalized ratio (INR) of 2-3."}, {"num": 39, "chapter": "Cardio", "front": "A 56 —year- old known hypertensive male patient, presented with an attack of palpitation. By examination he was conscious lying flat in bed, blood pressure 220/110, radial pulse 130/min and apical pulse 150/min, irregular. His past medical history, apart from hypertension, was unremarkable.\n\nWhat is your possible diagnosis? A\n\nWhat further investigations would you do?\n\nWhat is your plan of management in this emergency situation?\n\nWhat is your further plan of management after stabilization of his emergency condition?", "back": "1. Atrial Fibrillation (AF).\n2. ECG , Echocardiography transthoracic and transesophageal , electrolytes and thyroid function tests.\n3. Control BP, with mentioning of different drugs, either rate or rhythm control after checking TEE, with description of different medications.\n4. Rate and rhythm control medication, calculation of CHA,DS;-VASc score for decision of anticoagulation. CHADS:-VASc score=1 (anticoagulation is considered but not recommended). CHA2DS2-VASc score C= congestive heart failure, H = hypertension, A2 Age >75 years, D= Diabetes mellitus, S2= prior stroke or TIA or embolism, V= vascular disease, A= Age 65-74 years, Sc= Sex (female)"}, {"num": 40, "chapter": "Cardio", "front": "An 83-year-old known hypertensive female patient, fell down and unfortunately had fracture neck femur and she was operated upon and discharged from hospital. One week after discharge, she started to develop unilateral painful lower limb edema.\n\n1. What is your possible differential diagnosis for her unilateral lower limb edema?\n\n2. After two days she started to develop acute dyspnea and palpitation, what is your final diagnosis?\n3. What further imaging and laboratory tests do you suggest for this patient?\n\n4. What is your plan for management for this patient?\n\n5. What are the possible risk factors for her condition?", "back": "L. The possible differential diagnosis for umnilateral lower limb edema: deep    venous   thrombosis   (DVT),    rupture   Baker’s   cyst,   cellulitis, lymphedema, trauma, venous insufficiency thrombophlebilits. The possible diagnosis is DVT. Pulmonary embolism. ABG, D-dimer, ECG, CXR\n\n-    Along with routine test CBC, urea, creatinine and electrolytes\n\nUrgent LL venous duplex on swollen limb and echocardiography\n-    CT pulmonary angiography, and VQ scan (in whom CTPA is contraindication).\n\nIf the patient is vitally stable, anticoagulation is started with mentioning of different types.\n\ne If the patient is vitally unstable thrombolytic therapy (tPA) or or catheter based therapy should be considered. Bed ridden, dehydration and surgery."}, {"num": 41, "chapter": "Cardio", "front": "A 33 -—year-old female patient presented with recurrent post prandial abdominal pain. Her past medical history and examination were free, vital signs were normal, CBC was normal, ESR was 20 in the first hour, kidney and liver functions were normal. The patient isn’t diabetic or hypertensive.\n\n1. What is the possible differential diagnosis for this patient?\n\n2. What investigations will you ask for?\n\n3. The patient then entered the emergency department with acute abdomen, and she was operated upon, and she was found to have gangrenous intestine, what is your final diagnosis?\n\n4. What is your plan of management?", "back": "1. The differential diagnosis is wide ranging from simple indigestion to serious condition, dyspepsia, irritable bowel syndrome, peptic ulcer, Crohn's disease, mesenteric vascular occlusion, familial meditarean fever (FMF) and rare Celiac compression syndrome. Mesenteric and Celiac duplex, thrombophilia screening, autoimmune profile, CT angiography for the abdomen. Mesenteric vascular occlusion.\n\nAnticoagulation and treatment of the cause if autoimmune disease."}, {"num": 42, "chapter": "Cardio", "front": "A 50 —year- old male patient with history of deep venous thrombosis {reated with warfarin within its therapeutic range, had an attack of haematemesis. Upper endoscopy revealed active bleeding peptic ulcer. Duplex ultrasound revealed subacute thrombosis of the common femoral, and superficial femoral veins.\n\n1. What is the next step you suggest for this patient?\n\n2. What is the long term recommendation for this patient?\n\n3. What is the work up you recommend for this patient for unprovoked deep vencus thrombosis?", "back": "1.    Active bleeding is absolute contraindication for anticoagulation so will stop anticoagulation admit to ICU, do INR test, give plasma and vitamin K if INR prolonged more than the therapeutic range, proton pump inhibitor infusion and upper endoscopy Then according to thrombosis risk and bleeding score (HAS-BLED score), classification of the ulcer in endoscopy will take decision of restarting anticoagulation after bleeding stop in ICU. HAS-BLED score: H: Hypertension: Systolic blood pressure greater than 160 mmHg. A: Abnormal renal or liver function: Dialysis or creatinine > 200 pmol/L or liver disease with bilirubin > 2x ULN with ASAT/ALAT/AP > 3x ULN. S: Stroke history: Previous stroke or transient ischemic attack. B: Bleeding, previous major bleeding or predisposition to bleeding. L: Labile INR: Poorly controlled INR (International Normalized Ratio) with time in therapeutic range <60%, E: Elderly: Age > 65 years. D: Drugs or alcohol: Concomitant use of antiplatelet agents, NSAIDs, or excessive alcohol consumption. Interpretation of the score: Low risk: 0 points, Moderate risk: 1-2 points and High risk: 3 or more points. Inferior vena caval filter\n\nThrombophilia screening especially if there's positive family history, autoimmune profile and search for malignancy."}, {"num": 43, "chapter": "Cardio", "front": "A 55 —year- old woman known hypertensive , presented with vertigo and attacks of disturbed conscious level, and attacks of loss of vision, carotid duplex ultrasound revealed right internal carotid artery plaque causing 55% stenosis.\n\n1. What is the possible laboratory and imaging investigation do you recommend for this patient?\n\n2. What is your plan for management of this woman?\n\n3. What is her possible risk factor?", "back": "I. Carotid artery stenosis is a consequence of systemic atherosclerotic disease, any risk factor predisposing a patient to progressive atherosclerosis should be managed, fasting plasma glucose, hemoglobin A1C, total cholesterol, triglycerides, low-density lipoprotein cholesterol (LDL-C), high-density lipoprotein cholesterol (HDL-C), C-reactive protein, and homocysteine screening.\n\nImaging studies: A digital subtraction arteriography, magnetic resonance arteriography (MRA), or computed tomographic (CT) arteriography is required to confirm the diagnosis and plan a surgical approach if indicated. Gadolinium-enhanced MRA is better for differentiating high-grade stenosis, MRI is considered the best modality to image not only the degree of stenosis, but also the characteristics of the plaque which leads to increased embolization.\n2. The plan of management:\n\nLifestyle Modifications, (DASH) diet, exercise at least 150-300 minutes per week. Proper treatment of blood pressure, as it is related to decrease and regression of carotid stenosis. Treatment of any risk factor if present, eg, lipid lowering agents (LDL~C reduced to <50 mg/dL), control of blood glucose and body weight ---- Dual anti-platelet drugs (aspirin, clopidogrel, and ticagrelor), with correction of the risk factors. Follow up is very important for the progress of the atherosclerosis. Symptomatic stenosis: For patients who have experienced symptoms like our patient stroke or transient ischemic attack (TIA) due to carotid artery stenosis, both Carotid Endarterectomy (CEA) or Carotid Artery Stenting (CAS) are viable options, especially with moderate to severe stenosis (50% or greater).\n3. Hypertension, dyslipidemia & may be prediabetic or diabetic."}, {"num": 44, "chapter": "Chest", "front": "A 30-year-old woman presents with episodes of dyspnea, chest tightness, and cough productive of clear sputum. She says that she has had similar episodes over the last 2 years. The episodes occur approximately twice per month, and they are sometimes triggered by vigorous exercise. This is the first time she has sought clinical attention for these episodes. She does not take any medication. Physical examination is significant for bilateral wheezes on forced expiration. Vital signs are temperature 36.6°C, pulse 86 /minute, RR 18/min, blood pressure 120/80.\n\n1. What is the most likely diagnosis?\n\n2. What is the next step in diagnosis?\n\n3. Office spirometry demonstrates an FEV1I/FVC below 70% that increases to 90% after administration of inhaled albuterol. How would you manage her condition?\n\n4. The patient does not wish to stop exercising because it is a very important part of her social life. What options exist for this patient?", "back": "1. The diagnosis is bronchial asthma. This patient has classic asthma triad (episodes of dyspnea, cough, and wheezing). Symptoms are caused by bronchial hyper-responsiveness, Asthma may be induced by exercise. The initial test in a patient with suspected asthma is spirometry. If spirometry ~ demonstrates     an     obstructive   pattern,   perform bronchoprovocation test (in this patient spirometry demonstrates an FEV1/FVC of 70% that increases to 90% after administration of inhaled albuterol).\n\nQutpatient asthma management involves administering medications and avoiding precipitants:\n\n-   Pharmacological therapy: Guided by disease severity. This patient with mild intermittent asthma should take a short-acting inhaled -2 agonist (bronchodilator) such as albuterol to control her symptoms on the needed basis.\n-   For long-term control, low-dose inhaled corticosteroids (ICS) are often prescribed, either alone or in combination with a long-acting beta-agonist (LABA). Other options           may    include    leukotriene modifiers or mast cell stabilizers.\n-   Avoid     precipitants:   (Allergens,   Physical   activity,   Respiratory infections, Emotional stress, Chemicals, and Irritants).\n\n-   As far as possible, avoid aspirin, NSAIDs, and -blockers in patients with asthma because they can worsen bronchospasm.\n-   Educate on inhaler technique and adherence Pre-treatment: Use short acting B, agonist SABA 10-15 minutes before exercise Long term control medication: Consider daily low-dose ICS or leukotriene receptor antagonist (e.g., montelukast) if symptoms are frequent. Encourage continued physical activity with control measures in place"}, {"num": 45, "chapter": "Chest", "front": "A 26-year-old man comes for follow up. He was diagnosed with bronchial asthma 3 years ago. His current therapy is salbutamol 100 mcg on need and beclometasone diproprionate 200 mcg. However, his asthma is not properly controlled. Chest examination is unremarkable.\n\n1. What is the most appropriate next step?\n\n2. Enumerate the criteria of asthma control?\n\n3. Summarize stepwise management of asthma in adults?", "back": "1. Adding inhaled long beta 2 agonist (LABA) e.g. salmeterol inhaler is the most appropriate next step. The inhaled steroid dose should be increased if there is a benefit but inadequate symptom control to LABA. Assess if the patient has had any of these 4 symptoms in past 4weeks:\n- Daytime asthma symptoms > twice a week.\n- Any night waking due to asthma.\n- SABA reliever is needed for symptoms more than twice a week. (SABA= short acting B agonist)\n- Any activity limitation due to asthma.\n\na. Well controlled: None of the 4 symptoms in past 4 weeks. b. Partly controlled: 1-2 of the 4 symptoms in past 4 weeks. c. Uncontrolled: 3-4 of the 4 symptoms in past 4 weeks, Stepwise management of asthma in adults Step 1: inhaled short acting beta 2 agonist (e.g. salbutamol) as required, quik relief medication. Ipratropium may have an additive effect when combined with short-acting beta-2 agonists\n\nStep 2: add inhaled steroids on a regular basis at a dose 200-800mcg/d (start at a dose appropriate to the severity of asthma). A dose 400 mcg/d is an appropriate starting dose for many patients. (Beclometasone diproprionate or equivalent)\n\nStep 3: Add inhaled I.LABA. Assess asthma control after LABA\n- An adequate control < continue LABA + Inhaled steroids on a regular basis.\n- A benefit but still asthma is not adequately controlled: continue LABA and increase the inhaled steroid dose (800 mcg/d), long term control.\n- No benefit: stop LABA and increase the inhaled steroid dose (to 800 mcg/d). If no response: add other therapies e.g. leukotriene receptor agonists or sustained release (SR) theophylline orally. Step 4: consider trials of increasing the dose of inhaled steroids (up to 2000 mcg/d)\n-     Adding leukotriene receptor antagonist, SR theophylline, beta 2 agonist.\n\nStep 5: add oral steroids at the lowest dose providing adequate control. Maintain high dose inhaled steroids (2000 mcg/d), consider other treatments to minimize the dose of oral steroids,"}, {"num": 46, "chapter": "Chest", "front": "A 22-year-old woman presents with episodes of dyspnea, wheezing, and thinorrhea approximately 1 hour after she consumes aspirin. Her medical history is significant for bacterial sinusitis that required a prolonged course of antibiotics. On physical examination, there are nasal polyps.\n\n1. What is the most likely diagnosis?\n2. What is the treatment strategy for such patient?", "back": "1. The most likely diagnosis is Aspirin semsitivity (Aspirin-Exacerbated Respiratory Disease (AERD): occurring about an hour after aspirin consumption. This immediate reaction is highly characteristic. It is often between 20-50 years, and is slightly more common in women. -t Bronchial Asthma: underlying bronchial hyperresponsiveness. Chronic rhinosinusitis with nasal polyps: the presence of nasal polyps, on examination are hallmarks of the chronic rhinosinusitis component of AERD.\n\n2. The treatment strategy for AERD focuses on:\n\na.   Strict Avoidance of NSAIDs (Non-Steroidal Anti-Inflammatory Drugs and Aspirin): paracetamol is generally safe for pain and fever management in AERD patients. Leukotriene-modifying       agents       (LTMAs):   Montelukast     or zafirlukast can help reduce both asthma and rhinosinusitis symptoms.\n\nStandard Management of Asthma: includes inhaled corticosteroids (ICS) and long-acting beta-agonists (LABA) as maintenance therapy to control airway inflammation and bronchoconstriction. Short-acting beta-agonists (SABA) are used for rescue. Management of Chronic Rhinosinusitis with Nasal Polyps:\n\n-   Topical intranasal corticosteroids\n-   Oral corticosteroids (short courses): May be used for severe exacerbations and to reduce polyp size before surgery. Biologic therapies: For severe and refractory cases of AERD, particularly those with significant nasal polyps and asthma. For example: Anti-IgE (Omalizumab) and Anti-IL-5 (Mepolizumab). Aspirin Desensitization (AD): may be considered for patients whose disease is not adequately controlled by avoidance and medical therapy, or for those who frequently require oral corticosteroids."}, {"num": 47, "chapter": "Chest", "front": "A 36-year-old man has had asthma since he was 10 years old. He presents with a 2-day history of low-grade fever, malaise, and cough productive of brownish mucous cords. This is his fourth such episode in the last 2 years. CXR shows bronchiectasis. A complete blood count (CBC) is significant for eosinophilia\n\nWhat is the most likely cause of his symptoms? w D= o\n\nWhat is bronchiectasis and how to prevent its complications? How can you confirm diagnosis?\n\nHow can you treat this patient?", "back": "1.   The cause of these symptoms is probably allergic bronchopulmonary aspergillosis (ABPA). Aspergillus colonizes the airways and incites a vigorous IgE -mediated response. The immune response leads to bronchial obstruction, bronchiectasis, and eosinophilia. Bronchiectasis is the abnormal and permanent distortion of one or more of the conducting bronchi or airways, most ofien secondary to an infectious process. Bronchiectasis typically presents with chronic cough, foul-smelling and mucopurulent sputum.\n\n-   The major complications of bronchiectasis are recurrent pneumonia and hemoptysis.\n-   These complications can be prevented by proper antibiotics and chest physiotherapy for clearance of secretions that are the mainstay modalities. Oral, parenteral, and aerosolized antibiotics are used, depending on the clinical situation.\n-       Breathing exercises: Active cycle of breathing technique (ACBT). - Other modalities (beyond those for specific associated conditions) may include bronchodilators, corticosteroid therapy, oxygen and surgical therapies can be needed. The diagnosis is by:\n\no   The skin-prick test for reactivity to aspergillus is positive\no   Serum total IgE levels >1000 ng/ml and Elevated serum IgE and IgG antibodies specific to Aspergillus fumigatus.\no   Precipitating antibodies against Aspergillus fumigatus (may or may not be positive).\no   High-Resolution     CT    chest:    This   is   crucial   for   evaluating bronchiectasis. Treatment should focus on controlling inflammation and the fungal burden:\n\n-       Systemic corticosteroids: First-line treatment is oral prednisone. high dose (e.g., 30-60 mg/day) for a few weeks, then slowly taper.\n-       Antifungal agents: Oral itraconazole (e.g., 200 mg twice daily) is often added to corticosteroids. It helps reduce the fungal load\n-       Airway clearance: Techniques like chest physiotherapy, or hypertonic saline nebulization.\n-       Asthma management: (e.g., inhaled corticosteroids and bronchodilators)."}, {"num": 48, "chapter": "Chest", "front": "A 52-year-old patient has had allergic rhinitis, atopic dermatitis, and asthma of increasing severity for the last 10 years. He also has hypertension and is being treated by a neurologist for a mononeuropathy multiplex of unknown cause. During his last hospital admission, a CBC was significant for 20% eosinophils, and a CXR was indicative of patchy opacities. On physical examination, subcutaneous nodules are seen on the extensor surface of his arms.\n\n1. What diagnosis should you suspect?\n\n2. When to suspect the diagnosis of that disease?\n\n3. How would you treat this patient?", "back": "1. Eosinophilic Granulomatosis with Pelyangiitis (EGPA) (formerly Churg-Strauss Syndrome). Triad of: asthma, eosinophilia, and systemic vasculitis and Multisystem involvement: lungs, skin, nerves, GI, heart\n\nThe diagnosis of Churg-Strauss syndrome depends on the presence of:\n\nAsthma (wheezing, expiratdry rhonchi)\n\nEosinophilia of more than 10% in peripheral blood Paranasal sinusitis, pulmonary infiltrates (may be transient) Histological proof of vasculitis with extravascular eosinophils Mononeuritis multiplex or polyneuropathy Initial therapy:\n\nHigh-dose corticosteroids (e.g., prednisone 1 mg/kg/day) If severe or steroid-refractory disease: Add immunosuppressants:\n-   Cyclophosphamide (for severe organ-threatening disease)\n- Azathioprine or methotrexate (for maintenance or less severe disease)\n\n-   IVIg in select refractory cases @      Biologic agents (mewer option): Mepolizumab (anti-IL-5 monoclonal antibody) effective in reducing relapses and steroid use\n- in EGPA"}, {"num": 49, "chapter": "Chest", "front": "A 60-year-old man presents with a 6-month history of dyspnea on exertion. His dyspnea has progressively worsened to the point where he experiences shortness of breath after walking no more than 100 meters. He also reports increased cough productive of yellow sputum over the last 10 years. He has smoked two packs of cigarettes every day for the last 30 years.\n\nPhysical examination demonstrates hyperresonance on lung percussion, vesicular breathing with prolonged expiration and expiratory wheezes at the posterior lung bases. Vital signs are temperature 36.8°C, pulse 88 bpm, RR 18/min, BP 130/70. Body mass index (BMI) is 20.\n\n1. What is the differential diagnosis of chronic progressive cough and dyspnea?\n\nWhat is the most likely cause in this patient? W\n\nHow would you confirm the diagnosis?\n\nHow would you classify his disease severity? Mo\n\nWhat measures are recommended initially in such patients?", "back": "1. The differential diagnosis chronic progressive cough and dyspnea:\n-   Pulmonary: chronic obstructive pulmonary disease (COPD), bronchial asthma, interstitial lung disease (ILD).\n-   Cardiae: Left sided heart failure resulting in pulmonary congestion (e.g. mitral stenosis, uncontrolled hypertension) The most likely cause is COPD because of the long history of smoking and the physical findings of hyperresonance, vesicular breathing & prolonged expiration and expiratory wheezes. To confirm the diagnosis, history and physical examination alone is inaccurate in one third of patients, The test of choice to confirm COPD is spirometry. If spirometry demonstrates an obstructive pattern, repeat FEV1 after inhaled bronchodilator to distinguish between COPD and asthma. Failure of improvement by > 15% favors the diagnosis of COPD. A patient is considered to have COPD if FEV1 is < 80% predicted and FEV1/FVC is < 70%. Disease severity is staged using FEV1 based on the GOLD criteria. Stage                     FEV1 (% predicted) GOLD 1 — Mild                      = 80% GOLD 2 — Moderate                 50-79% GOLD 3 — Severe                   30-49% GOLD 4 — Very Severe               <30% Also, Combined GOLD & The Airway, Breathing, Circulation, Disability, Exposure (ABCDE) approach is applicable in all clinical emergencies for ‘immediate assessment and treatment. (Symptom + Exacerbation Risk)\n5.   The initial measure is smoking cessation: This is the most important step in management, as it is the only measure that reduces the rate of lung function decline in COPD.\n-   Medications: The initial therapy for COPD is a short-acting, inhaled f3; agonist (e.g., albuterol) or a short-acting inhaled anticholinergic (e.g., ipratropium) on as-needed basis.\n-   Antibiotics: Empiric antimicrobial therapy in an acute exacerbation (as evidenced by an increase in baseline dyspnea and/or a change in the quantity or quality of cough) and evidence of an infectious process, such as fever, leukocytosis, or an infiltrate on chest radiograph.\n-   Vaccines: Administer a single pneumococcal vaccine and annual influenza vaccine.\n-   Oxygen therapy: Indicated if Pa02 < 55 mmHg or Sp0O2 < 88%. Pulmonary rehabilitation: For symptomatic patients, improves exercise tolerance and quality of life"}, {"num": 50, "chapter": "Chest", "front": "A 46 years old patient presented with progressive dyspnea and productive cough. He has never smoked cigarettes. His father died of lung disease in his 40s. His grandfather and paternal uncle died of liver failure in their 30. Spirometry reveals an obstructive pattern not reversible with bronchodilators. CXR shows bullous changes in lung bases.\n\n1. What is the cause of COPD?\n\n2. Enumerate treatment options?", "back": "1. The development of COPD at an early age in a nonsmoker with a family history of lung disease and liver failure should raise suspicion for a-1- antitrypsin (AAT) deficiency. This autosomal, recessive, inherited condition predisposes to liver disease by the second decade and emphysema by the fourth decade of life. Bullous changes in emphysema due to a-1 antitrypsin deficiency tend to be more prominent in the lung bases (panacinar) compared to the apices (centrilobular).\n2. Treatment:\n\nReplacing enzyme:       Alphal-antitrypsin-deficient individuals who have or show signs of developing significant emphysema, can be treated with alphal-antitrypsin protein. IV or inhaled pooled human o-1 anti-protease, a weekly infusion is reserved for those individuals with the lowest AAT levels. IV replacement therapy shows promise in delaying progression the discase\n\nIt concentrates restore serum and alveolar alphal-antitrypsin concentrations to protective levels,\n\nControl symptoms of COPD: Early antibiotic therapy for all exacerbations with purulent sputum,\n\nAdminister short-acting beta-adrenergic agents and ipratropium bromide bronchodilators to maximize lung function. Inhaled corticosteroids may given in patients have significant bronchoreactivity\n\nPreventing   respiratory   infections:   Pneumonia     and     annual influenza vaccines will help prevent respiratory infections.\n\nLung transplant in end-stage lung disease."}, {"num": 51, "chapter": "Chest", "front": "A 63-year-old man with COPD is reviewed in the outpatient clinic, he stated that he feels breathlessness despite adding long-acting beta 2 agonist (LABA) in addition to inhaled iprairopium bromide inhaler as required as he was advised the last visit for 3 months. He stated that he gave up smoking for 4 months. FEV1 43%.\n\nWhat is the most appropriate next step? D=\n\nGive a brief plan for management in patients with stable COPD?\n\nWhat are the indications of long term oxygen therapy? BB\n\nIs this patient candidate for assessment for long term oxygen therapy?", "back": "1.   This patient is using monotherapy of long-acting muscarinic antagonists bronchodilator. Ipratropium bromide (SAMA) provides small benefits over muscarinic antagonists LAMA in terms of lung function, health status and the need for oral steroids. The most appropriate second step is to use a combination of LABA and LAMA. This combination has a great impact on FEV1, symptoms, improve quality of life and reduce exacerbations.\n2.   Management of Stable COPD: General measures:\n- Smoking cessation advice\n- Vaccination (COVID-19, influenza, pneumococcal).\n-      Regular check on the inhaler technique and adherence to therapy.\n-      Pulmonary rehabilitation. Pharmacological therapy:\n-       LABA or LAMA 1s preferred over short-acting inhaled bronchodilator except in patients with occasional dyspnea. Combination of LABA and LAMA are preferred as initial step of management over monotherapy.\n-       Escalation of therapy depends on whether patients suffer from dyspnea or exacerbations:\no Patients who remain breathless on monotherapy should start the LABALAMA combination. They should be investigated for other causes of dyspnea.\no      Patients with exacerbations on monotherapy should start LABALAMA-ICS (inhaled steroid) if eosinophils >300 cells/ul, or switch to LABA-LAMA if below 300, eosinophils.                                  |\no      If there is no response to dual therapy and eosinophils >100, patients switch to triple therapy; if still no response, they start roflumilast is a selective phosphodiesterase-4 inhibitor indicated to decrease the risk of exacerbations (if FEV1<50 and chronic bronchitis) or azithromycin (in former smokers). Indications of Long-term oxygen therapy (LTOT):\no       LTOT is offered if Pa0;< 55 mmHg or Sa0:< 88%, or from 55-60 mmHg with one of the following: Nocturnal hypoxemia, polycythemia, pulmonary hypertension or peripheral edema Long term oxygen therapy (LTOT) should be considered in this patient for 15 h/24 hours is associated with improved survival in selected patients with COPD. Assessment for LTOT is indicated with any of the following is present: —   Patients with very severe COPD (FEV1 <30%) should undergo assessment for LTOT. —   In patients with severe COPD FEV1 (30-49%) assessment for LTOT is considered. —   Polycythemia, Right sided heart failure —       Central cyanosis, oXygen saturation at room air < 92%."}, {"num": 52, "chapter": "Chest", "front": "A 55-year-old female complains of increasing dyspnea on exertion and a dry cough for the last 12 months. She does not take any medication. She has never smoked cigarettes, and occupational history does not reveal any workplace irritants. Physical examination reveals digital clubbing and fine bilateral basal crackles. CXR shows reduced lung volume and diffuse interstitial opacities with basal predominance. Pulmonary function tests show a decreased FEV1, decreased FVC, Normal FEV1/FVC, and decreased TLC.\n\n1. What is the interpretation of pulmonary functions? What category of lung diseases is she suffering from?\n2. Mention major causes of such category?\n\n3. Which cause is most likely responsible for this patient's symptoms?\n\n4, What is this patient's prognosis?", "back": "1.   She has restrictive lung disease (diminished FEV1, FVC with normal FEV1/FVG most probably due to interstitial lung disease (ILD). ILDs are a heterogeneous group of disorders that are characterized by common features including progressively increasing dyspnea, a dry cough, and a restrictive pattern on spirometry. Fine basal crackles are the most common physical examination finding. The typical CXR will show reticular or reticulonodular infiltrates with diminished lung volumes. CXR can be normal in some patients with biopsy-proven ILD. Obtain high-resolution CT if there is a high index of suspicion for ILD while CXR is normal. The major causes are:\n\n-   Pneumoconiosis: chronic exposure to inorganic dust leads to chronic inflammation resulting in scarring and fibrosis. Asbestosis, silica, coal, and beryllium are the most common etiologic agents.\n-   Hypersensitivity pneumonitis (HP): Deposition of organic antigens leads to the formation of antigen-antibody complexes in the alveoli. The presentation can either be acute (4 to 6 hours after exposure, resolving within 12 hours), subacute, or chronic. Examples of hypersensitivity pneumonitis are farmer's lung (exposure to thermophilic actinomycetes in hay), pigeon fancier's lung (exposure to bird feathers and excreta), humidifier lung (exposure to thermophilic bacteria), and allergic bronchopulmonary aspergillosis (ABPA).\n-   Collagen vascular disorders & Sarcoidosis\n-   Jatrogenic: Drugs: anti-cancer drugs, antibiotics, NSAIDS, B-blockers, antiarrhythmic drugs and radiation.\n-  Idiopathic: Idiopathic pulmonary fibrosis (IPF), acute interstitial pneumonia, desquamative interstitial pneumonia (DIP), and respiratory bronchiolitisassociated ILD are pathologically different idiopathic causes of ILD. The most likely cause is idiopathic pulmonary fibrosis (IP¥) as there is no history of related drug intake or exposure to specific agents. There was no history suggestive of connective tissue disorders. This condition tends to present in the fifth or sixth decades and is two times more common in females. Lung biopsy specimen shows areas of normal lung alternating with cystic fibrotic areas, which confirms the diagnosis of IPF. The prognosis usually follows a progressive course, with most patients dying of respiratory failure within 5 to 10 years of diagnosis. Treatment options are limited, and these patients should be referred early for lung transplantation."}, {"num": 53, "chapter": "Chest", "front": "A 29-year-old man presents with a 2-month history of dyspnea and dry cough. He does not have any environmental or occupational exposures to chest irritants. Spirometry reveals a restrictive pattern. CXR shows bilateral hilar adenopathy and upper lung field reticular opacities. Lung biopsy reveals noncaseating granulomas.\n\n1. What is the diagnosis?\n\n2. What other organ systems can be affected?\n\n3. Is treatment indicated for this patient stage? If so, how is it treated?", "back": "1. Bilateral hilar adenopathy and reticular opacities in the upper lung fields are highly suggestive of sarcoidosis. The presence of noncaseating granulomas on biopsy confirms the diagnosis. This multisystem disease of unknown cause is most common between the ages of 20 and 40. The lungs are the most commonly affected organ system (90%). 50% of sarcoid is detected incidentally on CXR in asymptomatic patients fifty percent.\n2. Non-caseating granulomas can infiltrate almost any organ system. Commonly affected organs are: Lymph nodes: painless hilar and peripheral lymphadenopathy occurs in ~90%. Systemic complaints, fever, anorexia, and arthralgias occur in 45% of cases\n\nSkin: Skin lesions occur in ~20%. The most common lesions are erythema nodosum (tender erythematous nodules on the shins of the tibia as a result of inflammation of subcutaneous fat) and lupus pernio (violaceous lesions on the nose, cheeks, and ears).\n\nEyes: eye lesions occur in ~25% (presenting symptom in 5%). The most common eye lesion is uveitis followed by chorioretinitis Other: Liver (mild increase in liver function tests), bones (polyarthralgias), heart (arrhythmias and conduction defects), CNS (cranial nerve palsies) and parotid gland (dry mouth).\n3. No treatment is necessary for asymptomatic patients with stage 1 or stage 2 diseases on CXR.\n\nAll patients with symptoms and/or stage 3 or stage 4 disease require treatment. This patient with symptomatic stage 2 disease requires treatment.\n\nFirst-line therapy is oral steroids. Corticosteroid can ultimately be stopped in most patients, but relapse accuts up to 50. Corticosteroid should be resumed for recurrence of symptoms & signs. Other immunosuppressants e.g. methotrexate can be used."}, {"num": 54, "chapter": "Chest", "front": "A 33-year-old woman is admitted to the hospital because of acute dyspnea and right sided chest pain which increased with inspiration. She delivered 5 days ago her 5% offspring. She denies fever, cough, headache, abdominal pain, back pain. Physical examination: reveals a dyspneic obese woman (BMI 35 kg/m?). Temp 36.7 C°, pulse 120/minute, RR 32/minute, BP 130/84 mmHg. Heart, chest, abdominal and neurological examination are free.\n\n1. What is the        most   probable    diagnosis     of   this   patient's presentation?\n\n2. What are the risk factors in this particular patient that predispose to such condition?\n\n3. Mention 3 important investigations you would like to do to this patient?\n\n4. What acute therapy would you choose?\n5. What would be your approach to long term management?", "back": "1. The most probable diagnosis of this patients presentation: is pulmonary embolism.\n2.   Risk factors that predispose to such condition:\n- Pregnancy, oral contraception.\n- Prolonged recumbency in the post partum period.\n- Obesity\n- Inherited clotting disorders like Factor V Leiden\n- Major surgery abdominal , pelvic , fracture Important investigations:\n- D-Dimer has a negative predictive value.\n- Arterial blood gases\n-    E.C.G.: sinus tachycardia T-wave inversion in V1-V4 leads, QR in V1 lead, classical S1Q3 picture, and incomplete or complete right bundle branch block can be helpful in the diagnosis of PE\n-    Echocardiology: new right ventricular strain,\n- Contrast enhanced mutidetector C.T. pulmonary angiography: have a sensitivity of 83% &specificity 96%, with a positive predictive value of 92%.\n- Ventilation/perfusion scanning: indicated if pulmonary angiography is contraindicated, or inconclusive or when additional testing is needed. Acute therapy: The treatment for patients with suspected PE is stratified according to the type of PE (hemodynamically stable or unstable)\n- Supportive measures (O2 therapy), anticoagulation is the mainstay of treatment, and reperfusion strategies for severe cases.\n- Thrombolysis, catheter-directed therapy, and surgical embolectomy are options for hemodynamically unstable patients (are alternative reperfusion . options in patients with contraindications to thrombolysis). -~ Thrombolytic therapy should be used in patients with acute PE associated with hypotension (systolic BP< 90 mm HG) who do not have a high bleeding risk\n-    Low-molecular-weight heparin (LMWH; fondaparinux) or unfractionated heparin (UFH) can be used for anticoagulation in acute PE. LMWH and fondaparinux are preferred since they lower the incidence of inducing major bleeding and heparin-induced thrombocytopenia Long term management:\n\n- Following reperfusion treatment and hemodynamic stabilization, patients recovering from high-risk PE can be switched from parenteral to oral anticoagulation. Oral anticoagulation should be given for 3-6 months as the patient has known predisposing factor.\n- Risk factors should be avoided if possible."}, {"num": 55, "chapter": "Chest", "front": "A 40-year-old woman presents with a 3-hour history of shortness of breath associated with sharp localized pain that increases with inspiration. She was on a 15-hour bus ride 2 days ago. She does not have any known medical problems. Her only medications are oral contraceptive pills. Her right calf is swollen and tender. Heart and lung findings are within normal limits. Vital signs are; temperature 37.2 C°, pulse 120 bpm, respiratory rate 30/min, blood pressure 140/90 mmHg. CXR shows atelectasis; ECG shows sinus tachycardia with nonspecific ST and T wave changes. ABG shows pH 7.45, PCO2 30 %, and PO> 80 %.\n\nWhat is the most likely diagnosis in this patient? o\n\nWhere is the original source of her chest problem?\n\nHow can you confirm the diagnosis? What is the treatment suggested? O\n\nHow long should this patient receive treatment? A", "back": "1. Acute onset of dyspnea and pleuritic chest pain along with a history of immobility (long bus ride), oral contraceptive pill use, and unilateral leg swelling put the diagnesis of pulmonary embolism (PE). Cardiogenic causes are less likely in this patient with nonspecific ECG and CXR findings. Pneumothorax is less likely because typical CXR findings are absent. Asthma is less likely because there is no history of episodic symptoms.\n\nThe origin source: more than 90% of pulmonary emboli originate from a thrombus in the proximal deep venous system of the lower extremities (popliteal, femoral, or iliac veins). Calf-vein thrombosis is less likely to result in pulmonary embolism. The diagnosis is confirmed by evaluating this patient with a high | probability for PE using pulmonary CT angiography and dupplex study of venous system of the lower limbs. D dimer\n\n4. The patient must be admitted to ICU, It is important to initiate simultaneous anticoagulation with heparin.\n- Heparin (unfractionated or low molecular weight), it reduces the mortality rate of PE because it slows or prevents clot progression and reduces the risk of further embolism.\n\n- Fibrinolytic therapy is given in patients with massive pulmonary embolism. These patients present with hemodynamic compromise and hypotension\n- Oxygen should be administered to every patient with suspected PE, even when the arterial PO; is perfectly normal, because increased ~alveolar oxygen may help to promote pulmonary vascular dilatation.\n\n- Then patient continue on oral warfarin, anticoagulant effect of warfarin adjusted by varying dose to keep INR within target range. An INR target range of 2.5-3.5.\n\n5. Patients with a single episode of DVT and/or PE due to identifiable and preventable risk factors should continue anticoagulation with warfarin for at least 3 months. The patient is advised to stop oral contraceptive pills."}, {"num": 56, "chapter": "Chest", "front": "A tall, thin 27-year-old man presents with a sudden onset of dyspnea and sharp, right-sided chest pain that worsens with inspiration (pleuritic). The symptoms began 2 hours ago while he was working in the yard and smoking a cigarette. On examination, breath sounds are decreased on the right side, and his arterial oxygen saturation (Sa02) is 81%.\n\n1. What is the diagnosis?\n\n2. How could you confirm that diagnosis?\n3. How is his condition treated?", "back": "1. The patient has a right-sided primary spontaneous pneumothorax. This condition commonly occurs in tall, thin young smokers during strenuous activity as a result of rupture of a subpleural bleb into the pleural space, which causes air to leak into the pleural space. Pleural air can collapse the lung, which causes decreased breath sounds on the affected side.\n2. To confirm the diagnosis: CXR is diagnostic, showing loss of normal lung markings in the periphery of the hemithorax and a well-defined visceral pleural line between the chest wall and the hilum.\n3. Treatment of pneumothorax: Stable patient with small pneumothorax: Observation and supplemental oxygen is usually sufficient in a stable patient with a pneumothorax that occupies <15% of the hemithorax or less than 2 cm.\n\nStable patient with a large pneumothorax: Aspirate a larger pneumothorax with a catheter threaded through an 18-gauge needle. Unstable patient or unsuccessful aspiratiom: If aspiration is ineffective or if the patient is unstable, insert a chest tube via an incision at the fourth or fifth intercostal space in the anterior axillary or mid-axillary line (tube thoracostomy). Tube thoracostomy is indicated in this unstable patient with a large pneumothorax.\n\nPneumomediastinum: a complication of primary spontaneous pneumothorax. Suspect this condition if a patient has mediastinal crunch or subcutaneous emphysema (bulging area of skin that crackles on palpation)."}, {"num": 57, "chapter": "Chest", "front": "A 68 years old woman is admitted with fever and a productive cough yielding yellowish sputum, associated with left-sided chest pain. Two days later, she developed chills and a temperature of 39°C. She denies hemoptysis, weight loss, sore throat, sinusitis, back pain, diarrhea, rash, joint pain, or headaches. Her medical history includes congestive heart failure secondary to ischemic heart disease, well controlled with furosemide and an ACE inhibitor. She is a former smoker, having quit three months ago. On examination, she is fully conscious, appears thin with respiratory distress. Vital signs: temperature 39.2°C, RR 33 /min, pulse 120 bpm, BP 125/80 mmHg, and oxygen saturation 89% on room air. Chest examination reveals dullness in the left infra-mammary region, with egophony and bronchial breath sounds on the left; the right lung is clear. Cardiovascular, abdominal, and neurological examinations are unremarkable. Laboratory findings: hemoglobin 13.8 g/dL, WBC 18 x 10°L (54% segmented neutrophils, 5% bands, 41% lymphocytes), platelets 255 x 10°/L. BUN is 25 mg/dL. ECG is normal. Chest X-ray shows a normal heart size with an infiltrate in the left lower lobe obscuring the left heart border. Sputum Gram stain reveals a few polymorphonuclear leukocytes, many epithelial cells, and scattered Gram-positive and Gram-negative cocci and rods.\n1. What is your most likely diagnosis?\n2. What host factors unique to this patient places her at risk for such a diagnosis?\n\n3. What features of the history and physical exam support this diagnosis?\n4. What kinds of infectious agents can produce this syndrome? Which would be most common?\n\n5. Are there any other diagnostic tests you would order before initiating therapy?\n6. Mention briefly the proper management of the patient and what antibiotic(s) would you initiate in this patient empirically?", "back": "1.   The diagnosis is Community acquired pneumonia (CAP).\n\n2. Host factors increasing the risk in this patient are: old age. previously smoking and comorbidity (congestive heart failure).\n3.   Features of the history and physical examination that support the diagnosis: Fever & productive cough (history). Limited expansionon left side of chest and dullness to percussion, Aegophony & bronchial breath sounds (physical examination). Most probably bacterial due to the presence of leucocytosis and shift to left.\n4. Infectious agents that can produce this syndrome include: Bacterial, Viral, Mycobacterial, Atypical organisms such as: Mycoplasma, Chlamydia, Coxiella burnetti, Legionella and Opportunistic infections. The most common cause for CAP is Streptococcus pneumonia,\n5.   Before initiating therapy, sputum should be analysis for bacterial culture & sensitivity. Culture for TB, ZN stain for acid fast bacilli, TB PCR\n6.   CURB 65 score should be determined (Mortality Prediction Tool for Patients with CAP)\n\nVariable (Assign 1 point for each)             Inpatient vs OQupatient\n- Confusion                                - 0 or 1 point treat as outpatient\n- BUN > 20 mg per dL                       - 2 points treat as inpatient\n- Respiratory rate > 30 per minute          - 23 points treat in intensive care unit\n- BP (systolic < 90 mm Hg or diastolic < 60 mm Hg)\n- Age > 65 years\n\nCURBG5 score for this patient is 3 points that means treatment of this patient should be in intensive care umit. Combination antibiotic therapy, Empiric antibiotic therapy is initiated as follows: Ceftriaxone 1-2g IV q24h+ Clarithromycin 500 mg PO q12h , or Ceftriaxone 1-2 g IV q24h + Levofloxacin 750 mg IV q24h. In penicillin allergy, Levofloxacin 750 mg IV q24h. Vancomycin or linezolid should be added if community-acquired methicillinresistant S qureus is a consideration. The regimen should de-escalated depending on culture result and clinical response.\n\nOxygen, care of bedridden patient including prophylactic enoxoparine."}, {"num": 58, "chapter": "Chest", "front": "A 32-year-old man presents with a 2-day history of fever, shaking chills (rigor), and cough productive of yellow sputum, dyspnea, and pleuritic chest pain. Past medical history is unremarkable. He is fully conscious, temperature 39°C, pulse 110 bpm, respiratory rate 25/min., blood pressure 110/80. Chest examination: increased tactile fremitus, dullness to percussion, decreased breath sounds crackles, and aegophony at the left upper lobe. BUN 15 MG/dL, Sa0; is 92%.\n\nWhat is the most likely cause of these symptoms?\n\nWhat are the “atypical” signs of that disease?\n\nWhat is the next step in management? Ll\n\nHow should you manage this patient's condition?", "back": "1. “Typical” community-acquired pmeumonia (CAP) classically presents with abrupt onset of fever, cough productive of purulent sputum, and pleuritic chest pain along with physical findings of lobar consolidation. The term “pneumonia” implies infection of the alveoli (lower respiratory tract). The most common pathogen in “typical” CAP is Streptococcus pneumoniae, followed by Hemophilus influenza and Moraxella catarrhalis.\n\nPneumeonia can also present imsidiously with atypical signs such as a dry cough, headache, myalgias, sore throat, and gastrointestinal symptoms (nausea, vomiting, diarrhea, and abdominal pain).\no   Mycoplasma pneumoniae and Chlamydia pneumoniae are the most common causes of community-acquired “atypical” pneumonia.\n\nCXR & CT scan chest to determine whether an infiltrate is present. Clinical and radiological findings do not reliably differentiate typical from atypical pathogens.\n\no   While there is much interest in using CBC differential, C-reactive protein (CRP) and procalcitonin to aid in the diagnosis of pneumonia and to help distinguish bacterial from viral causes of CAP.\n\n4, Determine CURB-65 score (see previous case)\n\n-   This patient has no significant past medical history and CURB-65 is 0 so can be treated on outpatient basis with one antibiotic PO.\n\n-   Empiric antibiotics are Azithromycin 500 mg PO on day 1 followed by 250 mg q24hr on days 2-5 or Clarithromycin 250 mg PO qi2h x 7 days or Doxycycline 100 mg PO q12hr 7-10 days.\n\n-   Combination therapy or monotherapy with quinolone can be prescribed in patients with comorbidities or previous use of antibiotics within the previous three months as: a.   Cefuroxime 500 (or Amoxicillin 1 g PO g8h or Amoxicillinclavulanate 2 g PO q12h mg PO q12 hr) + Clarithromycin 500 mg PO q12h or b. Monotherapy with Levofloxacin 750 mg PO g24h in penicillin allergy. &"}, {"num": 59, "chapter": "Chest", "front": "A 55-year-old man with a history of chronic bronchitis presents with a 2- month history of increasing dyspnea and cough that has changed in character and is tinged with blood. His voice has become hoarse, and he has unintentionally lost 10 Kg in the last 2 months. He often wakes up drenched in sweat. He works as a teacher. He smokes 20 cigarette/day for 20 years. On examination, there is digital clubbing. Vital signs are normal. X ray chest shows mediastinal adenopathy and a 5-cm central pulmonary nodule with irregular borders. Abnormal laboratory findings are elevated calcium and anemia.\n\nWhat is the differential diagnosis of hemoptysis in this patient?\n\nWhat diagnosis should you suspect in this patient at this stage? A\n\nWhat is the next step in the evaluation of this lesion? i\n\nWhat is the next step in management? S\n\nWhy does this patient have hypercalcemia? A\n\nWhat is the most likely cause of hoarseness in this patient?", "back": "L. The differential diagnosis of hemoptysis in this patiemt: bronchogenic carcinoma, chronic bronchitis and bronchiectasis, pulmonary tuberculosis. This patient has a history of chronic bronchitis, which is the most common cause of hemoptysis. However, the change in the character of cough along with weight loss, night sweats, hoarseness, and digital clubbing should raise suspicion for bronchegenic carcinoma. Perform high resolution CT scan chest with contrast to define the extent of the mass and to detect intrathoracic lymph node metastases.\n\n- Lung cancer most commonly metastasizes to the liver, adrenal glands, brain, and bones. Therefore, extend the chest CT to include the liver and adrenal glands. Also, obtain a head CT and a radionuclide-enhanced bone scan.\n\n- PET — to be an accurate modality in the detection of pleural metastases from NSCLC. However, unlike CT, PET is not useful in examining the extent of invasion across tissue planes.\n\nTissue samples of the lesion and associated lymph nodes are necessary to define the type and stage of lesion.\n\n-     Suptum cytology of an early morning sputum specimen occasionally yields malignant cells in central lesions.\n\n-     In most cases, central lesions require fiber-optic bronchoscope—guided bronchial washings, brushings, or biopsy.\n\n-       Lymph nodes can be sampled with a bronchoscope (transbronchial needle aspiration) or a mediastinoscope (bronchoscope inserted through an incision above the sternum). Lung cancer can cause a number of paraneoplastic syndromes. These result from production of biologically active substances by the tumor or in response to the tumor. The most likely cause of hypercalcemia even with no bony metastases is production of parathyroid hormone-related peptide (PTHzP).\n\nThe most likely cause of hoarsemess is compression of the recurrent laryngeal nerve by the tumor."}, {"num": 60, "chapter": "Chest", "front": "A 55-year-old man presents with a 2-year history of progressively worsening daytime somnolence. He recently crashed his car into a tree because he fell asleep at the wheel during the day. His wife reports that he snores loudly every night. Past medical history is significant for hypertension controlled with hydrochlorothiazide. On physical examination, he has a low-hanging soft palate. His neck is wide, and his BMI is 40. Vital signs are within normal limits.\n\nWhat is the most likely cause of his symptoms? M=\n\nWhat are the complications of that condition?\n\nWhat testing is indicated to evaluate this patient? BB\n\nHow to manage this patient?", "back": "1. Suspect obstructive sleep apnea (OSA) in a patient with snoring and excessive daytime sleepiness. OSA results from airway obstruction, so look for physical findings of nasal obstruction, a2 low-hanging soft palate and large uvula, enlarged tonsils or adenoids, and retrognathia or micrognathia. OSA is more common in men. An enlarged neck circumference and obesity are other risk factors for OSA. The complications of OSA: OSA can cause diminished alertness, HTN, cardiovascular diseases (cardiac arrhythmias, stroke) diabetes mellitus, lipid abnormalities, and pulmonary vascular disease. To evaluate for OSA Polysomnography is indicated in this patient with a high pretest probability of OSA whose symptoms substantially affect daily activities. Polysomnography monitors sleep stages, respiratory effort, airflow, Sa0,, ECG, body position, and limb movements.\n\n-   Consider cheaper tests such as overnight home oximetry in patients | with daytime somnolence whose have a lower pretest probability of OSA.\n4. The management:\n\n-   Patient should lose weight and avoid sedatives.\n-   Nasal CPAP (continuous positive airway pressure) is a noninvasive therapy for OSA.\n-   If lifestyle measures and nasal CPAP are ineffective, consider surgery to relieve areas of obstruction."}, {"num": 61, "chapter": "Chest", "front": "A 75-year-old woman presents to the emergency department complaining of shortness of breath at rest. She has a history of pneumonia treated 1 month ago with partial improvement of symptoms. Her temperature 38.0° C, pulse 120/min, RR 25/min, and BP 135/80 mm Hg. Chest examination reveals absent breath sounds and dullness to percussion at the base of the left lung. CXR revealed blunted costophrenic angle, homogeneous opacity at the left lung base that rises to axilla. A left-sided thoracentesis yields 1 L of non bloody, turbid fluid. The fluid is analysed: Protein: 4.0 g/dL, Lactate dehydrogenase (LDH): 230 U/L, Glucose: 35 mg/dL, Triglycerides: 50 mg/dL. The fluid cytology: negative for malignant cells. Gram stain: negative for bacteria. Cell count: 1500 WBC, 65% Neutrophils. Relevant laboratory test (in serum) are as follows: Protein: 7.0 g/dL, LDH: 250 U/L, Glucose: 90 mg/dL, Hemoglobin: 12 g/dL, Triglycerides: 100 mg/dL\n\n1. What is the most likely diagnosis?\n\n2. Mention the causes of pleural effusion?", "back": "1. The diagnosis is exudative pleural effusion, likely secondary to infection (Post pneumonic or Synpneumonic). The diagnosis of pleural effusion is suggested clinically by dullness to percussion or absent breath sounds plus radiographic findings (blunted costophrenic angle, homogeneous opacity at the base that moves with change in position), and confirmed with thoracocentesis. The causes of pleural effusion are either transudative or exudative. An effusion is classified as an exudate if one or more of Light’s criteria are positive:\n\n-    Pleural fluid protein/serum protein ratio > 0.5.\n\n-~   Pleural fluid LDH/serum LDH ratio > 0.6.\n\n-    Pleural fluid LDH > two-thirds the upper limit of normal serum LDH.\n\ne   Transudative effusions are due to elevated hydrostatic or decreased oncotic pressure; they can be caused by congestive heart failure (90%), cirrhosis, or nephrotic syndrome. e   Exudative effusions are due to pleural pathology and leaky capillaries. They are most commonly the result of malignancy, pneumonia, pulmonary embolism, tuberculosis, rheumatoid arthritis, lupus, pancreatitis, and post coronary artery bypass surgery.\n\ne   Fluid in the pleural cavity can also be blood, pus, or chyle.\n\no   A hemothorax is usually grossly bloody, most cases traumatic, non traumatic include lung sequestration, vascular, neoplasia, coagulopathies, and infectious processes.\no   An empyema is pus in the pleural space, arises as a complication of pneumonia, chest trauma, or surgery. The pleural fluid is characterized by a low pH, low glucose, and bacteria seen on Gram stain.\n\no   A chylothorax: results from the disruption of the thoracic duct or its tributaries, is most often iatrogenic or neoplastic chylothorax . The pleural fluid will be milky with a high triglyceride concentration."}, {"num": 62, "chapter": "Chest", "front": "A 56-year-old construction worker presents with increasing difficulty catching his breath and chest pain that increased within months. The pain is right-sided, sharp, worse with deep breathing, and nonradiating. The condition was associated with nonproductive cough. He also gives history of asthenia and weight loss. The patient gives history of previous admission to hospital three months before with dyspnea with pleural effusion and analysis was done with exclusion of tuberculosis and slight improvement on antibiotics. He has been in construction for most of his life, working for a company that remodels old buildings. On physical examination, there is dullness to percussion over his right lung base as well as decreased breath sounds. Serum chemistries, complete blood counts, and electrocardiogram are all within normal limits. A chest x-ray demonstrates a pleural-based mass and effusion in the right lower lung.\n\n1. What is the most likely diagnosis?\n\n2. What tests and/or imaging tools could be used to confirm the diagnosis?\n3. What is the most appropriate treatment for this condition?", "back": "1. The patient’s occupation of remodeling old buildings places him at risk for asbestos exposure, which is the primary risk factor for mesothelioma. The clinical manifestations of malignant mesothelioma begin insidious and often nonspecific. The findings on chest x-ray of a pleural-based mass are most consistent with malignant mesothelioma.\n\nCytology firom the pleural effusion is diagnostic in 26% only of cases.\no   When cytology is inconclusive, tumor biopsy by thoracoscopy is helpful, especially with immunohistochemistry.\no   MRI is useful for determining the extent
