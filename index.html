<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Internal Medicine Case Bank</title>
<style>
  :root{
    --paper:#f5f3ee;
    --paper-raised:#ffffff;
    --ink:#20262b;
    --ink-soft:#5a6570;
    --navy:#173a4d;
    --navy-deep:#0e2733;
    --teal:#3c7d78;
    --amber:#b8863b;
    --line:#dcd6c9;
    --chart-green:#4a7c59;
    --danger:#a44a3f;
    --shadow: 0 1px 2px rgba(20,30,35,.06), 0 8px 24px -12px rgba(20,30,35,.25);
    --radius: 14px;
    --serif: Georgia, 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --mono: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
  }
  body::before{
    content:"";
    position:fixed;inset:0;
    pointer-events:none;
    background-image:
      radial-gradient(circle at 1px 1px, rgba(23,58,77,.055) 1px, transparent 0);
    background-size:22px 22px;
    z-index:0;
  }

  #app{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}

  .screen{display:none;flex:1;flex-direction:column;}
  .screen.active{display:flex;}

  button{font-family:inherit;cursor:pointer;}
  button:disabled{cursor:not-allowed;}
  button:focus-visible, [tabindex]:focus-visible{
    outline:3px solid var(--amber);
    outline-offset:2px;
  }

  /* ============ SETUP SCREEN ============ */
  .masthead{
    background:linear-gradient(180deg, var(--navy-deep), var(--navy) 85%);
    color:#f2ede0;
    padding:38px 20px 30px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .pulse-line{
    position:absolute;
    left:0;right:0;top:14px;
    height:34px;
    opacity:.55;
  }
  .pulse-line svg{width:200%;height:100%;animation:drift 9s linear infinite;}
  @keyframes drift{ from{transform:translateX(0);} to{transform:translateX(-50%);} }

  .masthead h1{
    font-family:var(--serif);
    font-weight:400;
    font-size:clamp(28px,7vw,40px);
    line-height:1.15;
    margin:14px 0 6px;
    letter-spacing:.2px;
  }
  .masthead h1 span{
    display:block;
    font-style:italic;
    color:#d7c9a3;
    font-size:.72em;
    margin-top:2px;
  }
  .tagline{
    margin:0;
    font-size:13.5px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#a9c2c9;
  }

  .setup-body{
    max-width:640px;
    width:100%;
    margin:0 auto;
    padding:26px 18px 100px;
    flex:1;
  }

  .setup-block{margin-bottom:30px;}
  .setup-block-head{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:12px;
  }
  .setup-block h2{
    font-family:var(--serif);
    font-weight:400;
    font-size:19px;
    margin:0 0 12px;
    color:var(--navy-deep);
  }
  .setup-block-head h2{margin-bottom:0;}
  .link-btn{
    background:none;border:none;color:var(--teal);
    font-size:13px;font-weight:600;text-decoration:underline;
    padding:4px 0;
  }

  .chapter-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
  }
  .chapter-card{
    background:var(--paper-raised);
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:13px 14px;
    text-align:left;
    display:flex;
    flex-direction:column;
    gap:6px;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
    position:relative;
  }
  .chapter-card:active{transform:scale(.98);}
  .chapter-card .cc-top{display:flex;align-items:center;gap:8px;}
  .chapter-card .cc-check{
    width:17px;height:17px;flex:none;
    border-radius:5px;
    border:1.5px solid #b8c0bd;
    background:#fff;
    display:flex;align-items:center;justify-content:center;
  }
  .chapter-card .cc-check svg{width:11px;height:11px;opacity:0;transition:opacity .1s;}
  .chapter-card .cc-name{font-weight:600;font-size:14.5px;color:var(--ink);}
  .chapter-card .cc-count{font-size:12px;color:var(--ink-soft);padding-left:25px;}
  .chapter-card.selected{
    border-color:var(--teal);
    background:#eef4f1;
  }
  .chapter-card.selected .cc-check{background:var(--teal);border-color:var(--teal);}
  .chapter-card.selected .cc-check svg{opacity:1;}

  .mode-toggle{
    display:flex;
    background:#eae6db;
    border-radius:10px;
    padding:4px;
    gap:4px;
  }
  .mode-btn{
    flex:1;
    border:none;background:transparent;
    padding:10px 8px;
    border-radius:7px;
    font-size:13.5px;font-weight:600;
    color:var(--ink-soft);
    transition:background .15s, color .15s;
  }
  .mode-btn.active{background:#fff;color:var(--navy-deep);box-shadow:var(--shadow);}

  .setup-footer{
    position:fixed;left:0;right:0;bottom:0;
    background:linear-gradient(0deg, var(--paper) 70%, rgba(245,243,238,0));
    padding:22px 18px 18px;
    z-index:5;
  }
  .start-btn{
    max-width:640px;margin:0 auto;
    display:block;width:100%;
    background:var(--navy-deep);
    color:#f2ede0;
    border:none;
    padding:15px 18px;
    border-radius:11px;
    font-size:15.5px;
    font-weight:700;
    letter-spacing:.01em;
    box-shadow:var(--shadow);
    transition:opacity .15s, transform .1s;
  }
  .start-btn:active{transform:scale(.99);}
  .start-btn:disabled{background:#b9b2a0;color:#fff;box-shadow:none;}
  .start-hint{
    max-width:640px;margin:8px auto 0;
    text-align:center;font-size:12px;color:var(--ink-soft);
  }

  /* ============ STUDY SCREEN ============ */
  .study-topbar{
    padding:14px 16px 10px;
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--paper);
  }
  .icon-btn{
    background:none;border:none;
    color:var(--navy);
    font-size:14px;font-weight:600;
    padding:6px 4px;
    white-space:nowrap;
  }
  .progress-wrap{flex:1;min-width:0;}
  .progress-info{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:6px;
    gap:8px;
  }
  .chapter-badge{
    font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    color:var(--teal);
    background:#e4efec;
    padding:3px 9px;
    border-radius:100px;
    white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;
  }
  #progress-text{
    font-size:12.5px;font-weight:600;color:var(--ink-soft);
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  .progress-bar{
    height:5px;background:#e4e0d3;border-radius:100px;overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--teal), var(--chart-green));
    border-radius:100px;
    width:0%;
    transition:width .25s ease;
  }

  .card-stage{
    flex:1 1 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px 18px 4px;
    perspective:1800px;
    min-height:360px;
  }

  .flashcard{
    width:100%;
    max-width:560px;
    height:56vh;
    height:56dvh;
    min-height:340px;
    max-height:520px;
  }
  .flashcard-inner{
    position:relative;
    width:100%;height:100%;
    transform-style:preserve-3d;
    transition:transform .55s cubic-bezier(.4,.2,.2,1);
    cursor:pointer;
  }
  .flashcard.flipped .flashcard-inner{transform:rotateY(180deg);}

  .flashcard-face{
    position:absolute;inset:0;
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
    background:var(--paper-raised);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    border:1px solid var(--line);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .flashcard-front{border-top:5px solid var(--navy);}
  .flashcard-back{
    transform:rotateY(180deg);
    border-top:5px solid var(--chart-green);
  }

  .face-label{
    flex:none;
    padding:14px 22px 8px;
    font-family:var(--serif);
    font-style:italic;
    font-size:13px;
    letter-spacing:.04em;
    color:var(--ink-soft);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .flashcard-front .face-label{color:var(--navy);}
  .flashcard-back .face-label{color:var(--chart-green);}
  .face-label .fl-num{
    font-family:var(--mono);
    font-style:normal;
    font-size:11px;
    color:var(--ink-soft);
  }

  .face-scroll{
    flex:1;
    overflow-y:auto;
    padding:2px 22px 10px;
    -webkit-overflow-scrolling:touch;
  }
  .face-scroll p{
    margin:0;
    white-space:pre-wrap;
    font-size:15.5px;
    line-height:1.62;
    color:var(--ink);
  }
  .flashcard-back .face-scroll p{
    color:#233229;
    font-weight:600;
    font-size:17px;
    text-align:center;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100%;
  }

  .face-hint{
    flex:none;
    text-align:center;
    font-size:11px;
    color:#9aa2a0;
    padding:6px 0 12px;
    letter-spacing:.03em;
  }

  .controls{
    flex:none;
    display:flex;
    gap:10px;
    padding:14px 18px 6px;
    max-width:560px;
    width:100%;
    margin:0 auto;
  }
  .ctrl-btn{
    flex:1;
    background:#fff;
    border:1.5px solid var(--line);
    color:var(--navy-deep);
    padding:13px 10px;
    border-radius:10px;
    font-size:14px;
    font-weight:700;
  }
  .ctrl-btn:disabled{opacity:.4;}
  .ctrl-primary{
    background:var(--navy-deep);
    color:#f2ede0;
    border-color:var(--navy-deep);
    flex:1.3;
  }
  .ctrl-primary:active{transform:scale(.98);}

  .restart-btn{
    display:block;
    margin:6px auto 22px;
    background:none;border:none;
    color:var(--ink-soft);
    font-size:12.5px;
    text-decoration:underline;
    padding:8px;
  }

  .end-note{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    padding:0 24px 10px;
  }

  @media (min-width:720px){
    .chapter-grid{grid-template-columns:1fr 1fr 1fr;}
  }
  @media (max-width:380px){
    .chapter-grid{grid-template-columns:1fr;}
  }

  @media (prefers-reduced-motion: reduce){
    .flashcard-inner{transition:none;}
    .pulse-line svg{animation:none;}
  }
</style>
</head>
<body>
<div id="app">

  <!-- ============ SETUP SCREEN ============ -->
  <section id="setup-screen" class="screen active">
    <div class="masthead">
      <div class="pulse-line" aria-hidden="true">
        <svg viewBox="0 0 600 34" preserveAspectRatio="none">
          <polyline points="0,17 60,17 75,17 85,4 95,30 105,17 160,17 175,17 185,4 195,30 205,17 260,17
                     300,17 360,17 375,17 385,4 395,30 405,17 460,17 475,17 485,4 495,30 505,17 560,17
                     600,17 660,17 675,17 685,4 695,30 705,17 760,17 775,17 785,4 795,30 805,17 860,17
                     900,17 960,17 975,17 985,4 995,30 1005,17 1060,17 1075,17 1085,4 1095,30 1105,17 1160,17"
                     fill="none" stroke="#d7c9a3" stroke-width="1.6"/>
        </svg>
      </div>
      <h1>Internal Medicine<span>Case Bank</span></h1>
      <p class="tagline">264 cases · 9 specialties</p>
    </div>

    <div class="setup-body">
      <div class="setup-block">
        <div class="setup-block-head">
          <h2>Choose chapters</h2>
          <button id="select-all-btn" class="link-btn" type="button">Select all</button>
        </div>
        <div id="chapter-grid" class="chapter-grid"></div>
      </div>

      <div class="setup-block">
        <h2>Study mode</h2>
        <div class="mode-toggle" role="group" aria-label="Study mode">
          <button class="mode-btn active" data-mode="sequential" type="button">Sequential</button>
          <button class="mode-btn" data-mode="shuffled" type="button">Shuffled</button>
        </div>
      </div>
    </div>

    <div class="setup-footer">
      <button id="start-btn" class="start-btn" type="button" disabled>Select a chapter to begin</button>
      <p class="start-hint">Tap a chapter to add or remove it from your session</p>
    </div>
  </section>

  <!-- ============ STUDY SCREEN ============ -->
  <section id="study-screen" class="screen">
    <div class="study-topbar">
      <button id="back-btn" class="icon-btn" type="button">‹ Chapters</button>
      <div class="progress-wrap">
        <div class="progress-info">
          <span id="chapter-badge" class="chapter-badge">—</span>
          <span id="progress-text">Case 0 / 0</span>
        </div>
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      </div>
    </div>

    <div class="card-stage">
      <div id="flashcard" class="flashcard">
        <div class="flashcard-inner">
          <div class="flashcard-face flashcard-front">
            <div class="face-label"><span>Case</span><span class="fl-num" id="front-chapter-tag"></span></div>
            <div class="face-scroll"><p id="front-text"></p></div>
            <div class="face-hint">Tap the card, or press Flip Card, to reveal the diagnosis</div>
          </div>
          <div class="flashcard-face flashcard-back">
            <div class="face-label"><span>Diagnosis</span><span class="fl-num" id="back-chapter-tag"></span></div>
            <div class="face-scroll"><p id="back-text"></p></div>
            <div class="face-hint">Tap the card to flip back to the case</div>
          </div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="prev-btn" class="ctrl-btn" type="button">Previous</button>
      <button id="flip-btn" class="ctrl-btn ctrl-primary" type="button">Flip Card</button>
      <button id="next-btn" class="ctrl-btn" type="button">Next</button>
    </div>
    <button id="restart-btn" class="restart-btn" type="button">Restart this session</button>
  </section>

</div>

<script>
(function(){
  "use strict";

  // ============ DIAGNOSIS EXTRACTION HELPER ============
  function extractDiagnosis(backText) {
    // Try to find "1. The diagnosis is..." or similar patterns
    const patterns = [
      /(?:^|\n)\s*(?:The )?diagnosis\s+is\s+([^.\n]+[.\n])/i,
      /(?:^|\n)\s*(?:The )?most likely diagnosis\s+is\s+([^.\n]+[.\n])/i,
      /(?:^|\n)\s*(?:The )?diagnosis\s+of\s+[^.\n]+\s+is\s+([^.\n]+[.\n])/i,
      /(?:^|\n)\s*(?:The )?most probable diagnosis\s+is\s+([^.\n]+[.\n])/i,
      /(?:^|\n)\s*(?:The )?possible diagnosis\s+is\s+([^.\n]+[.\n])/i,
      /(?:^|\n)\s*1\.\s*([^.\n]+[.\n])/i,
    ];
    
    for (let pattern of patterns) {
      const match = backText.match(pattern);
      if (match) {
        let diagnosis = match[1].trim();
        // Clean up common prefixes that might remain
        diagnosis = diagnosis.replace(/^(?:The )?(?:most likely|most probable|possible|provisional|presumptive)\s+/i, '');
        // Capitalize first letter
        diagnosis = diagnosis.charAt(0).toUpperCase() + diagnosis.slice(1);
        // If it's too long (more than 2 sentences), try to get just the first sentence
        if (diagnosis.length > 200) {
          const firstSentence = diagnosis.match(/^[^.!?]*[.!?]/);
          if (firstSentence) {
            diagnosis = firstSentence[0];
          }
        }
        return diagnosis;
      }
    }
    
    // Fallback: just take the first sentence
    const firstSentence = backText.match(/^[^.!?]*[.!?]/);
    if (firstSentence) {
      let diagnosis = firstSentence[0].trim();
      diagnosis = diagnosis.replace(/^(?:The )?(?:most likely|most probable|possible|provisional|presumptive)\s+/i, '');
      diagnosis = diagnosis.charAt(0).toUpperCase() + diagnosis.slice(1);
      return diagnosis;
    }
    
    // If all else fails, take the first 100 characters
    let diagnosis = backText.substring(0, 100).trim();
    diagnosis = diagnosis.charAt(0).toUpperCase() + diagnosis.slice(1);
    return diagnosis + '…';
  }

  // ============ PROCESS CASES TO ADD DIAGNOSIS ============
  // We'll add a 'diagnosis' field to each case by extracting from 'back'
  const CASES_RAW = [{"num": 1, "chapter": "Cardio", "front": "A 42-year-old male patient with a S5-year history of hypertension first diagnosed during pre-employment check up. His family history is positive for hypertension. He is complaining of headache and has been taking lisinopril 20mg daily. Inspite of taking this antihypertensive drug regularly, his blood pressure remained elevated, ranging from 150/110 to 160/95 mm Hg. Physical assessment was unremarkable except for the presence of obesity. Serum sodium 138 mEq/L (135 to 147 mEq/L); potassium 4.1 mEq/L (3.5 to 5 mEq/L); BUN 19 mg/dL (10 to 20 mg/dL), creatinine 0.9 mg/dL (0.35 to 0.93 mg/dL), total cholesterol 268 mg/dL (<245 mg/dL), triglycerides 120 mg/dL (<160 mg/dL), and fasting glucose 105 mg/dL (70 to 100 mg/dL).\n\n1. What is the treatment plan for this patient?", "back": "The treatment plan is lifestyle modifications, weight reduction (help to lower blood pressure), diet modification (moderate reduction in sodium chloride intake can lead to a small reduction in blood pressure) and exercise Modification of BP therapy (with target BP <135/85 mmHg home BP monitoring (HBPM) or<140/90mmHg clinic BPM (according to NICE guidline)    As Renin angiotensin system (RAS) blockers, thiazides and CCBs are the 1% step in the management of hypertension with none of them superior to the others in the absence of renal disease So, ACE inhibitor is continuing, adding calcium channel blockers (CCBs) e.g. amlodipine Smg/day and re-evaluate the patient after two weeks. At that time, if blood pressure control remained marginal, low-dose hydrochlorothiazide (HCTZ) (12.5 mg/day) is added to the regimen. As regards high cholesterol, weight reduction, diet modification and exercise are recommended. In addition, statin is added if 10 year risk for ASCVD is > 7.5% or LDLc > 190 mg/dL. ASCVD risk estimation requires LDL and HDL cholesterol which are not available in the case. No clear benefit for aspirin in primary prevention in patients 50 years old. Hypertension is frequently associated with alterations in blood glucose and lipid profile. The prevalence of prediabetes, diabetes, dyslipidemia, and metabolic syndrome is much greater in hypertensive than normotensive people .So, HbAlc is recommended as well as repeating fasting glucose and blood glucose after 75 gm oral glucose to screen for prediabetes or diabetes. Also detection of target organ disease (e.g., renal damage, congestive heart failure) is recommended."}, {"num": 2, "chapter": "Cardio", "front": "A 52-year old woman, housewife, has 5 children. Her BP is repeatedly 160/105. She refused to take antihypertensive drugs as she feels fine and has no complaints.\n\nFew days ago, she started to complain of chest pain when she climbs 3 floors. This pain disappears without medication.\n\nWhat is the most likely diagnosis of this patient? Bow o=\n\nWhat are the important points in history you need to ask about? Enumerate essential investigations\n\nWhat are the drugs used in the treatment of these conditions?", "back": "1. The patient has stage 2 hypertension: a) Non elevated blood pressure less than 120/70mmHg. b) Elevated blood pressure is clinic BP of 120/70-139/89 mmHg. c) Stage 1 hypertension if SBP 140-159 mmHg and DBP 90-99 mmHg. d) Stage 2 hypertension if BP > 160/100 mmHg but less than 180/120 mmHg. According to (ESC 2024) Important points in the history: Smoking, family history, other comorbidities, medications/surgical history and menstrual history. Analysis of chest pain, ask about dyspnea, orthopnea & PND. The duration of hypertension and duration of the new symptoms, does this problem interfere with her daily life, uncontrolled blood pressure can cause these symptoms.\n\nInvestigations: ECG, Echocardiography, Stress ECG, thallium scan, coronary CT angiography or angiography. Blood sugar, blood lipid profile, serum creatinine, sodium, potassium, urine analysis, microalbuminuria & estimated GFR. Fundus examination. Treatment:\n\nLife style modification:\n-   Weight control\n-   Diet: low salt (< 2 grams), DASH diet; (low saturated fat, rich in fruits & vegetables), Low fat dairy, oily fish, pouliry, whole grain and nuts, little red meat, sweets or sugary drinks. Potassium rich diet such as banana, citrus, tomato, squash and green leafy vegetables. Poly-unsaturated fatty acids (omega 3).\n-   Moderate aerobic activity; regular walking routine (50 min/week) is reasonable. Drugs:\n-    In stage 2 hypertension starting with 2 drugs is recommended to BP treatment target < 130/80. In patients with hypertension and CAD beta blocker (for BP control and CAD) and ARBs or ACEi are reasonable with addition of other drugs as dihydro-pyridine CCB, thiazide and or mineralcorticoid antagonists as needed for further BP control.\n-   Drugs for angina (nitrates, or nicardipine). Statins to keep LDL cholesterol <70 mg/dl. Antiplateletes as aspirin. Coronary angioplasty , coronary stents or CABG may be required according to the results of stress test and coronary angiography.\n-   Follow up every month."}, {"num": 3, "chapter": "Cardio", "front": "A 64-year-old male presented to the outpatient clinic taking antihypertensive therapy for almost 15 years. At that time he was taking hydrochlorothiazide 25 mg qd., amlodipine 5 mg bid., and bisoprolol 5 mg qd and his blood pressure was well-controlled. Recently he developed exeretional dyspnea and paroxysmal    nocturnal   dyspnea.   Blood   pressure   measurments     were consistently ranging from 180/110-200/100 mm Hg and failed to respond to increased dose of amlopidine. A lipid profile revealed total cholesterol 261 mg/dL, low-density lipoprotein 174 mg/dL, and high-density lipoprotein 40 mg/dL. Ultrasonography demonstrated size discrepancy of greater than 1.5 cm between both kidneys.\n\n1. What is the explanation for accelerated hypertension?\n\n2. What is the most appropriate pharmacological therapy for hypertension and why?", "back": "1.   Secondary causes of hypertension should be considered in this patient with recently developing accelerated hypertension, especially that the patient was receiving regular triple antihypertensive drugs. An elderly male patient with long standing hypertension, and dyslipidemia; renovascular hypertension should be considered. Renovascular hypertension is BP elevation due to partial or complete occlusion of one or more renal arteries or their branches. Overall, about 80% of cases are caused by atherosclerosis as in our case and 20% by fibromuscular dysplasia. Atherosclerosis is more common in men > 50years old and affects mainly the proximal one third of the renal artery. Fibromuscular dysplasia is more common among younger patients (usually women) and usually affects the distal two thirds of the main renal artery and the branches of the renal arteries. Rare causes include emboli, trauma, inadvertent ligation during surgery, and extrinsic compression of the renal pedicle by tumors. The most appropriate therapy after confirming the diagnosis of renovascular hypertension (duplex ultrasonography, computed tomographic angiography in patients with normal renal function, and magnetic resonance angiography). All classes of antihypertensive medications are used, but the drugs of choice are those that block the RAAS, such as angiotensin converting enzyme inhibitors (ACEI) and angiotensin receptor blockers (ARB), since this type of hypertension is renin dependent. In addition, RAAS blockers can be used in combination with diuretics, calcium channel blockers and betablockers. Occasionally, in severe bilateral atherosclerotic RAS or solitary kidney the use of RAAS blockers could lead to significant increase in serum creatinine due to drop in glomerular filtration pressure from the decrease in the efferent arterial pressure produced by these drugs. This complication is completely reversible with the discontinuation of the medications. Therapy should be discontinued if their creatinine levels rise by > 30% above pretreatment value. Aggressive control of other risk factors for atherosclerosis is also crucial e.g dyslipidemia in this case provides benefit in atherosclerotic renovascular HT. The invasive and surgical options for treatment of renovascular hypertension include percutaneous transluminal angioplasty (PTA), surgical revascularization or nephrectomy"}, {"num": 4, "chapter": "Cardio", "front": "A 45 year-old male came complaining of chest pain with exertion , several weeks of worsening exertional dyspnea and history of lightheadedness as if he was about to faint. He has orthopnea with occasional paroxysmal nocturnal dyspnea. He does not smoke. On examination, temperature 37°C, pulse 104 bpm, BP 115/90 mm Hg, and respiratory rate 16 breaths per minute. Examination of the head and neck revealed congested neck veins. Chest examination:             Bilateral basal inspiratory crackles. Cardiac examination, apex is felt in the 5™ space, his heart rhythm is regular with a normal S1 and a splitting second heart sound during expiration, an S4 at the apex . An ejection systolic murmur is at the upper right sternal border that radiates to his carotids.\n\n1. What is the most likely diagnosis?\n\n2. What is the most appropriate investigation to reach the diagnosis? Explain why.\n\n3. What are the indications of surgery?", "back": "1. The most likely diagnosis is congestive heart failure (CHF) (dyspnea, orthopnea with occasional paroxysmal nocturnal dyspnea, congested neck veins , Bilateral basal inspiratory crackles.).. possibly as a result of aortic stenosis. Dyspnea, syncope (or other low CO symptoms) and angina are the main aortic stenosis symptoms.\n\n2. The most appropriate investigation:\n\n-   Echocardiography study to assess the aortic valve area, the state of the left ventricle and the left ventricular systolic function, to estimate the pressure gradient across the valve and the stroke volume index.\n-   Cardiac CT provides information concerning the anatomy of the aortic root and ascending aorta, and the extent and distribution of valve and vascular calcification.\n\n-   Coronary angiography is essential prior to surgery to determine the potential need for concomitant revascularization\n3. Indications of surgery for all symptomatic patients with:\n\n-    Severe, high-gradient aortic stenosis [mean gradient > 40mmHg, peak velocity > 4.0m/s, and valve area < 1.0cm2].\n-    Severe low-flow [stroke volume index (Svi) < 35mL/m2), lowgradient (<40mmHg) aortic stenosis with reduced ejection fraction (<50%), and evidence of flow (contractile) reserve which is assessed by low-dose dobutamine stress echocardiography."}, {"num": 5, "chapter": "Cardio", "front": "A 26-year-old woman, with known RHD presents to the emergency room complaining of sudden onset of palpitations, shortness of breath and coughing of scanty amount of frothy pink sputum. On examination, she is uncomfortable, has red cheeks, her heart rate is 130 bpm, irregular., BP 90/60 mmHg, respiratory rate 30 breaths per minute. Normal jugular venous pressure. She has bilateral inspiratory crackles in the lower lung fields, but no lower limb edema. On cardiac examination, apical impulse is non displaced. Heart rhythm is irregular with variable mtensity of S1 and low-pitched diastolic murmur at the apex. The oxygen saturation is 94% at room air.\n\n1. What is your most likely diagnosis?\n\n2. What is the emergency treatment for this patient?\n3. What is the long term management plan for this patient?", "back": "1. The most likely diagnosis is Rheumatic heart disease, Mitral stenosis, Atrial fibrillation (A.F), Cardiac asthma due to AF.\n\n2. Emergency treatment for this patient is the treatment of AF in hemodynamically unstable patient: Ventricular rate control by cardioversion : medical or electrical\n-   Medical: IV infusion of anti-arrhythmic drug such as classic Ic or a class III agent.\n\n-   Electrical: DC shock\n-   Oxygen: Supplemental oxygen to maintain PO2% > 94%\n-   Diuretics (e.g., IV furosemide) for pulmonary congestion (The cardiac asthma is controlled after controlling AF)\n3. Long term management plan:\n\nA. Definitive management of mitral stenosis: assessment the lesion by echocardiography to assess valve area, left atrial size, and pulmonary pressure Consider percutaneocus balloon mitral valvetomy (PBMYV) if suitable. If PBMYV is contraindicated or raised pulmonary pressure or persistance of pulmonary congestion despite therapy consider mitral valve replacement\n\nB. Rhythm and rate control:\n\n-   Chronic rate control (e.g., beta-blockers or digoxin)\n-   Consider long-term rhythm control (e.g., antiarrhythmics or ablation) depending on symptom burden and cardiac function C. Lifelong anticoagulation: If atrial fibrillation persists or recurs\n\nD. Secondary prophylaxis for RHD: Benzathine penicillin G, 1.2 million units IM every 3—4 weeks. For at least 10 years after last episode of Rf or lifelong if there is established valvular heart disease E. Regular follow-up: echocardiograms, INR monitoring if on warfarin"}, {"num": 6, "chapter": "Cardio", "front": "A 28-year-old woman presents to the emergency room complaining of palpitations, severe shortness of breath and cough. She also, reports change of the color of her urine. She has a history of rheumatic fever at the age of 14 years. On examination, heart rate is 130 bpm and is regular, blood pressure 120/70 mm Hg, temperature 38.4°C, respiratory rate 32 breaths per minute, and oxygen saturation of 90% on room air. Jugular venous pressure is normal, no peripheral edema. Abdominal examination revealed a just palpable spleen. Chest examination showed bilateral inspiratory crackles in the lower lung fields. On cardiac examination, apical impulse is non displaced, a muffled S1, and high-pitched systolic murmur at the apex propagating to the axilla.\n\n1. What is your most likely diagnosis? Explain why?\n\n2. What are the most important investigations for this patient? (mention 4) and why?.\n\n3. What is the treatment?", "back": "1. Rheumatic heart disease, Mitral valve disease (mitral regurge), left sided heart failure, precipitating factor is infective endocarditis. The most important investigations are: Blood culture: 3 sets before antibiotics for the causative organism Echocardiography: trans-thoracic; trans-oesophageal to demonstrate the vegetations, assess the mitral valve, demonstrate systolic and/or diastolic impairment of the ventricles Urine analysis : detects glomerulonephritis (hematuria, proteinuria), a sign of immune complex deposition ECG (ventricular enlargement,            conduction   abnormalities   in perivalvular extension ). Treatment of infective endocarditis Blood cultures are taken first then start empiric antibiotics. Suggested antibiotics: benzyl penicillin plus gentamicin. Then change antibiotics according to culture and sensitivity. Treatment of heart failure:\n- Control excessive retention of salt and water:        Furosemide -+ thiazide and spironolactone.\n- Vasodilator therapy:\n- Venodilators: short and long acting nitrates.\n- Balanced vasodilators: ACEIs, ARBs. Indications of valve replacement in patients with native valve endocarditis are as follows:\n- Congestive heart failure refractory to standard medical therapy\n- Fungal infective endocarditis\n- Persistent sepsis after 72 hours of appropriate antibiotic treatment\n- Recurrent septic emboli, especially after 2 wecks of antibiotic treatment\n\n- Conduction disturbances caused by a septal abscess."}, {"num": 7, "chapter": "Cardio", "front": "A 28-year-old man presented to the emergency department with high fever for 3weeks. He complained of malaise and poor appetite. There was no previous history of heart disease or rheumatic fever. He is a smoker and an intravenous drug user. On examination, temperature was 39.5°C, pulse rate 120bpm and blood pressure 100/60 mm Hg. Cardiac examination revealed a pansystolic murmur in the tricuspid area, splenomegaly. Laboratory invesﬁgations revealed hemoglobin 7 g/dl, WBC 17.5x107/, platelets 540x10°/1, ESR 110 mm/hour, C-reactive protein 280 mg/l, blood urea 45 mg/dL and serum creatinine 1.0 mg/dl. Chest X-ray was normal. ECG showed sinus tachycardia. Transthoracic echocardiogram showed two vegetations with severe tricuspid regurgitation. CT scan of the chest showed metastatic infection in the form of microabscesses in both lung bases. Two sets of blood cultures grew Staphylococcus aureus sensitive to vancomycin and gentamicin\n\n1. Which type of infective endocarditis belong to this patient and why?\n\n2. Criteria for failure of medical treatment and further steps for management?", "back": "L. The patient has acute infective endocarditis (IE) of right sided affection. Acute infective endocarditis is a much more aggressive disease. Patients with right-sided IE due to intravenous drug abuse, the vegetations of S aureus, Haemophilus influenzae and fungi are much more likely to embolize than those of S viridans. Those larger than 10 mm in diameter and mobile or prolapsing have a high rate of embolization. The vegetation that grows during therapy is associated with a significant increase in the risk of embolization but with the persistence of bacteremia. Criteria for failure of medical treatment:\n\nPersistent of bacteremia with high fever. Heart failure, valve dysfunction, perivalvular or myocardial abscess formation.\n\nThe presence of an unstable valve that is becoming detached from the valve ring. More than one embolic episode with persistent vegetations observed on trans-esophageal echocardiogram, or the presence of vegetations larger than 1 cm in diameter.\n\nRenal failure.\n\nHigh ESR and C-creative protein. The steps in management in the setting of acute IE, institute antibiotic therapy as soon as possible to minimize valvular damage. Three to 5 sets of blood cultures are obtained within 60-90 minutes, followed by the infusion of the appropriate antibiotic regimen. Empiric antibiotic IV should be used aimed at§ aurews with vancomycin and gentamicin.\n\nInfective endocarditis that is progressive despite the use of proper antibiotics requires valvular surgery."}, {"num": 8, "chapter": "Cardio", "front": "A 58-year-old man presents complaining of several weeks of worsening exertional dyspnea. He previously had chest pain on walking and on performance of strenuous exertion. He gave history of orthopnea and paroxysmal nocturnal dyspnea with edema of the lower limb. He has a history of hypercholesterolemia and smokes 20 cigarettes per day. On physical examination, temperature37°C, heart rate 110 bpm, blood pressure 120/90 mm Hg, and respiratory rate 36 breaths per minute. Examination of the head and neck revealed congested pulsating neck veins. Chest examination revealed bilateral basal inspiratory crepitations. On cardiac examination, apical impulse was displaced outwards and downwards, his heart thythm is regular with a normal S1, and S3 at the apex.\n\n1. What is the most likely diagnosis?\n2. What are the risk factors of his condition?\n3. What are the recommended investigations to assess the condition? Explain why.", "back": "1. The  diagnosis is      congestive        heart   failure   due    to    ischemic cardiomyopathy.\n\nThe risk factors in this patient are:\n\nMale patient Age\n\nHypercholesterolemia.\n\nCigarette smoking. Recommended investigations are:\n\nECG to demonstrate ST-T changes, arrhythmia and conduction abnormalities. Chest x-ray to demonstrate generalized cardiac enlargement and lung congestion.\n\nTwo-dimensional Echocardiography to assess the global contractility of the heart and wall motion abnormalities. Cardiac catheterization to assess coronary vessels. Blood tests: serum electrolytes to detect and follow serum Na & K, liver function tests { AST, ALT), CBC, renal function test, Pro BNP, lipid profile, RBG and HbAlc."}, {"num": 9, "chapter": "Cardio", "front": "A 43-year-old man presents to the ENT clinic complaining of recurrent attacks of epistaxis. He was discovered to have hypertension. He has a history of smoking 20 cigarettes per day for the last 25 years.\n\nOn examination, his heart rate 80 bpm and is regular, with blood pressure 170/110 mm Hg, respiratory rate 24 breaths per minute. Head and neck examination showed normal jugular venous pressure, both carotid impulses were felt equally. Cardiac examination revealed non displaced apical impulse, it is localized and heaving in character with normal S1, accentuated S2 , 84 at the apex , no murmurs.\n\n1. When to diagnose a case of hypertension?\n\n2. Explain the physical findings detected in this patient?\n3. What are the investigations recommended to such patient?", "back": "1. Normal BP is defined as SBP < 120 mmHg and DBP < 80 mmHg, Elevated BP if SBP 120-129 mmHg and DBP > 80 mmHg. Stage 1 Hypertension if SBP 130-139 mmHg and DBP 80-89 mmHg.\n\nStage 2 Hypertension if SBP > 140 mmHg and DBP > 90 mmHg. Diagnosis of hypertension is made after repeated BP measuring 3 times few weeks apart except if BP is markedly elevated hypertensive crisis SBP >180mmHg and or >120 mmHg or there is end organ damage.\n2. Physical findings : Localized heaving apex: left ventricular hypertrophy. S4 at the apex: forcible atrial contraction in face of left ventricular hypertrophy. Accentuated A2: systemic hypertension (closure of the aortic valve against high pressure in the aorta.\n3. Recommended investigations: _— Investigations to detect end organ damage: urine analysis, blood urea,   serum     creatinine,    serum    electrolytes,   ECG      and Echocardiography, abdominal ultrasound. Investigations to detect risk factors: blood glucose, lipid profile and serum uric acid."}, {"num": 10, "chapter": "Cardio", "front": "A 53-year-old man is admitted from the emergency room with shortness of breath which began about 2 weeks ago and last night he awoke from sleep and had to get up to \"get some air\", He denies any cough, hemoptysis, chest pain or discomfort, back pain, urinary abnormalities, abdominal pain or ankle swelling. He is known to be hypertensive on irregular treatment. Physical examination: pulse 120/min, regular, BP180/100. Chest examination showed basal rales audible about half way up bilaterally. Heart examination showed normal JVP. There is a palpable LV heave. Auscultation revealed regular thythm, S2 is loud and there is evidence for an S4 and S3. There is a 2/6 holosystolic murmur heard at the apex that radiates to the left axillary line. Abdomen showed no organomegaly.\n\n1. What is the most likely diagnosis?\n2. What aspects of history and physical exam support your diagnosis?\n3. What are the most likely precipitating medical causes for his problem?\n\n4. What investigations you like to do to this patient?\n\n5. What are the main lines of treatment for this patient?", "back": "1. Left ventricular failure secondary to hypertensive cardiomyopathy.\n\n2. Aspects of the history that support my diagnosis: The presence of paroxysmal nocturnal dyspnea points to the presence of left ventricular failure. Aspects of the physical examination that support the diagnosis: Tachycardia (120/min) may correlate with heart failure. B.P. 180/100 confirms the presence of hypertension. Palpable L'V heave denotes pressure overload on the LV due to hypertension. Loud S2 is due to systemic hypertension. Holosystolic murmur at the apex that radiates to the left axillary line denotes MR. S3 is due to blood gush in the ventricles after opening of A-V valve leading to excess ventricular vibrations (volume overload) due to MR. S4 is due to forcible atrial contraction against tension overload (systemic hypertension).\n3. Most likely precipitating medical cause (heart failure) is systemic hypertension.\n4. Imvestigations: Chest x ray (evidence of pulmonary congestion, evidence of Lt.ventricular hypertrophy). 2 D and Doppler echocardiography (evidence of ventricular hypertrophy & assess the global contractility of the heart and wall motion abnormalities.). 5., The main lines of treatment. Oxygen, confrol of blood pressure (target <130/80) ACE inhibitors and ARBs or angiotensin receptor-neprilysin inhibitor, balanced vasodilators, and diuretics to control excess salt and water retention. SGLT?2 inhibitors - antiplatelet drugs. In patients receiving optimal therapy have persistent symptoms ,it is suggested adding mineralocorticoid antagonist. Moreover, Betablocker can be added to control the heart rate and Bp."}, {"num": 11, "chapter": "Cardio", "front": "A 30 year-old women is admitted with a persistent cough , paroxysmal nocturnal dyspnea and orthopnea 3 days after normal vaginal delivery which were accompanied by edema in both lower limbs and pain in the right hypochondrium. Physical Examination: pulse 120 bpm with occasional irregularity, respiratory rate 26/min, blood pressure 90/60, jugular venous pulsations is seen at 6 c¢cm above angle of Louis at 45°. Extremities: peripheral edema. Lungs: bibasilar rales. Abdomen: hepatomegaly. Cardiac: apex is shifted down and out, diffuse in character with apical high —pitched systolic murmur of 2/6 intensity and S3 gallop.\n\n1. What is the most propable diagnosis?\n\n2. What are the recommended investigations to reach the diagnosis? Justify.\n\n3. Mention 3 other causes of that condition?", "back": "1. Diagnosis is Congestive heart failure; Peri-partum cardiomyopathy (dilated cardiomyopathy). Peripartum cardiomyopathy is an idiopathic cardiomyopathy presenting with HF secondary to left ventricular systolic dysfunction towards the end of pregnancy or in the first 5 months following delivery, where no other cause of HF is found.\n\n2. Recommended investigations:\n\n- Echocardiography: to assess ventricular function, valve structure, chamber size, and wall motion.\n\n-   ECG: may be normal, show sinus tachycardia or, rarely, atrial fibrillation if the cardiomyopathy is severe. Other nonspecific findings include low voltage, left ventricular hypertrophy, and nonspecific ST-segment and T-wave abnormalities\n- Chest X-ray: to detect lung congestion.\n\n3. Three other causes of dilated cardiomyopathy:\n\n- Post-infection, propably viral\n\n- Auto-immune diseases as SLE and systemic sclerosis\n- Toxic: alcohol, cocaine, doxorubicin, cyclophosphamide."}, {"num": 12, "chapter": "Cardio", "front": "A 45-year-old man, smoker, arrives at the emergency department with severe retrosternal chest pain with left arm radiation, the pain is partially relieved by sublingual nitroglycerin. Physical examination: vital signs: pulse 90 bpm; blood pressure 130/80. Cardiac: regular rhythm; no murmur or extra sounds. Laboratory findings: CBC: normal, cardiac enzymes: moderately elevated CK-MB and troponin. ECG: on first day, ST depression of 2 mm in V1-V4\n\n1. What is the diagnosis?\n2. How would you manage this patient?", "back": "1. Pain is typical of acute coronary syndrome (ACS). The increased level of myocardial biomarkers and ST depression are diagnostic of acute nonST segment elevation Myocardial infarction (mon STEMI).\n\n2. Management: once the diagnosis ACS is suspected Aspirin 300 mg + Ticagrelor 180 mg or a loading dose of clopidogrel 300mg)\n-   Transfer to CCU: therapy for acute myocardial infarction is directed toward restoration of perfusion, prevention and treatment of any complications that may arise and pain relief using morphine.\n-   Oxygen if oxygen saturation < 90%.\n-   Drugs to limit the infarct size: dual antiplatelets (see above) if not given in ER or before hospital arrival). Sublingual nitroglycerin (or IV infusion), Beta blockers e.g. metoprolol (5 mg iv or 50-100 mg oral). Low molecular weight (LMW) heparin\n\ne   Low risk patients: Continue in hospital medical treatment (see above). Stress ECG or thalium myocardial perfusion imaging is considered before hospital discharge to evaluate for the need of PCL.\n\ne   In moderate or high risk patients early coronary angioplasty and stenting (PCI) and glycoprotein IIb/IIla inhibitors infusion as abciximab or eptifibatide are considered before and up to 24 hr after the procedure that prevent fibrinogen binding to these receptor and inhibiting platelet aggregation improves the MI and mortality risk.\n\n-   In hospital treatment after PCI: aspirin 81 mg/d , ticagrelor 180 mg/d, or clopidogrel 75 mg/d, beta blocker, ACEI and statin."}, {"num": 13, "chapter": "Cardio", "front": "A 57-year-old man with triple coronary artery disecase was scheduled for coronary artery bypass grafting. He had a myocardial infarction 7 months ago. He was taking nitroglycerin, digoxin, propranolol, isosorbide dinitrate and nifedipine. His blood pressure was 120/80 mm Hg and his heart rate 60 beats per minute.\n\n1. What are the indications for coromary artery bypass grafting (CABG)?\n2. What is triple-vessel coronary artery disease?", "back": "1. The indications for CABG consist of the need for improvement in the quality or quantity of life. Patients whose angina is not controlled by medical treatment or who have unacceptable side effects with such management should be considered for coronary revascularization. Percutaneous transluminal coronary angioplasty (PTCA) is currently accepted as the initial procedure of choice in selected patients with obstructive coronary artery disease (CAD). The following are indications for CABG (American College of Cardiology (ACC) and the American Heart Association (AHA)):\n-   > 50% left main coronary artery stenosis\n-   > T70% stenosis of the proximal left anterior descending (LAD) and proximal circumflex arteries\n-   > 70% proximal LAD stenosis with either an ejection fraction (EF) below 50% or demonstrable ischemia on noninvasive testing\n-   Three-vessel disease in Asymptomatic patients Patients with mild or stable angina Patients with proximal LAD stenosis and poor LV function\n-   Disabling angina (class I) Ongoing ischemia in the setting of a non—STEMI                that is unresponsive to medical therapy\n-   Poor LV function but with viable, nonfunctioning myocardium above the anatomic defect that can be revascularized. The triple-vessel coronary artery disease: the patients with triple vessel disease, meaning that 3 big vessels (the left anterior descending, right coronary and circumflex arteries) have blockages from atherosclerotic plaques."}, {"num": 14, "chapter": "Cardio", "front": "A 68 year old male patient presented to the ER with 2 hour history of severe central chest pain associated with nausea and profuse sweating. On examination: there is pallor, BP 150/80 mmHg, pulse 60 bpm, S4 gallop over the apex.\n\n1. What is the most likely diagnosis?\n\n2. What further investigations would you recommend for him?\n\n3. Outline your management strategy?", "back": "-   The most likely diagnosis is an acute inferior myocardial infarction as the patient has bradycardic due to AV block, which may be temporary or permanent necessitating cardiac pacemaker.\n-   The recommended investigations are:\n\n-   ECG to prove MI and its extent.\n-   Cardiac enzymes: troponin T and I which rises 2-4 hours after infarction, CPK rises within 4-8 hours CPK-MB isoenzyme is more specific as it is found in cardiac muscles\n-   Echocardiography to assess global and regional cardiac function, ejection fraction, systolic and diastolic function\n-   Lipid profile, blood glucose; as they are risk factors for myocardial infarction. CBC, blood urea, serum creatinine, as a preparatory step before coronary angiography.\n-   The strategy for management :\n\nAt ER before admission to CCU: once diagnosis of acute MI suspected pain relief morphine, loading aspirin and clopidogrel or Ticagrelor, LMWH, oxygen if SO2 less than 90 % (avoid Beta blockers as our patient has bradycardia). After admission to CCU:\n\n-   Recanalization therapy primary percutaneous coronary angioplasty (PTCA) or thrombolytic therapy according to availability, location,\n\nresources, time to PTCA.\n\n-   Unfractionated heparin or LMWH, high intensity statin, nitroglycerin, ACE ], anti-platelet aspirin and clopidogrel or ticagrelor, nitrates\n\nIn hospital treatment after PCI: aspirin 81 mg/d, ticagrelor 180\n-   mg/d, or clopidogrel 75 mg/d, ACE I and statin."}, {"num": 15, "chapter": "Cardio", "front": "A 24-year-old medical student had sudden onset of substernal pain with radiation to his shoulders and neck. He describes the pain as sharp especially if he takes a deep breath. The patient also noted fever with flu-like symptoms one week before. Physical Examination; vital signs: pulse 120, blood pressure 110/70. Cardiac: friction rub over the precordium best heard along the left sternal border with the patient sitting up and leaning forward. Laboratory findings: CBC, urine analysis, and blood chemistry: normal. ECG: shows elevated ST segment in all ECG leads, cardiac enzymes are normal\n\n1. What is the most probable diagnosis?\n\n2. Mention 3 other etiological causes of this condition?\n\n3. What is the treatment of this particular patient?", "back": "1. The most propable diagnosis is viral pericarditis.\n2. Three other etiological causes of pericarditis are: renal failure, transmural myocardial infarction, collagen vascular disease as SLE, rheumatoid, acute rheumatic fever.\n3. Treatment: Treatment       of the    cause,   bed    rest,   NSAIDs   and/or corticosteroids."}, {"num": 16, "chapter": "Cardio", "front": "A 22-year-old woman presents with fatigue, shortness of breath, and loss of appetite. Her symptoms had started 2 weeks ago and have progressively worsened. She has had a fever for the past 3 days and night sweats. Her past medical history is unremarkable except for a wisdom tooth extraction approximately 2 months before she came to the clinic. On physical examination, she has a temperature of 38.6° C, heart rate of 120/min, respiratory rate of 24/min, and BP of 110/85 mm Hg. She has a 4/6 holosystolic murmur that radiates to the left axilla. Skin examination reveals scattered petechiae on her extremities.\n\n1. What is the most likely diagnosis? Justify.\n\n2. What are common clinical findings on physical exam that are associated with this condition?\n3. What risk factors are associated with an increased incidence of this condition?\n\n4. What are the most common pathogens associated with this condition?\n5. What are the most appropriate next steps in the investigations of this patient?\n\n6. What are the possible complications of this condition?", "back": "1. Most likely diagnosis: The patient’s symptoms, fever, combined with a heart murmur and associated skin lesions, are most suggestive of infective endocarditis following bacteremia from her dental procedure. Common clinical findings associated with this condition :\n- Fever, cachexia , anemia & clubbing\n- Skin lesions: petechiae, splinter hemorrhage, & generalized rash.\n- Fundus : Roth spots\n- Cardiac manifestations: new murmur, widened pulse pressure, tachycardia, heart failure.\n- Splenomegaly.\n- Systemic embolisation. Risk factors for infective endocarditis: Mitral valve prolapse, bicuspid aortic valvular heart disease. Prosthetic valve, pacemaker endocarditis, implant cardiac devices and intravenous drug abuse Prior infective endocarditis, Rheumatic valve disease. Rare in congenital cyanotic heart disease and ASD Most common pathogens :\n-     Streptococci (particularly Strepfococcus viridans), 50% (this is the most probable causative microbe of infective endocarditis following tooth extraction.\n-     Staphylococcus aureus 20% — especially in 1V drug use and acute IE\n-    Enterococcus spp.10% — often linked to genitourinary procedures\n-     Other causative agents of infective endocarditis\n- QGram negative bacteria of HACEK organisms                      (Haemophilus aphrophilus   [recently renamed Aggregatibacter     aphrophilus], Actinobacillus actinomycetemcomitans, Cardiobacterium hominis, Eikenella corrodens, and Kingellakingae), 5%.\n-   Culture negative, 5% Most important investigations:\n-    Blood cultures: Three separate sets, each from a separate venipuncture, obtained over 24 hours, are recommended to evaluate suspected endocarditis.\n-    Transesophageal echocardiogram is preferred over                a   transthoracic echocardiogram to evaluate for valvular vegetations.\n-    A complete blood count is performed to look for anemia.\n-    A basic metabolic panel and urinalysis are performed to evaluate renal function (immune complex glomerulonephritis often occurs in endocarditis). Complications :\n-  Cardiac: valvular damage, heart failure, intracardiac abscesses, pericarditis.\n-    Neurologic: meningitis/encephalitis, embolic stroke, cerebral hemorrhage, brain abscess or cerebritis.\n-    Renal: renal infarction, glomerulonephritis.\n-    Musculoskeletal: osteomyelitis."}, {"num": 17, "chapter": "Cardio", "front": "A 35 year old male presented to the ER with fever and sudden onset of left sided weakness and hemi-hypoesthesia. On examination his pulse was irregular and he was on anticoagulation for atrial fibrillation . BP 140/70mmHg, Temp 38.7 with a toxic look. Peripheral pulsations were intact with 1 degree clubbing Cardiac examination revealed muffled 1% and 2% sounds with pansystolic murmur over the apex radiating to the axilla and early diastolic murmur over the aortic area. Brain CT scan showed massive right frontoparietal infarction.\n\n1. What is the possible cause of this patient’s fever?\n\n2. Mention two        important    investigations   to   prove   your diagnosis?\n\n3. Would you like this patient to continue on anticoagulation ?", "back": "1. Infective endocarditis complicating chronic rheumatic valvular heart disease.\n\n2. Blood culture three separate sets, each from a separate venipuncture, obtained over 24 hours and transthoracic and transoesophageal echocardiography to prove the presence of vegetations.\n\n3. The patient should discontinue anticoagulation for two reasons to avoid hemorrhagic transformation of infarction as its large size and avoid the risk of hemorrhage from mycotic aneurysms complicating infective endocarditis."}, {"num": 18, "chapter": "Cardio", "front": "A 15-year-old girl presents to the clinic with a 3-week history of joints pain. The pain initially began in her legs. That pain resolved spontaneously, and then she experienced pain in her knees followed by her wrists. She recalls having a sore throat 2 weeks before her symptoms began. Vital signs are temperature 38°C, pulse 130 bpm, respiratory rate 12/minute, and blood pressure 110/70. Physical examination shows active arthritis in the wrist joint. Auscultation of the heart reveals a 2/6 blowing pansystolic murmur that is heard best at the apex and radiates to the axilla.\n\n1. What is the most likely diagnosis? (Explain Why)\n2. What is the cause of her condition?\n\n3. How would you treat her?", "back": "1. The most likely diagnosis is rheumatic fever. Diagnosis of rheumatic fever is clinical based on the Jones criteria: to make the diagnosis, a patient must have either two major or ome major and two minor criteria in the presence of a laboratory evidence of recent infection with group A beta hemolytic streptococci. Here the patient has: 2 major, arthritis (fleeting as shown in the case), carditis (holosystolic murmur and (trachycardia out of proportion to rise in temperature) and 1 minor , fever.\n\nRheumatic fever is an immune-mediated condition that occurs 2 to 4 weeks after untreated streptococcal pharyngitis in 3% of patients.\n\nEvidence of recent throat infection with group A beta hemolytic streptococci (either increased antistreptolysin O titer (or other streptococcal antibodies), positive throat culture, positive rapid streptococcal antigen test, or recent scarlet fever)\n\n3. Acute rheumatic fever is a self-limiting condition, As there is evidence of carditis and no evidence of heart failure, Aspirin can be used. Prednisone 0.5 to 2 mg/Kg/day orally up to 60 mg/day in severe carditis (heart failure) instead of aspirin. Treatment of streptococcal infection with Phenoxymethyl penicillin 500 mg 12 hourly for 10 days after sensitivity test. Prophylaxis against recurrence of acute rheumatic fever :\n-   Continue oral Phenoxymethyl penicillin 500 mg until the patient is 18 to 20 years of age or\n\n-   Benzathine penicillin G 1.2 million unit monthly IM injection.\n-   If allergic to penicillin, a sulphonamide or erythromycin can be used.\n\n-   Prophylaxis   against infective endocarditis: erythromycin or amoxicillin   before dental, genitourinary, and other invasive procedures."}, {"num": 19, "chapter": "Cardio", "front": "A 75 -year-old female presented to the ER complaining of nausea, vomiting, dizziness, confusion and blurred vision for 5 days. She has history of hypertension and angina. Last month she was admitted in the ICU complaining of dyspnea that awakened her from sleep and rapid irregular palpitations. She was discharged after one week on the following medications: digoxin, lisinopril, furosemide and warfarin. Physical examination: The patient is confused. BP: 135/95, Pulse: 100 bpm, irregular. Elevated jugular venous pressure with systolic expansion, variable intensity of S1, pansystolic murmur and S3 over the apex and tricuspid area. Abdominal examination:       tender epigastrium, no rigidity or rebound tenderness. Chest: Bibasilar end inspiratory fine crackles. Extremities: No edema.\n\n1. What is the meost likely diagnosis?\n\n2, What is the management of this patient during her hespital admission and after discharge?", "back": "1. The most likely diagnosis: Being 75 years old with angina of coronary artery disease (CAD) , Hypertension, MR, TR, AF and evidence of congestive heart failure (clarified from history and signs in physical examination), diagnosis of ischemic cardiomyopathy is the most likely diagnosis. Being on digoxin and suffering from nausea, vomiting and blurred vision, digexin toxicity must be considered.\n2. A- Hospital management: The following investigations are done: ECG, digoxin level, serum potassium, magnesium, serum creatinine and creatinine clearance. (Hypokalemia and renal impairment are risk factors for digoxin toxicity). PT, PC and INR to adjust warfarin dose. IV loop diuretics furosemide for congestive heart failure. TSH to exclude hyperthyroidism as a cause of AF Stop digoxin & monitor digoxin levels Continue on the rest of medications. Management of the dysrhythmia is directed toward the cause of the rhythm disturbance. The drugs of choice for management of ventricular irritability due to digitalis toxicity include phenytoin and lidocaine because they depress the enhanced ventricular automaticity without significantly slowing AV conduction. Epanutin is the anti-arrhythmic of choice in digitalis toxicity for both ventricular and supraventricular arrhythmia. Correct hypokalemia or hypomagnesemia if present. Start PPI and anti-emetics to relieve patient symptoms, B-Long term management:\n\nMonitor the digoxin levels regularly and adjust the dosage guided by creatinine clearance. After assessment patient condition may continue the same medications, or shift to other antiarrhythmic medication as amiodarone or dronedarone"}, {"num": 20, "chapter": "Cardio", "front": "A 65 year old male with a past medical history of hypertension, type 2 diabetes, coronary artery disease. He presented to the ER with acute epigastric pain and heart burn which started 4 hours ago and did not respond to antacids, the pain was associated with nausea, vomiting and sweating. The patient mentioned that his random blood glucose level 2 hours ago was 168 mg. No chest pain or shortness of breath. Physical examination: Temp: 37.5 C Respiratory rate: 22/min Pulse: 110 bpm, BP: 210/100mm/Hg. Accentuated A2 over the aortic area and S4 over the apex. Abdomen: normal. The rest of the examination was not remarkable. Upper and lower limb pulsations are bilaterally felt and equal. Random blood glucose 230 mg/dl.\n\n1. What is the most likely diagnosis?\n\n2. What is the differential diagnosis?\n3. What is the short and long term management of this patient?", "back": "1. The most likely diagnosis is inferior myocardial infarction: Acute epigastric pain resistant to antacids, nausea, vomiting and sweating in a diabetic patient, inferior myocardial infarction must be considered . The differential diagnosis:\n\nDissecting aortic aneurysm (upper and lower limb pulsations are bilaterally felt and equal)\n\nPeptic ulcer (no improvement with antacids). Pancreatitis (no tenderness or rigidity), acute cholecystitis (no tenderness or rigidity, pain is not referred to right scapula) Diabetic ketoacidosis (no acidotic breathing or acetone odor in breath).\n\nShort term management:\n- ECG, cardiac enzymes (myocardial infarction)\n- Urine for ketones, glucose, ABGs. Serum amylase (to exclude pancreatitis), sonar abdomen (to exclude acute cholecystitis).\n- Admit to the CCU: Morphia — Aspirin - Oxygen\n- Consider thrombolytic therapy or primary percutaneous coronary intervention (PCI) (balloon angioplastyl/stents). Long term management:\n\n- Antiplatelets, ACE inhibitors reduce risk of heart failure, B- blockers.\n- High intensity statins aiming LDL cholesterol < 70 mg/d. If this goal could not be attained add ezitemibe 10 mg/d and if failed PCSK9 inhibitor is recommended Diabetes control (American Diabetes Association 2018 recommended use of antidiabetic agents with CV benefits in patients with atherosclerotic cardiovascular disease as SGLT 2 I as dapagliflozin or empagliflozin).\n\n-   Modification of other risk factors as weight control hypertension, smoking. Consider Coronary angiography for possible surgical intervention."}, {"num": 21, "chapter": "Cardio", "front": "A 50-year-old man with diabetes mellitus, hypertension, dyslipidaemia and a recent history of crescendo chest pains on exertion called for an ambulance when he developed severe crushing central chest pain at rest 30 minutes before the arrival of the ambulance. The pain radiated into his jaw and down both arms. On examination BP 100/60mmHg, pulse 110/min regular, The patient was orthopneic. Cardiac examination showed S3 gallop with recent pansystolic murmur over the apex with bilateral fine basal crepitations. ECG revealed ST elevation from V1-V5 with reciprocal inversion of T waves in inferior leads. Troponin was significantly high.\n\n1. What the possible diagnosis ?\n\n2. What is the proper management of this patient after arrival to the hospital?\n\n3. Mention one possible complication that had happened based on clinical examination.?", "back": "1. ST elevation myocardial infarction (MI) complicated by cardiac decompansation due to papillary muscle rupture and acute mitral regurge.\n2. At ER before admission to CCU: pain relief morphine, loading aspirin and clopidogrel or Ticagrelor, LMWH, oxygen if SO2 less than 90 %\n-   Send the patient to the cardiac catheterization (PCI) for angiography and angioplasty and placing stents.\n3. Papillary muscle rupture complicated by heart failure."}, {"num": 22, "chapter": "Cardio", "front": "A 65-year-old man. heavy cigarette smoker presents with the chief complaint of leg pain. He noticed bilateral buttocks and thighs ache when he walks more than few blocks, the pain resolves with rest. He denies any history of trauma or problems with his joints. His past medical history is significant for myocardial infarction (MI) at the age of 61 years when questioned, he had impotence beginning a few months prior to his MI.\n\nOn physical examination, his heart and lung examination were within normal limits. His radial pulses are intact and equal but his femoral and dorsalis pedis pulses are diminished bilaterally. The skin of the legs is cool to touch and appears shiny with very little hair growth. There is no swelling or erythema of his hip or knee joints.\n\n1. What is the most likely diagnosis?\n2. What tests and/or imaging tools could be used to confirm the diagnosis?\n\n3. What risk factors are associated with an increased incidence of this condition?\n4. What is the most appropriate treatment for this patient?\n\n5. What are the treatment options for patients who fail conservative therapy?", "back": "1. The diagnosis is peripheral vascular disease. The intermittent claudication is due to peripheral vascular disease (PVD). Given his description of buttock and hip pain with associated impotence, he likely has aorteiliac ecclusion, also known as Leriche’s syndrome.\n\nTests and/or imaging tools could be used te confirm the diagnosis:\n\n-   Duplex ultrasound can be used to detect occlusions of blood flow and to calculate the ankle-brachial index (ABI). The ABI is the ratio of the systolic blood pressure at the ankle and the arm. An ABI > 0.9 is normal; intermittent claudication occurs at values < 0.9, while rest pain typically occurs at values < 0.4.\n-   CT angiography (CTA) or MR angiography (MRA): Recommended for detailed vascular imaging, especially if revascularization is being considered.\n-   Conventional angiography: Gold standard but usually reserved for intervention planning.\n-   Laboratory test like lipid profile, ESR, HbAlc. . Risk factors for PVD are similar to those for coronary atherosclerosis and include diabetes mellitus, hyperlipidemia, cigarette smoking and hypertension. This patient, who does not have rest pain or evidence of ischemia, is a candidate for conservative management. This includes immediate tobacco cessation and control of underlying conditions, such as diabetes, hypertension, and hyperlipidemia. Exercise, as tolerated, promotes the development of collateral circulation. Antiplatelet agents, including aspirin, may also improve symptoms. Angioplasty and stenting may be helpful, depending on the location of the occlusion. Endovascular or open arterial bypass surgery can be used to restore distal blood flow. If ischemia and necrosis have progressed significantly, amputation of the affected area becomes necessary."}, {"num": 23, "chapter": "Cardio", "front": "A 45-year-old male presented with shortness of breath and fast palpitation that developed suddenly one hour prior to presentation. On examination B/P was 80/50. ECG revealed supraventricular tachycardia for which he received Intravenous adenosine and a rhythm strip was recorded from lead V2.\n\nWhat is the role of carotid sinus massage as 1% aid in this patient? N\n\nWhat is the acute management of this case?\n\nMention 3 possible causes for this rapid palpitation? LY\n\nWhat will be the first choice drug to be administered for >\n\nmaintenance therapy?", "back": "1. Carotid sinus massage is always the 1% aid procedure for patients with SVT but its role is variable. Acute management :\n\n-   Synchronized    DC      cardioversion     is     recommended      for haemodynamically unstable patients.\n-   Haemodynamically stable patients: IV adenosine will be administered with maximum dose 6mg bolus, can be repeated after 2 minutes with maximum dose 12mg and afier another 2 minutes we can give another dose of adenosine (maximum 12mg).\n\n-   If IV adenosine failed or is contraindicated like in bronchial asthma, IV verapamil can be administered. Other causes for this palpitation:            ischemic    heart   disease, cardiomyopathy and thyrotoxicosis The first choice drug to be administered for maintenance therapy is calcium channel blockers (Verapamil, diltiazem)"}, {"num": 24, "chapter": "Cardio", "front": "28-year-old previously healthy female is brought to the emergency department complaining of sudden onset of palpitations and a “fluttering” sensation in her chest. She quickly became short of breath and light-headed. Physical examination reveals an oral temperature of 37.0° C, a pulse rate of 195/min, a respiratory rate of 20/min, and a blood pressure of 90/60 mm Hg. Examination of the lungs is unremarkable, and a cardiac examination is significant only for tachycardia. Her electrocardiogram revealed narrow complex tachycardia with absent p wave.\n\nWhat is the most likely diagnosis? BN\n\nWhat is the epidemiology of this condition? What is the pathogenesis of this condition?\n\nWhat is the treatment of her condition", "back": "1. Paroxysmal supraventricular tachycardia (PSVT) refers to a number of tachyarrhythmias. Patients with this condition have a heart rate between 160 and 250/min and suffer from the sudden onset and offset, hypotension, and syncope. Some patients may be asymptomatic. AV nodal re-entry tachycardia (AVNRT) commonly presents in the third or fourth decade of life in patients without underlying heart disease. Seventy percent of patients are women.\n\nIn patients with AVNRT, the AV node is divided into two pathways with varying conduction speeds and refractory periods. The tachycardia is initiated when an appropriately timed atrial complex is blocked in one pathway and conducted down the other to the ventricles. As the impulse is conducted, the previously blocked pathway recovers so that the impulse can now be conducted up toward the atria. This sets up the reentrant circuit,\n\nThe short circuit tachycardia may be caused by AVN and accessory pathway. It reveals a short PR interval as evidence of pre-excitaion. Typicaly in ECG with a slurred upstroke to the QRS, WPW Syndrome. Control of the attack will eventually correct her blood pressure.\n-   To stop the attack: Mechanical maneuvers (Valsalva maneuver and Carotid massage).\n-   Pharmacologic treatment: Intravenous verapamil,           beta-blocking agent, Class Ia drugs (Quinidine & Disopyramide).\n-   Radiofrequency ablation for any patient with symptomatic paroxysmal supraventricular tachycardia in whom long-term medical treatment is not effectively tolerated or whom electrophysiology testing identifies high-risk properties, such as shortest pre-excited RR interval, accessory pathway effective refractory period <250 ms and multiple accessory pathways. It is effective in <90% of patients.\n\n-   Prevention of attacks: Reassurance, avoid stimulants, continuous medication using verapamil, B-blockers for frequent severe attacks."}, {"num": 25, "chapter": "Cardio", "front": "A 28-year-old woman presents with recurrent attacks of palpitation, associated with dizziness, chest pain, near syncope. The attack lasted 10 to 60 minute and terminates spontaneously. Inbetween the attacks, she was completely normal. On examination, cardiac, chest and abdomen are normal. Resting ECG and echocardiography are normal, while Holter ECG shows regular narrow QRS tachyarrhythmia 150 beat/min, short P-R interval, that preceded by a premature atrial impulse.\n\n1. What is the diagnosis?\n\n2. How to manage this condition?", "back": "1. The diagnosis is paroxysmal supraventricular tachycardia, AV nodal reentrant tachycardia. AV nodal reentrant tachycardia may occur in healthy young individuals, and it occurs most commonly in women. In acute attack, treatment of SVT include calcium channel blockers like verapamil,    diltiazem   or  beta-blockers like  metoprolol          or esmolol. Electrophysiologic studies are generally performed           in combination with radiofrequency catheter ablation.\n\nConsider radiofrequency ablation for any patient with symptomatic paroxysmal supraveniricular tachycardia in whom long-term medical treatment is not effectively tolerated or desired Radiofrequency catheter ablation is more than 90% effective in curing paroxysmal supraventricular tachycardia."}, {"num": 26, "chapter": "Cardio", "front": "A 54 year old man came with chief complaints of generalized edema and oliguria. He had been receiving oral drug therapy for hypertension for more than 10 years. His medications include nifedipine (40mg/d) and losartan (50mg/d). His drug regimen had not been altered recently. Upon admission, his blood pressure was 210/130, heart rate 100/min. there was generalized edema, cardiac examination S4 over apex, normal respiratory sounds. The funduscopic changes are flame-shaped retinal hemorrhages, soft exudates, and papilledema. Serum creatinine 4.5mg/dl, BUN 143mg/dl, the previous kidney function was normal within last two months.\n\n1. What is your provisional diagnosis?\n2. Mention three possible causes of raised kidney function?\n\n3. What is the initial therapy in this case? Mention 3 parenteral drugs that can be used in hypertension emergencies", "back": "1. The patient has hypertension emergency as his BP > 180/120 mmHg and there 1s ongoing end organ damage in the form of Acute kidney injury (AKI) (serum creatinine 4.5mg/dl, BUN 143mg/d which were normal in the last 2 months). Funduscopic examination showed papilledema so this hypertensive emergency is malignant hypertension. AKI is defined as an abrupt or rapid decline in renal filtration function. This condition is usually marked by a rise in serum creatinine concentration or azotemia (a rise in blood urea nitrogen [BUN] concentration). Oliguria is defined as a daily urine volume of less than 400 mL/d. The causes of AKI are divided into 3 main categories: prerenal, (eg volume depletion), intrinsic (vascular eg. malignant hypertension, glomerular eg. glomerulonephritis), and postrenal (eg obstructive nephropathy). . Imitial therapy:\n-   Admit the patient to an ICU for continuous monitoring of BP and target organ damage, as well as for parenteral administration of an appropriate medication.\n-   Reduce the SBP to a maximum of 25% within the first hour; then, if the patient 18 clinically stable, lower the BP to 160/100 -110 mm Hg over the next 2-6 hours and then cautiously to normal over the following 24-48 hours. Parenteral antihypertensive       drug   preparations    in   emergency hypertension:                                                       |\n-   Nifroprusside IVinfusion works in 5 minutes dose 0.1-0.3 ug/kg/min. Side effects: thiocyanate/cyanide toxicity in renal & liver insufficiency                                                            .\n-   Nitroglycerine IVinfusion works after 1-2 minutes. Dose             5- 250ug/min. Side effects: headache, tolerance with prolonged use.\n-   Labetalol works in 5-10 min, IV bolus 20-80 mg q5-10 min up to 300 mg IV infusion 0.5-2 mg/min. Side effects: bronchospasm, heart failure, heart block"}, {"num": 27, "chapter": "Cardio", "front": "A 37-year-old woman presents complaining of dyspnea on exertion accompanied by mild chest pain. She recently fainted after climbing stairs. She 1s afebrile, with a heart rate of 90/min, respiratory rate of 12/min, blood pressure of 90/70 mm Hg, and oxygen saturation of 89% by pulse oximetry on room air. Cardiac examination is notable for a loud pulmonary component of 52 and a systolic murmur best appreciated at the lower sternal border. Increased jugular venous pressure, hepatomegaly, and lower extremity edema are appreciated. Skin and musculoskeletal examinations are normal. X-ray of the chest reveals normal lung fields with cardiomegaly and enlarged pulmonary vessels. Pulmonary function tests (PFTs) reveal a diffusion capacity of 50%.\n\nWhat is the most likely diagnosis?\n\nWhat are some etiologies of this condition? o\n\nWhat tests could be used to confirm the diagnosis?\n\nHow is the definitive diagnosis made? S\n\nWhat is the most appropriate treatment for this condition? LA", "back": "L. The diagnosis is idiopathic pulmonary arterial hypertension (PAH). PAH often goes undiagnosed (asymptomatic) until the disease is severe and the patient presents with symptoms of right heart failure. Common symptoms are dyspnea on exertion, chest pain, syncope and arrhythmia. Before the diagnosis of idiopathic pulmonary arterial hypertension, secondary causes of pulmonary hypertension must be excluded. Secondary causes include left heart disease (mitral valve disease, left ventricular dysfunction), connective tissue disease (lupus, scleroderma, and rheumatoid arthritis), parenchymal lung disease with chronic hypoxemia (emphysema, idiopathic pulmonary fibrosis, and cystic fibrosis), and chronic thromboembolic disease. It is also seen in patients with HIV, chronic liver disease, and obstructive sleep apnea.\n-   There is an association with amphetamines, pills, and intravenous drug use. It is estimated that 5—15% of idiopathic PAH is familial, and the gene BMPR2 has been associated with the familial form. To confirm idiopathic pulmonary arterial hypertension, secondary causes mentioned previously must be excluded. ECG may show right axis deviation, signs of right ventricular hypertrophy and P-pulmonale, while an echocardiogram will show enlargement of the right ventricle and tricuspid regurgitation with elevated pulmonary artery systolic pressures. A right-heart catheterization can determine pulmonary artery pressures and exclude the presence of pulmonary venous hypertension. PAH is defined as a pulmonary artery pressure of > 25 mm Hg at rest and > 30 mm Hg with exercise. A vasodilator trial during the procedure may heip to guide therapy. The treatment option are:\n-   Intravenous drugs: prostacyclin or prostacyclin analogue.\n-   Oral drugs:\n- Sildenafil (nitric oxide synthase inducer).\n-   Calcium channel antagonist, a-blockers.\n-   Endothelin receptor antagonists (e.g., bosentan)\n-   Inhaled Drugs (ileoprost): inhaled prostaglandin\n-   Heart lung transplantation.\n-   Supplemental oxygen should be used to keep saturation levels > 90%, and right heart failure should be treated with diuretics."}, {"num": 28, "chapter": "Cardio", "front": "A 50 year old man is hypertensive with repeated blood pressure recordings of >160/95 mmHg. He is already taking a thiazide diuretic as well as aspirin and a statin. There are no apparent secondary causes of hypertension. He has previously undergone CABG.\n\n1. What is the blood pressure target in this patient?\n\n2. What      drug    would    be    the   most   appropriate    add   on antihypertensive treatment? And why?\n3. Would you continue with aspirin and statins? What are the lipid levels targets in this case?", "back": "1. BP treatment target is <130/80mmHg to decrease adverse cardiovascular events.\n\n2. Beta-blockers the most appropriate antihypertemsive:- reduce the resting heart rate, contractility and blood pressure so reduce the demand for oxygen and increased diastolic coronary perfusion time. They also have been proven to reduce the incidence of heart attacks and sudden deaths in people with coronary artery disease.\n\n3. He must continue on aspirin and statins.\n\nAspirin provides benefit in nearly all groups of patients with clinical manifestations of coronary heart disease. This mcludes patients with evolving acute myocardial infarction or after recovery from myocardial infarction, with unstable or stable angina, and those who undergo coronary artery bypass grafting or coronary angioplasty. \"Statins\" are a class of drugs that lower the level of cholesterol in the blood by reducing the production of cholesterol by the liver. Statins block the enzyme hydroxy-methylglutaryl-coenzyme A reductase (HMG-CoA reductase) in the liver that is responsible for making cholesterol. High intensity statins as Atorvastatin 40-80 mg/d and Rosuvastatin 20-40 mg/d. The target levels for plasma lipids: LDL cholesterol < 70 mg/dl. TG < 130 mg/dl. If LDL cholesterol this goal could not be attained add ezitemibe 10 mg/d and if failed PCSK9 inhibitoris recommended"}, {"num": 29, "chapter": "Cardio", "front": "A 22-year-old athletic man was admitted directly to ICU after suffering a cardiac arrest at a local gym. Fortunately, automated defibrillation had been available. The defibrillator had diagnosed ventricular fibrillation and had administered a DC shock. The patient was not known to have any previous medical history and had been well recently. Trans-thoracic echocardiography in ICU showed a structurally normal heart but with depressed systolic function, presumed
