provisional Diagnosis and possible differential diagnosis based on clinical presentation, and lab findings?\n\n2. Describe how this informs therapeutic strategy, including the roles of genetic counseling and relapse prevention.", "back": "Atypical Hemolytic Uremic Syndrome (aHUS) — complementmediated thrombotic microangiopathy o   Atypical Hemolytic Uremic Syndrome (aHUS), Typical HUS (tHUS), and Thrombotic Thrombocytopenic Purpura (TTP) are thrombotic microangiopathies with distinct causes.", "cls": "Unclassified"}, {"num": 237, "chapter": "Nephro", "front": "29-year-old, female, with history of systemic lupus erythematosus (SLE) diagnosed 3 years ago; previously on hydroxychloroquine but poorly adherent; no prior renal involvement, she presents with worsening fatigue, facial puffiness, leg swelling, and decreased urine output over the past 2 weeks. She also reports intermittent headaches and blurry vision. Physical Examination: BP 170/110 mmHg, HR 92 bpm, Temp37.5°C, malar rash, periorbital and lower limb edema, mild confusion and disorientation, retinal cotton wool spots on fundus examination Laboratory: Hb: 8.6 g/dL, platelets: 64,000/uL, reticulocyte count, Peripheral smear schistocytes seen, LDH 1100 U/L, serum creatinine 4.1 mg/dL ( from baseline 0.9), BUN 56 mg/dL. Urinalysis: 3+ protein, 2+ blood, red cell casts, 24-hr urine protein 5.2 g. serum complement C3/C4 are low, ANA positive (1:640), anti-dsDNA high titer, antiphospholipid antibodies negative, ADAMTSI13 activity: 72% (normal). Renal biopsy: class IV lupus nephritis (diffuse proliferative GN), evidence of fibrinoid necrosis and vascular luminal narrowing consistent with lupus vasculopathy, presence of thrombotic microangiopathy (TMA) features.\n\n1. What is the provisional Diagnosis?\n2. Discuss the interplay between systemic lupus erythematosus and the development of lupus nephritis in this patient?\n\n3. Outline a comprehensive treatment plan for this patient, Justify each component?", "back": "Widespread vascular damage through immune complex deposition and complement activation, leading to multiple forms of injury.", "cls": "Unclassified"}, {"num": 238, "chapter": "Nephro", "front": "45-year-old, Male, with medical history of Hypertension (controlled on Amlodipine), no known autoimmune disease, He presents to the emergency department with fatigue, hematuria, and reduced urine output over the past week. He also reports mild shortness of breath and joint stiffness in the morning. He denies any recent infections or travel.\n\nExamination: BP 160/100 mmHg, HR 88 bpm, Temp: 37.1°C, pallor Bibasilar crackles on lung auscultation, Mild pedal edema, No skin rash or oral ulcers\n\nLaboratory investigations: Hemoglobin: 9.4 g/dL, WBC: 7.2 x10%L, Platelets: 220,000/uL, Serum Creatinine: 3.9 mg/dL (baseline 1.0 mg/dL two weeks ago), BUN: 68 mg/dL, Urinalysis:3+ blood, 2+ protein, Red cell casts seen. ANA negative, Anti-dsDNA: Negative, ANCA (anti-MPO): Positive, Anti-GBM negative, Complement levels (C3/C4) Normal, Chest X-ray: Diffuse interstitial infiltrates Renal Biopsy showed Crescent formation in >50% of glomeruli, No immune complex deposition on immunofluorescence, Consistent with pauci-immune crescentic glomerulonephritis.\n\n1. What is the provisional Diagnosis? describe how it leads to acute renal failure?\n\n2. Discuss the diagnostic approach and interpret the findings in this case?\n\n3. Describe the treatment strategy?", "back": "Rapidly Progressive Glomerulonephritis (RPGN) due to ANCA-associated vasculitis (Microscopic Polyangiitis — MPA) Rapidly Progressive Glomerulonephritis (RPGN) is a syndrome characterized by a rapid decline in kidney function over days to weeks, typically with crescent formation in the glomeruli due to severe capillary wall injury.", "cls": "Unclassified"}, {"num": 239, "chapter": "Nephro", "front": "32-year-old male, no medical history of chronic illness; treated for a presumed viral illness 3 months ago, he gave a Family History that his uncle with “kidney failure” in his 40s, He presents to his primary care clinic with progressive swelling of his legs and face over the past month. He also noticed that his urine appears foamy, but denies dysuria, hematuria, or back pain. Examination: BP 150/90 mmHg, HR 76 bpm, Temp: 36.9°C, BML: 31 kg/m?. He has periorbital puffiness, bilateral pitting edema to knee, No rash, joint swelling, or neurological deficits. Laboratory: serum creatinine 1.9 mg/dL (baseline unknown), BUN 38 mg/dL, Urinalysis: 4+ protein, negative for blood, Urine protein: creatinine ratio 8.5 g/day. Serum albumin: 2.3 g/dL, total cholesterol: 280 mg/dL, ANA, ANCA, Anti-dsDNA negative, complement C3/C4. HIV, hepatitis B & C were negative. Renal Biopsy revealed by light microscopy segmental sclerosis in some glomeruli; others appear normal. Immuno-fluorescence is negative for immune complex deposition. Electron microscopy showed effacement of podocyte foot processes without deposits.\n\n1. What is the provisional Diagnosis? Explain the pathogenesis and how it leads to nephrotic syndrome in this patient?\n\n2. Differentiate and outline the key diagnostic features that support the diagnosis in this case?\n\n3. Describe the treatment goals and challenges in managing the case, and explain why close monitoring is essential?", "back": "Primary Focal Segmental Glomerulosclerosis (FSGS), collapsing variant ruled out -   Focal Segmental Glomerulosclerosis (FSGS) is characterized by scarring in parts of some glomeruli, commonly presenting with nephrotic syndrome.", "cls": "Unclassified"}, {"num": 240, "chapter": "Nephro", "front": "Female patient 58-year-old, has diabetes mellitus, hypertension and end-stage renal disease (ESRD) secondary to diabetic nephropathy, on regular hemodialysis for 7 years. She was brought to the emergency department after she fell at home and sustained a painful left hip injury. She reports longstanding bone pain, fatigue, and pruritus. Her family notes recent irritability and a mild decline in cognition. Examination: BP 145/90 mmHg, HR 84 bpm, temp. 36.8°C. Tenderness over left hip pelvic. X-ray showed displaced fracture of the left femoral neck; signs of subperiosteal bone resorption, particularly in the phalanges. DEXA Scan revealed severe osteoporosis T score: —2.9.                     '\n\nLaboratory investigations: calcium (corrected)11.9 mg/dL, Phosphate 6.2 mg/dL, PTH 1450 pg/mL, alkaline phosphatase 380 U/L, 25(0OH) Vitamin D 24 ng/mL, 1,25(OH)2D Low-normal, BUN and serum creatinine are elevated (on dialysis)\n\n1. What is the provisional Diagnosis? Outline the differential diagnosis in dialysis patients?\n2. Explain the bone complications and relate these to the fracture and imaging findings in this patient?\n\n3. Outline the medical and surgical management?", "back": "Tertiary Hyperparathyroidism, in the setting of chronic dialysis-dependent ESRD, complicated by renal osteodystrophy and fragility fracture The differential diagnosis in dialysis patient: Hyperparathyroidism can be classified into primary, secondary, and tertiary forms.", "cls": "Unclassified"}, {"num": 241, "chapter": "Nephro", "front": "A 46 Years old, Male, with medical history of ESRD secondary to hypertension, Renal transplant 6 months ago, Type 2 diabetes mellitus (diagnosed 10 years ago) and history of latent tuberculosis (treated). His current medications are tacrolimus, mycophenolate mofetil, prednisolone, Cotrimoxazole (prophylaxis), valganciclovir (initially, stopped 1 month ago). He presents with fever, dry cough, and progressive shortness of breath for 5 days. He reports mild malaise and occasional diarrhea. No chest pain or hemoptysis. Examination: Temp 38.6°C, HR 102 bpm, RR 24, BP 118/74 mmHg, Sp0O2 91% on room air, Chest: fine crackles at bases, Abdomen: Non-tender, no graft tenderness, No lymphadenopathy or rash. Laboratory: serum creatinine 2.2mg/dl. (baseline.3), WBC count 2.8 x10%/L, absolute lymphocyte count 0.4 x10°/L, CRP 78 mg/L, tacrolimus 11.2 ng/mL (therapeutic range 5-15), CMV PCR 175,000 copies/mL. Chest CT diffuse ground-glass opacities, no consolidation. Blood & urine cultures were negative.\n\n1. What is the provisional Diagnosis and explain? Why this patient is at increased risk?\n2. Identify and explain the risk factors for graft dysfunction in this patient and how CMYV infection contributes to allograft injury?\n\n3. Outline a comprehensive approach to managing CMYV disease in renal transplant patients and strategies to minimize future graft dysfunction?", "back": "Cytomegalovirus (CMV) pneumonitis and early allograft dysfunction, in a renal transplant recipient with multiple risk factors -   CMV is a latent virus that can reactivate in immunosuppressed patients.", "cls": "Unclassified"}, {"num": 242, "chapter": "Rheumatology", "front": "A 26-year-old man presents to his general practitioner with a painful aphthous ulcer on his scrotum. Although he has had painful oral ulcers on and off ‘for years, this is the first episode in the genitourinary tract. He denies other genitourinary symptoms and is not sexually active. Four weeks. previously he experienced a rash over the front of his shins: discrete red tender lumps appeared and then faded spontaneously, going through color changes like a bruise. On systems review he mentions that his right knee is intermittently painful and swollen but denies any other problems. Examination\n\nThis young man has a deep ulcer on his scrotum, but his penis is normal. He has no oral ulcers. The sclera of his right eye is injected. He has a solitary brown slightly raised lesion on his left shin and a small effusion in the right knee. He has a small erythematous lesion in the left antecubital fossa from blood donation 48 hours previously.\n\n1. What diagnosis does this patient’s combination of symptoms suggest? What is your differential diagnosis?\n\n2. What other features would you seek in history?\n\n3. What are the treatment options?", "back": "The Combination of orogenital ulceration, arthritis, ocular inflammation and a rash suggests a diagnosis of Behcet’s syndrome.", "cls": "4-star"}, {"num": 243, "chapter": "Rheumatology", "front": "A 25-year-old lady presented with fever of one month duration with generalized myalgia, pain and swellings in the small joints of both hands and feet, and easy fatigability. Examination revealed pallor, an erythematous malar rash, areas of nonscarring alopecia, and an ulcer on the inner aspect of the cheek. CBC: HB 5.5 gm/dl.\n\n1. What is your provisional diagnosis?\n\n2. What investigations would you recommend to confirm the diagnosis?\n\n3. Mention three possible causes of anemia in this case and how to prove each one?\n\n4. What are the other abnormal findings you may find in the CBC of this lady?", "back": "Systemic lupus erythematosus (SLE) Based on: Constitutional symptoms (fever, fatigue), polyarthritis of small joints, malar rash, nonscarring alopecia, oral ulcers and severe anemia (Hb 5.5 g/dL).", "cls": "4-star"}, {"num": 244, "chapter": "Rheumatology", "front": "A 24-year-old female presented with precordial pain. This was present for one week, intermittent at first but now nearly continuous.\n\nThe pain appeared to be aching and central, sometimes worse on lying flat, sometimes worse on inspiration. She had progressive shortness of breath particularly on lying flat. She suffered from Raynaud’s phenomena, butterfly rash, oral ulcers, arthralgias with intermittent fever. The pericardial rub was audible, and the chest was clear. Hb 10.5 g/dl, white cell count 3.4 x10°/L, ESR 99 mm/h. Rheumatoid factor negative. CXR increased cardiothoracic ratio.\n\nWhat is the most likely diagnosis? A.\n\nMention four criteria for diagnosis of this disease im this patient?\n\n3. Give two investigations to confirm diagnosis.", "back": "Systemic lupus erythematosus (SLE) with pericardial effusion.", "cls": "3-star"}, {"num": 245, "chapter": "Rheumatology", "front": "A female patient 23-year-old presented with gradual onset of pain in both hands and feet joints of two months duration. This was associated with morning swelling and stiffness that lasted for two hours. One week before, the patient noticed night numbness in the right hand.\n\nWhat is your provisional diagnosis? s\n\nWhat is the differential diagnosis in this case?\n\nWhat is the cause of the numbness?\n\nWhat investigations would you recommend fo confirm the diagnosis?\n\n5. What do you suggest as a treatment in this case?", "back": "Rheumatoid arthritis (RA).", "cls": "4-star"}, {"num": 246, "chapter": "Rheumatology", "front": "A 28-year-old lady presented with puffiness of the eye lids and edema of the lower limbs of two months duration. The patient was diagnosed with SLE one year before this presentation when she suffered from mucocutaneous and musculoskeletal manifestations. Examination revealed malar rash, tender metacarpo-phalangeal joints (MCPs), wrists and knees on both sides. Blood pressure was 170/110.\n\n1. How can you explain the present illness?\n\n2. What investigations do you recommend to prove your diagnosis?\n\n3. What is your plan to treat this lady?", "back": "Lupus nephritis (in a patient with known SLE).", "cls": "3-star"}, {"num": 247, "chapter": "Rheumatology", "front": "An unconscious 25~year-old female with generalized seizure, presented to the emergency, with a history of low-grade intermittent fever and joint pain & swelling for duration one month. The provisional diagnosis was bacterial or viral meningitis and treatment was initiated along with fluid and electrolyte corrections. Injection with dexamethasone started (4 mg every eight hours). Laboratory: Hemoglobin was 5.7 gm/dl, WBC 6400/cmm. The computed tomography scan of the brain was normal. The cerebrospinal fluid study was not suggestive of infective pathology. There was raised protein, total cell count 50 per cmm with 100% lymphocytes, and the adenosine deaminase (ADA) test was negative. There was effusion in the right lung base and enlarged cardiac shadow on the chest X-ray. Echocardiography reported normal left-ventricular function and minimal pericardial effusion.\n\nShe maintained complete alertness for the next two days, although low-grade intermittent fever persisted. The steroid was gradually tapered down, while other supportive treatment and antibiotics were continued. The patient’s condition suddenly deteriorated once the steroid was withdrawn. She suffered high fever with generalized convulsions. The sepsis markers were normal (C Reactive Protein 11.7 mg/dl, Procalcitonin 0.07 ng/ml),\n\n1. Explain the possible disease of these neurological manifestations?", "back": "The patient's presentation is consistent with Neuropsychiatric Lupus (NPSLIE), specifically Lupus Cerebritis.", "cls": "New"}, {"num": 248, "chapter": "Rheumatology", "front": "You are consulted from the surgical ward of your hospital to evaluate a 70- year-old man whose right knee suddenly became painful and swollen five days after coronary bypass surgery. The patient was diagnosed with gout oneyear ago and kept on allopurinol 100 mg/day. He is diabetic and hypertensive. On physical exam, his right knee is warm and swollen with limited range of active and passive movement. The overlying skin is normal. Body temperature is 38.7°C. Laboratory examinations performed show a Jeukocyte count of 13.2 x10%/L, elevated C reactive protein and ESR. The serum creatinine and uric acid were within normal range. You consider acute gout as a possible diagnosis.\n\nWhy do you suspect acute gout in the differential diagnosis? RN\n\nHow can you confirm your suspicion?\n\nWhat is the other diagnosis you should exclude? Why? and how?\n\nWhat is the significance of the serum uric acid levels im this B\n\nsetting?\n\nWhat management strategies will you suggest? e\n\n6. What is your action plan regarding allopurinol?", "back": "The patient is known to have gout, DM and Hypertensive.", "cls": "New"}, {"num": 249, "chapter": "Rheumatology", "front": "A 21-year-old patient presented with gradual onset progressive low backache of 8 months duration. One year before this presentation, he suddenly suffered from painful redness of his right eye, associated with photophobia that was treated for two months by eye drops. His cousin, aged 18 years also suffers from backache.\n\n1. What is the provisional diagnosis?\n\n2. What other data are missing from the history & clinical examination you need to reach a proper diagnosis?\n3. What is your plan to manage this case?", "back": "Seronegative spondyloarthropathy.", "cls": "2-star"}, {"num": 250, "chapter": "Rheumatology", "front": "A 30-year-old female presented at the out clinic after experiencing fever, dysuria and frequency of urine for 5 days. For which she had received successful treatment. Three weeks later she developed arthritis of both ankle and sacroiliac joints. On admission, the temperature was 38°C, pulse 115 /min, and BP110/70 mmHg. Physical examination revealed swelling and tenderness of left ankle joint and on left sacroiliac joints. Other joints were normal. Other systemic examinations were normal. Cardiac auscultation was normal.\n\nLaboratory studies showed Hb 12.8 g/dL, WBC 12,860/mm?>, platelet count 573,000/mm?, ESR 70 (0 to 15) mm/hr., and CRP 3.97 (0 to 0.5) mg/dL. Liver and renal functions were normal. Venereal disease research laboratory tests and ANA were negative. Urine analysis revealed pyuria. However, urine culture was negative. Synovial fluid aspiration from left ankle revealed severe inflammation, with gram stain and synovial fluid culture were negative. Radiographs of the ankle joint showed only soft tissue swelling, without any visualization of enthesopathy or erosive joint damage.\n\n1. What is the possible cause of this arthritis?\n\n2. What is the treatment?", "back": "Considering the clinical features, the preceding symptomatic of UT infection, diagnosis of reactive arthritis is considered.", "cls": "New"}, {"num": 251, "chapter": "Rheumatology", "front": "A 28-year-old woman presents to the Emergency department with an acute onset of diffuse right lower limb swelling. one year ago, she suffered from repeated attacks of unilateral headache relieved by analgesics. She has been married for 4 years and has no children. Although she got pregnant three times, they all ended up with abortions. On examination; mild fever 37.7°C, diffuse swelling of the right LL extending to the thigh.\n\n1. What is your provisional diagnosis?\n\n2. What investigations would be most helpful in this case?\n\n3. What is your plan to treat this lady?", "back": "A female patient with symptoms suggestive deep vein thrombosis (hypercoagulable state) and repeated abortions, one should consider antiphospholipid syndrome either primary or secondary to SLE.", "cls": "4-star"}, {"num": 252, "chapter": "Rheumatology", "front": "A 40-year-old lady presented with a two-month history of progressive difficulty in hanging out her washing and climbing out of a chair as well as progressive dyspnea four months ago. She noticed a skin rash m the sun exposed area. On examination, there was heliotrope rash. She had marked weakness of her neck and proximal muscles. Reflexes and sensations were normal. No other abnormality was detected on examination. Hb 10.4 g/dl, MCV 85fL, WBCS 6.6 x10°/L, Platelets 180 x10°/L, ESR 60 mm/h. TSH, calcium and phosphorus were normal. Rheumatoid factor and ANA were negative. Chest X ray was also normal.\n\n1.   What is the most likely diagnosis?\n\n2.    Give three investigations to confirm diagnosis?\n3.   How would you treat this condition?", "back": "Dermatomyositis, an idiopathic inflammatory myopathy with characteristic cutaneous findings.", "cls": "2-star"}, {"num": 253, "chapter": "Rheumatology", "front": "A 28-year-old lady suffered two years ago from Raynaud’s phenomenon and heartburn. She started to complain of pain in her fingers, particularly at night. On examination, she had thickened shiny skin over her fingers. Hard nodules were palpable beneath the skin of several digits. Telangiectasia was detected on her face and fingers. Mouth opening was limited. Then dyspnea developed and was progressive with central cyanosis on examination and high pulmonary component of second sound, S3 was audible. Bilateral basal pulmonary inspiratory crepitations. Tender hepatomegaly and lower limb edema were detected.\n\n1.    What is the provisional diagnosis?\n\n2.     Explain the cause of dyspnea and central cyanosis in this case?\n\n3.    Mention three other systems affected by this condition?", "back": "Systemic sclerosis/scleroderma.", "cls": "4-star"}, {"num": 254, "chapter": "Rheumatology", "front": "A 56-year-old diabetic gentleman presented in the emergency room with acute agonizing onset pain in the left forefoot. One week before this presentation the patient was discovered as hypertensive and was prescribed thiazide. Examination revealed swollen red tender left foot extending to the ankle with limitation of movement.\n\n1.   What is your differential diagnosis?\n\n2.   What are the investigations you need to reach a proper diagnosis?\n3.   Would you like to recommend another antihypertensive for this gentleman and why?\n\n4.   How to treat such a patient?", "back": "Acute gouty arthritis, precipitated by recent thiazide intake.", "cls": "4-star"}, {"num": 255, "chapter": "Rheumatology", "front": "A 70-year-old woman with known diabetes mellitus presents to the emergency department with pain and swelling of the right knee joint for the preceding 24 hours. She has developed a fever. She received paracetamol 500 mg bid since yesterday. She denies any history of trauma. Five years ago, she complained of infrequent mild chronic aching pain in both her knee joints. On examination, her temperature was (37.1°C), a pulse rate of 74/min blood pressure of 140/80 mmHg. Her right knee joint is swollen and tender with a moderate effusion and limitation of movements. Other joints are normal, except for the presence of Heberden's nodes in the second, third and fifth fingers of both hands.\n\nWhat is the most likely diagnosis? What are the risk factors for this disease? o\n\nWhat joints are affected by this disease?\n\nWhat are the investigations needed for diagnosis? S\n\nHow to treat such 2 case? A", "back": "Osteoarthritis complicated by septic arthritis or pseudogout.", "cls": "4-star"}, {"num": 256, "chapter": "Rheumatology", "front": "A 30-year-old man presents to the emergency department with acute onset of diffuse right lower limb swelling. Six months ago, he suffered from pain and redness in his eyes, with diminution of vision. He sought medical advice and was prescribed prednisolone with gradual improvement. Repeated painful ulcers started within the last 3 years. On examination, he had oral and scrotal ulcerations. The pathergy test was positive.\n\n1.    What is the most likely diagnosis?\n\n2.     Mention the diagnostic criteria of this disease.", "back": "Behget’s disease.", "cls": "3-star"}, {"num": 257, "chapter": "Rheumatology", "front": "A 17-year-old boy presented with rapidly progressive rash over his legs and buttocks associated with severe colicky abdominal pain associated with nausea, vomiting but no change in bowel habit, also he complained of pain in right ankle On examination, pulse was 84/min, Bp 110/70, he had palpable purpura over his legs and buttocks, mild swelling with tenderness in his right ankle, palpation of abdomen revealed diffuse tenderness but no guarding or rebound and no organomegaly Laboratory findings: CBC revealed Hb 12.8 g/dL, WBC 6.500 x10°/L, platelets 370.000 x10%/L\n\nWhat is the most likely diagnosis of this case? e\n\nHow can you confirm this diagnosis?\n\nWhat are other Iaboratory tests you have to do? Sl\n\nWhat are the possible complications of this condition?", "back": "IgA vasculitis (formerly known as Henoch-Schonlein Purpura).", "cls": "New"}, {"num": 258, "chapter": "Rheumatology", "front": "A 32-year-old African woman presents with a 3-month history of nonproductive cough, progressive exertional dyspnea, low-grade fever, and fatigue. She reports tender red nodules on her shins for the last 2 weeks. On examination, bilateral crepitations are heard at the lung bases, and multiple erythematous, raised, tender nodules are noted on both legs. Chest X-ray shows bilateral hilar lymphadenopathy. Laboratory tests reveal hypercalcemia and elevated serum angiotensin-converting enzyme (ACE). The tuberculin skin test is negative.\n\n1. What is the most likely diagnosis and what are the important differential diagnoses?\n2. How would you investigate this case further to confirm the diagnosis?\n\n3. What is the appropriate treatment plan for this patient?\n\n4, What are the possible extrapulmonary manifestations of your primary diagnosis?", "back": "Sarcoidosis is mostly diagnosis based on presence of hilar lymphadenopathy, interstitial pulmonary disease, systemic symptoms (fever and fatigue), and erythema nodosum.", "cls": "Unclassified"}, {"num": 259, "chapter": "Rheumatology", "front": "A 72-year-old woman complains of bilateral shoulder and hip pain and stiffness, especially in the morning, for the past 6 weeks. She also has a newonset temporal headache, scalp tenderness, and jaw pain while chewing. On exam, the right temporal artery is thickened and tender. Shoulder movements are limited in all directions. ESR is 92 mm/hr, CRP is 85 mg/L, and she has mild anemia. No weakness is detected on power testing.\n\n1. What is the most likely diagnosis?\n\n2, How      would    you    confirm    the   diagnosis    and    rule   out complications?\n3. What is the immediate and long-term treatment strategy?\n\n4. What is the risk to vision and how can it be prevented?", "back": "Diagnosis:     Giant Cell Arteritis (GCA) with associated Polymyalgia Rheumatica (PMR) GCA is suggested by the new-onset headache,             scalp tenderness, jaw claudication, and temporal artery abnormalities, along with markedly elevated ESR and CRP.", "cls": "Unclassified"}, {"num": 260, "chapter": "Rheumatology", "front": "A 45-year-old man presents with 3 months of epistaxis and nasal crustations. He has also experienced weight loss, fatigue, and intermittent episodes of hemoptysis. On exam, he has nasal septal perforation and a saddle-nose deformity. Areas of bronchial breathing are heard on chest auscultation. Chest CT shows multiple cavitary nodules in both lungs. Urinalysis reveals proteinuria and red blood cell casts. c-ANCA is strongly positive, Creatinine is 2.1 mg/dL.\n\nWhat is the most likely diagnosis and important differentials? PP\n\nWhat investigations are needed to confirm and assess severity?\n\nWhat is the appropriate treatment approach?\n\nWhat are the potential complications of this disease and its treatment?", "back": "Diagnosis: Granulomatosis with polyangiitis (GPA): should be suspected in a case of ENT manifestations and pulmonary cavities along with systemic symptoms (weight loss and fatigue).", "cls": "Unclassified"}, {"num": 261, "chapter": "Rheumatology", "front": "45-year-old male Patient presented by Painful, non-blanching purpuric rash on lower legs Started 5 days ago, progressing upward from ankles associated with mild fever, joint pain with recent history intake of antibiotics for sinusitis, No symptoms suggestive of autoimmune disease. By examination: Palpable purpura on both lower extremities, no ulceration or necrosis, and no systemic signs of severe organ involvement.\n\n1. What is the most likely diagnosis?\n\n2. What investigations would you recommend to confirm the diagnosis?\n3. What is the line of management?\n\n4. What is the possible etiology?\n\nS. What is the prognosis?", "back": "Diagnosis: Leukocytoclastic vasculitis (LCV): A small-vessel vasculitis typically presenting with palpable purpura, especially on the lower extremities, and often triggered by infections, drugs, or systemic conditions.", "cls": "Unclassified"}, {"num": 262, "chapter": "Rheumatology", "front": "45-year-old male patient presented with fatigue, weight loss, postprandially abdominal pain, muscle aches and malaise for 2 months associated with10 kg unintentional weight loss Myalgias and arthralgias, hypertension (recently diagnosed, difficult to control) associated episodes of skin rash and livedo reticularis.\n\nBy examination: BP: 160/100 mmHg, Skin: Livedo reticularis on legs, tender subcutaneous nodules, neurological: mononeuritis multiplex (foot drop), abdomen: Mild tenderness, no rebound tenderness.\n\n1. What is the most likely diagnosis?\n\n2, What investigations would you recommend to confirm the diagnosis?\n\n3. What is the line of management?", "back": "Diagnesis: A case of Polyarthritis Nodosa (PAN) Polyarteritis nodosa (PAN) is a systemic necrotizing vasculitis of medivm-sized arteries characterized by constitutional symptoms (fatigue, weight loss), multisystem involvement, (skin, nervous system, GI, renal), hypertension, mononeuritis multiplex, classic skin signs such as livedo…", "cls": "Unclassified"}, {"num": 263, "chapter": "Rheumatology", "front": "14-year-old male Patient presented with a 2-day history of severe abdominal pain and fever (up to 39.5°C). Similar episodes have occurred approximately once per month since age 12, often accompanied by chest pain or joint pain (especially in the knees and ankles). Each episode resolves spontaneously within 1-3 days. No known triggers. No recent travel, sick contacts, or unusual exposures.\n\nBy examination: temp (38.9°C), HR 110 bpm, abdominal tenderness, especially in the lower quadrants, No rebound or guarding, Mild swelling of the right knee.\n\n1. What is the most likely diagnosis?\n\n2. What investigations would you recommend to confirm the diagnosis?\n3. What is the line of management?", "back": "Diagnosis: A case of Familial Mediterranean Fever (FMF), Recurrent febrile episodes Serositis (abdominal or chest pain due to peritonitis or pleuritis) Arthritis, particularly in large joints If Family history of FMF supports the diagnosis.", "cls": "Unclassified"}, {"num": 264, "chapter": "Rheumatology", "front": "A 45-year-old female school teacher reports a 6-month history of persistent dry eyes and dry mouth. She uses over-the-counter eye drops several times a day. She also finds it difficult to swallow dry foods and often drinks water with meals. Recently, she noticed some joint stiffness in the morning that lasts less than 30 minutes. She denies any rash, fever, or weight loss. No history of radiation exposure or use of medications known to cause dryness. Unremarkable past or family history.\n\nPhysical Examination: there was dry, red conjunctivae, dental caries, no lymphadenopathy, mild swelling of small joints in hands. Schirmer’s test: <5 mm wetting in 5 minutes (positive) investigations done and reveals: elevated ESR, ANA: Positive (1:80), positive Anti-Ro (SSA) and Anti-La (SSB). Rheumatoid factor: is negative\n\nWhat is the most likely diagnosis and DD? L\n\nWhat are the hallmark symptoms of this condition?\n\nWhat is the next step for confirming the diagnosis? What are the possible complications?\n\nWhat is the treatment strategy?", "back": "Primary Sjögren's syndrome.", "cls": "Unclassified"}];

  let position = 0;      // current index within session

  // ---------- Persistent progress storage ----------
  // Prefers the Claude artifact storage API (window.storage), which persists
  // across sessions when this file is opened inside Claude. Falls back to
  // localStorage for when the file is opened directly in a regular browser,
  // and finally to an in-memory store (no persistence) if neither works —
  // e.g. private browsing. The app functions the same either way; only
  // whether progress survives a reload/reopen differs.
  const PROGRESS_KEY = "im_case_bank_diagnosis_progress_v1";

  const Store = {
    backend: "memory",
    memoryVal: null,
    async init(){
      try{
        if(typeof window.storage !== "undefined" && typeof window.storage.set === "function"){
          await window.storage.set("__probe__", "1", false);
          const r = await window.storage.get("__probe__", false);
          if(r && r.value === "1"){
            this.backend = "window";
            return;
          }
        }
      }catch(e){ /* fall through to next backend */ }
      try{
        localStorage.setItem("__probe__", "1");
        localStorage.removeItem("__probe__");
        this.backend = "local";
        return;
      }catch(e){ /* fall through */ }
      this.backend = "memory";
    },
    async get(key){
      try{
        if(this.backend === "window"){
          const r = await window.storage.get(key, false);
          return r ? r.value : null;
        } else if(this.backend === "local"){
          return localStorage.getItem(key);
        }
        return this.memoryVal;
      }catch(e){ return null; }
    },
    async set(key, value){
      try{
        if(this.backend === "window"){
          await window.storage.set(key, value, false);
        } else if(this.backend === "local"){
          localStorage.setItem(key, value);
        } else {
          this.memoryVal = value;
        }
      }catch(e){ /* saving is best-effort; ignore failures */ }
    }
  };

  let progressData = { reviewed: [], lastSession: null };

  async function loadProgress(){
    await Store.init();
    const raw = await Store.get(PROGRESS_KEY);
    if(raw){
      try{
        const parsed = JSON.parse(raw);
        if(parsed && typeof parsed === "object"){
          progressData.reviewed = Array.isArray(parsed.reviewed) ? parsed.reviewed : [];
          progressData.lastSession = parsed.lastSession || null;
        }
      }catch(e){ /* keep defaults */ }
    }
  }

  function saveProgress(){
    Store.set(PROGRESS_KEY, JSON.stringify(progressData));
  }

  function markReviewed(num){
    if(progressData.reviewed.indexOf(num) === -1){
      progressData.reviewed.push(num);
      saveProgress();
    }
  }

  function saveSessionState(){
    progressData.lastSession = {
      order: session.map(c => c.num),
      position: position,
      mode: mode,
      chapters: Array.from(selected),
      browseMode: browseMode,
      classes: Array.from(selectedClasses)
    };
    saveProgress();
  }

  const selectAllBtn = document.getElementById("select-all-btn");
  const startBtn = document.getElementById("start-btn");
  const modeButtons = document.querySelectorAll(".mode-btn[data-mode]");
  const browseButtons = document.querySelectorAll(".browse-btn[data-browse]");
  const pickerHeading = document.getElementById("picker-heading");
  const startHint = document.getElementById("start-hint");
  const overallProgressRow = document.getElementById("overall-progress-row");
  const overallProgressText = document.getElementById("overall-progress-text");
  const resetProgressBtn = document.getElementById("reset-progress-btn");
  const resumeBtn = document.getElementById("resume-btn");

  function reviewedCountForChapter(ch){
    let n = 0;
    for(let i = 0; i < CASES.length; i++){
      if(CASES[i].chapter === ch && progressData.reviewed.indexOf(CASES[i].num) !== -1) n++;
    }
    return n;
  }

  function reviewedCountForClass(cl){
    let n = 0;
    for(let i = 0; i < CASES.length; i++){
      if(CASES[i].cls === cl && progressData.reviewed.indexOf(CASES[i].num) !== -1) n++;
    }
    return n;
  }

  function renderChapterGrid(){
    chapterGrid.innerHTML = "";
    CHAPTER_ORDER.forEach(ch => {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "chapter-card";
      card.setAttribute("data-chapter", ch);
      card.setAttribute("aria-pressed", selected.has(ch) ? "true" : "false");
      if(selected.has(ch)) card.classList.add("selected");
      const reviewedN = reviewedCountForChapter(ch);
      const countLine = chapterCounts[ch] + ' case' + (chapterCounts[ch] === 1 ? '' : 's') +
        (reviewedN > 0 ? ' · ' + reviewedN + ' reviewed' : '');
      card.innerHTML =
        '<div class="cc-top">' +
          '<span class="cc-check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>' +
          '<span class="cc-name">' + CHAPTER_LABELS[ch] + '</span>' +
        '</div>' +
        '<span class="cc-count">' + countLine + '</span>';
      card.addEventListener("click", () => toggleChapter(ch, card));
      chapterGrid.appendChild(card);
    });
  }

  function renderClassGrid(){
    classGrid.innerHTML = "";
    CLASS_ORDER.forEach(cl => {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "chapter-card";
      card.setAttribute("data-class", cl);
      card.setAttribute("aria-pressed", selectedClasses.has(cl) ? "true" : "false");
      if(selectedClasses.has(cl)) card.classList.add("selected");
      const reviewedN = reviewedCountForClass(cl);
      const countLine = classCounts[cl] + ' case' + (classCounts[cl] === 1 ? '' : 's') +
        (reviewedN > 0 ? ' · ' + reviewedN + ' reviewed' : '');
      card.innerHTML =
        '<div class="cc-top">' +
          '<span class="cc-check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>' +
          '<span class="cc-name">' + CLASS_LABELS[cl] + '</span>' +
        '</div>' +
        '<span class="cc-count">' + countLine + '</span>';
      card.addEventListener("click", () => toggleClass(cl, card));
      classGrid.appendChild(card);
    });
  }

  function toggleChapter(ch, card){
    if(selected.has(ch)){
      selected.delete(ch);
      card.classList.remove("selected");
      card.setAttribute("aria-pressed", "false");
    } else {
      selected.add(ch);
      card.classList.add("selected");
      card.setAttribute("aria-pressed", "true");
    }
    updateStartButton();
  }

  function toggleClass(cl, card){
    if(selectedClasses.has(cl)){
      selectedClasses.delete(cl);
      card.classList.remove("selected");
      card.setAttribute("aria-pressed", "false");
    } else {
      selectedClasses.add(cl);
      card.classList.add("selected");
      card.setAttribute("aria-pressed", "true");
    }
    updateStartButton();
  }

  function setBrowseMode(newMode){
    browseMode = newMode;
    browseButtons.forEach(b => b.classList.toggle("active", b.getAttribute("data-browse") === newMode));
    if(newMode === "chapter"){
      chapterGrid.style.display = "";
      classGrid.style.display = "none";
      pickerHeading.textContent = "Choose chapters";
      startHint.textContent = "Tap a chapter to add or remove it from your session";
      selectAllBtn.textContent = selected.size === CHAPTER_ORDER.length ? "Clear all" : "Select all";
    } else {
      chapterGrid.style.display = "none";
      classGrid.style.display = "";
      pickerHeading.textContent = "Choose classification";
      startHint.textContent = "Tap a classification to add or remove it from your session";
      selectAllBtn.textContent = selectedClasses.size === CLASS_ORDER.length ? "Clear all" : "Select all";
    }
    updateStartButton();
  }

  browseButtons.forEach(btn => {
    btn.addEventListener("click", () => setBrowseMode(btn.getAttribute("data-browse")));
  });

  function updateStartButton(){
    const total = totalSelectedCount();
    if(total === 0){
      startBtn.disabled = true;
      startBtn.textContent = browseMode === "chapter" ? "Select a chapter to begin" : "Select a classification to begin";
    } else {
      startBtn.disabled = false;
      startBtn.textContent = "Start studying — " + total + " case" + (total === 1 ? "" : "s");
    }
  }

  function totalSelectedCount(){
    let n = 0;
    if(browseMode === "chapter"){
      selected.forEach(ch => n += chapterCounts[ch]);
    } else {
      selectedClasses.forEach(cl => n += classCounts[cl]);
    }
    return n;
  }

  function updateOverallProgress(){
    const n = progressData.reviewed.length;
    if(n === 0){
      overallProgressRow.style.display = "none";
      return;
    }
    overallProgressRow.style.display = "flex";
    overallProgressText.innerHTML = "<b>" + n + "</b> of " + CASES.length + " cases reviewed";
  }

  function findCaseByNum(num){
    for(let i = 0; i < CASES.length; i++){ if(CASES[i].num === num) return CASES[i]; }
    return null;
  }

  function updateResumeUI(){
    const ls = progressData.lastSession;
    if(!ls || !Array.isArray(ls.order) || ls.order.length === 0 ||
       ls.position == null || ls.position >= ls.order.length){
      resumeBtn.style.display = "none";
      return;
    }
    resumeBtn.style.display = "block";
    const modeLabel = ls.mode === "shuffled" ? "shuffled" : "sequential";
    resumeBtn.textContent = "Resume — Case " + (ls.position + 1) + " / " + ls.order.length + " (" + modeLabel + ")";
  }

  resumeBtn.addEventListener("click", () => {
    const ls = progressData.lastSession;
    if(!ls) return;
    const restored = ls.order.map(findCaseByNum).filter(Boolean);
    if(restored.length === 0) return;
    session = restored;
    position = Math.min(ls.position, session.length - 1);
    mode = ls.mode === "shuffled" ? "shuffled" : "sequential";
    modeButtons.forEach(b => b.classList.toggle("active", b.getAttribute("data-mode") === mode));
    selected.clear();
    (ls.chapters || []).forEach(ch => selected.add(ch));
    selectedClasses.clear();
    (ls.classes || []).forEach(cl => selectedClasses.add(cl));
    setBrowseMode(ls.browseMode === "class" ? "class" : "chapter");
    renderChapterGrid();
    renderClassGrid();
    updateStartButton();
    flipped = false;
    showScreen("study");
    renderCard();
  });

  resetProgressBtn.addEventListener("click", () => {
    const ok = window.confirm("Reset all saved progress? This clears which cases you've reviewed and your resume point. This can't be undone.");
    if(!ok) return;
    progressData = { reviewed: [], lastSession: null };
    saveProgress();
    renderChapterGrid();
    renderClassGrid();
    updateOverallProgress();
    updateResumeUI();
  });

  selectAllBtn.addEventListener("click", () => {
    if(browseMode === "chapter"){
      const allSelected = selected.size === CHAPTER_ORDER.length;
      document.querySelectorAll('#chapter-grid .chapter-card').forEach(card => {
        const ch = card.getAttribute("data-chapter");
        if(allSelected){
          selected.delete(ch);
          card.classList.remove("selected");
          card.setAttribute("aria-pressed", "false");
        } else {
          selected.add(ch);
          card.classList.add("selected");
          card.setAttribute("aria-pressed", "true");
        }
      });
      selectAllBtn.textContent = allSelected ? "Select all" : "Clear all";
    } else {
      const allSelected = selectedClasses.size === CLASS_ORDER.length;
      document.querySelectorAll('#class-grid .chapter-card').forEach(card => {
        const cl = card.getAttribute("data-class");
        if(allSelected){
          selectedClasses.delete(cl);
          card.classList.remove("selected");
          card.setAttribute("aria-pressed", "false");
        } else {
          selectedClasses.add(cl);
          card.classList.add("selected");
          card.setAttribute("aria-pressed", "true");
        }
      });
      selectAllBtn.textContent = allSelected ? "Select all" : "Clear all";
    }
    updateStartButton();
  });

  modeButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      modeButtons.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      mode = btn.getAttribute("data-mode");
    });
  });

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  startBtn.addEventListener("click", () => {
    let pool = browseMode === "chapter"
      ? CASES.filter(c => selected.has(c.chapter))
      : CASES.filter(c => selectedClasses.has(c.cls));
    if(pool.length === 0) return;
    session = mode === "shuffled" ? shuffle(pool) : pool.slice().sort((a,b) => a.num - b.num);
    position = 0;
    flipped = false;
    showScreen("study");
    renderCard();
  });

  // ---------- Study screen ----------
  const setupScreen = document.getElementById("setup-screen");
  const studyScreen = document.getElementById("study-screen");
  const backBtn = document.getElementById("back-btn");
  const chapterBadge = document.getElementById("chapter-badge");
  const classBadge = document.getElementById("class-badge");
  const progressText = document.getElementById("progress-text");
  const progressFill = document.getElementById("progress-fill");
  const flashcard = document.getElementById("flashcard");
  const frontText = document.getElementById("front-text");
  const backText = document.getElementById("back-text");
  const frontChapterTag = document.getElementById("front-chapter-tag");
  const backChapterTag = document.getElementById("back-chapter-tag");
  const prevBtn = document.getElementById("prev-btn");
  const nextBtn = document.getElementById("next-btn");
  const flipBtn = document.getElementById("flip-btn");
  const restartBtn = document.getElementById("restart-btn");

  function showScreen(name){
    setupScreen.classList.toggle("active", name === "setup");
    studyScreen.classList.toggle("active", name === "study");
  }

  // In shuffled mode the chapter is hidden by default (cases jump between
  // specialties, so the chapter name gives away the diagnosis) and reveals
  // on tap. In sequential mode it's always shown.
  let chapterRevealed = true;

  function updateChapterDisplay(){
    const c = session[position];
    if(!c) return;
    const shouldHide = mode === "shuffled" && !chapterRevealed;
    const chapterName = CHAPTER_LABELS[c.chapter];
    const clsName = CLASS_LABELS[c.cls] || c.cls;
    const caseLabel = "Case " + c.num;

    chapterBadge.textContent = shouldHide ? "Tap to reveal chapter" : chapterName;
    chapterBadge.classList.toggle("is-hidden", shouldHide);
    classBadge.textContent = clsName;

    const tagText = (shouldHide ? caseLabel + " · ?" : caseLabel + " · " + chapterName) + " · " + clsName;
    frontChapterTag.textContent = tagText;
    backChapterTag.textContent = tagText;
    frontChapterTag.classList.toggle("is-hidden", shouldHide);
    backChapterTag.classList.toggle("is-hidden", shouldHide);
  }

  function revealChapter(e){
    if(e) e.stopPropagation();
    if(mode !== "shuffled" || chapterRevealed) return;
    chapterRevealed = true;
    updateChapterDisplay();
  }

  function renderCard(){
    const c = session[position];
    if(!c) return;
    frontText.textContent = c.front;
    backText.textContent = c.back;
    chapterRevealed = mode !== "shuffled";
    updateChapterDisplay();
    progressText.textContent = "Case " + (position + 1) + " / " + session.length;
    progressFill.style.width = ((position + 1) / session.length * 100) + "%";
    flipped = false;
    flashcard.classList.remove("flipped");
    prevBtn.disabled = position === 0;
    nextBtn.disabled = position === session.length - 1;
    flashcard.querySelector(".face-scroll").scrollTop = 0;
    saveSessionState();
  }

  function flipCard(){
    flipped = !flipped;
    flashcard.classList.toggle("flipped", flipped);
    if(flipped){
      const c = session[position];
      if(c) markReviewed(c.num);
    }
  }

  flashcard.addEventListener("click", flipCard);
  flipBtn.addEventListener("click", flipCard);
  chapterBadge.addEventListener("click", revealChapter);
  frontChapterTag.addEventListener("click", revealChapter);
  backChapterTag.addEventListener("click", revealChapter);

  prevBtn.addEventListener("click", () => {
    if(position > 0){ position--; renderCard(); }
  });
  nextBtn.addEventListener("click", () => {
    if(position < session.length - 1){ position++; renderCard(); }
  });

  backBtn.addEventListener("click", () => {
    renderChapterGrid();
    renderClassGrid();
    updateOverallProgress();
    updateResumeUI();
    showScreen("setup");
  });
  restartBtn.addEventListener("click", () => {
    position = 0;
    flipped = false;
    if(mode === "shuffled"){ session = shuffle(session); }
    renderCard();
  });

  document.addEventListener("keydown", (e) => {
    if(!studyScreen.classList.contains("active")) return;
    if(e.key === "ArrowRight") nextBtn.click();
    else if(e.key === "ArrowLeft") prevBtn.click();
    else if(e.key === " " || e.key === "Enter"){ e.preventDefault(); flipCard(); }
  });

  (async function init(){
    await loadProgress();
    renderChapterGrid();
    renderClassGrid();
    updateStartButton();
    updateOverallProgress();
    updateResumeUI();
  })();
})();
</script>
</body>
</html>
