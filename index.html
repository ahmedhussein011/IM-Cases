k.", "cls": "Unclassified"}, {"num": 70, "chapter": "GIT", "front": "A 56-year-old obese male, smoker, complains of repeated episodes of heartburn and regurgitation associated with meals and sleep for more than 7 years. He was always prescribed proton pump inhibitors with improvement. In the last few months, he developed dysphagia and repeated bolus impaction in the esophagus. Bolus impactions were frequently mobilized using an endoscope.\n\nGive the explanation for the last few months presentation? BowoP =\n\nHow do you evaluate this condition?\n\nWhat is the treatment required at early stage of the disease? What are the treatment options for this patient?", "back": "Esophageal stricture due to chronic gastroesophageal reflux (GERD) is the most likely explanation.", "cls": "Unclassified"}, {"num": 71, "chapter": "GIT", "front": "A 54-year-old male presents with a 2-day history of black tarry stools, dizziness, and mild epigastric discomfort. He has hypertension (on amlodipine) with no history of NSAID or alcohol use. On examination: BP 90/60 mmHg, HR 110 bpm, pallor, melena. Labs: Hb 8.2 g/dL., BUN 40 mg/dL, INR 1.0.\n\n1. What is the most likely source of bleeding?\n\n2. What is the next best step in management?\n3. What scoring system predicts outcomes?", "back": "Most Likely Source of Bleeding is peptic ulcer disease (PUD), likely from Helicobacter pylori or stress-related mucosal injury, this can be explained by: e     Melena (black, tarry stools) indicates upper GI bleeding (proximal to the ligament of Treitz).", "cls": "Unclassified"}, {"num": 72, "chapter": "GIT", "front": "A 52- year -old male, is admitted to ER because of vomiting a small cup of blood. He had tennis elbow for which he was receiving NSAID (diclofenac) 50 mg bid for 10 days. He had been relatively stable until about 2 days prior to admission when he noted some occasional vague abdominal pain. On examination: Temp 36.8°C, pulse 120 bpm and regular, RR16/min. BP 100/60. Investigations showed: Hb 10.2 gm/di, HCT 36.4%, platelet and WBC are normal.\n\n1. What is the most probable diagnosis?\n\n2. What information would you use to assess the degree of this patient's blood loss?\n\n3. What is the most important investigation             would    you recommend for this patient?\n\n4. What are the urgent lines of treatment you recommend?", "back": "Drug induced gastritis and possibly ulcer complicated by acute GIT bleeding is the first possibility due to the history of NSAIDs administration.", "cls": "Unclassified"}, {"num": 73, "chapter": "GIT", "front": "A 28-year-old woman reports several years of cramp-like lower abdominal pain associated with abdominal bloating, rectal urgency, and frequent loose, non-bloody, small-volume stools and mucus. Pain is worse after meals and is partially relieved with defecation or passage of flatus. At other times, the patient reports having to strain to pass hard stools. There is no fever, weight loss, rashes, joint or eye pain. She considers herself \"anxious\" and thinks her symptoms get worse with stress and menses.\n\nPhysical exam reveals an anxious woman who makes poor eye contact, abdomen with a small right lower quadrant surgical scar, and mild tenderness that is most evident in the left lower quadrant.\n\n1. Discuss the possible diagnosis?\n2. What are the alarm symptoms that necessitate colonoscopy in such cases?\n3. What is the management of this patient?", "back": "This young woman's presentation is most consistent with irritable bowel syndrome (IBS).", "cls": "Unclassified"}, {"num": 74, "chapter": "GIT", "front": "A 50 year old man reports a 1-month history of bloody diarrhea throughout the day and night. He notes decreased appetite, nausea and vomiting, intermittent fever, and a 5 kg weight loss. There are no rashes, joint aches, or eye symptoms. He has a history of prostate cancer that was treated with radiation therapy 9 years ago. A screening colonoscopy 6 years ago was normal. He took an antibiotic 3 months ago after a tooth extraction. Physical exam is notable for pallor, aphthous ulcers, diffuse abdominal tenderness without masses; perianal exam is notable for small fissure and two external hemorrhoids; rectal exam is notable for guaiac-positive liquid stool.\n\n1. Discuss the differential diagnosis?\n\n2. How would you proceed for diagnosis?", "back": "This is a case of chronic bloody diarrhea with systemic symptoms in an elderly man with prior pelvic irradiation.", "cls": "Unclassified"}, {"num": 75, "chapter": "GIT", "front": "A 61- year- old woman reports a 3-month history of watery diarrhea. Her symptoms started insidiously without a clear precipitant. She describes 4-7 bowel movements each day and at night, associated with mild, diffuseabdominal discomfort. She has experienced 5 kgs weight loss.\n\n1. What is the Differential Diagnosis of this case?\n2. Discuss how would you approach the diagnosis of such case?", "back": "The differential diagnosis of chronic watery diarrhea (diarrhea lasting more than 4 weeks with non bloody non fatty stools) is subdivided into osmotic, secretory, and functional diarrhea.", "cls": "Unclassified"}, {"num": 76, "chapter": "GIT", "front": "A 49 year old woman presents with several weeks of diarrhea described as 2- 5 semi-formed stools per day that are non-bloody, greasy, and foul-smelling. She is constantly \"gassy\" and bloated and notes a decreased appetite, mild fatigue, and a 4 kg weight loss over the past 2-3 months. Physical exam is notable for a thin, anxious woman whose abdomen is distended with mild epigastric and right upper quadrant tenderness. Laboratory studies are notable for an iron-deficiency anemia.\n\n1. Discuss how would you approach the diagnosis and the possible management?", "back": "This patient describes symptoms of steatorrhea (fatty, greasy, foul smelling stools due to fat malabsorption with weight loss).", "cls": "Unclassified"}, {"num": 77, "chapter": "GIT", "front": "A 76 -year- old man presents with a 6 week history of progressive swallowing difficulties, particularly of solids. He had lost 6 kg in weight. There has been no pain associated with dysphagia. He is able to drink normally. He occasionally reports regurgitation of solids. In the past he had myocardial infarction 10 years ago. He takes prophylactic aspirin therapy and oral sustained release nitrates for occasional angina. He has regularly consumed alcohol for many years and smokes 20 cigarettes per day. Examination of the mneck reveals no abnormality. There is no lymphadenopathy. Nervous system, cardiovascular system and chest showed normal findings.\n\n1. Mention the 2 most common causes for dysphagia in this patient?\n\n2. How would you proceed in such case?", "back": "Progressive dysphagia to solids with weight loss — top differentials: esophageal carcinoma, peptic stricture, or achalasia.", "cls": "Unclassified"}, {"num": 78, "chapter": "GIT", "front": "A 34 -year -old gravid woman with a history of ileal Crobn’s disease presented at 30 weeks’ gestation with a 2-week history of fever up to 38.6°C, right upper quadrant pain, nausea but no vomiting. Right upper quadrant pam was constant and radiated to her back. She did not experience any changes in her bowel habits. On physical examination, she had a gravid abdomen with normal bowel sounds and significant tenderness on palpation of the right upper quadrant. Initial investigations: unremarkable urinalysis and urine culture, elevated white-blood-cell count of 12 x 10%1 with 75% neutrophils and 12% bands. Her liver function test and other metabolic profiles were unremarkable.\n\n1. Discuss the differential diagnosis\n\n2. How to reach your diagnosis?", "back": "The differential diagnosis includes Crohn’s disease flare, intraabdominal abscess, cholecystitis, and appendicitis.", "cls": "Unclassified"}, {"num": 79, "chapter": "GIT", "front": "A 16- year -old boy presents to the outpatient department complaining of diarrhea for 6 years. He passes 4-5 large volume stools daily, which are frothy, greasy and fowl smelling, and contain undigested food material. The stools show no visible blood, mucus or pus. He has postprandial abdominal bloating, generalized weakness and easy fatigability but no abdominal pain, fever or joint pains. His parents mentioned that he is not growing well. On examination: Height 150 cm, weight 32 kg, BMI 14.2. Normal blood sugar level. He is pale with angular stomatitis and cheilitis and no apparent secondary sexual characters.\n\n1. What is the most probable diagnosis?\n\n2. Enumerate other possible causes?\n\n3. What are the investigations suggested to reach the diagnosis this condition?", "back": "Malabsorption syndrome, likely due to celiac disease.", "cls": "Unclassified"}, {"num": 80, "chapter": "GIT", "front": "A 25 year old female presents with a 3 months history of increasing right lower quadrant abdominal pain and non bloody diarrhea. She has lost 5 kg. She has had recurrent attacks of urinary tract infections, and a recent urine culture showed Klebsiella, E coli, and yeast. On physical examination, she is thin and pale but in no acute distress. Tender fullness is noted in the right lower quadrant without guarding or rebound. Colonoscopic findings were negative, although the endoscopist was not able to pass to the terminal ileum.\n\n1. What is the most likely diagnosis?\n2. What are the intestinal complications of this condition?\n3. What is the most appropriate test to establish the diagnosis?", "back": "The most likely diagnesis is Crohn’s disease (chronic non bloody diarrhea, right lower abdominal pain, with pallor and weight loss) Crohn’s disease is an idiopathic, chronic, transmural inflammatory process of the bowel that often leads to fibrosis and obstructive symptoms.", "cls": "Unclassified"}, {"num": 81, "chapter": "GIT", "front": "A 28 years old male comes to the ER complaining of recurrent attacks of abdominal pain and diarrhea over the last 6 to 8 months. The recent attack is of 2 days duration. He describes his stools as frequent, with 10-12 times/day, small volume, sometimes with visible blood and mucus, it is preceded by a sudden urge to defecate. Abdominal pain is crampy, diffuse, and moderately severe, and it is not relieved with defecation. He has no other medical history and takes no medications. On examination, temperature is 38°C, Pulse 98 bpm, and BP 115/70 mm Hg. There were no oral ulcerations. Chest and heart examination is clear. His abdomen is soft and mildly distended, with hypoactive bowel sounds and minimal diffuse tenderness but no guarding or rebound tenderness. Investigations: WBC 15,800/mm3 with 82% polymorphonuclear leukocytes, Hb 10.3 g/dL, Platelet 754,000/mm3. Plain film radiograph of the abdomen shows a mildly dilated air-filled colon with a 4.5-cm diameter and no pneumoperitoneum or air/fluid levels.\n\n1. What is the most likely diagnosis?\n\n2. Mention other manifestations for this condition?\n\n3. What is your next step?", "back": "Inflammatory bowel disease (IBD) versus infectious colitis.", "cls": "Unclassified"}, {"num": 82, "chapter": "GIT", "front": "A 54 y old female presents with a 2 weeks history of watery diarrhea without fever., The patient reports passing 6 to 8 watery stools daily. She has nocturnal diarrhea. There is nausea but no vomiting. Patient is diabetic (type 2), and treatment was switched recently from metformin to insulin. Approximately 6 weeks before the onset of diarrhea, she received a course of ciprofloxacin for a urinary tract infection. On examination: Vital signs are normal and abdominal examination shows mild non specific tenderness. Stool studies show the presence of many leukocytes.\n\n1. What are the causes of diarrhea related to diabetes mellitus and what is the most likely diagnosis?\n2. What are investigations needed for diagnosis?", "back": "Causes of diarrhea related to diabetes mellitus are: -    Autonomic neuropathy affecting GIT motility.", "cls": "Unclassified"}, {"num": 83, "chapter": "GIT", "front": "A 32 year old female has a 2 months history of fever, night sweats, watery diarrhea, a 9kg loss of weight, malaise and abdominal pain mainly in right iliac fossa. On examination: pallor with diffusely tender abdomen. Investigations: Hb 9.2g/dL, ESR 110 mm/hour, serum albumin 2.1g/dL. Contrast-enhanced CT showed thickness of bowel loops and enlarged mesenteric lymph nodes.\n\n1. What is the most likely diagnosis?\n2. Explain the sources of infection for this condition?\n\n3. Explain the localization of the site of pain to the right iliac fossa? Mention other disorders characteristically affecting this site?", "back": "In the presence of fever, night sweating, diarrhea, pallor, diffusely tender abdomen together with thickened bowel loops and enlarged mesenteric lymph nodes by CT scan possibility of tuberculous enteritis should be considered.", "cls": "Unclassified"}, {"num": 84, "chapter": "GIT", "front": "A 65 year old male came complaining of progressively increasing constipation since 4 months. He lost 10 kg of his weight and his wife noticed that he looks pale. On examination: no organomegaly or masses could be detected and his abdomen was lax but there was mild tenderness in the right iliac fossa. Investigations showed: Microcytic hypochromic anemia with normal liver and kidney function tests and positive stool for occult blood.\n\n1. What is your most likely diagnosis?\n\n2. Mention other common clinical presentations of this condition?\n3. What is your next diagnostic step?", "back": "Considering the age of the patient with progressive constipation and weight loss and the presence of occult blood in stools with microcytic anemia, the most likely diagnosis will be cancer colon.", "cls": "Unclassified"}, {"num": 85, "chapter": "GIT", "front": "A 61-year-old man came to the emergency room complaining of 3 days history of worsening left lower quadrant abdominal pain with nausea but no vomiting. He had mild diarrhea at the beginning of his illness, but bowel evacuation became difficult thereafter. On examination, temperature is 38°C, pulse 98 bpm, and BP 110/70 mm Hg. He has no pallor or jaundice. Chest and heart examination revealed no clinical abnormality. His abdomen is mildly distended with hypoactive bowel sounds and marked left lower quadrant tenderness with rebound tenderness. His stool is negative for occult blood. Investigations: WBC 11,800/mm3, 74% polymorphonuclear leukocytes, 22% lymphocytes, and with normal hemoglobin and hematocrit. A plain film of the abdomen showed no pneumoperitoneum and a nonspecific bowel gas pattern.\n\n1. What is the most likely diagnesis? Define this condition?\n2. What is the most appropriate next step?\n\n3. Describe treatment outlines in this case.", "back": "Acute Sigmoid Diverticulitis.", "cls": "Unclassified"}, {"num": 86, "chapter": "GIT", "front": "An 82 year old male had been admitted 4 times in the previous year with malaise, lethargy and extreme pallor. On each occasion he was found to be anemic but apart from the invariable finding of positive occult blood in stools; no definite diagnosis was made. On examination: He was pale, with no organomegaly or lymphadenopathy. Investigations showed: Positive occult blood in stools, Hb 7g/dl, serum iron 5mg/dL.\n\n1. What is the most probable diagnosis?\n\n2. What further investigations would you like to do to reach the diagnosis?", "back": "In elderly patient with evidence of GI bleeding, as shown by the low serum iron and hemoglobin levels with positive occult blood in stool, the first possibility is GIT malignancy (eg.", "cls": "Unclassified"}, {"num": 87, "chapter": "GIT", "front": "A 65 year old female is evaluated for 12 kgs weight loss and diarrhea over the past year. She has postprandial nausea with vague diffuse abdominal pain occurring 30 minutes after eating. She avoids food for fear of pain and reports watery, slimy stools. She gives history of coronary artery disease, hypertension, peripheral vascular disease, cigarette smoking, and mild renal insufficiency. Investigations: Results of endoscopy with small-bowel biopsy and colonoscopy with terminal ileal views were unremarkable, MRA shows highgrade stenotic lesions of the proximal celiac artery and superior mesenteric artery. The pancreas and liver are normal. Serum creatinine 1.7 mg/dL.\n\n1. What is the most likely diagnosis?\n\n2. What most likely would benefit this patient?", "back": "This patient most likely has chronic mesenteric ischemia with postprandial pain due to limited arterial blood flow, especially when increased blood flow is needed after meals.", "cls": "Unclassified"}, {"num": 88, "chapter": "GIT", "front": "A 68-year-old woman is evaluated for abdominal bloating and intermittent diarrhea that has been present for 6 months. Bloating improves after bowel movement. This was associated with weight loss (5 kg during 6 months). She had medical history of permicious anemia, for which she received vitamin B12 injections monthly. There was no history of recent travel, sick contacts, or medication changes. Investigations showed: Iron deficiency anemia, normal level of vitamin B12 and folic acid. TSH level was normal. Stool microbiologic findings were negative. Upper endoscopy showed atrophic- appearing gastric mucosa. Small bowel biopsy specimens showed increased cellularity in the lamina propria. Colonoscopy, with random biopsy specimens, were negative.\n\n1. What is the most likely diagnosis? Explain the patient data?\n\n2. What.is the pathogenesis of the condition?\n\n3. What is the appropriate treatment in this case?", "back": "Malabsorption mostly due to small intestinal bacterial overgrowth.", "cls": "Unclassified"}, {"num": 89, "chapter": "GIT", "front": "A 42 year old female presents to the ER complaining of 24 hours of severe, steady epigastric abdominal pain, radiating to the back with several episodes of nausea and vomiting. She has experienced similar painful episodes in the past, following heavy meals but the episodes always resolve spontaneously within an hour or two. She gave no history of medications. On examination: Temp. 37.8 C, pulse 110 bpm, BP 115/75, and she has jaundice. Abdomen is lax, mildly distended with marked right upper quadrant pain and epigastric tenderness, hypoactive bowel sounds and no masses or organomegaly. Investigations: negative occult blood in stools, total bilirubin 9.2 mg/dL, direct fraction 7 mg/dL, alkaline phosphatase 285 IU/L, AST 78 1U/L, ALT 92 IU/L, serum amylase 1249 TU/L WBCs     16500/mm3,    with   82% polymorphonuclear        cells   and   16% lymphocytes. Plain film of the abdomen showed nonspecific changes.\n\n1. What is the differential diagnosis?\n\n2. What is your next diagnostic step?", "back": "A female patient with a past history suggestive of cholelithiasis now presents with epigastric pain and nausea for 24 hours, much longer than would be expected with uncomplicated biliary colic.", "cls": "Unclassified"}, {"num": 90, "chapter": "GIT", "front": "A 40 year-old male, presented with 2 months of bright red blood mixed with stools. Sometimes there was increased bowel motions (up to 4/day). There is no pain, change in appetite, weight loss or fever and is generally well. Family history: his father had significant rectal bleeding and polyps. On examination: no signs of significant blood loss. BP was 120/70 mm Hg and pulse was 80 bpm. Abdominal examination was unremarkable. Inspection of the perianal region showed no abnormalities. Digital rectal examination revealed fresh blood.\n\n1. What is the most likely diagnosis?\n\n2. What is the differential diagnosis of the presentation?\n3. What is the most important procedure for this patient?", "back": "In the presence of family history of rectal bleeding due to colonic polyps, the most likely diagnosis is inherited familial polyposis syndrome.", "cls": "Unclassified"}, {"num": 91, "chapter": "GIT", "front": "A 40-year-old man presenting with increased abdominal girth and fever for the past several weeks. An ultrasound scan of the abdomen reveals ascites with no evidence of cirrhosis and patent hepatic vasculature. Paracentesis reveals a protein content of 6.2g% and a serum ascites albumin gradient of 0.5, as well as 568 WBCs with 87% lymphocytes.\n\n1. What is the most probable diagnosis?\n2. What would be the most appropriate next test to help determine the diagnosis?", "back": "This patient likely has tuberculous ascites.", "cls": "Unclassified"}, {"num": 92, "chapter": "GIT", "front": "A 23-year-old man with a history of Crohn’s disease presents with increased diarrhea, abdominal pain, fever; and increased leukocyte count. He undergoes a CT scan of the abdomen that shows intra-abdominal abscess. Subsequently, he undergoes percutaneous catheter drainage of the abscess. Four days later, he reports improvement in the diarrhea. Laboratory test results are significant for a decrease in the WBC count. However, he continues to have high output from the drain, which is his main symptom.\n\n1. What is your explanation for this?\n\n2. What is the next best step to reach the diagnosis?", "back": "Enteric fistula (from percutaneous abscess drain) in Crohn's disease.", "cls": "Unclassified"}, {"num": 93, "chapter": "GIT", "front": "A 40-year-old man with long- standing alcohol abuse and a history of chronic pancreatitis is admitted to the hospital with mild right upper quadrant abdominal pain and jaundice for one week. His total bilirubin level is 12.2mg/dL, direct bilirubin is 9.9 mg/dL, and alkaline phosphatase is 337 IU/L. MRCP was performed and demonstrated a stricture of the distal bile duct with proximal dilatation of the upstream pancreatic duct, a lobular contour of the liver, and prominent perigastric and paraesophageal venous collaterals.\n\n1. What is the possible diagnosis?\n\n2. What is the next appropriate step in the management of this patient?", "back": "This patient presents with biliary and pancreatic duct obstruction in the setting of chronic alcoholic pancreatitis.", "cls": "Unclassified"}, {"num": 94, "chapter": "GIT", "front": "A 55-year-old man is referred for evaluation for 10 kg weight loss, fatigue, weakness and small volume diarrhea of 6 months duration. He was diagnosed as insulin- requiring diabetes mellitus 1 year ago. On physical examination he appears wasted. A raised, scaly erythematous rash is observed over the buttocks, inner thighs and groins. Laboratory examination is significant for anemia (hemoglobin, 9g/dL). CT scan of abdomen revealed a large pancreatic mass with hepatic metastasis.\n\n1. What is the most likely diagnosis?\n\n2. What will be the next diagnostic step?", "back": "Patient history, examination and workup have many points that could help to reach diagnosis of pancreatic neuroendocrinal tumor(NET), particularly glucagonoma.", "cls": "Unclassified"}, {"num": 95, "chapter": "GIT", "front": "A 22-year-old female with ulcerative colitis is presenting with 10—12 bloody stools/day, fever (38.9°C), and hypotension after recent antibiotics. Stool PCR is positive for C. difficile toxin.\n\n1. List three differential diagnoses.\n\n2. What are the essential investigations to be required?\n\n3. Define the stepwise management approach.", "back": "C. difficile colitis complicating an ulcerative colitis flare.", "cls": "Unclassified"}, {"num": 96, "chapter": "GIT", "front": "A 68-year-old male, presents to the emergency department with left lower quadrant abdominal pain, low-grade fever, and altered bowel habits for the past three days. He reports occasional constipation and bloating. On examination, he has localized tenderness over the left iliac fossa without signs of peritonitis. Blood tests show mild leukocytosis and elevated CRP. Based on his clinical presentation, a diagnosis of sigmoid diverticulitis is made.\n\n1. List two complications of diverticulitis that may require surgical intervention?\n\n2. Identify two key lifestyle modifications that can help prevent recurrent diverticular disease episodes?", "back": "Sigmoid diverticulitis.", "cls": "Unclassified"}, {"num": 97, "chapter": "GIT", "front": "A 56-year-old female presents with weight loss, loose motions and flushing that deteriorated over the last six months. She experienced 4 daily attacks of diarrhea with intermittent flushes and has lost approximately 6 kg in weight over this period. She passed through menopause over the last five years but was untroubled at that stage. She is non smoker with no current medication intake.\n\nOn examination, she has a BMI of 28.1 kg/m?, pulse of 80 bpm and a blood pressure of 128/78 mmHg. Auscultation of the chest reveals expiratory wheezes. Examination of the abdomen reveals 4 cm hepatomegaly. Investigations reveal: CBC, urea, AST, ALT gamma GT, sodium, potassium, FT4 and TSH are in the normal range. Random plasma glucose 87 mg/dl, Hb Alc 5.2%, alkaline phosphates 128 U/L (60-110), Estradiol 63 pmol/L (120- 800), LH 55 U/L (postmenopausal > 40) FSH 88 U/L (postmenopausal > 50). Abdominal ultrasonography: hepatomegaly with multiple focal lesions consistent with hepatic metastasis.\n\n1. What is the most appropriate diagnosis? What are other differential diagnoses?\n\n2. What is the test needed to reach this diagnosis?\n\n3. What is the most appropriate therapy for this patient?", "back": "The most likely diagnosis in this patient is carcinoid syndrome as reflected by the symptoms and signs (diarrhea, intermittent flushes, weight loss, chest wheezes).", "cls": "Unclassified"}, {"num": 98, "chapter": "GIT", "front": "A 24-year-old woman was referred from the endocrinology clinic for a gastroenterologist opinion. She had been treated for hypothyroidism for 12 years, but she remained persistently tired, despite adequate thyroxine replacement therapy. She reported a long history of tiredness, accompanied by headaches, joint pains, blisters on her face, and occasional mouth ulcers. Gastrointestinal symptoms included abdominal bloating and occasional vomiting. She was taking anticholinergics, sulpride and carbon tablets for her GIT symptoms. Her mother had diabetes mellitus, and her father and grandfather both had bowel cancer in their sixties.\n\nPhysical examination was unremarkable. Investigations: Hb 9.2 g/dL, WBC 6.100 /dL /1, platelets 279.000 /dL, MCV 76fL. Serum ferritin 6ng/L (N 15— 200 ng/ml), plasma folate 4.9 (N 2-20 ng/mL), serum vitamin B12 700 (N 200 to 900 pg/mL). TSH 1.6 wU/ml (N 0.4-4.4 pU/ml) free-T4 2.3 ng/dL (normal range 0.8 -2.8 ng/dL). Serum albumin 4.7 g/dL, Ca 7.9 mg/dL, fasting glucose 90 mg/dL. Liver function tests were normal. Endomysial antibody IgA: negative. IgA <5 mg/dl (N 80 - 350 mg/dl)\n\n1. What is the diagnosis? Justify?\n\n2. What are your next step investigations?\n\n3. What is your initial management?", "back": "Celiac disease is the most likely cause: Celiac disease is an autoimmune disease and is characterized by Gluten intolerance and antibodies against gluten and total villus atrophy of small intestine resulting in diarrhea, bloating and colics with disappearance of these symptoms if gluten containing diet is restricted.", "cls": "Unclassified"}, {"num": 99, "chapter": "Hepatology", "front": "44 vyears old Egyptian male patient discovered accidentally to have HCV antibodies during blood donation. Laboratory: serum ALT 17 U/L, AST 15 U/L, total bilirubin 0.9 mg/dL, direct 0.3 mg/dL, albumin 4.5 mg/dL, PC 100% (INR 1). CBC and creatinine are within normal range. HCV PCR 20800 IU/ml Genotype 4, HBsAg was negative. Abdominal ultrasound was normal.\n\n1. Is this patient candidate for treatment?\n\n2. What are the goals and endpoints for treatment?\n\n3. What is the recommended drug regimen for this patient?", "back": "Chronic hepatitis C virus (HCV) infection, genotype 4 (treatment candidate).", "cls": "New"}, {"num": 100, "chapter": "Hepatology", "front": "A 47 year old, female patient married known to be infected with HCV for 10 years which was complicated with liver cirrhosis. The patient had no history of hematemsis or hepatic encephalopathy. She presented to the hepatology clinic for HCV treatment\n\n1. What is the next step?\n\n2. Ts this patient candidate for HCV treatment?\n\n3. Is there a need for post sustained virologic response (SVR) surveillance?", "back": "HCV-related liver cirrhosis (compensated), for antiviral treatment planning.", "cls": "New"}, {"num": 101, "chapter": "Hepatology", "front": "A 30-year-old female with vitiligo and hypothyroidism presents with jaundice, arthralgia, and elevated IgG (2,200 mg/dL). She presented to hepatology clinic for elevated liver enzymes with ALT 480 U/L and negative viral serology.\n\n1. What is your differential diagnosis?\n\n2. What are the confirmatory tests for diagnosis?\n\n3. What are the possible complications and initial treatment lines?", "back": "Differential diagnoses includes: autoimmune hepatitis (ATH), druginduced liver injury and primary biliary cholangitis (PBC).", "cls": "Unclassified"}, {"num": 102, "chapter": "Hepatology", "front": "A 54-year-old female patient, known to have chronic HCV was treated with direct acting anti-viral and achieved sustained viral response (SVR) two years ago. She complained of progressive palpable purpura of both lower limbs along with lower limb edema, facial puffiness and oliguria. BP is 150/95. Chest and cardiac examinations were normal. There was no clinical evidence of ascites or manifestation of liver cell failure. Investigations: Hb 10 g/dl, serum creatinine 2.4mg/dl, blood urea 85 mg/dl, serum albumin 3.5g and, INR 1.4.\n\n1. How to approach this case and how to treat?", "back": "HCV-associated mixed cryoglobulinemia with cryoglobulinemic glomerulonephritis.", "cls": "New"}, {"num": 103, "chapter": "Hepatology", "front": "A 33 year old male patient presents complaining of generalized fatigue, anorexia, dull aching right hypochondrial pain and dark urine for 5 days. There is no past history or family history of liver disease. No history of drug intake during the last 6 months. On examination he is fully conscious with tinge of jaundice, Liver was tender and felt 4 fingers below the costal margin. Laboratory results: CBC was normal apart from mild leucopenia (WBCs 3.2) with relative lymphocytosis, serum ALT 278 U/L, AST 211 U/L, total bilirubin 2.3 mg/dL, direct 1.9 mg/dL. (serum ALP, GGT & albumin, creatinine, INR, fasting blood sugar, lipid profile) were within normal ranges. Hepatitis B sAg was positive. Abdominal ultrasound was normal apart from mild hepatosplenomegaly.\n\n1. What is the most likely diagnosis?\n\n2. What further investigations do you recommend?\n\n3.   [Is this patient candidate for starting antiviral therapy?", "back": "Acute viral hepatitis.", "cls": "New"}, {"num": 104, "chapter": "Hepatology", "front": "A 44 -years-old male patient accidentally discovered to be infected with HBYV during blood donation and his investigations were as follows: ALT 17 U/L, AST 15 U/L, Bilirubin total 0.9 mg/dL direct 0.3 mg/dL, HBsAg, HBe Ab were positive. HBeAg, HBc Ab IgM, and HBs Ab were negative. HBV PCR 700 IU/ml. Abdominal ultrasound was normal.\n\n1. What is the current HBV state in this phase?\n2. Is this patient candidate for treatment in this phase?\n\n3. What is the next step?", "back": "This patient had normal liver enzymes, positive HBsAg and HBe Ab, negative HBeAg with HBV-DNA less than 2000 IU/ml so he can be categorized as HBeAg -ve inactive chronic HBV infection (old terminology was inactive catrier).", "cls": "New"}, {"num": 105, "chapter": "Hepatology", "front": "A 42-years-old female patient presented to the outpatient clinic with elevated liver enzymes. Laboratory investigations were as follows; serum ALT 115 U/L, AST 123 U/L, Bilirubin total 2 mg/dL. direct 0.9 mg/dL, AFP was negative. Hepatitis markers HBsAg, HBe Ab, HBc Ab IgG were positive. HBeAg, HBs Ab and HCV Ab were negative. HBV DNA PCR 22100 IU/ml. Abdominal ultrasound was normal.\n\n1. What is the current HBV state in this phase?\n\n2, Is this patient candidate for treatment in this phase?\n3. What are the recommended drugs will you preseribe to treat this patient?\n\n4. What is the main end point for treatment?", "back": "The hepatitis B state is active HBeAg-negative chronic hepatitis B.", "cls": "New"}, {"num": 106, "chapter": "Hepatology", "front": "A 17- year -old male presented with 4 days of fever, anorexia, vomiting and right hypochondrial pain not related to meals. His mother noticed teacoloured urine on the last day. No history of drug intake or previous illnesses. On examination: Temp 38°C, pulse 120 bpm, normal BP. He was jaundiced. Abdominal examination revealed right hypochondrial tenderness and hepatomegaly (5 cm below the costal margin). No splenomegaly or ascites. Investigations: serum ALT 2650 U/L, AST 2320 U/L, Total bilirubin 5 mg/dL, indirect bilirubin 2.2 mg/dL.                                    |\n\n1. What would be the possible diagnosis?\n\n2. What further tests would you recommend to confirm the diagnosis?\n3. What is the treatment?", "back": "The clinical picture is consistent with acute viral hepatitis, most likely hepatitis A.", "cls": "4-star"}, {"num": 107, "chapter": "Hepatology", "front": "A 30 year old woman presents to the outpatient clinic complaining of upper right quadrant abdominal discomfort of 2 months duration, and easy fatigability. No history of other GIT symptoms. By examination, height was 161cm, weight 83kg, B.P. 125/80, pulse 88/min, regular, temperature is 36.8° C. Abdominal examination revealed; mild hepatomegaly soft, non-pulsating, not tender. Laboratory Profiles show; fasting blood sugar 118mg/dl, AST 60 IU/L, ALT 70 IU/L, GGT 80 IU/L, total cholesterol 223mg/dl, LDL-c 153mg/dl, HDL-c 32mg/dl, Triglycerides 93mg/dl. HCV antibody and HBVs antigen are negative. Abdominal ultrasound shows hepatomegaly with bright echo pattern.\n\nComment on the laboratory test results? ol\n\nWhat is the most probable diagnosis? A\n\nHow can you confirm the diagnosis? What about the management plane?", "back": "Metabolic dysfunction-associated steatohepatitis (MASH).", "cls": "2-star"}, {"num": 108, "chapter": "Hepatology", "front": "A- 28y -old male comes complaining of 5-days history of nausea, vomiting, diffuse abdominal pain, muscle aches, anorexia and fever up to 38°C. He has no significant medical past or family history. He denies any drug abuse. He takes no medications routinely, but he has been taking acetaminophen, approximately 30 tablets per day for 3 days for tennis elbow. On examination, Temperature is 37.8°C, pulse 98 bpm, BP 120/75 mm Hg. He has jaundice. Chest and heart are clear. The liver is slightly tender. No abdominal distention or peripheral edema. Investigations: normal complete blood count, creatinine 1.1 mg/dL, ALT 3440 U/L, AST 2705 U/L, total bilirubin 24.5 mg/dL & direct bilirubin 18.2 mg/dL, alkaline phosphatase 349 IU/L (NL:40-129), serum albumin 4.0 g/dL and INR is 1.4.\n\n1. What is the most likely diagnosis?\n\n2. What is the most important immediate diagnostic test?", "back": "The most likely diagnosis: Drug induced liver injury (DILI) mostly due to drug (acetaminophen) The degree and pattern of transaminase (ALT and AST) elevation can provide some clues to help differentiate possible etiologies.", "cls": "2-star"}, {"num": 109, "chapter": "Hepatology", "front": "A 49 year old female presents to the ER complaining of a 4 weeks history of progressive abdominal swelling and discomfort. She has no other GI symptoms. Medical history is significant only for three pregnancies, one of which was complicated by excessive blood loss, requiring a blood transfusion. She is married for 20 years. On examination: temperature is 37°C, pulse 88 bpm, and BP 95/60 mm Hg. She has jaundice Chest and heart are clinically free. Her abdomen is distended, with mild diffuse tenderness, hypoactive bowel sounds and shifting dullness to percussion. There is mild peripheral edema. Investigations: serum Na 129 mEqg/L, serum albumin 2.8 mg/dL, total bilirubin 4 mg/dL, prothrombin concentration 45%, Hb 12 g/dL and Platelet count 78 x10%/L.\n\n1. What is the most likely diagnosis?\n2. Explain laboratory findings in this patient?\n\n3. What is your next step?                        /", "back": "The most likely diagnosis: ascites caused by portal hypertension as a complication of hepatic cirrhosis.", "cls": "4-star"}, {"num": 110, "chapter": "Hepatology", "front": "A 62- year-old female was referred to the outpatient clinic with 8 months history of pruritus. She had loose motions for the past 4 weeks and felt generally tired. There was no loss of weight or appetite and no abdominal pain. On examination: She was mildly jaundiced and had clubbing of her fingers. No lymphadenopathy. BP was 170/60. Pulse was 80bpm and regular. Skin was dry and pigmented with scratch marks all over her body together with bilateral xanthelasmas. Abdominal examination revealed hepatomegaly. Spleen was 3 fingers below the costal margin. Abdomen was distended with shifting dullness.\n\nInvestigations: serum albumin 2 g/dL, total bilirubin 3.8 mg/dL, direct bilirubin 3.0 mg/dL, alkaline phosphatase 640 U/L, GGT 230 U/L, prothrombin time 15 seconds.\n\n1. What is the most likely diagnosis?\n\n2. What further investigations would you like to perform?\n3. What is the treatment of this disease?", "back": "Primary biliary cholangiopathy (previously known as primary biliary cirrhosis).", "cls": "2-star"}, {"num": 111, "chapter": "Hepatology", "front": "A 59-year-old retired accountant was admitted with a 6 months history of increasing tiredness and lethargy and 2 months history of poor appetite. His weight was increasing in the last few weeks. There was no history of chest pain, cough or expectoration. He was started on frusemide 3 weeks ago but this in fact had worsened his tiredness.\n\nOn examination: He was alert with jaundice and bilateral LL pitting edema. Abdominal examination revealed shifting dullness. Liver was not palpable and spleen was moderately enlarged.\n\nInvestigations: total bilirubin 2.3 mg/dL, direct bilirubin 1.1 mg/dL, ALT 120 U/L, AST 130 U/L, serum albumin 2.5g/dL, K 2.5 mEq/L, Na 129 mEq/L.\n\nWhat is the most likely diagnosis? Ae\n\nList the most important causes of such a disease in Egypt?\n\nExplain the laboratory findings in view of your diagnosis?\n\nWhat investigations would you like to do to define the etiology of this condition?", "back": "Liver cirrhosis.", "cls": "4-star"}, {"num": 112, "chapter": "Hepatology", "front": "A 54- year- old female presents to the ER with hematemesis and melena. She gives a 4 months history of upper abdominal discomfort and marked itching. No history of drug intake or receiving blood transfusion. On examination; Pulse is 120bpm regular. BP 85/50mmHg. Prominent xanthelasmas are present. She has clubbing of fingers but no palmar erythema or spider nevi. Chest examination is unremarkable. Abdominal examination revealed mild hepatomegaly with smooth surface and 3cm splenomegaly below the costal margin. Investigations: Hb 7.1 g/dL, WCC 13.5x10%L, platelets 540 x10°/L, Na 138mEq/L, K 4.5mEq/L, ALT 41U/L, AST 65 U/L, INR 1.1, Protein 8 g/dL, albumin 3.3 g/dL. alkaline phosphatase 570 U/L, GGT 195 U/L.\n\n1. What is your diagnosis?\n\n2. What would be the most appropriate immediate therapies whilst you are organizing for upper GI endoscopy?\n\n3. What test would best confirm the likely underlying diagnosis?", "back": "This patient has hematemesis and melena, itching, clubbing, prominent xanthelasmas and raised serum alkaline phosphatase.", "cls": "2-star"}, {"num": 113, "chapter": "Hepatology", "front": "A 38-year-old woman presents for further evaluation of vague right upper quadrant pain, pruritus, and abnormal liver test results. Her primary care physician has already ordered a right upper quadrant ultrasound scan, which showed no abnormality. A quantitative hepatobiliary iminodiacetic acid scan showed a normal GB ejection fraction. Laboratory: serum albumin level of 4.0 g/dL, bilirubin 1.2 mg/dL, alkaline phosphatase 350 U/L, AST 65 U/L, ALT 72 U/L, antimitochondrial antibody 1:1280, ANA 1:20, HCV antibody negative, antibody to anti-HBc negative, HBsAg negative, and anti-HBs positive.\n\n1. What is this patient’s most likely diagnosis?\n2. Mention the drugs that can be used in treatment of pruritus in such patients?", "back": "This patient has primary biliary cholangitis (formerly referred to as primary biliary cirrhosis).", "cls": "2-star"}, {"num": 114, "chapter": "Hepatology", "front": "A 40 year old female presents with acute abdominal pain. She takes no regular medications except contraceptive pills and occasional analgesics for back pain. She has no current illnesses, but had a lower limb deep venous thrombosis Syears ago. No previous abdominal surgeries. On examination, she is in pain, pulse 110 bpm regular, BP 120/80, JVP not raised with absent hepatojugular reflex. Heart sounds are normal, with no ankle edema. Chest is clear, and abdominal examination reveals tender hepatomegaly and ascites. Investigations: Hb 12g/dL, bilirubin 3mg/dL, platelets 114x x10°/L, INR 1.1, HBsAg and anti-HCV Ab were negative, anti-smooth muscle Ab was negative, anti-mitichondrial Ab and RF were also negative.\n\n1. What is the most likely diagnosis?\n\n2. What investigation would you do to confirm the diagnosis?\n\n3. What are the most likely causes of such a disease?", "back": "The classic triad of acute abdominal pain, ascites, and hepatomegaly, besides absent hepatojugular reflux, suggests hepatic venous outflow tract obstruction.", "cls": "2-star"}, {"num": 115, "chapter": "Hepatology", "front": "A 25- year- old lady presented with acute onset of right hypochondrial pain, jaundice and increase of abdominal girth. She was married since 4 years and gave history of two consecutive abortions. There was no history of alopecia, photosensitivity or skin rash. Examination revealed BP 110/70, pulse 90/min regular. Patient was jaundiced with an enlarged tender liver and ascites by shifting dullness. CBC showed mild thrombocytopenia platelet count 110.000/dl with hyperbilirubinaemia bilirubin 3 mg/dl with biphasic pattern and normal liver enzymes.\n\n1. What is your diagnosis?\n\n2. Mention the possible cause for this patient’s condition?\n\n3. Mention lines of treatment?", "back": "The classic triad of acute abdominal pain, ascites, and hepatomegaly in a middle-aged female suggests hepatic venous outflow tract obstruction.", "cls": "New"}, {"num": 116, "chapter": "Hepatology", "front": "A 22 -year- old female presents with jaundice, abdominal pain and confusion. She was unable to give any further history but her parents denied any previous ill health, medications or depression. On examination, she was afebrile, pulse 95 bpm, BP 100/50, normal JVP and chest was clear. She was jaundiced, abdominal examination revealed 5 cm tender hepatomegaly and ascites. Flapping tremors were present and her Glasgo coma scale GCS was 13/15\n\nInvestigations: Hb 10g/dL, WCC 11x10%L, platelets 186x10°1L, ESR >100 mms, INR 2.3, ALT 3565 U/L, ALP 410 U/L, hepatitis viral markers are negative. ANA 1/160, antimitochondrial and anti-smooth muscle antibodies were negative, serum ceruloplasmin and urinary copper were normal, paracetamol levels undetectable\n\n1. What is the most likely diagnosis? and why?", "back": "This is a 22-year-old female with clinical (encephalopathy) and laboratory (coagulopathy) evidence of acute liver failure without preexisting liver disease.", "cls": "2-star"}, {"num": 117, "chapter": "Hepatology", "front": "A 57 -year- old male presents with increasing abdominal girth, abdominal discomfort and tiredness. He was diagnosed as having chronic HCV hepatitis 3 years ago but he is received only supportive hepatotropic treatment. On examination, he is jaundiced and several spider nevi. There is no astrexis. Pulse is regular, 80bpm. BP 135/75. Normal JVP. Chest and heart examinations are unremarkable. Abdominal examination reveals mild tenderness in right hypochondrium without organomegaly but there is shifting dullness. Investigations: Bilirubin 3.5 mg/dL, albumin 2.8 g/dL, alkaline phosphatase S00U/L, INR 2, alpha-fetoprotien 2000IU/L\n\n1. What is the likely diagnosis?\n2. What diagnostic test(s) would confirm the diagnosis?", "back": "The likely diagnosis is liver cirrhosis due to chronic HCV hepatitis, mostly complicated by hepatocellular carcinoma (HCC).", "cls": "4-star"}, {"num": 118, "chapter": "Hepatology", "front": "A 52 -year- old male with a 4 years history of ulcerative colitis presents for his usual follow up. He complains of intermittent abdominal pain, worse in the right upper quadrant. During the last episode of pain, he noticed that his eyes look rather yellow. His bowel motions 2-3/d. They are loose but no blood. He takes mesalazine and azathioprine. He underwent cholycystectomy 15year ago.\n\nOn examination, He is jaundiced with no spider nevi or palmar erythema. Pulse is 80bpm and regular. BP is 140/85. Chest is clear, heart sounds are within normal. Abdominal examination mild right upper quadrant tenderness but no palpable organomegaly.\n\n1. What is the most likely diagnosis?\n2. How would you confirm the diagnosis?", "back": "Jaundice and right hypochondrial pain and tenderness in a patient with ulcerative colitis should raise the suspicion of a hepatobiliary complication.", "cls": "2-star"}, {"num": 119, "chapter": "Hepatology", "front": "A 42 -year- old male presents to the ER with one day history of vomiting of fresh blood. He also reported passing black tarry stools for the last 3 days and feeling generally unwell for the last 6 weeks. He gives history of previous 3 attacks of jaundice.\n\nOn examination, he was jaundiced, and pale. Pulse 110 bpm. BP 110/70. Abdominal examination showed palpable liver 2cm below the right costal margin and firm in consistency. Spleen was also felt 4 fingers below the left costal margin. Few spider nevi were present on the chest and back.\n\nWhat is the diagnosis? S\n\n.List 3 common causes of such condition?\n\nWhat is the cause of black tarry stools?\n\nWhat is the priority in the management of this patient?\n\nWhat investigations would order for this patient? U", "back": "This patient has jaundice, a firm liver, and splenomegaly plus spider nevi, so the diagnosis will be hematemesis and melena due to vascular decompensation of liver cirrhosis.", "cls": "4-star"}, {"num": 120, "chapter": "Hepatology", "front": "A 40- year- old female presents to the casualty complaining of 2 months history of progressive abdominal distension with no change in appetite or in bowel habits and no other gastrointestinal tract symptoms. On examination: She was icteric, her temperature was 38°C with no lower limb edema. Chest and heart examination showed no abnormality. The abdomen was distended with diffuse tenderness and shifting dullness.\n\nInvestigations: HB 11 g/dL, total leucocytic count 15x10°/L, platelets 78x10°/L, albumin 2.8 g/dL, total bilirubin 4 mg/d}, direct bilirubin 2 mg/dl, prothrombin time 15 seconds.\n\n1. What is the most likely diagnosis?\n\n2. What further investigations should be done?\n3. What is the cause of shifting dullness and fever?", "back": "Liver cirrhosis with ascites, complicated by spontaneous bacterial peritonitis (SBP) due to the presence of fever and abdominal tenderness in a cirrhotic patient.", "cls": "2-star"}, {"num": 121, "chapter": "Hepatology", "front": "A 48-year-old man with HCV —and alcohol-related cirrhosis hospitalized with a two-day history of fever and abdominal discomfort. His temperature is 38C°. He has abdominal distension with shifting dullness and a small, reducible umbilical hernia is noted. Laboratory test results reveal a sodium level of 130 mEq/L, albumin of 2.5g/dL, and ALT of 75 U/L. Ascitic fluid has an albumin level of 1g/dLL and a polymorphonuclear leukocyte (PMN) count of 500 cells/mm3.\n\n1. What is the most likely diagnosis?\n2. Which are the most appropriate next steps in managing this patient?", "back": "Spontaneous bacterial peritonitis (SBP), confirmed by PMN count > 250/mm?", "cls": "2-star"}, {"num": 122, "chapter": "Hepatology", "front": "A 45-year-old man with HCV related liver cirrhosis is admitted with refractory ascites, oliguria, and failure to thrive. No fever, jaundice, edema or encephalopathy. Laboratory: BUN and creatinine increased from 18 mg/dL and 1.5 mg/dL to 25 mg/dL and 1.8mg/dL over 6 weeks. Blood and urine cultures are negative. Ascitic fluid 120 neutrophils/mm?®. Nasogastric lavage is negative for blood.\n\n1. What is the most probable diagnosis?\n\n2. What is the best next step in managing this patient?", "back": "Hepatorenal syndrome (HRS), a functional renal failure in patients with advanced liver disease.", "cls": "2-star"}, {"num": 123, "chapter": "Hepatology", "front": "A 14 -year- old boy presents with yellowish sclera, fatigue and abnormal upper limb movements. Family history reveals his sister had similar symptoms and died. Examination: jaundiced, mild lower limb edema, shifting dullness and abnormal limb movements. Investigations: total bilirubin 3.5mg/dL, direct bilirubin 2.8mg/dL, albumin 3g/dL, AST 556 U/L, ALT 678 U/L, INR 2.5.\n\n1. What is the most likely diagnosis?\n\n2. What further investigations should be done?\n3. What is the treatment of this condition?", "back": "Wilson's disease, an autosomal recessive disorder of copper metabolism leading to liver and neurologic damage.", "cls": "2-star"}, {"num": 124, "chapter": "Hepatology", "front": "18-year-old female presented with a 3-day history of jaundice, nausea, and abdominal discomfort. She had noticed dark urine, but normal stool and no itching. Examination: normal apart from jaundice. Urine output was less than 30 ml/h Investigations: Hb 7.0g/dL, WBC 21.800 /mcL, platelets 144.000/mcL, blood film: polychromasia, burr cells, microspherocytes; no fragmented cells, reticulocytes 6.7% (normal range <2%). Coomb’s test is negative. Prothrombin time 30 sec. serum Na 134mmol/L; K 4.8mmol/L; creatinine 1.85 mg/dL. Bilirubin 28.9 mg/dL; AST 89 TU/L, ALT 62 IU/L, ALP 69 IU/L, albumin 2.3 g/dL, abdominal ultrasound: no comment on liver texture, mild splenomegaly.\n\n1. What is the most probable diagnosis?\n\n2. What are your next step investigations?\n3. What is your initial management?", "back": "The most likely diagnesis is Wilson disease (WD): The clinical presentation is acute jaundice with rising bilirubin, decreasing Hb and dark urine and elevated creatinine.", "cls": "New"}, {"num": 125, "chapter": "Hepatology", "front": "A 55 -year- old obese female presented in the ER with fever and right upper quadrant abdominal pain that increases with meals for the last two weeks. There were 2 attacks of vomiting. In the last few days there were itching and clay colored stools. She is a mother of 4 children. On examination: the patient was conscious, temp 38°C, pulse 120 bpm, BP 120/80, jaundice with scratch marks all over her body. Abdominal examination right hypochondrial tenderness but no organomegaly. Investigations: total bilirubin 3.5mg/dL, direct bilirubin 3mg/dL, alkaline phosphatase 1000 U/L, GGT 567 U/L, total leucocytic count 14x10%/L\n\n1. What is the most likely diagnosis?\n\n2. What is your interpretation of the Laboratory tests?\n\n3. What further investigations would you do?", "back": "Obstructive jaundice.", "cls": "2-star"}, {"num": 126, "chapter": "Hepatology", "front": "A 66 -year -old female patient presented to the ER with high fever, delirium and right hypochondrial pain. She had a history of recurrent diarrhea in the last month. On examination: temp 39.4°C, pulse 125bpm, BP 135/85. She was drowsy. Neurological examination showed no lateralization or neck rigidity. No jaundice. Abdominal examination showed right hypochondrial and right intercostal tendemess, liver 6cm below the right costal margin. No splenomegaly. Investigations: total bilirubin 1.2 mg/dL, ALT 110 U/L, alkaline phosphatase 456 U/L, Abdominal US revealed the presence of a large cystic lesion in the right lobe of the liver.\n\n1. What are the causes of such a cystic lesion in this patient?\n\n2. What further investigations would you like to ask?", "back": "Cystic liver lesion, likely infectious — bacterial liver abscess, hydatid disease, or amebic liver abscess.", "cls": "2-star"}, {"num": 127, "chapter": "Hepatology", "front": "A 70 -year -old male presented with jaundice and anorexia of one month duration. He lost 8 kilograms in the last few weeks.\n\nOn examination he was deeply jaundiced and cachectic. The liver was felt 3 fingers below the costal margin in the mid-clavicular line and was smooth surface and soft in consistency. Spleen was not felt and there was no ascites. Investigations: abdominal sonography revealed a distended gall bladder and dilated intra hepatic and cystic duct but no stones were present.\n\nWhat is the likely diagnosis? State why? Ae\n\nWhat further investigations would you like to order?\n\nHow would you manage him?\n\nCan you prescribe ursodeoxycholic acid (UDA) to such patient?", "back": "Malignant obstructive jaundice would be the likely diagnosis.", "cls": "2-star"}, {"num": 128, "chapter": "Hepatology", "front": "A 52-year-old male, with a chief Complaint: \"I'm feeling more tired than usual.\" He visited the clinic for a routine check-up. He has a history of type 2 diabetes mellitus and hypertension. He is overweight (BMI: 31 kg/m?) and admits to a sedentary lifestyle and a diet high in processed foods. He denies alcohol use. Physical Examination mild hepatomegaly. No signs of liver failure. Lab Tests revealed ALT: 65 U/L, AST: 55 U/L, fasting glucose: 145 mg/dL, HbAlc: 7.5%, and lipid profile shows elevated triglycerides and LDL\n\nAbdominal ultrasound shows increased echogenicity of the liver consistent with hepatic steatosis.\n\n1. What is the most likely diagnosis, and what criteria are used to establish it?\n\n2. What are the recommended management strategies for this condition?", "back": "Metabolic dysfunction-associated steatotic liver disease (MIASLLD).", "cls": "Unclassified"}, {"num": 129, "chapter": "Hepatology", "front": "A 25-year-old male presents with jaundice, fatigue, and right upper quadrant pain 2 weeks after traveling to a hepatitis A-endemic region. Labs: ALT 480 U/L, AST 390 U/L, total bilirubin 3.8 mg/dL. He drinks 10-12 units of alcohol/week.\n\n1. Mention three differential diagnoses for the condition?\n2. What are the most important investigations?\n3. Outline management plan for the patient.", "back": "Acute hepatitis A virus (HAV) infection.", "cls": "Unclassified"}, {"num": 130, "chapter": "Hepatology", "front": "A 62-year-old Egyptian male with 20-year history of untreated HCV infection presents with weight loss around 6 kg in two months and right upper quadrant pain.\n\nLaboratory: AFP 620 ng/mL, platelets 90,000/uL, ALT 85 U/L. Ultrasound shows a 6 cm liver mass.\n\n1. List three differential diagnoses for the liver mass?\n\n2. Prioritize investigations to confirm HCC?\n\n3. Outline a treatment plan?", "back": "Hepatocellular carcinoma (HCC).", "cls": "Unclassified"}, {"num": 131, "chapter": "Hepatology", "front": "A 28-year-old pregnant female (32 weeks) presents with jaundice, dark urine, and right upper quadrant pain after consuming untreated water. Labs: ALT 1200 U/L, INR 1.8, IgM anti-HEYV is positive.\n\n1. List three differential diagnoses.\n\n2. What are the key investigations?\n3. What are the maternal and fetal management outlines?", "back": "Acute hepatitis E virus (HEV) infection (in pregnancy).", "cls": "Unclassified"}, {"num": 132, "chapter": "Neuro", "front": "A 65-year-old man was found collapsed in his bedroom during the night at his residential care facility. He had reportedly risen to use the toilet and then developed weakness on the right side of his body. He has a 15-year history of type 2 diabetes mellitus and hypertension and smokes 10 cigarettes per day. His current medications include amlodipine 5 mg daily and a combined metformin/glibenclamide (850/5 mg) oral tablet twice daily. On examination, he demonstrated a right homonymous hemianopia, right lower motor neuron facial palsy, right hypoglossal nerve paralysis, and expressive aphasia. The remainder of the cranial nerves was intact. There was right-sided weakness with muscle strength graded at 2/5 in the upper limb and 3/5 in the lower limb, in a pyramidal distribution. Deep tendon reflexes were reduced on the right side, and plantar response was extensor bilaterally. His blood pressure was 170/95 mmHg. A left carotid bruit was audible. Cardiac examination was unremarkable. Laboratory findings included hemoglobin 12 g/dL, WBC 10 x 10°/L, platelets 330 x 10°/L, normal coagulation profile, sodium 138 mmol/L, potassium 4.2 mmol/L, BUN 15 mg/dL, and creatinine 1.0 mg/dL. ECG and serum troponin levels were normal.\n\n1. What is the most likely cause of the patient’s neurological manifestations?\n2. What is the most critical diagnostic investigation?\n3. What is the recommended management plan?", "back": "The most likely cause is cerebrovascular stroke (CVS).", "cls": "4-star"}, {"num": 133, "chapter": "Neuro", "front": "A 65-year-old man presented to the emergency department in a comatose state. His relatives reported a history of untreated hypertension. He had developed a sudden, severe headache followed by repeated episodes of vomiting and loss of consciousness. On examination, his vital signs were as follows: blood pressure 220/130 mmHg, pulse 58 bpm, respiratory rate 22/min, and temperature 37.2°C. Glasgow Coma Scale (GCS) was 11. Neurological examination revealed right-sided hypotonia, hyporeflexia, and an extensor plantar response. There were no signs of meningeal irritation.\n\n1. What is the most likely diagnosis?\n2. What investigations are required to confirm the diagnosis?\n3. Outline the treatment plan for this patient.", "back": "Cerebrovascular accident, etiology is vascular mostly intracranial hemorrhage (ICH).", "cls": "4-star"}, {"num": 134, "chapter": "Neuro", "front": "A 55-year-old man presents to the emergency department reporting sudden onset of dysarthria and right arm numbness. He is notably anxious, but his symptoms had improved spontaneously by the time of arrival. He is a known diabetic on sulfonylurea therapy. On examination, blood pressure was 145/90 mmHg, pulse 86/min (regular), and neurologic examination was normal. Blood glucose was 190 mg/dL. ECG showed no abnormalities, and non-contrast CT brain was unremarkable.\n\n1. What is the most probable diagnosis?\n\n2. What are the investigations required?\n\n3. What’s your plan of treatment?", "back": "The diagnosis: Type 2 diabetes, hypertension, Transient ischemic attack (TTA).", "cls": "4-star"}, {"num": 135, "chapter": "Neuro", "front": "A 67-year-old woman presents to the emergency room with sudden onset of dizziness, severe vertigo, and repeated vomiting. She also complains of numbness over the right side of the face and the left upper and lower limbs. She remains fully conscious and is able to move all limbs. On examination, BP is 160/95 mmHg, pulse 78/min, regular. Mild dysarthria is noted. There is decreased pinprick sensation on the right side of the face and on the left side of the body. Horizontal nystagmus is present on right gaze.\n\n1. What is the most likely diagnosis?\n\n2. What is the etiological cause? What are the other findings you may get in her neurological examination?\n\n3. What is the important investigation to prove your suggested diagnosis?", "back": "Ischemic stroke in the vertebrobasilar system, most consistent with lateral medullary syndrome (Wallenberg syndrome) due to right posterior inferior cerebellar artery (PICA) occlusion.", "cls": "4-star"}, {"num": 136, "chapter": "Neuro", "front": "A 38-year-old woman presents to the emergency department with progressive lower limb weakness. She reports flu-like illness one week ago with fever, nausea, and diarrhea, which resolved spontaneously two days prior to symptom onset. Upon waking today, she had difficulty standing and nearly fell. As the day progressed, she noticed increasing weakness in her arms. She reports NO sensory loss, headache, back pain, visual or auditory symptoms, or bowel/bladder incontinence. On examination: Temperature 37.0°C, BP 100/60 mmHg, pulse 70/min, respiratory rate 22/min, Cranial nerves are intact. Lower limb exam: hypotonia, bilateral weakness 3/5 power, areflexia, bilateral flexor plantar reflexes, normal sensation. Upper limbs: mild weakness (4/5), hypotonia, and hyporeflexia bilaterally. Investigations: CBC, electrolytes, renal, glucose, calcium, LFTs are normal. CSF shows protein 146 mg/dL, glucose 70 mg/dL, no cells. Gram stain was negative,\n\n1. What conditions should be considered in the differential diagnosis?\n\n2. What is the most likely diagnosis?\n\n3. What are the required investigations to diagnose this condition?\n\n4. What is the most appropriate treatment for this condition?", "back": "The differential diagnosis for an individual presenting with rapidly progressing flaccid quadriparesis includes: Guillain—Barré syndrome (GBS): ascending weakness, areflexia, postinfectious, CSF with albuminocytologic dissociation.", "cls": "3-star"}, {"num": 137, "chapter": "Neuro", "front": "A 27-year-old woman presents to the neurology clinic with a history of recurrent headaches since adolescence. Over the past 6 months, the frequency has increased to approximately three episodes per month. Each episode is characterized by unilateral throbbing pain localized to the left temporal region, typically lasting 8—12 hours. The headache is preceded by visual symptoms described as flashing lights in the right lower visual field that begin about 45 to 60 minutes prior to pain onset and resolve spontaneously. During the headaches, she experiences photophobia, phonophobia, nausea, and occasional vomiting. Headache episodes are aggravated by physical activity and relieved by rest in a dark, quiet room. She denies fever, neck stiffness, focal neurological weakness, seizures, loss of consciousness, or visual loss. There is no history of trauma, substance use, recent travel, or systemic illness. She is otherwise healthy and takes no regular medications. On examination: Temperature 37.0°C, HR 80/min, RR 12/min, BP 120/80 mmHg. Neurological examination is completely normal including fundoscopy. No focal signs, cerebellar dysfunction, or signs of raised intracranial pressure were noted.\n\n1. What is the most likely diagnosis? Justify your diagnosis?\n\n2. What is the treatment?", "back": "The most likely diagnosis: Migraine with aura.", "cls": "3-star"}, {"num": 138, "chapter": "Neuro", "front": "56-year-old man is brought to the emergency department by a co-worker after suffering from severe headache, nausea, and vomiting over the past 2 hours. The headache was sudden in onset, as the patient was sitting at his desk. It was the first time for him to experience a headache of such severity. Shortly after headache onset, the patient became nauseous and vomited a few times before insisting to go to the ER. On examination, the patient was drowsy, with marked neck rigidity, positive Kernig's sign and Brudzinski's sign. He reported NO recent illness, head trauma, nor history of migraine. His temperature was 37°C, heart rate was 80/min, respiratory rate 14/min, and blood pressure 120/60 mm Hg. WBC, blood chemistry, and coagulation laboratory values were all within normal limits.\n\n1. What is the most likely diagnosis?\n\n2. What risk factors are associated with an increased incidence of this condition?\n\n3. What tests and/or imaging tools could be used to confirm the diagnosis?\n\n4. What conditions should be included in the differential diagnosis?", "back": "Subarachneid hemorrhage (SAH).", "cls": "4-star"}, {"num": 139, "chapter": "Neuro", "front": "Case Presentation\n\nA 31-year-old woman presents with diminution of vision in the right eye of 2 day duration, during an episode of a common cold. The condition was associated with pain in the same eye (right) that increased with eye movements. She had a history of mild right lower limb weakness, 3 years ago, that was ignored as it seemed to resolve over time. Last month, she developed weakness in her left upper and lower limbs, with an insidious onset and regressive course. She also reported unsteadiness of her gait, which was gradually progressive over the past year. Many of her symptoms sometimes get worse after a hot bath and after physical effort. On examination, the patient is found to be afebrile and has normal vital signs. Her visual acuity is 6/60 in the right eye and 6/6 in the left eye. WBC count, erythrocyte sedimentation rate, and C-reactive protein were mnormal. Cerebrospinal fluid analysis revealed slightly elevated protein, with elevated immunoglobulin G and oligoclonal bands.\n\n1. What is the most likely diagnosis?\n\n2. What     conditions   should     be   included   in   the   differential diagnosis?\n\n3. What are the recommended investigations to diagnose this condition? -\n\n4. What is the most appropriate treatment for this condition?", "back": "Multiple sclerosis (MS):         The patient experienced recurrent neurological deficits (muscle weakness, unsteadiness, diminished vision) not anatomically related to each other (disseminated nature) with exacerbating and remitting course.", "cls": "2-star"}, {"num": 140, "chapter": "Neuro", "front": "A 65-year-old man presents with resting tremors affecting both hands of 1 year duration. He is accompanied by his wife, who points out that her husband has been moving much more slowly, has not been sleeping well, and has been depressed and anxious. During the interview, the patient spoke m a monotonous manner without facial expressions. On examination, vital signs: temperature 37°C, heart rate is 90/min, and blood pressure 140/85 mm Hg. His hands had a static tremor involving the fingers and wrists. He had hypertonia (lead pipe rigidity) affecting all 4 limbs, which was more proximal than distal. Deep reflexes were diminished. He had a shuffling gait without arm swinging.\n\n1. What is the most likely diagnosis?\n\n2. What comorbid conditions are associated with this condition?\n\n3. What is the most appropriate treatment for this condition?", "back": "Parkinson’s disease (PD).", "cls": "2-star"}, {"num": 141, "chapter": "Neuro", "front": "A 30-year-old woman presents complaining of double vision and fatigue. Her symptoms are absent in the morning but become progressively worse by the end of the day. Physical examination reveals a heart rate of 90/min and a blood pressure of 120/75 mm Hg. Ophthalmologic examination is remarkable for bilateral symmetric ptosis and intact pupillary responses bilaterally, Weakness of the muscles of the hand is evident bilaterally, but only after multiple contractions. Sensory examination is completely normal and deep tendon reflexes are intact.\n\n1. What is the most likely diagnosis?\n\n2. What tests and/or imaging tools could be used to confirm the diagnosis?\n\n3. What is the most appropriate treatment for this condition?\n\n4. What is the potential complication of this condition and how to manage?", "back": "Myasthenia gravis (MG).", "cls": "4-star"}, {"num": 142, "chapter": "Neuro", "front": "A 20-year-old college student presents to the clinic with fever and headache. The headache began the night before and has significantly disrupted her routine. She describes it as a severe, non-pulsating headache, exacerbated by moving her neck. She also notes that loud noises and bright lights seem to bother her much more than usual. On physical examination, her temperature is 39.1°C, pulse is 110/min, and the respiratory rate is 20/min. She is unable to touch her chin to her chest, and she experiences significant pain upon flexion of her thigh with extension of her leg. There is a macular purple rash over both legs, which she had not noticed before. Her funduscopic exam is normal, and she has no focal neurologic deficits. A lumbar puncture reveals cloudy fluid and the following results: Protein: 75 g/dL, Glucose: 23 g/dL, WBCs: 678/mm3, 98% neutrophils, RBCs: 5/mm3. Bacteria: none visualized\n\n1. What is the most likely diagnosis?\n\n2. Should this patient have undergone CT scan prior to lumbar puncture?\n\n3. What is the treatment of this condition? When should patients receive steroids?", "back": "Bacterial meningitis.", "cls": "3-star"}, {"num": 143, "chapter": "Neuro", "front": "A 75-year-old man presents with difficulty in walking. His gait has become progressively more spastic and unsteady over the past several months, and he reports increased problems with fatigue and forgetfulness. He has lived in a residential facility for the past 5 years and complains that the food is terrible, so he has been eating very poorly. He is otherwise very healthy and takes no medications or supplements. On examination, his vital signs include a temperature of 36.3°C, pulse of 90/min, and blood pressure of 120/80 mm Hg. He is alert and oriented. Neurologic examination is significant for 4+/5 strength in the bilateral lower extremities, 5/5 in the bilateral upper extremities, a positive Romberg test, and increased muscle tone in the lower extremities. On sensory testing, there are notable deficits in fine discriminative touch, vibration and conscious proprioception but retained pain and temperature sensation in the lower extremities. The remainder of his examination is within normal limits. A complete blood count (CBC) reveals hemoglobin of 8.3 g/dL, hematocrit of 26%, and mean corpuscular volume (MCV) of 110 fl. Hypersegmented neutrophils are visible on peripheral smear.\n\n1. What is the most likely diagnosis? What are the common neurologic symptoms of this condition?\n\n2. What is the most appropriate next step in management?\n\n3. What is the treatment?", "back": "Subacute combined degeneration secondary to vitamin B12 due to dysfunction of the dorsal columns and corticospinal tracts in the spinal cord.", "cls": "2-star"}, {"num": 144, "chapter": "Neuro", "front": "An 18 -year-old man is having breakfast with his mother when suddenly he arches his back, turns his head to the side, shout loudly, and falls to the ground. His arms and legs remain extended for approximately 30 seconds, after which his arms and legs begin to flex and extend rhythmically for the next 2 minutes. The patient’s mother calls emergency, and on arrival the paramedics find the patient lying on the floor. He appears drowsy but can respond to vocal commands. He has bitten his tongue badly, and is soiled due to lost control of bowel and bladder functions. The patient is confused and appears to have no knowledge of what has happened to him. The paramedics transfer the patient to the ambulance and bring him to the emergency department for further evaluation.\n\n1. What is the most likely diagnosis?\n\n2, How is this condition diagnosed?\n\n3. What tests could be used to confirm the diagnesis and how to treat?", "back": "Generalized tounic-clonic seizures (partial with secondary generalization as at the onset of the fit the patient head was turned to one side) Diagnosis of this condition: In patients without a history of epilepsy or seizure, it can either indicate the new onset of primary epilepsy or may be the consequence of a provoking stimulus (i.e.…", "cls": "2-star"}, {"num": 145, "chapter": "Neuro", "front": "A 67-year-old woman is brought by her daughter for increased forgetfulness. During the visit, the patient has trouble answering questions about events that took place in the past month, and at one point stops to ask her daughter where she is. Her daughter comments that she has recently been disoriented in familiar environments, that she has trouble coming up with the names of people and objects.\n\nOn examination her temperature is 36.5°C with a heart rate of 90/min and a blood pressure of 130/80 mm Hg. Neurologic examination reveals no focal deficits, she is not oriented to the date or day of the week, is unable to recall words that she has been asked to remember after a brief delay, and is unable to copy a simple figure.\n\n1. What is the most likely diagnosis?\n\n2. What are the most common causes of this condition?\n\n3. What diagnostic tests should be performed?", "back": "Dementia. Dementia is defined as a chronic progressive decline in multiple areas of cognitive functions that impairs activities of daily living.", "cls": "2-star"}, {"num": 146, "chapter": "Neuro", "front": "A 74-year-old man was noted to have excellent cognitive and motor skill 12 months ago. His wife noted that 6 months ago his function deteriorated noticeably, and 2 months ago another level of deterioration was noted.\n\n1. What is the provisional diagnosis?\n2. Which investigations are most likely to reveal the etiology of his functional decline?\n\n3. What is your plan of management?", "back": "Multi-infarct dementia.", "cls": "1-star"}, {"num": 147, "chapter": "Neuro", "front": "A 49 year old man presented with 10 days history of low back pain, dull aching and had developed after a long car journey. It increased if he coughed or strained. It was relieved initially by NSAIDs, but now they are ineffective. Over the last 2 days the pain had begun to spread into his right buttock and down the back of the right thigh. Eight years ago he had a previous episode of low back pain which had responded to bed rest. Examination revealed BMI 40, BP 130/90, pulse 83 and temp. 37.1°C. There was loss of normal lumbar lordosis. Straight leg raising was limited bilaterally, more on the right side. Complete blood count and ESR were normal.\n\n1. What is the most likely diagnosis?\n\n2. What further investigations you need to confirm your diagnosis?", "back": "This patient may have a mechanical derangement of the lumbosacral spine.", "cls": "3-star"}, {"num": 148, "chapter": "Neuro", "front": "A 55 year old man has hypertensive, diabetic and heavy cigarette smoker, presented to emergency room by 24 hours duration of weakness of his legs accompanied by difficulty in walking. He had also noticed some hesitancy in his micturition. He had not passed urine for 12 hours. He suffered from dull aching back pain in the past 2 weeks. He also had repeated cough with one attack of hemoptysis. On examination BP was 150/90, pulse 85/min, temp 36.8C. The dorsal spines were tender. Abdominal examination showed full bladder and the prostate was normal. Neurological examination revealed weakness of both legs more marked on the left side. Tone was normal. The tendon reflexes in the legs were exaggerated. The planter response was extensor bilateral. Sensory testing revealed impairment of all modalities in both lower limbs and this extended up to the costal margin. No abnormality was found in the cranial nerves and the upper limbs. Investigations revealed normal complete blood count and ESR was 100.\n\n1. What is your provisional diagnosis? Justify why?\n\n2. Mention three other differential diagnoses?\n\n3. What are the investigations needed to reach a diagnosis?", "back": "The clinical picture of this patient is matching with an extramedullary compression of the spinal cord at the level of the mid thoracic vertebrae.", "cls": "4-star"}, {"num": 149, "chapter": "Neuro", "front": "A 45 year old female with a history of severe pricking pain, tingling and numbness sensation of both hands and feet of about 6 months duration. On examination vital signs were normal, cardiac, chest and abdominal examination were normal.\n\nThe mentality, speech and cranial nerve were normal. Motor system examination and coordination also were normal. There was bilateral symetrical dimished superfical sensation in both hands and feet.\n\n1. What is your diagnosis?\n\n2. Mention 5 different causes of this condition?\n\n3. What are the investigations needed to prove your diagnosis and how to treat such condition?", "back": "Peripheral neuritis.", "cls": "New"}, {"num": 150, "chapter": "Neuro", "front": "A 25 year old female presented with a history of numbness and loss of sensation over the left small and ring fingers. She first developed numbness about 6 months ago, and a few days prior to clinic visit she burnt her small finger while cooking but felt no pain. The numbness has gradually worsened and affects the whole of the 2 fingers as well as part of the palm. On examination the patient mentality, speech and cranial nerves were normal. She had wasting of the first dorsal interosseous and abductor digit minimi. There is a sensory loss to touch, pain and temperature over the 2 fingers and the medial aspect of the palm.\n\n1., What would be your differential diagnosis?\n\n2. What are the investigations needed for this patient", "back": "The distribution of motor and sensory affection point to an ulnar nerve lesion, a Cg/T root lesion or a lesion within the lower cervical cord such as syringomyelia or ulnar nerve compressed along its course.", "cls": "New"}, {"num": 151, "chapter": "Endocrine", "front": "A woman 30 year old, developed post-partum hemorrhage, received four units of blood transfusion. She could not lactate her baby, three weeks later, she suffered from general weakness and fatigability. Later, there was no resumption of menstrual cycle and lack of re-growth of shaved axillary and pubic hair.\n\n1. What do you think about the diagnosis?\n\n2. How you proceed for her management? (investigations & treatment)", "back": "Sheehan's syndrome (hypopituitarism).", "cls": "4-star"}, {"num": 152, "chapter": "Endocrine", "front": "45- year- old female with dull headache and visual changes which became significantly worse in the past week. CT brain revealed large sellar mass with cystic areas with marked compression of the optic chiasm. Further evaluation, revealed laboratory evidence of mild hypopituitarism and bilateral visual field defects.\n\n1. What are the most likely diagnostic possibilities?\n\n2.   What will be the most likely initial treatment approach?", "back": "Pituitary apoplexy which is hemorrhagic infarction of an underlying macroadenoma.", "cls": "New"}, {"num": 153, "chapter": "Endocrine", "front": "A 61- year- old female found to have a pituitary lesion during imaging workup for headaches CT brain revealed a round lesion within the left aspect of the pituitary gland. The suprasellar cistern is clear without contact on the optic chiasm. The patient had normal clinical evaluation and labs including hormonal profile. Visual field and fundus examination were normal.\n\n1. What should be done next?\n\n2. Give an algorithm for management of incidental pituitary mass", "back": "Incidental pituitary microadenoma (nonfunctioning).", "cls": "New"}, {"num": 154, "chapter": "Endocrine", "front": "A 25-year-old female, single, has regular menstrual cycles since menarche. Four months ago, she developed secondary amenorrhea and noticed milky discharge from the nipples. She also suffered from recent onset of headache. She did not receive any medications in the last few months. She sought medical advice where serum prolactin was 400 ng/ml, MRI proved a small sellar mass.\n\n1. What is the diagnosis?\n\n2. Mention drugs that can increase serum prolactin?\n\n3. How you proceed in the treatment and follow up?", "back": "In a single female with secondary amenorrhea, galactorrhea & raised serum prolactin > 250 ng/ml, sellar mass in MRI, the most likely diagnosis 1s prolactinoma.", "cls": "4-star"}, {"num": 155, "chapter": "Endocrine", "front": "A 45-year old man, noticed over the last 5 years changes in size of his ring and shoes. Later he develops coarse facial features, hyperhidrosis, headac
