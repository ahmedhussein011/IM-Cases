 of disease.\n\no   While positron emission tomography (PET) scanning can help distinguish benign pleural plaques from mesothelioma. The median survival for mesothelioma is 12 months after diagnosis, so treatments are primarily palliative.\n-   Surgical decortication of pleura is an option most commonly used in conjunction with radiation, chemotherapy, or immunotherapy.\n-   Recurrent pleural effusions can be treated with pleurodesis: scarring of the pleura to the chest wall to eliminate the potential space filled by pleural fluid.\n-   Somatic pain (caused by invasion of the chest wall) can be controlled by pharmacological therapy opiates and nonsteroidal anti-inflammatory drugs, while neuropathic pain (caused by invasion of intercostal nerves) may require the addition of an anticonvulsant. Non pharmacological peripheral nerve injections, a “nerve block targeting the inter-costal nerve."}, {"num": 63, "chapter": "Chest", "front": "A 50-year old female presented with dyspnea, dry cough and facial swelling with neck and upper limbs with a bluish tinge. On examination she had fever of 37.8°C, neck veins were congested and non-pulsating. There were also dilated superficial veins over the chest. There were two lymph nodes (3 cm in size) felt in the left supraclavicular area and the upper sternum was dull. Bilateral axillary nodes were detected and a firm. The spleen was felt 2 fingers below costal margin.\n\n1. What is the diagnosis of her chest condition?\n\n2. Mention the various causes for this chest condition?\n\n3. What are further investigations you would order to diagnose her chest condition and to reach the full diagnosis?", "back": "1. Superior Mediastinal Syndrome; diagnosis is based on: history of dry cough, dyspnea, facial congestion and bluish tinge. Examination revealed dull upper sternum and evidence of SVC obstruction (congested nonpulsating neck veins). The     presence   of fever with     generalized   lymphadenopathy     and splenomegaly suggest lymphema as the most probable cause of superior vena cava (SVC) obstruction.\n2. The Causes of mediastenal syndrome:\n\n-   More than 80% of cases of superior vena cava syndrome (SVCS) are caused by malignant mediastinal tumors.\no   Bronchogenic carcinomas account for 75-80% of all these cases, with most of these being small-cell carcinomas.\no Non-Hodgkin lymphoma (especially the large cell type) represents 10-15% of cases.\no Other malignant diagnoses include Hodgkin disease, metastatic cancers, primary leiomyosarcomas of the mediastinal vessels, and plasmocytomas\n-   Nonmalignant conditions (20%): retrosternal huge goiter, mediastinal fibrosis; vascular diseases such as thoracic aortic aneurysm, vasculitis, and arteriovenous fistulas; infections such as tuberculosis, syphilis, and actinomycosis; benign mediastinal tumors such as teratoma, cystic hygroma, thymoma, and dermoid cyst; cardiac causes, such as pericardial effusion and atrial myxoma; and thrombosis related to the presence of central vein catheters.\n3. Investigations:\n\n-    CT chest and MRI: provide more accurate information on the location of the obstruction. It also provides information on other critical structures such as the bronchi and the vocal cords.\n-     PET scan\n\n-    Biopsy by mediastinoscopy, bronchoscopy, or percutaneous fineneedle aspiration. LN biopsy, and histopathological examination."}, {"num": 64, "chapter": "Chest", "front": "A male patient 62 years old, retired. He is chronic heavy smoker (40 packs/year). He is complaining of progressive persistent cough and dyspnea for 5 months. Two weeks ago, he devolped hemoptysis. He also reported unexpained weight loss (8 Kgs in 2 months). Chest examination revealed dullness all over the left side chest.\n\n1. What is the most likely diagnesis in this condition?\n\n2. How do you investigate this case?\n\n3. Mentions other causes of hemoptysis?", "back": "1. The most propable diagnesis is Bromchegenic carcinoma; male, cigarrete smoker, presented with hemoptysis, marked weight loss, and massive pleural effusion.\n2. To evaluate this case the following investigations a are needed:\n\nSputum analysis for culture and sensetivity and cytology CT chest with contrast PET/CT for staging Pleural Effusion Thoracocentesis Biopsy is needed from the lesion either excisional or FNAC.\n3. Hemoptysis is expectoration of blood from respiratory tract The most comimon causes :\n\n1-   Infections:     Tuberculosis,   pneumonia,    fungal       infections (aspergillosis) p Malignancies: Bronchogenic carcinoma, metastases,             bronchial tumor\n\nCardiovascular: pulmonary venous hypertension: e.g. severe mitral stenosis, pulmonary embolism, arteriovenous malformation (AVMs). Vasculitis:   granulomatsosis   with   polyangitis,    Goodpasture syndrome\n\nPulmonary: bronchiectasis, airway trauma or foreign body (esp. Children), lung abscess Systemic causes of bleeding tendency, anticoagulants."}, {"num": 65, "chapter": "Chest", "front": "A 52-yeat-old male is known history of COPD (GOLD Stage II), presented to the emergency department with sudden onset left sided chest pain (sharp and pleuritic) for 3 hours. He 1s also complaining of dyspnea with no fever or hemoptysis. He denies any trauma. On examination: fully conscious and alert, but appears anxious, RR: 26 breaths/min, SO, 93% on room air. No cyanosis, no tracheal deviation. Decreased chest expansion, hyperresonance on percussion, and markedly diminished breath sounds over the left side.\n\n~ 1- What is the most likely diagnosis?\n\n~ 2- How to manage this case? 3- What are causes of this condition? |", "back": "1- The diagnosis is a left-sided secondary spontaneous pneumothorax (SSP) Occurred in a patient with underlying COPD Triggered by increased intra-alveolar pressure from coughing, causing rupture of subpleural bullae. 2- Management: Investigations\n\nChest X-ray (PA + Expiratory view) — confirms pneumothorax, estimates size CT scan chest (if diagnosis unclear or to evaluate for bullae/ emphysematous changes) ABG: Especially in COPD patients ECG: To rule out other causes of chest pain Blood tests: CBC, electrolytes, baseline before chest intervention Treatment: According to the British Thoracic Society (2023) guidelines: Conservative management (observation) in case of minimal symptoms (ie, no significant pain or dyspnea) or asymptomatic primary spontaneous pneumothorax in adults regardless of size. In patients not suitable for conservative (larger phenmothoraces or if symptomatic), needle aspiration or tube drainage to evacuate the air from pleural space and allow lungs to re-expand. Chemical pleurodesis to be considered for the prevention of recurrence of secondary spontaneous pneumothorax in adults (eg, patients with severe COPD who significantly decompensated in the presence of a pneumothorax, even during / after the first episode). Thoracic surgery can be considered for the treatment of pneumothorax in adults at initial presentation if recurrence preventidn is tmportant (eg, patients presenting with tension pneumothorax, or those in high risk occupations) 3- Other causes of spontanous pneumothorax:\n\nPrimary: No underlying lung disease or injury due to ruptured blebs. Secondary: in patients with underlying lung disease: COPD, asthma, cystic fibrosis, pulmonary abscess, tuberculosis"}, {"num": 66, "chapter": "Chest", "front": "A 50-year heavy smoker man presented to the outpatient clinic with dyspnea, purulent sputum, and productive cough of few days’ duration. No history of hemoptysis or pleuritic chest pain. On examination his chest was hyperinflated and bilateral basal medium sized crepitations were detected.\n\nWhat is the probable diagnosis? b=\n\nMention required investigations.\n\nHow do you treat this case? ¥\n\nHow can he stop smoking? =", "back": "1. Acute respiratory    tract   infection   im   a   COPD      patient   with bronchiectasis.\n\nInvestigations\n\nSputum culture and sensitivity CXR High-resolution CT Chest (HRCT) Bronchoscopy Treatment\n\nAntibiotics in patient with purulent           suptum.    Amoxicillin, azithromycin or fluoroquinolones Chest Physiotherapy.                                                  , Inhaled bronchodilators (B2 agonist & anticholinergics) with or without corticosteroids. Hypertonic saline nebulizer. Low concentrations oxygen therapy if needed as, hypercapenia may worsen with oxygen. This worsening has been thought from an attenuation of hypoxic respiratory drive. Patient with life threatening exacerbations (severe acute hypoxemia) should be admitted ICU To stop smoking: is the most crucial step in managing COPD: Several behavioural and pharmacological treatments have demonstrated “efficacy in helping to achieve abstinence Assess readiness to quit. Treat by:\no Advice and counseling. Find healthy replacements, prepare for withdrawal\no Pharmacotherapy: Nicotine replacement medicines: lozenge, nicotine patch, nicotine gum. Varenicline (micotine receptor partial agonist)\no Maintain a healthy lifestyle and follow up."}, {"num": 67, "chapter": "Chest", "front": "A 68-year-old man, heavy smoker, known case of COPD was admitted because of recent history of progressive productive cough, dyspnea. He received repeated courses of steroids and antibiotics as a case of COPD with exacerbation with unsatisfactory response. Physical examination: no clubbing, chest examination: signs of hyperinflated chest: increased anteroposterior diameter, encroachment on hepatic and cardiac dullness, auscultation a fixed monophonic wheeze in the right lung. CXR revealed a suspicious mass (4.5 cm) in right hilum and changes of COPD. laboratory: serum Na* 124 mmol/l s K 4 mmol/l, blood urea 40 mg/dL and creatinine 1 mg/dL.\n\n1. What is the most likely diagnosis? Specify it’s type.\n2. Mention other features expected to be present in conjunction of the low s Na™ level.\n3. Mention other extra pulmonary manifestations? 4, How is his condition treated?", "back": "1. Bronchogenic carcinoma. The most probable histopathology finding in Lung cancer and low Na* (hyponatremia) is small cell lung cancer, as the low Na\" denotes ADH excess (SIADH syndrome of inappropriate antidiuretic hormone secretion). SIADH 1s a common complication of small cell lung cancer where tumor cells can release ADH leading to increased water retention.\n\n2.       Other features of SIADH:\n\nHyponatremia (ie, serum Na\" <135 mmol/L) + concomitant hypoosmolality (serum osmolality < 280 mOsm/kg) + high urine osmolality are the hallmarks of SIADH. Absence of other causes of:\n\no   Intravascular volume depletion (Normal skin turgor, blood pressure)\no   States of excess volume such as congestive heart failure and cirrhosis\no   Adrenal      insufficiency      (mineralocorticoid     deficiency, glucocorticoid deficiency), hypothyroidism, renal disease with salt wastage, drugs that impair renal water excretion. Correction of hyponatremia by fluid restriction Urine Na* concentration usually > 40 mEqg/L because, in SIADH, Na is dazmped in urine under effect increased atrial natriuretic peptide (ANP).\n3. Other extra pulmonary manifestations:\n\n-     Paraneoplastic syndrome: Cushing syndrome due to ectopic ACTH secretion, Hypercalcemia, Lambert Eaton Syndrome.\n-     Metastasis: CNS, Liver, and bones,\n\n4. Treatment depends on the stage of disease at presentation (limited or metastatic). Lines of treatment chemotherapy, radiotherapy and surgery (selected cases). However, small cell lung cancer is usually metastatic at the presentation."}, {"num": 68, "chapter": "Chest", "front": "A 26-year-old man presented to outpatient clinic because of progressively increased dyspnea with exertion over the last 3 months. Red painful nodules over the legs, Chest auscultation: normal shape chest, respiratory rate 28 /min. End inspiratory medium sized crackles that are persistent after cough. Chest x ray shows bilateral hilar adenopathy and bilateral basal interstitial infiltrate. ESR 97 mm/hr and rhematoid factor —ve, serum Ca* 11.5 mg/dL\n\n1. What is the most likely outcome? Justify?\n\n2. Mention required investigations?", "back": "1.   Sarceidosis: is a multisystem disease of unknown etiology characterized by noncaseating granulomas. It is more common in young adults.\n\nClinical picture: - Lung, eye (uveitis) and skin are the most common sites of the disease. - The red nodules over the legs are erythema nodosum which is one of cutaneous lesions in sarcoidosis. The pulmonary affection (history, physical and radiological findings) in addition to hypercalcemia which occur in 10% of cases. These three findings make the diagnosis of sarcoidosis is the most likely diagnosis. Investigations: No single diagnestic test:\n\na)   Laboratory tests:\n- ACE levels have a 60% sensitivity and 70% specificity and are therefore not reliable in the diagnosis of sarcoidosis although they may have a role in monitoring disease activity.\n- Hypercalcemia 10% of cases & elevated alkaline phosphatse in liver affection.\nb) Chest X ray shows either no abnormality (stage 0) or bilateral hilar adenopathy (Stage 1), or bilateral hilar adenopathy and interstitial infiltrate (stage 2) or interstitial infiltrate only (Stage 3) or diffuse fibrosis (stage 4). Stages 3 and 4 carry bad prognosis and stage 1 does not need treatment, Treatment is started in stage 2 (the patient in this case). High Resolution CT:      hilar lymphadenopathy ground glass appearance in stage of alveolitis and reticulondular opacity and even honey comb pattern in fibrotic stage). Pulmonary functions;      Spirometry restrictive lung defect. Diminished diffusing capacity. ABGs: hypoxia and hypocapnea. Bronchoscopy & Brochoalveolar lavage: increased lymphocytes and increased CD4/CD8 lymphocytes. g Transbronchial lung biopsy: noncaseating granuloma in absence of TB or fungi confirms the histological diagnosis.\nh) Galium-67scintigraphy and 18F-fluorodeoxyglucose (18F-FDG) PET scan are not routinely used except to monitor disease activity (differentiates fibrosis from granuloma) and to show the extent of the disease and uncover nonvisualized lesions in (e.g. spleen salivary gland or mediastinum) to guide the biopsy sites."}, {"num": 69, "chapter": "GIT", "front": "A 60-year-old male with CHILD C liver cirrhosis is admitted to the ICU following a variceal bleeding. He feels cold extremities and has mottled skin. He is hypotensive and tachycardic. Exam revealed ascites and bilateral lower limb edema. Lactate level is 14mmol/L. One liter of IV saline was given. Terlipressin was initiated. Although the bleeding was stopped after variceal band ligation, he is still hypotensive 80/35 mmHg (MAP 50 mmHg). Lactate level dropped only to 10mmol/L. When applying a passive leg raise, his BP rose to 90/40 (MAP 59 mmHg).\n\n1.   Would you prescribe an additional fluid bolus to this patient?\n\n2,   What type of fluid is preferred in this situation?\n3.   What is your comment on the lactate level in this patient?", "back": "1. Yes, the hypotensive state with positive passive leg raising test and cold mottled skin suggests a still unresolved functional hypovolemia and that this patient is fluid responsive.\n-   Patients with cirrhosis can have intravascular volume depletion while showing signs of edema and ascites, However, the effect after fluid administration should be evaluated since administering too much fluid can aggravate ascites formation, edema, cardiac dysfunction, and even increase portal hypertension and restart gastro-intestinal bleeding.\n2. Balanced crystalloids and albumin are preferred, while hypo and hypertonic fluids should be avoided. Excessive fluids should also be avoided in order not to expand the circulation. Starch fluids should be avoided because of their effect on coagulopathy.\n3. Lactate is usually cleared by the liver. In liver cell failure, lactate is not the best marker of the hemodynamic state. However, its dynamic changes can help follow up the response to therapy in critical hepatic patients with bleeding varices.\n-   The drop from 14 to 10mmol/L should be considered beneficial in evaluating the response of this patient to fluid administration and vasoconstrictors (Terlipressin)."}, {"num": 70, "chapter": "GIT", "front": "A 56-year-old obese male, smoker, complains of repeated episodes of heartburn and regurgitation associated with meals and sleep for more than 7 years. He was always prescribed proton pump inhibitors with improvement. In the last few months, he developed dysphagia and repeated bolus impaction in the esophagus. Bolus impactions were frequently mobilized using an endoscope.\n\nGive the explanation for the last few months presentation? BowoP =\n\nHow do you evaluate this condition?\n\nWhat is the treatment required at early stage of the disease? What are the treatment options for this patient?", "back": "1. Esophageal stricture due to chronic gastroesophageal reflux (GERD) is the most likely explanation. Stricture is the result of chronic inflammation and fibrosis from refluxed gastric acid. Dysphagia especially to solids and food impaction are classical features. Dysphagia may also be due to esophageal carcinoma complicating Barrett's esophagus. Barrett's esophagus is a complication of chronic GERD in which normal squamous epithelium of lower esophagus is replaced by metaplastic columnar epithelium. Upper endoscopy (EGD) and biopsy is the gold standard for evaluation, not only for diagnosis of reflux esophagitis but also for other complications of GERD (for evaluation of mucosal integrity, esophageal stricture, Barrett's esophagus) and to rule out esinophilic esophagitis.\n-   Barium swallow (esophagram): to delineate location, length and degree of stricture. If malignancy is suspected further work up with CTor EUS may be needed.\n\nThe treatment required at early stage of the disease:\n\n-   Lifestyle modifications (reducing weight, stopping smoking, eating small frequent meals, elevating the head of the bed )\n-   Acid suppression by H2 receptor antagonists, proton pump inhibitors (PPI) or potassium competitive acid blockers (P-CABs).\n-   In Barrett's esophagus, endoscopic mucosal resection (EMR) may be needed in selected cases to prevent progression to esophageal adenocarcinoma\n4. Esophageal stricture is treated by high dose PPI, endoscopic dilation or surgery in refractory cases"}, {"num": 71, "chapter": "GIT", "front": "A 54-year-old male presents with a 2-day history of black tarry stools, dizziness, and mild epigastric discomfort. He has hypertension (on amlodipine) with no history of NSAID or alcohol use. On examination: BP 90/60 mmHg, HR 110 bpm, pallor, melena. Labs: Hb 8.2 g/dL., BUN 40 mg/dL, INR 1.0.\n\n1. What is the most likely source of bleeding?\n\n2. What is the next best step in management?\n3. What scoring system predicts outcomes?", "back": "- 1. Most Likely Source of Bleeding is peptic ulcer disease (PUD), likely from Helicobacter pylori or stress-related mucosal injury, this can be explained by: e     Melena (black, tarry stools) indicates upper GI bleeding (proximal to the ligament of Treitz). e     Epigastric pain lack of NSAID or alcohol use\no     Flevated BUN suggests blood breakdown in the GI tract (urea absorption), supporting an upper GI source.\n\ne     Other causes (e.g., esophagal varices, Mallory-Weiss tear) are less likely without liver disease or vomiting history.\n2. Next Best Step in Management is immediate resuscitation with IV crystalloids, blood transfusion with packed RBCs target Hb <7-8 g/dL, and urgent upper endoscopy that should be performed within 24 hours to identify the source (e.g., ulcer, esophagal varices) and apply therapy (e.g., clips, coagulation).\n-     H pylori testing: rapid urease test in biopsy during endoscopy, urea breath test or stool antigen test.\n-     Role of surgery and interventional radiblogy in such case is indicated if endoscopy can’t control bleeding or the source of bleeding is beyond endoscopic reach.\n\n3. Prognostic Scoring System for this case is Glasgow-Blatchford Score (GBS).\n-     Purpose: Predicts need for hospitalization for intervention (transfusion, endoscopy, surgical) based on vital signs and laboratory values (pulse, systolic BP, Hb, BUN), presence of melena, syncope or comorbidity."}, {"num": 72, "chapter": "GIT", "front": "A 52- year -old male, is admitted to ER because of vomiting a small cup of blood. He had tennis elbow for which he was receiving NSAID (diclofenac) 50 mg bid for 10 days. He had been relatively stable until about 2 days prior to admission when he noted some occasional vague abdominal pain. On examination: Temp 36.8°C, pulse 120 bpm and regular, RR16/min. BP 100/60. Investigations showed: Hb 10.2 gm/di, HCT 36.4%, platelet and WBC are normal.\n\n1. What is the most probable diagnosis?\n\n2. What information would you use to assess the degree of this patient's blood loss?\n\n3. What is the most important investigation             would    you recommend for this patient?\n\n4. What are the urgent lines of treatment you recommend?", "back": "1. Drug induced gastritis and possibly ulcer complicated by acute GIT bleeding is the first possibility due to the history of NSAIDs administration.\n2. The assessment: vital signs (pulse and BP) can be used to assess the severity of the bleeding. Tachycardia (120 bpm) and borderline low BP (100/60) indicate acute severe bleeding. Also, drop of hemoglobin may indicate degree of patient's blood loss.\n3. Upper endoscopy is the important investigation to confirm diagnosis.\n4. The urgent line of treatment is:\n\n-   IV administration of proton pump inhibitor to decrease the acidity.\n-   Close follow up to assess the amount of bleeding (melena, vital signs, BUN and Hb level). Plasma expanders and blood transfusion is indicated if marked blood loss lead to hypovolemic shock.\n-   Endoscopic intervention eg. Adrenaline injection or applying clips may be needed in severe bleeding cases."}, {"num": 73, "chapter": "GIT", "front": "A 28-year-old woman reports several years of cramp-like lower abdominal pain associated with abdominal bloating, rectal urgency, and frequent loose, non-bloody, small-volume stools and mucus. Pain is worse after meals and is partially relieved with defecation or passage of flatus. At other times, the patient reports having to strain to pass hard stools. There is no fever, weight loss, rashes, joint or eye pain. She considers herself \"anxious\" and thinks her symptoms get worse with stress and menses.\n\nPhysical exam reveals an anxious woman who makes poor eye contact, abdomen with a small right lower quadrant surgical scar, and mild tenderness that is most evident in the left lower quadrant.\n\n1. Discuss the possible diagnosis?\n2. What are the alarm symptoms that necessitate colonoscopy in such cases?\n3. What is the management of this patient?", "back": "1. This young woman's presentation is most consistent with irritable bowel syndrome (IBS). IBS is the most common digestive disorder seen in primary care practice, and is the leading reason for referral to a gastroenterologist. The ROME criteria, which are centered on abdominal discomfort associated with abnormal bowel habits, provide a systematic symptom-based method for the diagnosis of IBS. ROME IV Criteria: At least 3 months, with onset at least 6 months prior to diagnosis of recurrent abdominal pain on average at least 1 day/week with 2 or more of the following: Relation to defecation. Association with a change in frequency of stool. Association with a change in form (appearance) of stool. Exaggeration of symptoms with stress and absence of red flags support the diagnosis\n2. The alarm symptoms that necessitate cdlonoscopy are: Anemia, fever, unexplained weight loss. Persistent diarrhea, severe constipation, rectal bleeding. Nocturnal symptoms of pain and abnormal bowel function. Family history of GI cancer, inflammatory bowel disease, or celiac disease. New onset of symptoms in patients above 50 years of age.\n3. The management: Reassurance, dietary recommendations ( eg; low FODMAP diet, avoiding gas forming food, trial of lactose free and gluten free diet in certain situations). Anti-diarrheal medications such as loperamide as needed in diarrhea predominant IBS, and possibly anti-cholinergics. If postprandial pain is a feature other lines like probiotics and antidepressant medications e.g. tricyclic antidepressants may help. Of note, interval follow-up is needed. If symptoms fail to improve, the need for diagnostic testing can be considered."}, {"num": 74, "chapter": "GIT", "front": "A 50 year old man reports a 1-month history of bloody diarrhea throughout the day and night. He notes decreased appetite, nausea and vomiting, intermittent fever, and a 5 kg weight loss. There are no rashes, joint aches, or eye symptoms. He has a history of prostate cancer that was treated with radiation therapy 9 years ago. A screening colonoscopy 6 years ago was normal. He took an antibiotic 3 months ago after a tooth extraction. Physical exam is notable for pallor, aphthous ulcers, diffuse abdominal tenderness without masses; perianal exam is notable for small fissure and two external hemorrhoids; rectal exam is notable for guaiac-positive liquid stool.\n\n1. Discuss the differential diagnosis?\n\n2. How would you proceed for diagnosis?", "back": "1. This is a case of chronic bloody diarrhea with systemic symptoms in an elderly man with prior pelvic irradiation. The differential diagnosis of such case includes:\n-       Chronic inflammatory disease (ulcerative colitis and Crohn's colitis), infectious colitis (eg; c. difficile), radiation colitis, ischemic colitis or colorectal cancer.\n\n2. Inmvestigations required for this patient include:\n\n-   Laboratory: CBC, liver function tests, serum albumin, coagulation profile, ESR, or CRP.\n\no   Stool analysis for fecal leukocytes and microscopy for ova and parasites. Stool cultures for bacterial pathogens should also be obtained. Fecal calprotectin is helpful to support the diagnosis of IBD.\no   Clostridium difficile testing should be performed for this patient because antibiotics were used in the prior 3 months. Options include either a cytotoxic assay or more specifically nucleic acid amplification testing (NAAT) for bacteria in stool.\n- Endoscopic evaluation: a. Flexible sigmoidoscopy or colonoscopy (to distinguish between IBD, infectious colitis, ischemic colitis, radiation colitis or cancer) is indicated in all patients with chronic bloody diarrhea. All abnormal regions should be biopsied. b. Enteroscopy and MRI enterography may be needed when standard endoscpies are not diagnostic and small bowel pathology is still suspected."}, {"num": 75, "chapter": "GIT", "front": "A 61- year- old woman reports a 3-month history of watery diarrhea. Her symptoms started insidiously without a clear precipitant. She describes 4-7 bowel movements each day and at night, associated with mild, diffuseabdominal discomfort. She has experienced 5 kgs weight loss.\n\n1. What is the Differential Diagnosis of this case?\n2. Discuss how would you approach the diagnosis of such case?", "back": "1.     The differential diagnosis of chronic watery diarrhea (diarrhea lasting more than 4 weeks with non bloody non fatty stools) is subdivided into osmotic, secretory, and functional diarrhea.\n\na.   Osmotic diarrhea is caused by poorly absorbed substances eg; lactose intolerance, Mg containing antacids or laxatives. It stops with fasting and has a high osmotic gap (> 125mOsm/kg). Osmotic gap is determined by subtracting the estimated stool osmolality from serum osmolality {290 mOsm/L-2(stool sodium+ stool potassium)}. b.   Secretory diarrhea does not respond to fasting and result in a normal osmotic gap. These are most often non-inflammatory and may be due to chronic secretory types of infection, medications, bile acid malabsorption, microscopic colitis, vasculitis, stimulant laxatives, endocrinopathies, or tumors (vipomas). c.   Functional diarrhea: motility disorder without structural cause diagnosed by Rome IV criteria.\n\nd.   Classically inflammatory diarrhea is not categorized under chronic watery diarrhea because it typically features blood, mucosal damage and systemic signs. Microscopic colitis is an exception as it causes - watery diarrhea and is inflammatory on histology. It is a bridge between the two categories.\n\n2.    Investigations include:\n\nLaboratory:\n\nOsmotic gap. Stool examination: fecal fat quantitative and qualitative, microscopy, culture, c difficille, calprotectin, CBC, CRP, ESR, metabolic panel. Celiac serology. Hormonal assay (TSH, VIP, gastrin). Lactose breath test. Urinary HIAA for carcinoid. Endoscopic evaluation: Colonoscopy with biopsy. Upper endoscopy and duodenal biopsy for celiac. - Capsule endoscopy and enteroscopy if small bowel pathology is suspected. Imaging: Abdominal ultrasonography, CT or MRI enterography."}, {"num": 76, "chapter": "GIT", "front": "A 49 year old woman presents with several weeks of diarrhea described as 2- 5 semi-formed stools per day that are non-bloody, greasy, and foul-smelling. She is constantly \"gassy\" and bloated and notes a decreased appetite, mild fatigue, and a 4 kg weight loss over the past 2-3 months. Physical exam is notable for a thin, anxious woman whose abdomen is distended with mild epigastric and right upper quadrant tenderness. Laboratory studies are notable for an iron-deficiency anemia.\n\n1. Discuss how would you approach the diagnosis and the possible management?", "back": "1. This patient describes symptoms of steatorrhea (fatty, greasy, foul smelling stools due to fat malabsorption with weight loss).\n\nSteatorrhea is caused by either pancreatic insufficiency (eg; chronic pancreatitis, tumors, cystic fibrosis), small intestinal mucosal disorder (eg; celiac disease, giardiasis, tropical spru, Whipple's disease, small intestinal bacterial overgrowth {(SIBO), short bowel syndrome), bile salt deficiency (eg; cholestasis, cirrhosis, ileal resection or disease) or lymphatic obstruction (eg; lymphoma lymphangiectasia). Medical approach to such patient involves:\n\nSystematic assessment is to identify and treat the underlying cause. Diagnostic work up should include:\n\nStool for ova and parasites. Stool fat qualitative by Sudan stain or 72 h quantitative, Fecal elastase for exocrine pancreatic insufficiency. LFT, vitamin level, celiac serology. Breath test for SIBO.\n\no   Imaging for pancreas, liver and small intestine by abdominal ultrasound or CT scan, MRCP or ERCP for biliary obstruction.\n\no Upper endoscopy and biopsy for celiac, tropical spru or Whipple disease.\no   Colonoscopy: for ileal pathology like Crohn's disease"}, {"num": 77, "chapter": "GIT", "front": "A 76 -year- old man presents with a 6 week history of progressive swallowing difficulties, particularly of solids. He had lost 6 kg in weight. There has been no pain associated with dysphagia. He is able to drink normally. He occasionally reports regurgitation of solids. In the past he had myocardial infarction 10 years ago. He takes prophylactic aspirin therapy and oral sustained release nitrates for occasional angina. He has regularly consumed alcohol for many years and smokes 20 cigarettes per day. Examination of the mneck reveals no abnormality. There is no lymphadenopathy. Nervous system, cardiovascular system and chest showed normal findings.\n\n1. Mention the 2 most common causes for dysphagia in this patient?\n\n2. How would you proceed in such case?", "back": "1.   The 2 most common causes for dysphagia in this patient are:\n\ne   Neurological causes (oropharyngeal): The most common causes in the elderly are stroke, parkinson's disease, dementia (e.g, Alzheimer), amyotrophic lateral sclerosis and myasthenia gravis. e   Esophageal causes like: Cancer Esophagus. Esophageal stricture. Achalasia. Zencker's diverticulum. Mediastinal mass (lymphadenopathy, lung cancer, etc.) After neurological assessment, that was free in this case the first step in such patient is to exclude malignancy and other organic causes of dysphagia by endoscopy. Chest CT scan and cervical MRI are required to exclude chest or neck masses. Barium study will give an idea about possible esophageal intraluminal causes like strictures or achalasia. Esophageal manometry is needed to assess the presence of achalasia of the cardia and to detect its type."}, {"num": 78, "chapter": "GIT", "front": "A 34 -year -old gravid woman with a history of ileal Crobn’s disease presented at 30 weeks’ gestation with a 2-week history of fever up to 38.6°C, right upper quadrant pain, nausea but no vomiting. Right upper quadrant pam was constant and radiated to her back. She did not experience any changes in her bowel habits. On physical examination, she had a gravid abdomen with normal bowel sounds and significant tenderness on palpation of the right upper quadrant. Initial investigations: unremarkable urinalysis and urine culture, elevated white-blood-cell count of 12 x 10%1 with 75% neutrophils and 12% bands. Her liver function test and other metabolic profiles were unremarkable.\n\n1. Discuss the differential diagnosis\n\n2. How to reach your diagnosis?", "back": "1. The differential diagnosis includes Crohn’s disease flare, intraabdominal abscess, cholecystitis, and appendicitis.\n-   Crohn’s disease related causes: Flare of Crohn’s disease, stricture or obstruction (adhesions, inflammatory), perforation (rare, but serious), abscess, fistula, short bowel syndrome if history of resection\n-   Obstetric causes: Preterm labor,placental abruption, round ligament pain, uterine rupture (rare, especially with prior uterine surgery)\n\n-   QOther causes:\no   Appendicitis (location altered by pregnancy)\no   Cholecystitis\no   Pancreatitis\no UTI or pyelonephritis Management of this case requires multidisciplinary team (MDT) consisting of: gastroenterologist, gynecologist and surgeon. This MDT approach helps to take the appropriate decision in proper time to avoid complications. CT scan is considered the ‘gold standard’ diagnostic study for our differential diagnosis. The risk of radiation to the fetus is greatest at 8—15 weeks’ gestation, though high doses of radiation still pose a risk to the fetus throughout the second and third trimesters. Exposure of a fetus to radiation can lead to a reduction in IQ, increased risk of cancer in adulthood and increased genetic risk to future generations. MR study is considered a more safe choice in this case."}, {"num": 79, "chapter": "GIT", "front": "A 16- year -old boy presents to the outpatient department complaining of diarrhea for 6 years. He passes 4-5 large volume stools daily, which are frothy, greasy and fowl smelling, and contain undigested food material. The stools show no visible blood, mucus or pus. He has postprandial abdominal bloating, generalized weakness and easy fatigability but no abdominal pain, fever or joint pains. His parents mentioned that he is not growing well. On examination: Height 150 cm, weight 32 kg, BMI 14.2. Normal blood sugar level. He is pale with angular stomatitis and cheilitis and no apparent secondary sexual characters.\n\n1. What is the most probable diagnosis?\n\n2. Enumerate other possible causes?\n\n3. What are the investigations suggested to reach the diagnosis this condition?", "back": ". Small bowel diarrhea associated with malabsorption because of the presence of large volume, frothy, greasy, fowel smelling stool with undigested material and association with nutritional deficiency (short stature, anemia, angular cheilitis and stomatitis).\n\nPossible causes: Celiac disease, small intestinal bacterial overgrowth, parasitic infestations, Crohn's disease, lactose intolerance and chronic pancreatitis. Investigations suggested are:\n\nStool analysis: for fat content, parasites as Giardia, pus & blood indicating inflammation. CBC for anemia, IgA antiendomysial antibody and anti-transglutaminase antibody for evidence of Celiac disease. Tests for deficient nutrients: serum albumin, iron, calcium, vitamin B12 Evidence of malabsorption: 5 hours urinary D-xylose excretion, Lactose hydrogen breath test. Fecal elastase test: measures the amount of elastase, a pancreatic enzyme, in stool. It's used to assess exocrine pancreatic insufficiency (EPI). Low levels of fecal elastase can indicate EPI, which can lead to malabsorption and related symptoms like diarrhea, weight loss, and abdominal pain. Secretin test for pancreatic insufficiency. Upper endoscopy with jejunal biopsy, Capsule endoscopy helps to visualize the small bowel beyond the\n- reach of the gastroscopy.\n\nImaging studies like CT scan or MR enterography, can help to detect bowel wall edema, possible strictures or fistulae. Intestinal ultrasound has a promising role also in such cases."}, {"num": 80, "chapter": "GIT", "front": "A 25 year old female presents with a 3 months history of increasing right lower quadrant abdominal pain and non bloody diarrhea. She has lost 5 kg. She has had recurrent attacks of urinary tract infections, and a recent urine culture showed Klebsiella, E coli, and yeast. On physical examination, she is thin and pale but in no acute distress. Tender fullness is noted in the right lower quadrant without guarding or rebound. Colonoscopic findings were negative, although the endoscopist was not able to pass to the terminal ileum.\n\n1. What is the most likely diagnosis?\n2. What are the intestinal complications of this condition?\n3. What is the most appropriate test to establish the diagnosis?", "back": "1. The most likely diagnesis is Crohn’s disease (chronic non bloody diarrhea, right lower abdominal pain, with pallor and weight loss) Crohn’s disease is an idiopathic, chronic, transmural inflammatory process of the bowel that often leads to fibrosis and obstructive symptoms. It can affect any part of the gastrointestinal tract from mouth to anus.\n\n2. The major intestinal complications of Crohn’s disease are due to the transmural nature of the disease. This leads to the formation of abscesses, fistulae, sinus tracts, strictures, and adhesions, which may also contribute to obstruction.\n\n3. The most appropriate test to establish the diagnosis:\n\n-    Endoscopic     visualization (Esophagogastroduodenoscopy (EGD), colonoscopy, enteroscopy) and biopsy are essential in the diagnosis of Crohn’s disease. Endoscopic abnormaities are patchy. Aphthoid and deep ulcers and strictures are common,\n-   With negative endoscpic findings, the small intestine needs to be assessed with CT scan or MR enterography that provide added benefit of looking at structures outside the bowel lumen and, in particular, can assess for stricture, fistula or abscess.\n\n-   Capsule endoscopy is useful if small intestinal involvement is suspected but not reachable via ileocolonoscopy. It should be done after exclusion of stricture presence by MR enterography to avoid capsule retention and bowel obstruction."}, {"num": 81, "chapter": "GIT", "front": "A 28 years old male comes to the ER complaining of recurrent attacks of abdominal pain and diarrhea over the last 6 to 8 months. The recent attack is of 2 days duration. He describes his stools as frequent, with 10-12 times/day, small volume, sometimes with visible blood and mucus, it is preceded by a sudden urge to defecate. Abdominal pain is crampy, diffuse, and moderately severe, and it is not relieved with defecation. He has no other medical history and takes no medications. On examination, temperature is 38°C, Pulse 98 bpm, and BP 115/70 mm Hg. There were no oral ulcerations. Chest and heart examination is clear. His abdomen is soft and mildly distended, with hypoactive bowel sounds and minimal diffuse tenderness but no guarding or rebound tenderness. Investigations: WBC 15,800/mm3 with 82% polymorphonuclear leukocytes, Hb 10.3 g/dL, Platelet 754,000/mm3. Plain film radiograph of the abdomen shows a mildly dilated air-filled colon with a 4.5-cm diameter and no pneumoperitoneum or air/fluid levels.\n\n1. What is the most likely diagnosis?\n\n2. Mention other manifestations for this condition?\n\n3. What is your next step?", "back": "1. Inflammatory bowel disease (IBD) versus infectious colitis. Most likely IBD due to chronicity of the condition. The Hb level of 10.3 g/dl suggests chronic blood loss. Clinically grossly bloody stool is more in favour with ulcerative colitis. Ulcerative     colitis   is   associated   with    various    extracolonic manifestations, These include uveitis, pyoderma gangrenosum, pleuritis, erythema nodosum, spondyloarthropathies and primary sclerosing cholangitis. The next step is to hospitalize the patient for: confirmation of diagnosis, assess disease activity and plan to treatment.\n-   Assessment of disease activity includes clinical examination, laboratory testing, endoscopic evaluation and histopathological study of endoscopic biopsies.\n-   Stool studies: stool analysis to exclude other causes. These include evaluation of fecal leukocytes, ova and parasite, and culture for bacterial pathogens. Fecal calprotectin can help in predicting the degree of inflammation and gives an idea about disease activity, Exclusion of clostridium difficile colitis is also recommended by stool culture, nucleic acid amplification NAAT, or detection of enterotoxins.\n-   Colonoscopy: in ulcerative colitis the lesion is characterized by abnormal erythematous mucosa, with or without ulceration, extending from the rectum to part or all of the colon (pancolitis). The inflammation is uniform, without intervening areas of normal mucosa,\n-   Biopsy of the mucosa is recommended to identify the extent of the disease with respect to the thickness of the bowel wall and seek for dysplasia."}, {"num": 82, "chapter": "GIT", "front": "A 54 y old female presents with a 2 weeks history of watery diarrhea without fever., The patient reports passing 6 to 8 watery stools daily. She has nocturnal diarrhea. There is nausea but no vomiting. Patient is diabetic (type 2), and treatment was switched recently from metformin to insulin. Approximately 6 weeks before the onset of diarrhea, she received a course of ciprofloxacin for a urinary tract infection. On examination: Vital signs are normal and abdominal examination shows mild non specific tenderness. Stool studies show the presence of many leukocytes.\n\n1. What are the causes of diarrhea related to diabetes mellitus and what is the most likely diagnosis?\n2. What are investigations needed for diagnosis?", "back": "1. Causes of diarrhea related to diabetes mellitus are:\n\n-    Autonomic neuropathy affecting GIT motility.\n\n-    Small intestinal bacterial overgrowth.\n-    Metformin induced diarrhea.\n-    Celiac disease (autoimmune) in type 1 diabetes mellitus.\n-    Certain diet sweateners. This patient has significant watery diarrhea, including nocturnal diarrhea with increased fecal leukocytes indicate infectious cause. With the history of antibiotic use, Clostridium difficile infection (CDI) is the most likely (pseudomembranous colitis or antibiotic-associated colitis).\n2. The investigation: Glutamate dehydrogenase (GDH) and nucleic acid amplification testing (NAAT) have the higher sensitivity for diagnosis of CDI. If not available, three sequential stool samples should be sent for analysis by ELISA-based C.difficile stool enterotoxins. The sensitivity of combining these three tests is approximately 95%.\n-     Sigmoidoscopy is not routinely used in the diagnosis, because of risk of perforation, as mucosa of colon in such cases is very . edematous and friable. The classic appearance of 2-mm to 10-mm raised yellow nodules or detection of pseudomembrane is pathognomonic."}, {"num": 83, "chapter": "GIT", "front": "A 32 year old female has a 2 months history of fever, night sweats, watery diarrhea, a 9kg loss of weight, malaise and abdominal pain mainly in right iliac fossa. On examination: pallor with diffusely tender abdomen. Investigations: Hb 9.2g/dL, ESR 110 mm/hour, serum albumin 2.1g/dL. Contrast-enhanced CT showed thickness of bowel loops and enlarged mesenteric lymph nodes.\n\n1. What is the most likely diagnosis?\n2. Explain the sources of infection for this condition?\n\n3. Explain the localization of the site of pain to the right iliac fossa? Mention other disorders characteristically affecting this site?", "back": "1. In the presence of fever, night sweating, diarrhea, pallor, diffusely tender abdomen together with thickened bowel loops and enlarged mesenteric lymph nodes by CT scan possibility of tuberculous enteritis should be considered.\no   QGastrointestinal TB is often difficult to differentiate from other intestinal inflammatory lesions. The differential diagnosis includes also inflammatory bowel disease (Crohn’s disease) and intestinal lymphoma, The possible sources of infection of TB enteritis have been attributed to four mechanisms:\n\nSwallowing of infected sputum Hematogenous spread from active pulmonary or miliary TB Ingestion of contaminated milk or food Contiguous spread from adjacent organs. Intestinal tuberculosis often affects the ileocecal region. The affinity of mycobacterium tuberculosis for this site may be due to its relative stasis and abundant lymphoid tissue.\n\nOther disorders that are associated with lesions in the ileocecal region include Crohn'disease, cancer colon, carcinoid tumor, . intussusception, lymphoma and less commonly, infection due to Yersinia enterocolitica."}, {"num": 84, "chapter": "GIT", "front": "A 65 year old male came complaining of progressively increasing constipation since 4 months. He lost 10 kg of his weight and his wife noticed that he looks pale. On examination: no organomegaly or masses could be detected and his abdomen was lax but there was mild tenderness in the right iliac fossa. Investigations showed: Microcytic hypochromic anemia with normal liver and kidney function tests and positive stool for occult blood.\n\n1. What is your most likely diagnosis?\n\n2. Mention other commeon clinical presentations of this condition?\n3. What is your next diagnostic step?", "back": "1. Considering the age of the patient with progressive constipation and weight loss and the presence of occult blood in stools with microcytic anemia, the most likely diagnosis will be cancer colon.\n\n2. Common clinical presentations include iron-deficiency anemia, rectal bleeding, abdominal pain, change in bowel habits, and intestinal obstruction or perforation. Right-sided lesions are more likely to bleed and cause diarrhea.\n\n-   While left-sided tumors are usually detected later and could present with bowel obstruction.\n-   Nonspecific symptoms (fatigue, weight loss) are absent early in the disease course.\n-   Palpable abdominal mass, hepatomegaly (in cases of liver metastasis) and ascites could be present in advanced cases.\n3. Next step is colonoscopy. A suspicion of colorectal cancer diagnosis ~warrants rectal examination and colonoscopy with biopsy of any suspicious lesion.\n-   Serum carcinoembryonic antigen (CEA) is used for diagnosis and= follow up after treatment.\n-   Imaging in the form of CT scan and PET-CT scan to exclude distant metastasis."}, {"num": 85, "chapter": "GIT", "front": "A 61-year-old man came to the emergency room complaining of 3 days history of worsening left lower quadrant abdominal pain with nausea but no vomiting. He had mild diarrhea at the beginning of his illness, but bowel evacuation became difficult thereafter. On examination, temperature is 38°C, pulse 98 bpm, and BP 110/70 mm Hg. He has no pallor or jaundice. Chest and heart examination revealed no clinical abnormality. His abdomen is mildly distended with hypoactive bowel sounds and marked left lower quadrant tendermness with rebound tenderness. His stool is negative for occult blood. Investigations: WBC 11,800/mm3, 74% polymorphonuclear leukocytes, 22% lymphocytes, and with normal hemoglobin and hematocrit. A plain film of the abdomen showed no pneumoperitoneum and a nonspecific bowel gas pattern.\n\n1. What is the most likely diagnesis? Define this condition?\n2. What is the most appropriate next step?\n\n3. Describe treatment outlines in this case.", "back": "1. Acute Sigmoid Diverticulitis. Diverticulitis is defined as inflammation of one or more diverticulae. Fecal material or undigested food particles may collect in a diverticulum causing obstruction, erosion of the diverticular wall, resulting in inflammation, focal necrosis, and perforation. Computed tomographic (CT) scan of the abdomen will be very useful to confirm the diagnosis and to exclude pericolic abscess or other complications, such as fistula formation. Colonoscopic examination is not recommended during acute episodes due to increased risk of perforation. In general treatment of diverticulitis depends om whether it is complicated or non complicated disease. In our case it is complicated mostly by localized peritonitis, with possible pericolic abscess, so admission to the hospital for intravenous antibiotics and follow up are recommended.\n-   In cases with abscess size > 4 cm, CT guided drainage is indicated together with parenteral antibiotics.\n-   In selected uncomplicated cases oral antibiotics may be used. For example, combination of ciprofloxacin (or trimethoprimsulfamethoxazole) and metronidazole for 7-10 days.\n-   Cases complicated with perforation, emergency surgery would be recommended."}, {"num": 86, "chapter": "GIT", "front": "An 82 year old male had been admitted 4 times in the previous year with malaise, lethargy and extreme pallor. On each occasion he was found to be anemic but apart from the invariable finding of positive occult blood in stools; no definite diagnosis was made. On examination: He was pale, with no organomegaly or lymphadenopathy. Investigations showed: Positive occult blood in stools, Hb 7g/dl, serum iron 5mg/dL.\n\n1. What is the most probable diagnosis?\n\n2. What further investigations would you like to do to reach the diagnosis?", "back": "1. In elderly patient with evidence of GI bleeding, as shown by the low serum iron and hemoglobin levels with positive occult blood in stool, the first possibility is GIT malignancy (eg. gastric or colonic).\n\n-    However other causes for GI bleeding should be considered (eg: esophageal varices, gastritis or peptic ulcer, polyps, angiodysplasia). All these conditions can be aggravated with the use of oral anticoagulant or antiplatelet therapy for other comorbid conditions.\n2. Upper endoscopy and colonoscopy: If there is suspicious malignant lesion, biopsy should be taken.\n-   Abdominal ultrasonography searching for malignancy or liver deposits.\n-   Tumor markers: CEA."}, {"num": 87, "chapter": "GIT", "front": "A 65 year old female is evaluated for 12 kgs weight loss and diarrhea over the past year. She has postprandial nausea with vague diffuse abdominal pain occurring 30 minutes after eating. She avoids food for fear of pain and reports watery, slimy stools. She gives history of coronary artery disease, hypertension, peripheral vascular disease, cigarette smoking, and mild renal insufficiency. Investigations: Results of endoscopy with small-bowel biopsy and colonoscopy with terminal ileal views were unremarkable, MRA shows highgrade stenotic lesions of the proximal celiac artery and superior mesenteric artery. The pancreas and liver are normal. Serum creatinine 1.7 mg/dL.\n\n1. What is the most likely diagnosis?\n\n2. What most likely would benefit this patient?", "back": "1. This patient most likely has chronic mesenteric ischemia with postprandial pain due to limited arterial blood flow, especially when increased blood flow is needed after meals. The recurrent postprandial pain has a mid gut distribution most consistent with abdominal angina. Being smoker with hypertension and history of coronary and peripheral vascular disorders support the diagnosis. Doppler study of mesenteric vessels is simple and non invasive test, particularly in cases with impaired kidney functions.\n-   Mesenteric angtography may be needed. In such case intravenous hydration with the use of small dose or iso-osmolar contrast agents will be considered to avoid contrast nephropathy. At angiography, a decision can be made in this high-risk surgical patient as whether to proceed to angioplasty with or without stenting or surgery to bypass the proximal arterial large-vessel occlusive lesion."}, {"num": 88, "chapter": "GIT", "front": "A 68-year-old woman is evaluated for abdominal bloating and intermittent diarrhea that has been present for 6 months. Bloating improves afier bowel movement. This was associated with weight loss (5 kg during 6 months). She had medical history of permicious anemia, for which she received vitamin B12 injections monthly. There was no history of recent travel, sick contacts, or medication changes. Investigations showed: Iron deficiency anemia, normal level of vitamin B12 and folic acid. TSH level was normal. Stool microbiologic findings were negative. Upper endoscopy showed atrophic- appearing gastric mucosa. Small bowel biopsy specimens showed increased cellularity in the lamina propria. Colonoscopy, with random biopsy specimens, were negative.\n\n1. What is the most likely diagnosis? Explain the patient data?\n\n2. What.is the pathogenesis of the condition?\n\n3. What is the appropriate treatment in this case?", "back": "1.   Malabsorption mostly due to small intestinal bacterial overgrowth.\n\nPatients with achlorhydria are at risk for small intestinal bacterial overgrowth.\n\nPatient has pernicious      anemia, which is         associated with autoimmune atrophic gastritis that can lead to achlorhydria.\n\nAdvanced cases of bacterial overgrowth syndrome may manifest by malabsorption findings eg. microcytic anemia due to iron deficiency. Small intestinal bacterial overgrowth can cause histologic changes of subtotal villous atrophy, and increased cellularity in the lamina propria. Small intestinal bacterial overgrowth (SIBG) refers to a condition in which abnormally large number of bacteria (at least 100000 Colony forming unit of bacteria per ml of fluid aspirate) are present in the small intestine.\n2. Overgrowth of bacteria is capable of deconjugating and dehydroxylating bile salts leading to malabsorption. Various ctiological processes can disrupt mechanisms that keep the number of bacteria low. These include structural abnormalities (congenital or surgical) and disorders that cause decreased gastric acidity, reduced peristaltic activity, and mucosal damage or atrophy.\n3.   Treatment should be directed at:\n\nTreating the underlying cause, diet modification (eg; FODMAP\n- diet), nutritional support (vitamin B12, folate, fat soluble vitamins and iron),\n\nInitial antibiotic therapy is usually empiric and should be broad and covering both aerobic and anaerobic micro-organisms, eg Rifaximin or Levofloxacin combined with metronidazole. Patients with recurrent symptoms may need cyclical antibiotic therapy (eg, the first 5-10 days of every month) ."}, {"num": 89, "chapter": "GIT", "front": "A 42 year old female presents to the ER complaining of 24 hours of severe, steady epigastric abdominal pain, radiating to the back with several episodes of nausea and vomiting. She has experienced similar painful episodes in the past, following heavy meals but the episodes always resolve spontaneously within an hour or two. She gave no history of medications. On examination: Temp. 37.8 C, pulse 110 bpm, BP 115/75, and she has jaundice. Abdomen is lax, mildly distended with marked right upper quadrant pain and epigastric tenderness, hypoactive bowel sounds and no masses or organomegaly. Investigations: negative occult blood in stools, total bilirubin 9.2 mg/dL, direct fraction 7 mg/dL, alkaline phosphatase 285 IU/L, AST 78 1U/L, ALT 92 IU/L, serum amylase 1249 TU/L WBCs     16500/mm3,    with   82% polymorphonuclear        cells   and   16% lymphocytes. Plain film of the abdomen showed nonspecific changes.\n\n1. What is the differential diagnosis?\n\n2. What is your next diagnostic step?", "back": "L. A female patient with a past history suggestive of cholelithiasis now presents with epigastric pain and nausea for 24 hours, much longer than would be expected with uncomplicated biliary colic. Her symptoms are consistent with acute pancreatitis with obstructive jaundice.\n\nShe has hyperbilirubinemia (mainly direct) and an elevated alkaline phosphatase level suggesting obstruciion of the CBD by a stone, which is the likely cause of her pancreatitis.\n\nNext diagnostic step: Abdominal ultrasonography is the most useful initial test in determining the etiology of pancreatitis and is the technique of choice for detecting gallstones and evidence of extrahepatic biliary obstruction. Endoscopic retrograde cholangiopancreatography (ERCP) has a diagnostic and therapeutic role particularly in the presence of gall stones pancreatitis and cholangitis. Abdominal CT scanning is always indicated in patients with severe acute pancreatitis and is the imaging study of choice for assessing complications. Magnetic resonance cholangiopancreatography (MRCP): a technique to visualize the biliary tract and pancreatic ducts, particularly in doubtful cases. Endoscopic ultrasonography (EUS): accurate in stones and tumors and can be used for pancreatic cyst or abscess drainage. It’s highly recommended in cases with recurrent acute pancreatitis to exclude microlithiasis or if diagnosis is uncertain."}, {"num": 90, "chapter": "GIT", "front": "A 40 year-old male, presented with 2 months of bright red blood mixed with stools. Sometimes there was increased bowel motions (up to 4/day). There is no pain, change in appetite, weight loss or fever and is generally well. Family history: his father had significant rectal bleeding and polyps. On examination: no signs of significant blood loss. BP was 120/70 mm Hg and pulse was 80 bpm. Abdominal examination was unremarkable. Inspection of the perianal region showed no abnormalities. Digital rectal examination revealed fresh blood.\n\n1. What is the most likely diagnosis?\n\n2. What is the differential diagnosis of the presentation?\n3. What is the most important procedure for this patient?", "back": "1. In the presence of family history of rectal bleeding due to colonic polyps, the most likely diagnosis is inherited familial polyposis syndrome.\n2. The differential diagnosis of the presentation (bleeding per rectum) is:\n\no     Haemorrhoids, anal fissure, inflammatory bowel disease, diverticular disease, neoplasia (benign polyps, cancer) and angiodysplasia.\n3. In this patient, colonoscopy is the initial diagnostic procedure of choice. It is important not only for diagnosis but also for biopsy of the lesion and in periodic post surgical surveillance."}, {"num": 91, "chapter": "GIT", "front": "A 40-year-old man presenting with increased abdominal girth and fever for the past several weeks. An ultrasound scan of the abdomen reveals ascites with no evidence of cirrhosis and patent hepatic vasculature. Paracentesis reveals a protein content of 6.2g% and a serum ascites albumin gradient of 0.5, as well as 568 WBCs with 87% lymphocytes.\n\n1. What is the most probable diagnosis?\n2. What would be the most appropriate next test to help determine the diagnosis?", "back": "1. This patient likely has tuberculous ascites. Peritoneal carcinomatosus and lymphoma can be also other possibilites. Non cirrhotic patient with tuberculous peritonitis usually have ascites with high protein content, low glucose concentration, and low serum-toascites albumin gradient of less than 1.1g/dL. Patients almost always have an clevated ascetic fluid WBC count with a lymphocytic predominance.\n2. The algorithm in the evaluation of patients with high-lymphocytecount ascites includes:\n-   Cytologic evaluation of the fluid and consideration of laparoscopic biopsies, when other non invasive test results are not conclusive.\n-   Adenosine deaminase level is typically elevated in ascitic fluid of tuberculous peritonitis patients\n-   Gene expert study in ascitic fluid and serum quantiferon can confirm TB infection. If peritoneal carcinomatosis is present, the cytologic findings are positive in more than 90% of the time. In such case, tumor markers, e.g. CEA, CA 19.9,CA125 can help to identify the primary tumor origin."}, {"num": 92, "chapter": "GIT", "front": "A 23-year-old man with a history of Crohn’s disease presents with increased diarrhea, abdominal pain, fever; and increased leukocyte count. He undergoes a CT scan of the abdomen that shows intra-abdominal abscess. Subsequently, he undergoes percutaneous catheter drainage of the abscess. Four days later, he reports improvement in the diarrhea. Laboratory test results are significant for a decrease in the WBC count. However, he continues to have high output from the drain, which is his main symptom.\n\n1. What is your explanation for this?\n\n2. What is the next best step to reach the diagnosis?", "back": "1. Persistently high catheter output in this scenario raises the suspicion of a fistula.\n\n2. A catheter study performed by instilling water-soluble contrast medium through catheter under fluoroscopy is the best method to assess for internal fistula."}, {"num": 93, "chapter": "GIT", "front": "A 40-year-old man with long- standing alcohol abuse and a history of chronic pancreatitis is admitted to the hospital with mild right upper quadrant abdominal pain and jaundice for one week. His total bilirubin level is 12.2mg/dL, direct bilirubin is 9.9 mg/dL, and alkaline phosphatase is 337 IU/L. MRCP was performed and demonstrated a stricture of the distal bile duct with proximal dilatation of the upstream pancreatic duct, a lobular contour of the liver, and prominent perigastric and paraesophageal venous collaterals.\n\n1. What is the possible diagnosis?\n\n2. What is the next appropriate step in the management of this patient?", "back": "1. This patient presents with biliary and pancreatic duct obstruction in the setting of chronic alcoholic pancreatitis. The differential diagnosis of the etiology of the mass is focal chronic pancreatitis versus pancreatic adenocarcinoma arising in a setting of chronic pancreatitis.\n2. The next appropriate step would be:\n\n-   ERCP with placement of stent for biliary decompression.\n-   To differentiate between focal chronic pancreatitis and pancreatic adenocarcinoma endoscopic ultrasound (EUS) will be the investigation modality of choice. EUS has specific criteria for diagnosis of chronic pancreatitis, and in case of presence of pancreatic adenocarcinoma, it can help in tissue acquisition using fine needle biopsy.\n-   Imaging result (MRCP), EUS features (with possible fine needle biopsy) and tumor markers,e.g CA 19.9 help to make the proper diagnosis. Considers serum IgG4 in autoimmune pancreatitis."}, {"num": 94, "chapter": "GIT", "front": "A 55-year-old man is referred for evaluation for 10 kg weight loss, fatigue, weakness and small volume diarrhea of 6 months duration. He was diagnosed as insulin- requiring diabetes mellitus 1 year ago. On physical examination he appears wasted. A raised, scaly erythematous rash is observed over the buttocks, inner thighs and groins. Laboratory examination is significant for anemia (hemoglobin, 9g/dL). CT scan of abdomen revealed a large pancreatic mass with hepatic metastasis.\n\n1. What is the most likely diagnosis?\n\n2. What will be the next diagnostic step?", "back": "1. Patient history, examination and workup have many points that could help to reach diagnosis of pancreatic neuroendocrinal tumor(NET), particularly glucagonoma. These points include:\n\n-   Presence of pancreatic mass in abdominal CT\n-   Glucose intolerance, weight loss, and anemia are also common in these patients.\n-   The rash described in this patient is characteristic of (necrolytic migratory erythema) that is associated with glucagonoma. It typically develops in the intertriginous areas of the body (eg., groins, axillae) as a raised scaly rash that eventually forms bullae that burst and crust over. Hyperpigmentation results after healing of the lesions.\n\nOther less likely   NETs include insulinomas and Vipomas\n\n-   Patients with insulinoma present with syncope, sweating, and hypoglycemia.\n\n-   Vipomas are associated with severe watery diarrhea. Patients with Zollinger- Ellison syndrome typically presents with peptic ulcer disease and severe reflux disease, diarrhea is not uncommon.\n\n2. The diagnosis is confirmed by: demonstrating an increased plasma glucagon level. A plasma glucagon level > 500 pg/ml is considered diagnostic of glucoganoma.\n-   CT scan abdomen or endoscopic ultrasound fine needle biopsy can help in tissue diagnosis. Somatostatin receptor scintigraphy can help for assessment of disease activity and distant metastasis. Other diseases causing increased plasma glucagon levels include renal insufficiency, acute pancreatitis, hypercortisolism, hepatic insufficiency, prolonged fasting, or familial hyperglucagonemia."}, {"num": 95, "chapter": "GIT", "front": "A 22-year-old female with ulcerative colitis is presenting with 10—12 bloody stools/day, fever (38.9°C), and hypotension after recent antibiotics. Stool PCR is positive for C. difficile toxin.\n\n1. List three differential diagnoses.\n\n2. What are the essential investigations to be required?\n\n3. Define the stepwise management approach.", "back": "1. Differential Diagnoses include:\n\n-     Ulcerative colitis flare with C. difficile coinfection (most likely).\n\n- -    CMV colitis.\n\n-    Bacterial dysentery (e.g., Shigelia).\n2. Essential Investigations to be requested include:\n-     Sigmoidoscopy with biopsy to assess inflammation and to rule out\n- CMV infection\n-    Abdominal X-ray to exclude toxic megacolon\n\n-    Blood cultures to rule out sepsis.\n\n3. Stepwise Management outlines are\n1. Treat C. difficile: Oral vancomycin and/or IV metronidazole as both choices represent first-line therapy for severe C. difficile treatment.\n1. Hold immunosuppressants until infection is controlled.\n2. Ulcerative colitis flare: TV steroids (methylprednisolone) if no improvement post-infection.\n\nBiologics (e.g., infliximab) for steroid-refractory cases, after exclusion of active infection."}, {"num": 96, "chapter": "GIT", "front": "A 68-year-old male, presents to the emergency department with left lower quadrant abdominal pain, low-grade fever, and altered bowel habits for the past three days. He reports occasional constipation and bloating. On examination, he has localized tenderness over the left iliac fossa without signs of peritonitis. Blood tests show mild leukocytosis and elevated CRP. Based on his clinical presentation, a diagnosis of sigmoid diverticulitis is made.\n\n1. List two complications of diverticulitis that may require surgical intervention?\n\n2. Identify two key lifestyle modifications that can help prevent recurrent diverticular disease episodes?", "back": "1. Two complications of diverticulitis that may require surgical intervention:\n\n-   Perforation with peritonitis\n-   Fistula formation (e.g., colovesical fistula) e   Other potential complications include large abscess not suitable for percutaneous drainage, bowel obstruction, or recurrent diverticulitis with strictures.\n2. Two key lifestyle modifications to help prevent recurrence:\n\n- Increase dietary fiber (fruits, vegetables, whole grains)\n- Regular physical activity to support bowel health\n\nAdditional measures include adequate hydration, weight loss, and avoiding smoking,"}, {"num": 97, "chapter": "GIT", "front": "A 56-year-old female presents with weight loss, loose motions and flushing that deteriorated over the last six months. She experienced 4 daily attacks of diarrhea with intermittent flushes and has lost approximately 6 kg in weight over this period. She passed through menopause over the last five years but was untroubled at that stage. She is non smoker with no current medication intake.\n\nOn examination, she has a BMI of 28.1 kg/m?, pulse of 80 bpm and a blood pressure of 128/78 mmHg. Auscultation of the chest reveals expiratory wheezes. Examination of the abdomen reveals 4 cm hepatomegaly. Investigations reveal: CBC, urea, AST, ALT gamma GT, sodium, potassium, FT4 and TSH are in the normal range. Random plasma glucose 87 mg/dl, Hb Alc 5.2%, alkaline phosphates 128 U/L (60-110), Estradiol 63 pmol/L (120- 800), LH 55 U/L (postmenopausal > 40) FSH 88 U/L (postmenopausal > 50). Abdominal ultrasonography: hepatomegaly with multiple focal lesions consistent with hepatic metastasis.\n\n1. What is the most appropriate diagnosis? What are other differential diagnoses?\n\n2. What is the test needed to reach this diagnosis?\n\n3. What is the most appropriate therapy for this patient?", "back": "1. The most likely diagnosis in this patient is carcinoid syndrome as reflected by the symptoms and signs (diarrhea, intermittent flushes, weight loss, chest wheezes).\n\nNormal blood glucose excludes the possibility of diabetes as the cause of weight loss. Normal FT4 and TSH exclude the possibility of hyperthyroidism as the cause of weight loss and loose stool. The patient has postmenopausal LH, FSH and estradiol and intermittent flushes which are well known menopausal symptoms. However, diarrhea and chest wheezes are not explained by menopause. Investigation:\n\n24 hour - urinary hydroxyindoleacetic acid (HIAA) which will be elevated in carcinoid syndrome. Imaging for tumor localization and staging: triphasic CT scan, MRI and somatostatin receptor scintigraphy. Functional imaging 68-gallium positron emission tomography (PET) The most appropriate therapy would be:\n\nSomatostatin analogues which are demonstrated to improve symptoms and prognosis. Surgical intervention is likely to be inappropriate because of the presence of hepatic metastases. Hepatic artery embolization would not be considered unless somatostatin receptor therapy was unable to control symptoms."}, {"num": 98, "chapter": "GIT", "front": "A 24-year-old woman was referred from the endocrinology clinic for a gastroenterologist opinion. She had been treated for hypothyroidism for 12 years, but she remained persistently tired, despite adequate thyroxine replacement therapy. She reported a long history of tiredness, accompanied by headaches, joint pains, blisters on her face, and occasional mouth ulcers. Gastrointestinal symptoms included abdominal bloating and occasional vomiting. She was taking anticholinergics, sulpride and carbon tablets for her GIT symptoms. Her mother had diabetes mellitus, and her father and grandfather both had bowel cancer in their sixties.\n\nPhysical examination was unremarkable. Investigations: Hb 9.2 g/dL, WBC 6.100 /dL /1, platelets 279.000 /dL, MCV 76fL. Serum ferritin 6ng/L (N 15— 200 ng/ml), plasma folate 4.9 (N 2-20 ng/mL), serum vitamin B12 700 (N 200 to 900 pg/mL). TSH 1.6 wU/ml (N 0.4-4.4 pU/ml) free-T4 2.3 ng/dL (normal range 0.8 -2.8 ng/dL). Serum albumin 4.7 g/dL, Ca 7.9 mg/dL, fasting glucose 90 mg/dL. Liver function tests were normal. Endomysial antibody IgA: negative. IgA <5 mg/dl (N 80 - 350 mg/dl)\n\n1. What is the diagnosis? Justify?\n\n2. What are your next step investigations?\n\n3. What is your initial management?", "back": "1. Celiac disease is the most likely cause: Celiac disease is an autoimmune disease and is characterized by Gluten intolerance and antibodies against ghuten and total villus atrophy of small intestine resulting in diarrhea, bloating and colics with disappearance of these symptoms if gluten containing diet is restricted. Celiac disease is associated with other autoimmune diseases as           Type   1   diabetes, autoimmune thyroid disease, skin diseases as dermatitis herpetiform and atopic dermatitis, Among those autoimmune condition: autoimmune thyroiditis, dermatitis herpitiformis exist in this case. GIT micronutrient absorption may be the main presenting features of the disease as iron deficiency anemia (low ferritin) or hypocalcemia as this case.\n\nIgA deficiency is another feature of the disease explaining the negative endomysial antibody IgA in this case.\n\n2. Next step investigations:\n\n-   Anti-tissue transglutaminase antibody IgA and IgG together with Endomysial antibody IgG may be helpful screening tests.\n-   Upper GIT Endoscopy or enterscopy and biopsy to show total villus atrophy.\n-   Serum 25 -OH vitamin D.\n3. Initial management:\n\n|      -   Gluten free diet\n-   Vit D3, calcium and iron replacement.\n\n-   Follow up upper GIT endoscopy to confirm intestinal mucosal recovery."}, {"num": 99, "chapter": "Hepatology", "front": "44 vyears old Egyptian male patient discovered accidentally to have HCV antibodies during blood donation. Laboratory: serum ALT 17 U/L, AST 15 U/L, total bilirubin 0.9 mg/dL, direct 0.3 mg/dL, albumin 4.5 mg/dL, PC 100% (INR 1). CBC and creatinine are within normal range. HCV PCR 20800 IU/ml Genotype 4, HBsAg was negative. Abdominal ultrasound was normal.\n\n1. Is this patient candidate for treatment?\n\n2. What are the goals and endpoints for treatment?\n\n3. What is the recommended drug regimen for this patient?", "back": "1. All patients with HCV infection must be considered for therapy, including treatment-naive patients and individuals who failed to achieve sustained viral response (SVR) after prior treatment.\n\n2. The goal of therapy is to cure HCV infection, in order to: (i) prevent the complications of HCV-related liver and extra-hepatic diseases, including   hepatic  necro-inflammation, fibrosis and cirrhosis, decompensation of cirrhosis, HCC, extra-hepatic manifestations (ii) improve quality of life prevent transmission of HCV.\n\nThe endpoint of therapy is undetectable HCV RNA in serum or plasma by a sensitive assay (lower limit of detection <15 IU/ml) 12 weeks (sustained virologic response SVR12) or 24 weeks (SVR24) after the end of treatment.\n3. The following regimens are recommended for the treatmemt of patients infected with genotype 4 including Treatment-naive patients without cirrhosis or with compensated (Child-Pugh A) cirrhosis:\n\n-   The fixed-dose combination of sofosbuvir (400 mg) and velpatasvir (100 mg) in a single tablet administered once daily.\n-   The fixed-dose combination of glecaprevir (300 mg) and pibrentasvir (120 mg) in three tablets containing 100 mg of glecaprevir and 40 mg of pibrentasvir, administered once daily with food.\n-   The fixed-dose combination of sofosbuvir (400 mg) and ledipasvir (90 mg) in a single tablet administered once daily.\n\n-   The fixed-dose combination of grazoprevir (100 mg) and elbasvir (50 mg) in a single tablet administered once daily."}, {"num": 100, "chapter": "Hepatology", "front": "A 47 year old, female patient married known to be infected with HCV for 10 years which was complicated with liver cirrhosis. The patient had no history of hematemsis or hepatic encephalopathy. She presented to the hepatology clinic for HCV treatment\n\n1. What is the next step?\n\n2. Ts this patient candidate for HCV treatment?\n\n3. Is there a need for post sustained virologic response (SVR) surveillance?", "back": "1. Assessment of liver cirrhosis for severity (Child-Pugh stage) and complications including:\n-   Clinical: stigma of liver cell failure\n\n-   Laboratory: CBC, liver function, PT&PC, molecular assays to confirm, detect or quantify HCV RNA, alpha fetoprotein, serum creatinine. HBsAg to exclude co-infection with hepatitis B.\n-   Abdominal ultrasonography and upper endoscopy for esophageal varices.\n\nRegimens recommended for the treatment of patients infected with genotype 4 including Treatment-naive patients without cirrhosis or with compensated (Child-Pugh A) cirrhosis are the same.\n-   Sofosbuvir/velpatasvir.\n-   Glecaprevir/pibrentasvir.\n-   Sofosbuvir/ledipasvir.\n-   Grazoprevir/elbasvir. The use of protease inhibitors is contraindicated in patients with ChildPugh B and C decompensated cirrhosis, because of substantially higher drug exposure, which is associated with toxicities in these patients. . If this patient achieved sustained virological response, post-treatment surveillance for HCC, by abdominal ultrasound and AFP, must also be performed in patients with advanced fibrosis (METAVIR score F3) and cirrhosis."}, {"num": 101, "chapter": "Hepatology", "front": "A 30-year-old female with vitiligo and hypothyroidism presents with jaundice, arthralgia, and elevated IgG (2,200 mg/dL). She presented to hepatology clinic for elevated liver enzymes with ALT 480 U/L and negative viral serology.\n\n1. What is your differential diagnosis?\n\n2. What are the confirmatory tests for diagnosis?\n\n3. What are the possible complications and initial treatment lines?", "back": "1. Differential diagnoses includes: autoimmune hepatitis (ATH), druginduced liver injury and primary biliary cholangitis (PBC). Elevated IgG and autoimmune disease history strongly favor AIH. Negative viral serology excludes hepatitis; no recent drugs argue against drug-induced liver injury, No pruritus/ AMA negativity makes PBC unlikely.\n\nConfirmatory tests include:\n\nANA/ASMA antibodies (positive in 80% of ATH). Other autoantibodies may be required eg; anti-LKM and anti- soluble liver antigen/ liver pancreas antigen (SLA/LP). Liver biopsy shows interface hepatitis (inflammatory cells at portal- | parenchymal junction), that are considered pathognomonic for AIH. Complications include:\n-   Those of disease itself, like progression to cirrhosis or HCC or complications related to treatment, particularly steroids, like steroid induced osteoporosis. Bone density monitoring and calcium/vitamin D supplementation mitigate osteoporosis risk. Initial treatment lines include steroids in the form of prednisone (40-60 mg/day) according to body weight induction dose, then maintenance\n- 20mg/day. Azathioprine can be added to maintain steroid effects and help in their withdrawal as soon as possible. The treatment must be continued despite normal liver function. Budesonide may be used instead of prednisone, combination with azathioprine is alternative. Close monitoring for relapse and side effects is recommended."}, {"num": 102, "chapter": "Hepatology", "front": "A 54-year-old female patient, known to have chronic HCV was treated with direct acting anti-viral and achieved sustained viral response (SVR) two years ago. She complained of progressive palpable purpura of both lower limbs along with lower limb edema, facial puffiness and oliguria. BP is 150/95. Chest and cardiac examinations were normal. There was no clinical evidence of ascites or manifestation of liver cell failure. Investigations: Hb 10 g/dl, serum creatinine 2.4mg/dl, blood urea 85 mg/dl, serum albumin 3.5g and, INR 1.4.\n\n1. How to approach this case and how to treat?", "back": "1. Patient is known HCV and responded to treatment but presented with puffiness of face, edema of lower limbs, vasculitic skin lesions and elevated serum creatinine. In such case, renal affection secondary to HCV with cryoglobulinemia should be considered (one of extrahepatic manifestations of HCV infection). HCYV can be associated with autoimmune diseases such as:\n\n-   Mixed cryoglobulinemia\n\n-   Membranoproliferative glomerulonephritis\n-   Autoimmune thyroiditis, and lymphoproliferative disorders. In general the extrahepatic manifestations of virus C occur in patients with +ve HCV PCR, however few cases have been reported after treatment and sustained viral response.\n\nThe approach for diagnosis of HCV-associated cryoglobulinemia is:\n\n- Urine analysis, albumin/creatinine ratio\n- An increased rheumatoid factor activity and low serum complement C4 are classic features in such case.\n- Repeat PCR for HCV
