tation is consistent with Neuropsychiatric Lupus (NPSLIE), specifically Lupus Cerebritis.\n\nSupporting Features: ]  History of SLE symptoms (joint pain, fever) prior to admission. &  Initial presentation with seizures and altered sensorium. D  CSF with lymphocytic plescytosis, elevated protein, and negative ADA — suggests aseptic meningitis or autoimmune etiology. MRI and CSF are more reliable than CT, which was normal. Pericardial effusion and pleural effusion support systemic SLE flare. Dramatic deterioration upon steroid withdrawal suggests a steroidresponsive autoimrune process (likely lupus cerebritis). @   Normal sepsis markers (CRP, procalcitonin), ruling out infection. Differential Diagnoses to Rule Out: -] Infective causes: Bacterial,    TB    meningitis,    viral       encephalitis (unlikely with negative CSF findings and no pathogen).             « Steroid withdrawal or adrenal insufficiency — but not likely given the convulsions. Thrombotic     thrombocytopenic      purpura    (TTP)       —     must be considered in SLE with CNS signs and anemia. Antiphospholipid syndrome (APS) — microthrombi in CNS can cause seizures, strokes.                           | Metabolic causes — but labs don't support derangement, Drug toxicity — especially NSAIDs or steroid-induced psychosis. Recommended Investigations: @ MRI brain — preferred over CT, more sensitive to detect white matter lesions or infarcts. EEG — if ongoing seizures or altered consciousness. ANA, anti-dsDNA, antiphospholipid antibodies (aPL, lupus anticoagulant, anticardiolipin). CSF anti-neuronal and anti-NMDA antibodies — if autoimmune encephalitis suspected. ESR, CRP, renal and liver function tests."}, {"num": 248, "chapter": "Rheumatology", "front": "You are consulted from the surgical ward of your hospital to evaluate a 70- year-old man whose right knee suddenly became painful and swollen five days after coronary bypass surgery. The patient was diagnosed with gout oneyear ago and kept on allopurinol 100 mg/day. He is diabetic and hypertensive. On physical exam, his right knee is warm and swollen with limited range of active and passive movement. The overlying skin is normal. Body temperature is 38.7°C. Laboratory examinations performed show a Jeukocyte count of 13.2 x10%/L, elevated C reactive protein and ESR. The serum creatinine and uric acid were within normal range. You consider acute gout as a possible diagnosis.\n\nWhy do you suspect acute gout in the differential diagnosis? RN\n\nHow can you confirm your suspicion?\n\nWhat is the other diagnosis you should exclude? Why? and how?\n\nWhat is the significance of the serum uric acid levels im this B\n\nsetting?\n\nWhat management strategies will you suggest? e\n\n6. What is your action plan regarding allopurinol?", "back": "1. The patient is known to have gout, DM and Hypertensive. He presented with monoarthritis following surgery. Surgery is a known risk factor that may precipitate an acute gouty attack. Joint aspiration and synovial fluid analysis using polarized microscopy: A diagnosis of gout is confirmed by the presence of negatively birefringent monosodium urate crystals.\n\nThe other diagnosis septic arthritis is a real possibility. The patient is febrile, presented with acute monoarthritis and has leukocytosis. Analysis of synovial fluid including TLC, culture and sensitivity must be made. The crystal arthritis can also produce elevated body temperature (more likely if the affected joint is large, like in this man) and mild leukocytosis. Crystal arthritis may coexist with bacterial arthritis. Serum uric acid may fall (may be misleadingly low during attacks of gout), or be elevated Management:\n\n-       Treatment of acute attack includes:\n\ne     NSAIDs should be avoided as they can exacerbate hypertension. In addition, they may put this patient at high risk of gastrointestinal bleeding. Cyclo-oxgenase-2 (COX-2) selective NSAIDs such as etoricoxib and celecoxib have better gastrointestinal profiles but should be used cautiously in patients with pre-existing cardiovascular disease.\n\ne     QOral colchicine is an alternative treatment,\n\ne     Intra-articular steroids can help settle the acute inflammatory symptoms specifically        in     this   patient   presenting   with monoarthritis.\n6. Regarding allopurinol: as the patient is already on allopurinol, it can be continued during the acute attack without changing the dose."}, {"num": 249, "chapter": "Rheumatology", "front": "A 21-year-old patient presented with gradual onset progressive low backache of 8 months duration. One year before this presentation, he suddenly suffered from painful redness of his right eye, associated with photophobia that was treated for two months by eye drops. His cousin, aged 18 years also suffers from backache.\n\n1. What is the provisional diagnosis?\n\n2. What other data are missing from the history & clinical examination you need to reach a proper diagnosis?\n3. What is your plan to manage this case?", "back": "1. Seronegative spondyloarthropathy.\n\n2. Inflammatory back pain that is increased by rest and relieved by exercise and its duration, preceding trauma, pain in the enthesis, any history of psoriasis or any other skin lesions, history suggestive of inflammatory bowel disease (IBD), preceding history of GIT or urinary infections (reactive arthritis or Reiter’s syndrome) and history of oral ulcers.\n\nExamining the patient, T would stress on examining spinal stiffness, limited mobility, sacroiliac joints and the enthesis and check on chest expansion. Search for hidden areas of psoriasis in the skin, pyoderma gangrenosum of irritable bowel disease (IBD), circinate balanitis and keratoderma blennorrhagica of Reiter’s syndrome.\n\n3. Laboratory study will include CBC, ESR, CRP, HLAB?27.\n-   X-ray and MRI of lumbosacral spine and both sacroiliac joints.\n\n-   Treatment: Treatment for Ankylosing Spondylitis (AS) focuses on managing symptoms, slowing disease progression, and improving quality of life, as there is no cure. This involves a combination of physical therapy, exercise, medication, and lifestyle modification Medications:\n\ne   Nonsteroidal Anti-inflammatory Drugs (NSAIDs): These help reduce pain and inflammation.\n\ne   Anti-TNF Bioclogics: For those who don't respond well to NSAIDs, these drugs can help reduce inflammation.,\n\ne   JL-17 imhibitors: alternative to TNFoa-inhibitors\n\ne   JAK Inhibitors: Another class of medication used for AS, especially if anti-TNF drugs are not effective or tolerated."}, {"num": 250, "chapter": "Rheumatology", "front": "A 30-year-old female presented at the out clinic after experiencing fever, dysuria and frequency of urine for 5 days. For which she had received successful treatment. Three weeks later she developed arthritis of both ankle and sacroiliac joints. On admission, the temperature was 38°C, pulse 115 /min, and BP110/70 mmHg. Physical examination revealed swelling and tenderness of left ankle joint and on left sacroiliac joints. Other joints were normal. Other systemic examinations were normal. Cardiac auscultation was normal.\n\nLaboratory studies showed Hb 12.8 g/dL, WBC 12,860/mm?>, platelet count 573,000/mm?, ESR 70 (0 to 15) mm/hr., and CRP 3.97 (0 to 0.5) mg/dL. Liver and renal functions were normal. Venereal disease research laboratory tests and ANA were negative. Urine analysis revealed pyuria. However, urine culture was negative. Synovial fluid aspiration from left ankie revealed severe inflammation, with gram stain and synovial fluid culture were negative. Radiographs of the ankle joint showed only soft tissue swelling, without any visualization of enthesopathy or erosive joint damage.\n\n1. What is the possible cause of this arthritis?\n\n2. What is the treatment?", "back": "1. Considering the clinical features, the preceding symptomatic of UT infection, diagnosis of reactive arthritis is considered. Reactive arthritis is a sterile synovitis triggered by a distant infection of the genitourinary or gastrointestinal tract. Patients with reactive arthritis generally have asymmetrical oligoarthritis usually of lower limb joints that last at least 1 month, as well as 1 or more of the following features: urethritis, eye involvement (conjunctivitis or uveitis), mouth ulcers, balanitis, or radiographic evidence of sacroiliitis, enthesitis or dactylitis.\n2.   Treatment:\n\nNon-steroidal anti-inflammatory drugs are the initial treatment of choice. Intra-articular or local glucocorticoids, as in cases of enthesitis or bursitis, can be wused if the patient has mono/oligoarthritis. Low-dose prednisone may be prescribed. Disease-modifying antirheumatic drugs (DMARDs), including methotrexate and sulfasalazine, are effective in managing chronic arthritis cases that do not respond to NSAIDs. Antibiotics should be given to treat the underlying active infection. Prognosis: reactive arthritis is usually self-limited that resolves within 3 to 5 months. Patients with symptoms lasting longer than six months are considered chronic arthritis and require sustained treatment. The presence of hip involvement, unresponsiveness to NSAIDs, and ESR greater than 30 portend a worse outcome."}, {"num": 251, "chapter": "Rheumatology", "front": "A 28-year-old woman presents to the Emergency department with an acute onset of diffuse right lower limb swelling. one year ago, she suffered from repeated attacks of unilateral headache relieved by analgesics. She has been married for 4 years and has no children. Although she got pregnant three times, they all ended up with abortions. On examination; mild fever 37.7°C, diffuse swelling of the right LL extending to the thigh.\n\n1. What is your provisional diagnosis?\n\n2. What investigations would be most helpful in this case?\n\n3. What is your plan to treat this lady?", "back": "1. A female patient with symptoms suggestive deep vein thrombosis (hypercoagulable state) and repeated abortions, one should consider antiphospholipid syndrome either primary or secondary to SLE. The headache (migraine) is one of the symptoms related to this syndrome.\n\n2. Investigations are: —    Doppler study on venous system of lower limb to confirm DVT.\n-   ESR, CBC.\n-   PT, PTT both may be prolonged in antiphospholipid syndrome —   Serological study: ANA, ENA, anticardiolipin Ab (IgM, IgG), lupus anticoagulant and anti-B, glycoprotein I (IgG, IgM).\n3. Anticoagulant for DVT, low molecular weight heparin (LMWH) 1mg/kg every 12 hours followed by vitamin K antagonist (warfarin) with target INR 2-3. When she becomes pregnant, the patient will be shifted from warfarin to therapeutic dose of LMWH. Following up of this patient is very important, as may develop new thrombosis in future either venous or arterial."}, {"num": 252, "chapter": "Rheumatology", "front": "A 40-year-old lady presented with a two-month history of progressive difficulty in hanging out her washing and climbing out of a chair as well as progressive dyspnea four months ago. She noticed a skin rash m the sun exposed area. On examination, there was heliotrope rash. She had marked weakness of her neck and proximal muscles. Reflexes and sensations were normal. No other abnormality was detected on examination. Hb 10.4 g/dl, MCV 85fL, WBCS 6.6 x10°/L, Platelets 180 x10°/L, ESR 60 mm/h. TSH, calcium and phosphorus were normal. Rheumatoid factor and ANA were negative. Chest X ray was also normal.\n\n1.   What is the most likely diagnosis?\n\n2.    Give three investigations to confirm diagnosis?\n3.   How would you treat this condition?", "back": "1.   The diagnosis is dermatomyositis, an idiopathic inflammatory myopathy with characteristic cutaneous findings. There is high association between dermatomyositis and malignancy, so malignancy in this case should be excluded. Muscle enzymes creatine kinase, aldolase, aspartate aminotransferase [AST], lactic dehydrogenase [LDH]) are elevated. An abnormal finding on electromyography, MRI muscles with abnormal signals of the affected muscles and muscle biopsy.\n\nGoals of Therapy:\n\ne   Control muscle inflammation and improve strength and Manage skin manifestations e   Screen and manage associated malignancy and interstitial lung disease (ILD)\n\nFirst-line Therapy:\n\no   High-dose corticosteroids (e.g., prednisone 1 mg/kg/day) — for muscle inflammation, May start with I'V methylprednisolone in severe cases\n\nSteroid-sparing agents (early introduction recommended):\n\ne   Methotrexate,       Azathioprine,        Mycophenolate         mofetil, Cyclophosphamide (especially if ILD is prominent) e   IVIG — for severe or refractory cases, or when rapid response is needed (c.g., dysphagia)\n\nSkin Disease-Specific Management:\n\ne   Sun protection: Avoid sun exposure, use broad-spectrum sunscreens\n\ne   Topical corticosteroids or calcineurin inhibitors (e.g., tacrolimus for facial rash)\n\no   Antimalarials: Hydroxychloroquine for cutaneous involvement\n\nCancer Screening:\n\ne   Especially in adults >40: Use age-appropriate screening, with CT chest/abdomen/pelvis, mammography, pelvic exam, and possibly PET-CT"}, {"num": 253, "chapter": "Rheumatology", "front": "A 28-year-old lady suffered two years ago from Raynaud’s phenomenon and heartburn. She started to complain of pain in her fingers, particularly at night. On examination, she had thickened shiny skin over her fingers. Hard nodules were palpable beneath the skin of several digits. Telangiectasia was detected on her face and fingers. Mouth opening was limited. Then dyspnea developed and was progressive with central cyanosis on examination and high pulmonary component of second sound, S3 was audible. Bilateral basal pulmonary inspiratory crepitations. Tender hepatomegaly and lower limb edema were detected.\n\n1.    What is the provisional diagnosis?\n\n2.     Explain the cause of dyspnea and central cyanosis in this case?\n\n3.    Mention three other systems affected by this condition?", "back": "1.   The diagnosis is systemic sclerosis/scleroderma. Scleroderma is a widespread connective tissue disease that involves changes in the skin, blood vessels, muscles, internal organs and immunologic disturbances accompany these {indings.\n\nThe cause of dyspnea and central cyanosis is interstitial lung disease associated   with   systemic   sclerosis   and   /or   pulmonary   arterial hypertension (PAH) Due to vascular remodeling of pulmonary arterioles that are complicated with Cor pulmonal.\n3.   Other systems that could be affected in scleroderma are: The      gastrointestinal  tract   mainly       esophagus      causing gastroesophageal reflux due to incompetence lower esophageal sphincter and decreased or absent peristalsis in the lower two thirds of the esophagus. Kidney: Renal hypertension and chronic renal           failure, Risk of scleroderma renal crisis (SRC) which                  may lead to microangiopathic hemolytic anemia\n\nMuscular system causes arthralgia, myalgia, loss in joint range of motion and joint flexion contractures."}, {"num": 254, "chapter": "Rheumatology", "front": "A 56-year-old diabetic gentleman presented in the emergency room with acute agonizing onset pain in the left forefoot. One week before this presentation the patient was discovered as hypertensive and was prescribed thiazide. Examination revealed swollen red tender left foot extending to the ankle with limitation of movement.\n\n1.   What is your differential diagnosis?\n\n2.   What are the investigations you need to reach a proper diagnosis?\n3.   Would you like to recommend another antihypertensive for this gentleman and why?\n\n4.   How to treat such a patient?", "back": "1. The most probable diagnosis is acute gouty arthritis, precipitated by recent thiazide intake. Other possibilities are septic arthritis, cellulitis, pseudogout (CPPD crystal arthritis) — though more common in knees and elderly and trauma-related hemarthrosis (if unnoticed)\n2. The investigations are: Laboratory tests: -CBC with differential: Leukocytosis suggests infection\n- ESR and CRP: Elevated in inflammatory or infectious conditions — Serum uric acid: May be elevated but can be normal in acute attacks ~ Renal function tests (urea, creatinine):\no       Joint fluid analysis (if effusion present): —       Polarized light microscopy:\no       Negatively birefringent needle-shaped urate crystals — Gout\no       Positively birefringent rhomboid-shaped crystals — Pseudogout\no       Cell count and differential: High WBC (>50,000/uL) suggests septic arthritis -Gram stain and culture: Rule out septic arthritis Imaging: — X-ray of foot and ankle: Look tor joint erosion, tophi, chondrocalcinosis\n- Musculoskeletal ultrasound: Can detect effusion, double contour sign\n3. Yes. Thiazide diuretics should be discontinued as they raise uric acid levels and can precipitate gout flares. Recommended alternatives in a diabetic patient: ACE inhibitors (e.g., enalapril) or ARBs (e.g., losartan) 4, Treatment: If gout is confirmed: e      NSAIDs (e.g., naproxen or indomethacin) — if no contraindications\no      Colchicine, Corticosteroids — oral or intra-articular if NSAIDs/colchicine are contraindicated e      Discontinue thiazide diuretic\no      Rest and elevation of the affected limb If septic arthritis: Urgent joint aspiration and IV antibiotics (guided by gram stain/culture)\no      Possible joint drainage/surgical washout, Hospital admission likely If cellulitis: e«       Empiric antibiotics covering gram-positive cocci (e.g., flucloxacillin or cefazolin)"}, {"num": 255, "chapter": "Rheumatology", "front": "A 70-year-old woman with known diabetes mellitus presents to the emergency department with pain and swelling of the right knee joint for the preceding 24 hours. She has developed a fever. She received paracetamol 500 mg bid since yesterday. She denies any history of trauma. Five years ago, she complained of infrequent mild chronic aching pain in both her knee joints. On examination, her temperature was (37.1°C), a pulse rate of 74/min blood pressure of 140/80 mmHg. Her right knee joint is swollen and tender with a moderate effusion and limitation of movements. Other joints are normal, except for the presence of Heberden's nodes in the second, third and fifth fingers of both hands.\n\nWhat is the most likely diagnosis? What are the risk factors for this disease? o\n\nWhat joints are affected by this disease?\n\nWhat are the investigations needed for diagnosis? S\n\nHow to treat such 2 case? A", "back": "1.   The diagnosis is osteoarthritis complicated by septic arthritis or pseudogout.\n\n2.   The risk factors for osteoarthritis are:\n\n-     Increasing age, female sex.\n-     Obesity, DM, trauma\n-     Genetic factor, metabolic disorder (e.g., calcium/phosphate imbalance)\n3.   The joints that are affected predominantly by osteoarthritis are the weightbearing joints, including the knees, hips, cervical and lumbosacral spine. Other commonly affected joints include the distal interphalangeal (DIP) and proximal interphalangeal (PIP) joints of the hands, also first carpometacarpal joint (thumb base) and first metatarsophalangeal joint\n\n4.   Osteoarthritis can usually be diagnosed on clinical grounds. The history and physical examination findings are sufficient.\n\n- Radiographic findings confirm the initial impression and laboratory values are typically within the reference range. X ray of knee joint showed joint space narrowing, subchondral sclerosis {increased      bony formation around the joint), subchondral cyst formation, and osteophytes. Plain films may not correlate with the findings on physical examination or with the degree of pain. — The history of fever needs exclusion of septic arthritis and pseudogout by the following investigations; — Peripheral leukocytic count, ESR, CRP, blood cuiture.\n- Aspiration of the knee effusion and examination by polarized          light microscopy for calcium pyrophosphate crystals (pseudogout), urate crystals (gout). Microscopic examination for WBCs. Gram stain and culture of synovial fluid to exclude septic arthritis. If osteoarthritis only:\n\nPain comntrol: Acetaminophen, topical NSAIDs (first line), Oral NSAIDs Nonpharmacologic: Physical therapy and strengthening exercises, Weight loss, Walking aids if needed\n-     -In Advanced cases: Intra-articular corticosteroid injections. Consider total knee replacement for severe joint destruction\n-     -Hf septic arthritis: Urgent joint aspiration and IV antibiotics, Hospital admission, Possible arthroscopic washout\n-     -If psewdogout: NSAIDs or colchicine, Intra-articular corticosteroid injection may help"}, {"num": 256, "chapter": "Rheumatology", "front": "A 30-year-old man presents to the emergency department with acute onset of diffuse right lower limb swelling. Six months ago, he suffered from pain and redness in his eyes, with diminution of vision. He sought medical advice and was prescribed prednisolone with gradual improvement. Repeated painful ulcers started within the last 3 years. On examination, he had oral and scrotal ulcerations. The pathergy test was positive.\n\n1.    What is the most likely diagnosis?\n\n2.     Mention the diagnostic criteria of this disease.", "back": "1. The diagnosis is Behget’s disease. It is a chronic, relapsing, multi-system disease that is predominant in the Middle East and the Silk Road countries. It usually occurs in middle-aged males. In this case, there are recurrent orogenital ulcers, eye involvement (mostly uveitis pending ophthalmological evaluation), deep venous thrombosis (pending duplex examination and positive pathergy (a characteristic skin reaction in Behcet cases). A diagnosis of Behget disease is based on clinical criteria because of the absence of a pathognomonic laboratory test. The International Study Group (ISG) criteria set is the most widely used. For the ISG criteria, the presence of recurrent oral ulceration 1s required, plus two of the following four symptoms are required for diagnosis: (a) genital ulceration (sometimes those may be scarring), (b) eye lesions (e.g. posterior or pan uveitis, usually non-granulomatous), (c) skin lesions (e.g. Erythema nodesum, skin folliculitis, acnetform lesions) and (d) positive pathergy test. These criteria have been shown to have 95% sensitivity and 08% specificity. Other manifestations include vascular Behcet (e.g., DVTs, pulmonary aneurysms), neuro Behcet (e.g. Cerebral venous sinus thrombosis, parenchymatous lesions),"}, {"num": 257, "chapter": "Rheumatology", "front": "A 17-year-old boy presented with rapidly progressive rash over his legs and buttocks associated with severe colicky abdominal pain associated with nausea, vomiting but no change in bowel habit, also he complained of pain in right ankle On examination, pulse was 84/min, Bp 110/70, he had palpable purpura over his legs and buttocks, mild swelling with tenderness in his right ankle, palpation of abdomen revealed diffuse tenderness but no guarding or rebound and no organomegaly Laboratory findings: CBC revealed Hb 12.8 g/dL, WBC 6.500 x10°/L, platelets 370.000 x10%/L\n\nWhat is the most likely diagnosis of this case? e\n\nHow can you confirm this diagnosis?\n\nWhat are other Iaboratory tests you have to do? Sl\n\nWhat are the possible complications of this condition?", "back": "1. The most likely diagnosis is IgA vasculitis (formerly known as Henoch-Schonlein Purpura). This is supported by the presence of: Palpable purpura with normal platelet count Colicky abdominal pain Arthralgia/arthritis (right ankle pain)\n\nYoung age (<20 years) The diagnostic test is skin biopsy which reveals leukocytoclastic vasculitis (small vessel vasculitis with fragmented neutrophils) with IgA and C3 deposition in the blood vessel wall\n\nThe following laboratory tests should be done Complete urine analysis and serum creatinine as about 50% of patients may have inflammation affecting the kidneys IgA level in blood (it may be raised in about a third of patients, though not diagnostic)\n\nStool occult blood or abdominal uitrasound: If gastrointestinal symptoms are prominent or complications are suspected Complications from IgA Vasculitis are rare and include: Bowel bleeding Bowel intussusception Kidney failure."}, {"num": 258, "chapter": "Rheumatology", "front": "A 32-year-old African woman presents with a 3-month history of nonproductive cough, progressive exertional dyspnea, low-grade fever, and fatigue. She reports tender red nodules on her shins for the last 2 weeks. On examination, bilateral crepitations are heard at the lung bases, and multiple erythematous, raised, tender nodules are noted on both legs. Chest X-ray shows bilateral hilar lymphadenopathy. Laboratory tests reveal hypercalcemia and elevated serum angiotensin-converting enzyme (ACE). The tuberculin skin test is negative.\n\n1. What is the most likely diagnosis and what are the important differential diagnoses?\n2. How would you investigate this case further to confirm the diagnosis?\n\n3. What is the appropriate treatment plan for this patient?\n\n4, What are the possible extrapulmonary manifestations of your primary diagnosis?", "back": "1.   Sarcoidosis is mostly diagnosis based on presence of hilar lymphadenopathy, interstitial pulmonary disease, systemic symptoms (fever and fatigue), and erythema nodosum. Hypercalcemia and elevated ACE level are characteristic, Negative tuberculin skin test helps exclude latent TB Differentials: Tuberculosis (important differential, especially in endemic regions), lymphoma, Hypersensitivity pneumonitis or fungal infections. Investigations:\n- High Resolution Chest CT for: hilar lymph nodes and ILD.\n-   Bronchoscopy with transbronchial lung biopsy (Pathology: non-caseating granulomas)\n-   Serum ACE, calcium levels, liver enzymes (to evaluate hepatic sarcoidosis)\n-    Pulmonary Function Tests (PF'Ts): Typically show a restrictive pattern with reduced DLCO\n-   Ophthalmologic examination: To screen for uveitis\n-    ECG and echocardiogram: If cardiac symptoms are present (to assess for sarcoid cardiomyopathy or conduction defects) Treatment: Management depends on severity and organ involvement:\n-  Observation: Asymptomatic or mild cases (e.g., isolated erythema nodosum) may resolve spontaneously\n-   First-line therapy: Oral corticostersids (e.g., prednisone 20—40 mg/day) for symptomatic pulmonary disease or systemic involvement\n-   Steroid-sparing agents (if prolonged treatment is needed or steroids are contraindicated):\n-   Methotrexate, azathioprine, or hydroxychlorogquine\n-   Refractory or severe disease: May require infliximab or other biologic agents Extrapulmonary Features: Sarcoidosis is a multisystem             granulomatous   disease    with   diverse extrapulmonary features: Skin: Erythema nodosum Lupus pernio Papular or plague lesions Eyes: Uveitis (anterior or posterior) Conjunctival granulomas Cardiac: Conduction abnormalities (e.g., complete heart block) Cardiomyopathy, arthythmias Neurological: Cranial nerve palsies (especially facial nerve) Neurosarcoidosis (e.g., meningitis, myelopathy) Liver: Hepatomegaly, abnormal LFTs, infiltrating liver disease Portal hypertension (rare) Renal: Nephrocalcinosis due to hypercalcemia Interstitial nephritis"}, {"num": 259, "chapter": "Rheumatology", "front": "A 72-year-old woman complains of bilateral shoulder and hip pain and stiffness, especially in the morning, for the past 6 weeks. She also has a newonset temporal headache, scalp tenderness, and jaw pain while chewing. On exam, the right temporal artery is thickened and tender. Shoulder movements are limited in all directions. ESR is 92 mm/hr, CRP is 85 mg/L, and she has mild anemia. No weakness is detected on power testing.\n\n1. What is the most likely diagnosis?\n\n2, How      would    you    confirm   the    diagnosis    and    rule   out complications?\n3. What is the immediate and long-term treatment strategy?\n\n4. What is the risk to vision and how can it be prevented?", "back": "1. Diagnosis:     Giant Cell Arteritis (GCA) with associated Polymyalgia Rheumatica (PMR) GCA is suggested by the new-onset headache,             scalp tenderness, jaw claudication, and temporal artery abnormalities, along with markedly elevated ESR and CRP. PMR, commonly associated with GCA, explains the bilateral shoulder and hip girdle pain and stiffness without true muscle weakness. In elderly patients with new-onset headache and raised inflammatory markers, GCA should be presumed and treated immediately to prevent irreversible complications, especially vision loss. Investigations:\n-   ESR/CRP (typically elevated)\n-   CBC (normocytic anemia)\n-   Duplex ultrasound of the temporal artery (“halo sign”)\n-   Temporal artery biopsy (gold standard)\n-   Joint ultrasound. Ophthalmological assessment to exclude eye involvement, which may be sightthreatening.\n\nTreatment:\n-   Start high-dose corticosteroids immediately (Prednisone 40—60 mg/day or IV methylprednisolone for visual symptoms)\n-   Taper steroids gradually based on response and inflammatory markers\n-   Bone protection and PPI with long-term steroids\n-   Consider steroid-sparing agents as MTX or biological treatment (e.g., tocilizumab) for severe or refractory cases.\n4. Vision Risk: Risk: Permanent vision loss due to anterior ischemic optic neuropathy (AION) is the most serious complication of GCA. This can occur suddenly and irreversibly, often affecting one or both eyes. Prevention:\n-  Immediate initiation of corticosteroids is critical; Treatment must not be delayed for diagnostic procedures such as biopsy\n-   Prompt ophthalmologic evaluation if visual symptoms are present (blurred vision, diplopia, transient visual loss)"}, {"num": 260, "chapter": "Rheumatology", "front": "A 45-year-old man presents with 3 months of epistaxis and nasal crustations. He has also experienced weight loss, fatigue, and intermittent episodes of hemoptysis. On exam, he has nasal septal perforation and a saddle-nose deformity. Areas of bronchial breathing are heard on chest auscultation. Chest CT shows multiple cavitary nodules in both lungs. Urinalysis reveals proteinuria and red blood cell casts. c-ANCA is strongly positive, Creatinine is 2.1 mg/dL.\n\nWhat is the most likely diagnosis and important differentials? PP\n\nWhat investigations are needed to confirm and assess severity?\n\nWhat is the appropriate treatment approach?\n\nWhat are the potential complications of this disease and its treatment?", "back": "1.   Diagnosis: Granulomatosis with polyangiitis (GPA): should be suspected in a case of ENT manifestations and pulmonary cavities along with systemic symptoms (weight loss and fatigue). Cytoplasmic ANCA positivity is highly suggestive of GPA diagnosis. Differentials: Microscopic polyangiitis, tuberculosis, fungal infections, malignancy (e.g lymphoma). Investigations: =    CBC, LFTs, ESR/CRP ®     Urinalysis, renal function tests, Abdominal ultrasound. v«   c-ANCA by immunofluorescence (Anti PR3 antibodies with ELISA should be done for confirmation). e    Chest imaging (CT for cavitation) s    Tissue biopsy (confirmatory): Nasal or lung        biopsy:      Often      shows   mnecrotizing   granulomatous inflammation Renal biopsy: Typically reveals pauci-immune crescentic necrotizing glomerulonephritis Treatment: &=   Induction: High-dose steroids + cyclophosphamide or rituximab. =    Maintenance: Azathioprine or methotrexate w     Prophylaxis against Pneumocystis jirovecii (e.g.,, TMP-SMX) during immunosuppression =     Bone protection and gastric protection for long-term steroid use =    Monitor renal function and relapse indicators\n4.   Complications: Disease-related complications: s    Rapidly progressive glomerulonephritis (RPGN) — renal failure =    Diffuse alveolar hemorrhage #     Chronic sinus destruction or saddle-nose deformity »     Hearing loss or subglottic stenosis Treatment-related complications: =    Opportunistic infections (due to immunosuppressive therapy) s    Cyclophosphamide       toxicity     (e.g.,     hemorrhagic    cystitis,   infertility, malignancy risk) =    Steroid-related adverse effects (osteoporosis, diabetes, hypertension)"}, {"num": 261, "chapter": "Rheumatology", "front": "45-year-old male Patient presented by Painful, non-blanching purpuric rash on lower legs Started 5 days ago, progressing upward from ankles associated with mild fever, joint pain with recent history intake of antibiotics for sinusitis, No symptoms suggestive of autoimmune disease. By examination: Palpable purpura on both lower extremities, no ulceration or necrosis, and no systemic signs of severe organ involvement.\n\n1. What is the most likely diagnosis?\n\n2. What investigations would you recommend to confirm the diagnosis?\n3. What is the line of management?\n\n4. What is the possible etiology?\n\nS. What is the prognosis?", "back": "1. Diagnosis: Leukocytoclastic vasculitis (LCV): A small-vessel vasculitis typically presenting with palpable purpura, especially on the lower extremities, and often triggered by infections, drugs, or systemic conditions. Investigations: Lab Tests: CBC: May show mild leukocytosis or eosinophilia ESR/CRP elevated, renal function and urinalysis to rule out kidney involvement, ANCA, ANA, RF, Hepatitis B/C, Cryoglobulin, HIV to assess for secondary causes Skin Biopsy (definitive): Neutrophilic infiltrate around postcapillary venules, leukocytoclasia (nuclear debris) and fibrinoid necrosis of vessel walls Etiologies: Drugs (e.g., antibiotics, NSAIDs) Infections (e.g., viral hepatitis, streptococcus), Autoimmune disorders (e.g., lupus, RA), Malignancy (rarely) Management: Identify and remove the ftrigger (e.g., discontinue offending drug), Symptomatic treatment: NSAIDs for joint pain, antihistamines for itching, rest and leg elevation, Topical corticosteroids for localized disease Systemic corticosteroids for moderate/severe cases or systemic involvement (prednisone 0.5-1 mg/kg/day, tapered gradually), Immunosuppressants (e.g., azathioprine, dapsone) if refractory Prognosis: Generally good in skin-limited LCV, recurrence is possible, systemic involvement (e.g., kidney, GI, lungs) requires aggressive treatment"}, {"num": 262, "chapter": "Rheumatology", "front": "45-year-old male patient presented with fatigue, weight loss, postprandially abdominal pain, muscle aches and malaise for 2 months associated with10 kg unintentional weight loss Myalgias and arthralgias, hypertension (recently diagnosed, difficult to control) associated episodes of skin rash and livedo reticularis.\n\nBy examination: BP: 160/100 mmHg, Skin: Livedo reticularis on legs, tender subcutaneous nodules, neurological: mononeuritis multiplex (foot drop), abdomen: Mild tenderness, no rebound tenderness.\n\n1. What is the most likely diagnosis?\n\n2, What investigations would you recommend to confirm the diagnosis?\n\n3. What is the line of management?", "back": "1. Diagnesis: A case of Polyarthritis Nodosa (PAN) Polyarteritis nodosa (PAN) is a systemic necrotizing vasculitis of medivm-sized arteries characterized by constitutional symptoms (fatigue, weight loss), multisystem involvement, (skin, nervous system, GI, renal), hypertension, mononeuritis multiplex, classic skin signs such as livedo reticularis and tender nodule\n2. Investigations: Elevated ESR and CRP, normocytic normochromic anemia, negative ANCA (typically PAN is ANCA-negative), elevated creatinine (renal involvement without glomerulonephritis), Hepatitis B surface antigen positive (associated in some cases) Angiography: Microaneurysms       and     segmental narrowing   (\"beading\") in mesenteric/renal   arteries, Biopsy of skin nodule: Necrotizing inflammation of medium-sized arteries\n3. Management\n\nMedical management:\n\n-   High-dose corticosteroids (e.g., prednisone 1 mg/kg/day) — Rapid symptom control and inflammation suppression\n-   Cyclophosphamide — added in severe, organ-threatening, or lifethreatening disease Hepatitis B—associated:\n-   Initiate antiviral therapy (e.g., entecavir or tenofovir),\n-   Avoid prolonged immunosuppression to prevent viral reactivation\n- Consider plasma exchange in select cases Supportive care:\n-   Control hypertension (often secondary to renal ischemia)\n-   Monitor renal function and screen for complications (e.g., bowel infarction, peripheral neuropathy)\n-   Regular follow-up for relapses or treatment toxicity"}, {"num": 263, "chapter": "Rheumatology", "front": "14-year-old male Patient presented with a 2-day history of severe abdominal pain and fever (up to 39.5°C). Similar episodes have occurred approximately once per month since age 12, often accompanied by chest pain or joint pain (especially in the knees and ankles). Each episode resolves spontaneously within 1-3 days. No known triggers. No recent travel, sick contacts, or unusual exposures.\n\nBy examination: temp (38.9°C), HR 110 bpm, abdominal tenderness, especially in the lower quadrants, No rebound or guarding, Mild swelling of the right knee.\n\n1. What is the most likely diagnosis?\n\n2. What investigations would you recommend to confirm the diagnosis?\n3. What is the line of management?", "back": "1. Diagnosis: A case of Familial Mediterranean Fever (FMF), Recurrent febrile episodes Serositis (abdominal or chest pain due to peritonitis or pleuritis) Arthritis, particularly in large joints If Family history of FMF supports the diagnosis\n2. Investigations:\n\nLaboratory tests during an attack:\n\nCBC: Mild leukocytosis ESR/CRP: Elevated inflammatory markers Serum amyloid A (SAA): Elevated during attacks (important for monitoring risk of amyloidosis)\n\nGenetic testing: MEFYV gene mutation analysis (commonly M694V, V726A, etc.) Other supportive tests:\n\nUrinalysis and serum creatinine — to detect early amyloidosis\n\nANA/ANCA - to rule out autoimmune diseases if the presentation is atypical or association\n3. Management: Starting colchicine 1-1.5 mg/day with max. dose 3 mg in adults to prevent attacks and amyloidosis, Patient and family education, Monitor renal function and proteinuria (to detect early amyloidosis). Inflammatory markers (SAA) between attacks. Refractory cases: Consider biologic therapy (e.g., IL-1 inhibitors like anakinra or camakinumab) in colchicine-resistant or intolerant FMF patients.\n4. Prognesis: Good with regular colchicine use, without treatment, risk of developing amyloidosis with potential kidney failure."}, {"num": 264, "chapter": "Rheumatology", "front": "A 45-year-old female school teacher reports a 6-month history of persistent dry eyes and dry mouth. She uses over-the-counter eye drops several times a day. She also finds it difficult to swallow dry foods and often drinks water with meals. Recently, she noticed some joint stiffness in the morning that lasts less than 30 minutes. She denies any rash, fever, or weight loss. No history of radiation exposure or use of medications known to cause dryness. Unremarkable past or family history.\n\nPhysical Examination: there was dry, red conjunctivae, dental caries, no lymphadenopathy, mild swelling of small joints in hands. Schirmer’s test: <5 mm wetting in 5 minutes (positive) investigations done and reveals: elevated ESR, ANA: Positive (1:80), positive Anti-Ro (SSA) and Anti-La (SSB). Rheumatoid factor: is negative\n\nWhat is the most likely diagnosis and DD? L\n\nWhat are the hallmark symptoms of this condition?\n\nWhat is the next step for confirming the diagnosis? What are the possible complications?\n\nWhat is the treatment strategy?", "back": "1. The diagnosis is Primary Sjogren’s Syndrome Differential diagnoses include:\n-   Medication side effects (e.g., antihistamines, antidepressants)\n-   Radiation-induced gland damage\n-   HCV-associated sicca syndrome or HIV\n-   Sarcoidosis\n-   Dehydration\n\nThe hallmark symptoms of Sjogren’s Syndrome\n- Dry eyes (keratoconjunctivitis sicca)\n- Dry mouth (xerostomia) Other possible symptoms include fatigue, arthralgia, and dental caries due to lack of saliva. Labial salivary gland biopsy showing lymphocytic infiliration The complications:\n-  Dental caries Oral candidiasis Corneal ulcers Parotid gland enlargement Increased risk of B-cell lymphoma Treatment: symptomatic and supportive, including:\n- Artificial tears and saliva substitutes\n- Good oral hygiene\n- Hydroxychloroquine for joint symptoms\n- Immunosuppressants in severe systemic involvement\n- Regular monitoring for lymphoma"}];

  // Process cases to add extracted diagnosis
  const CASES = CASES_RAW.map(c => {
    return {
      ...c,
      diagnosis: extractDiagnosis(c.back)
    };
  });

  const CHAPTER_ORDER = ["Cardio","Chest","GIT","Hepatology","Neuro","Endocrine","Hematology","Nephro","Rheumatology"];
  const CHAPTER_LABELS = {
    "Cardio":"Cardio",
    "Chest":"Chest",
    "GIT":"GIT",
    "Hepatology":"Hepatology",
    "Neuro":"Neuro",
    "Endocrine":"Endocrine",
    "Hematology":"Hematology",
    "Nephro":"Nephro",
    "Rheumatology":"Rheumatology"
  };

  const chapterCounts = {};
  CHAPTER_ORDER.forEach(ch => chapterCounts[ch] = 0);
  CASES.forEach(c => { if(chapterCounts[c.chapter] !== undefined) chapterCounts[c.chapter]++; });

  const selected = new Set();
  let mode = "sequential";
  let session = [];      // ordered array of case objects for the active session
  let position = 0;      // current index within session
  let flipped = false;

  // ---------- Setup screen ----------
  const chapterGrid = document.getElementById("chapter-grid");
  const selectAllBtn = document.getElementById("select-all-btn");
  const startBtn = document.getElementById("start-btn");
  const modeButtons = document.querySelectorAll(".mode-btn");

  function renderChapterGrid(){
    chapterGrid.innerHTML = "";
    CHAPTER_ORDER.forEach(ch => {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "chapter-card";
      card.setAttribute("data-chapter", ch);
      card.setAttribute("aria-pressed", "false");
      card.innerHTML =
        '<div class="cc-top">' +
          '<span class="cc-check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>' +
          '<span class="cc-name">' + CHAPTER_LABELS[ch] + '</span>' +
        '</div>' +
        '<span class="cc-count">' + chapterCounts[ch] + ' case' + (chapterCounts[ch] === 1 ? '' : 's') + '</span>';
      card.addEventListener("click", () => toggleChapter(ch, card));
      chapterGrid.appendChild(card);
    });
  }

  function toggleChapter(ch, card){
    if(selected.has(ch)){
      selected.delete(ch);
      card.classList.remove("selected");
      card.setAttribute("aria-pressed", "false");
    } else {
      selected.add(ch);
      card.classList.add("selected");
      card.setAttribute("aria-pressed", "true");
    }
    updateStartButton();
  }

  function updateStartButton(){
    const total = totalSelectedCount();
    if(total === 0){
      startBtn.disabled = true;
      startBtn.textContent = "Select a chapter to begin";
    } else {
      startBtn.disabled = false;
      startBtn.textContent = "Start studying — " + total + " case" + (total === 1 ? "" : "s");
    }
  }

  function totalSelectedCount(){
    let n = 0;
    selected.forEach(ch => n += chapterCounts[ch]);
    return n;
  }

  selectAllBtn.addEventListener("click", () => {
    const allSelected = selected.size === CHAPTER_ORDER.length;
    document.querySelectorAll(".chapter-card").forEach(card => {
      const ch = card.getAttribute("data-chapter");
      if(allSelected){
        selected.delete(ch);
        card.classList.remove("selected");
        card.setAttribute("aria-pressed", "false");
      } else {
        selected.add(ch);
        card.classList.add("selected");
        card.setAttribute("aria-pressed", "true");
      }
    });
    selectAllBtn.textContent = allSelected ? "Select all" : "Clear all";
    updateStartButton();
  });

  modeButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      modeButtons.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      mode = btn.getAttribute("data-mode");
    });
  });

  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  startBtn.addEventListener("click", () => {
    let pool = CASES.filter(c => selected.has(c.chapter));
    if(pool.length === 0) return;
    session = mode === "shuffled" ? shuffle(pool) : pool.slice().sort((a,b) => a.num - b.num);
    position = 0;
    flipped = false;
    showScreen("study");
    renderCard();
  });

  // ---------- Study screen ----------
  const setupScreen = document.getElementById("setup-screen");
  const studyScreen = document.getElementById("study-screen");
  const backBtn = document.getElementById("back-btn");
  const chapterBadge = document.getElementById("chapter-badge");
  const progressText = document.getElementById("progress-text");
  const progressFill = document.getElementById("progress-fill");
  const flashcard = document.getElementById("flashcard");
  const frontText = document.getElementById("front-text");
  const backText = document.getElementById("back-text");
  const frontChapterTag = document.getElementById("front-chapter-tag");
  const backChapterTag = document.getElementById("back-chapter-tag");
  const prevBtn = document.getElementById("prev-btn");
  const nextBtn = document.getElementById("next-btn");
  const flipBtn = document.getElementById("flip-btn");
  const restartBtn = document.getElementById("restart-btn");

  function showScreen(name){
    setupScreen.classList.toggle("active", name === "setup");
    studyScreen.classList.toggle("active", name === "study");
  }

  function renderCard(){
    const c = session[position];
    if(!c) return;
    frontText.textContent = c.front;
    backText.textContent = c.diagnosis;  // Show only the diagnosis
    const tag = "Case " + c.num + " · " + CHAPTER_LABELS[c.chapter];
    frontChapterTag.textContent = tag;
    backChapterTag.textContent = tag;
    chapterBadge.textContent = CHAPTER_LABELS[c.chapter];
    progressText.textContent = "Case " + (position + 1) + " / " + session.length;
    progressFill.style.width = ((position + 1) / session.length * 100) + "%";
    flipped = false;
    flashcard.classList.remove("flipped");
    prevBtn.disabled = position === 0;
    nextBtn.disabled = position === session.length - 1;
    flashcard.querySelector(".face-scroll").scrollTop = 0;
  }

  function flipCard(){
    flipped = !flipped;
    flashcard.classList.toggle("flipped", flipped);
  }

  flashcard.addEventListener("click", flipCard);
  flipBtn.addEventListener("click", flipCard);

  prevBtn.addEventListener("click", () => {
    if(position > 0){ position--; renderCard(); }
  });
  nextBtn.addEventListener("click", () => {
    if(position < session.length - 1){ position++; renderCard(); }
  });

  backBtn.addEventListener("click", () => showScreen("setup"));
  restartBtn.addEventListener("click", () => {
    position = 0;
    flipped = false;
    if(mode === "shuffled"){ session = shuffle(session); }
    renderCard();
  });

  document.addEventListener("keydown", (e) => {
    if(!studyScreen.classList.contains("active")) return;
    if(e.key === "ArrowRight") nextBtn.click();
    else if(e.key === "ArrowLeft") prevBtn.click();
    else if(e.key === " " || e.key === "Enter"){ e.preventDefault(); flipCard(); }
  });

  renderChapterGrid();
  updateStartButton();
})();
</script>
</body>
</html>
